HOMA：弱条件控制的人—物交互视频生成", "year": "2025", "theme": "人物与交互视频生成", "authors": "Z Huang, Z Zhou, J Cao, Y Ma, Y Chen, Z Rao, Z Xu, H Wang, Q Lin, ...", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-06-10", "preprint_date": "2025-06-10", "arxiv_id": "2506.08797"}, "motivation": "人—物交互生成若要求完整身体、手指与物体姿态序列，用户准备条件的成本很高，数据也难以大规模获得。HOMA 希望用较弱、可缺省的运动条件生成通用交互，并支持音频驱动的说话动作。", "context": "弱条件并不意味着完全没有约束。物体中心轨迹仍规定大致位置，骨架规定部分身体动作，缺失部分由生成先验补全。论文通过可选姿态设计，让用户决定控制精度和输入成本之间的取舍。", "analysis": "控制条件太少会让动作和物体关系漂移，条件过细又限制使用场景。人物、物体与动作还处于不同表示方式中，需要在视频基座里协调，而不是简单把参考图堆在输入侧。", "rationale": "作者定义可缺省的人体姿态和点式物体轨迹作为弱条件，在潜变量与 token 空间组织人物、物体、动作，再通过 HOI 适配器建模交互。论文以不同弱条件实验和组件消融检验这种控制与灵活性的组合。", "basis_reference": "HunyuanVideo-HOMA v3 §3.1—3.3；HOMA 正式摘要", "basis_title": "弱控制保留哪些条件，放开哪些细节", "method_title": "条件融合、交互适配与说话控制", "result_title": "条件减少之后还能控制什么", "connection": "外观和运动先进入共享上下文，再通过 HOI 适配器强化人与物的联系。音频适配器另外作用于面部，服务唇形控制；它不替代物体轨迹，也不自动决定双手怎样接触商品。", "architecture": [{"name": "弱条件编码", "flow": "参考人物、物体、弱骨架与点轨迹 → 条件表示", "explanation": "正式论文将单臂骨架与物体中心点作为最小运动条件，并允许更弱条件设置。文字与音频提供补充，不要求完整三维运动捕捉。", "operation": "以可缺省的人体骨架和物体中心点轨迹表示弱条件，保留基本位置与运动约束，同时降低对精细手部或完整三维标注的依赖。"}, {"name": "上下文融合", "flow": "外观与动作 → MMDiT 上下文", "operation": "把人物、物体和弱动作条件组织到潜变量与 token 表示中。", "explanation": "上下文融合先解决不同条件如何被同一基座读取。"}, {"name": "HOI 适配器", "flow": "融合条件 → 交互一致特征", "operation": "以预训练 HunyuanVideo 参数初始化适配器，强化物体注入和人—物关系。", "explanation": "作者通过适配器消融检查物体运动是否仍过度依赖人体姿态。"}, {"name": "面部音频控制", "flow": "语音特征、面部区域 → 同步说话动作", "explanation": "音频交叉注意力将语音注入面部相关区域，补充身体／物体动作之外的唇形控制。各条件共同决定最终视频。", "operation": "进一步用面部音频交叉注意力支持说话，将声音条件与面部变化联系起来；训练与评估覆盖不同对象、弱姿态和运动轨迹组合。"}], "findings": "比较不同对象、轨迹与弱条件设定，并通过消融检验上下文融合和 HOI 适配器。解读以 HunyuanVideo-HOMA 预印本为基础。", "limitations": "仍需要稀疏动作输入，点轨迹不保证精确接触；真实物理合理性主要靠生成先验。", "figures": [{"number": 2, "page": 4, "src": "figures/paper-28-fig-02.webp", "original_caption": "Figure 2: We explore a weak HOI condition, where each component of the human pose can be optionally removed, and the object’s motion is a sequence of dots indicating the center points of its trajectory.", "placement": "intro", "caption": "多种弱姿态和物体点轨迹直接展示输入到底简化到什么程度。物体只用中心点序列表示，人体姿态部分可省去，便于与强控制方法区分。"}, {"number": 3, "page": 5, "src": "figures/paper-28-fig-03.webp", "original_caption": "Figure 3: Architecture of HunyuanVideo-HOMA. HunyuanVideo-HOMA is built upon the multi-modal diffusion transformer and is composed of context fusion, HOI adapter, and audio adapter.", "placement": "method", "caption": "总图包含上下文融合、HOI 适配器和音频适配器。读图时分别追踪外观、运动与声音，能看清这些条件在何处汇合、何处保持专门路径。"}, {"number": 4, "page": 7, "src": "figures/paper-28-fig-04.webp", "original_caption": "Figure 4: Depth-aware HOI Data Curation.", "placement": "detail", "caption": "深度感知的数据整理用来筛选真实交互片段。它属于训练数据准备，不是每次用户生成时都执行的数据检索模块。"}, {"number": 10, "page": 13, "src": "figures/paper-28-fig-10.webp", "original_caption": "Figure 10: Results with different types of poses.", "placement": "evidence", "caption": "不同姿态条件下的输出说明弱控制的可用范围。条件越少，越多细节由先验决定，因此“能生成”与“能精确指定每个接触”并不相同。"}], "paper_url": "https://doi.org/10.1145/3757377.3763861"}, {"id": "paper-29", "title": "In-context brush: Zero-shot customized subject insertion with context-aware latent space manipulation", "chinese_title": "In-Context Brush：无需微调的定制主体插入", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, Y Wu, L Gao, O Deussen, H Yan, J Li, J Cao, TY Lee", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-05-26", "preprint_date": "2025-05-26", "arxiv_id": "2505.20271"}, "motivation": "把参考图中的某个主体放进新场景，需要既保留其身份和形状，又与背景的光照、尺度和文字要求协调。为每个主体重新微调模型效率较低。In-Context Brush 尝试在一次推理中完成主体插入。", "context": "参考图中的背景可能与目标场景无关，主体也可能需要调整姿态和光照。先分割主体、再在潜空间转移信息，使生成器有机会结合新场景重新合成，而不是把旧背景和原姿态一起贴过去。", "analysis": "只依赖文字描述容易丢失参考主体的独特外观；直接复制局部像素又难以适应新场景。主体信息必须能进入目标区域，同时避免把参考图背景和其他无关因素一起带过去。", "rationale": "作者利用扩散模型上下文中的参考主体信息，在注意力头内执行潜变量特征位移，并通过跨头重加权及 token blending 协调主体与场景。原文对照实验检验各操作对身份、文本对齐和融合的作用。", "basis_reference": "方法部分：上下文组织、特征位移与 token 混合", "basis_title": "插入参考主体，不是简单复制像素", "method_title": "参考信息怎样进入目标区域", "result_title": "怎样保住主体又融入场景", "connection": "上下文输入让模型看到参考和目标，特征位移连接主体与目标位置，文本重加权与 token 混合再协调修改要求和场景一致性。三者都发生在已有模型的推理中，不需要每插入一个新主体就重新训练。", "architecture": [{"name": "参考主体与场景准备", "flow": "主体图、目标场景和掩码 → 上下文输入", "explanation": "分割移除参考背景，目标掩码界定允许生成的区域。拼接让模型同时访问主体和目标环境。", "operation": "先分割出较干净的参考主体，将其与目标场景拼接成上下文输入，并扩展目标区域掩码，为新主体及其边缘融合留出生成空间。"}, {"name": "注意力头内特征位移", "flow": "参考主体潜变量 → 目标区域主体表示", "explanation": "在模型内部特征空间迁移主体语义，而非直接复制像素。后续去噪仍需结合目标上下文恢复姿态与外观。", "operation": "在注意力头内部进行潜变量特征位移，将参考主体语义送向目标位置，让已有模型在新场景中重新合成主体，而非只在像素层粘贴。"}, {"name": "重加权与混合", "flow": "主体表示、文字和场景 → 融合图像", "explanation": "跨头重加权增强目标文字作用，token blending 协调上下文。三者一起在已有模型推理中工作，无需为该主体微调。", "operation": "跨头重加权增强文本控制，并通过 token blending 协调目标区域与上下文，兼顾身份保持、修改要求和场景融合。"}], "findings": "与主体插入方法比较身份保持、文字对齐和图像质量，并展示试衣、组合及局部插入等应用。", "limitations": "依赖分割与掩码位置，复杂遮挡及大幅形变受基础修复模型限制。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-29-fig-01.webp", "original_caption": "Figure 1. Our method achieves identity-preserving subject insertion in the novel scene harmoniously, simultaneously enabling diverse text-driven control.", "placement": "intro", "caption": "示例同时展示身份保持、场景融合和文字控制。三者应一起看：只像参考主体但融不进背景，或只符合场景却变了身份，都不满足任务。"}, {"number": 2, "page": 3, "src": "figures/paper-29-fig-02.webp", "original_caption": "Figure 2. Pipeline of our method. We mainly introduce latent space shifting for subject present in target images in a training-free manner. In the “Latent Feature Shifting” part, features from the reference are shifted to output. We propose attention heads activation for further enhance representation of textual prompts and token blending for consistency injection within the image.", "placement": "method", "caption": "流程图中的 latent shifting 把参考特征送到目标区域，注意力头激活强化文字作用，token blending 协调上下文，分别对应不同问题。"}, {"number": 7, "page": 8, "src": "figures/paper-29-fig-07.webp", "original_caption": "Figure 7. Ablation study on token blending.", "placement": "evidence", "caption": "混合操作的消融用于观察主体与周围内容如何协调。它说明插入边界和上下文处理并非最后可有可无的装饰步骤。"}], "paper_url": "https://doi.org/10.1145/3757377.3763820", "code_url": "https://github.com/ICTMCG/In-context-Brush"}, {"id": "paper-31", "title": "Enhancing Fake News Video Detection via LLM-Driven Creative Process Simulation", "chinese_title": "AgentAug：通过造假制作过程模拟增强视频检测", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Y Bu, Q Sheng, J Cao, S Wang, P Qi, Y Shi, B Hu", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-10-05", "arxiv_id": "2510.04024"}, "motivation": "真实虚假新闻视频难以快速收集和标注，而生成技术又不断带来新制作方式。直接生成更多假视频未必有帮助，可能只让检测器学会识别合成痕迹。AgentAug 希望模拟具体造假过程，生成与真实检测难点更相关的训练样本。", "context": "真实素材也能被剪成误导新闻。比如改变配文或替换部分镜头，不一定留下明显生成痕迹。作者围绕制作操作构造数据，让检测器学习文字与视频怎样错配，而不是只记住一种合成工具的外观。", "analysis": "训练数据需要同时覆盖文字叙事与视频素材之间的误导关系，并与当前检测器真正不确定的样本匹配。只扩大数量、不控制来源和选择方式，可能增加噪声，甚至造成训练测试信息泄漏。", "rationale": "作者将造假制作过程作为增强依据，用四类基本操作构造误导关系，再围绕真实样本不确定性选择训练数据。多折筛选用于控制合成样本的实际帮助，测试只使用人类制作视频以检查迁移。", "basis_reference": "方法部分：创作过程模拟与数据选择", "basis_title": "为何要模拟造假过程，而不只造假样本", "method_title": "从训练素材到有选择的数据增强", "result_title": "合成数据怎样帮助真实视频检测", "connection": "素材库限制可用训练来源，制作流程产生候选，选择机制再把候选与真实难例对应。生成与选择是两件事：不是每条合成内容都会进入最终训练，也不是把测试素材拿来重新组合。", "architecture": [{"name": "训练素材库", "flow": "训练视频 → 镜头片段及语言描述", "explanation": "视觉语言模型将素材转成可检索描述，使后续流程可以按造假意图选择片段，数据来源限定在训练部分。", "operation": "把训练视频分成镜头，用视觉语言模型描述素材，建立可检索的文字与视频片段库；合成只使用训练部分素材。"}, {"name": "创作过程模拟", "flow": "素材、四类造假操作 → 合成新闻视频", "explanation": "模拟改变的是叙事、事实与素材对应关系，不只是把图像做视觉扰动。输出仍需接受筛选。", "operation": "通过 LLM 驱动的制作流程，模拟事实歪曲、无中生有、误导替换和选择性剪辑等操作，再组合文字与视频，生成有制作逻辑的多模态样本。"}, {"name": "不确定性选择与重训", "flow": "难真实样本、合成候选 → 增强后的检测器", "explanation": "真实难例确定需要补的数据区域，多折筛选控制候选稳定性。最终检验放在人类制作视频上，而不是仅测合成识别。", "operation": "围绕检测器高不确定的真实样本检索候选合成数据，再用多折筛选保留稳定有帮助的样本，加入原检测器重新训练。"}], "findings": "在 FakeSV、FakeTT 与四种检测器上均报告改善；合成数据仅来自训练素材，测试仍使用人类制作视频。", "limitations": "不覆盖完全生成式假新闻视频；只研究固定任务工作流；随机加入合成样本有时反而降低性能，增强质量和选样都关键。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-31-fig-01.webp", "original_caption": "Figure 1: An example of how original real materials can be used for fabrication in multiple ways (highlighted in red), while some may not be shown in existing observed data.", "placement": "intro", "caption": "同一组真实素材可以通过多种方式被用于造假。图中强调的变化是信息与叙事关系，解释为什么只收集已观察到的假视频还不够。"}, {"number": 2, "page": 3, "src": "figures/paper-31-fig-02.webp", "original_caption": "Figure 2: Overall framework of AgentAug.", "placement": "method", "caption": "总图把素材库、制作模拟和选择增强连起来。候选生成之后还有筛选，最终收益应在真实视频测试上检查。"}, {"number": 4, "page": 5, "src": "figures/paper-31-fig-04.webp", "original_caption": "Figure 4: LLM-driven pipelines for video news fabrication.", "placement": "detail", "caption": "四类 LLM 驱动制作流程具体展示文字和视频如何被组织成不同误导操作，比笼统说“用大模型增强数据”更接近实际训练内容。"}], "paper_url": "https://doi.org/10.1145/3746252.3760933", "code_url": "https://github.com/ICTMCG/AgentAug"}, {"id": "paper-32", "title": "Bridging thoughts and words: Graph-based intent-semantic joint learning for fake news detection", "chinese_title": "InSide：联合新闻意图与语义的图学习", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, Q Sheng, D Wang, B Hu, J Cao", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-09-01", "arxiv_id": "2509.01660"}, "motivation": "假新闻不只体现在错误事实，也可能通过选择细节、安排叙事来服务某种意图。直接让 LLM 判断作者动机可能忽略文章细节；只编码正文又难以捕捉较抽象的目的。InSide 尝试把意图与具体语言证据连接起来。", "context": "意图图表达较抽象的目的，语义图保留句子与实体。如果没有连接，前者容易成为一段独立评论，后者仍只看表面线索。方法重点在于让这些意图能找到正文中的对应表达，再用于检测。", "analysis": "意图推断属于较粗的解释，句子与实体属于较细的语义单元。两者粒度不同，如果只是拼接最终向量，难以知道哪个意图对应哪段表达，也不利于在相互矛盾时调整判断。", "rationale": "作者以信念、欲望等意图分析组织粗粒度信息，同时用句子和实体图保留细粒度语义。动态路径对齐和跨图消息传递建立两种粒度间的联系，回应直接拼接无法充分连接意图与表达的问题。", "basis_reference": "方法部分：意图图、语义图与动态路径对齐", "basis_title": "文章的意图怎样对应具体措辞", "method_title": "两张图如何相互传递信息", "result_title": "对齐到底连接了哪些证据", "connection": "两张图先各自编码，路径对齐再建立共同空间和动态连接。跨图消息传递不是先给文章定一个动机、再强制按动机分类，而是把意图与语义表示共同用于最终判断。", "architecture": [{"name": "语义图", "flow": "正文句子与实体 → 细粒度语义结构", "explanation": "句子保留叙事片段，实体提供跨句连接，后续图传播可聚合局部与跨句信息。", "operation": "用句子和实体构建语义图，保留局部叙事及跨句联系，让具体表达不只压缩为整篇文本的一个向量。"}, {"name": "意图图", "flow": "正文、LLM 意图推断 → 粗细意图表示", "explanation": "信念与欲望等推断组织目的层信息，细粒度表达使它能够与正文对应。推断仍是模型输出，非作者心理事实。", "operation": "让 LLM 从信念、欲望等角度推断粗粒度意图，再结合细粒度表达建立意图图，显式表示作者可能想传达和实现的内容。"}, {"name": "动态路径对齐", "flow": "两张图 → 联合表示与真假判断", "explanation": "在共享空间中匹配路径并跨图传消息，使抽象意图与具体表达相互约束，最后执行检测分类。", "operation": "分别更新两张图，通过动态路径对齐建立共同空间，进行跨图消息传递后分类，使意图解释能够影响具体证据聚合，反过来也接受正文约束。"}], "findings": "在 PolitiFact、GossipCop、Weibo 和 LLMFake 上验证；前三者按时间切分，LLMFake 使用随机划分。", "limitations": "对非故意错误的适用性不明；LLM 的意图推断会出错；并未证明可以普遍识别真实内容里的操纵框架。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-32-fig-01.webp", "original_caption": "Figure 1: Comparison between existing works and our proposed framework. Existing detectors focus on surface semantic clues of news and often struggle when the writing pattern shifts. Instead, our method utilizes semantic-intent joint learning, integrating the thoughts (intents) and words (semantics) for enhanced detection.", "placement": "intro", "caption": "概念对照展示从只关注表面写作线索转向联合意图与语义。这里的意图是模型分析得到的表示，不是已知的作者心理事实。"}, {"number": 2, "page": 4, "src": "figures/paper-32-fig-02.webp", "original_caption": "Figure 2: Overview of InSide architecture. Given a news item, InSide leverages heterogeneous graph structures to represent the news semantics and intent (a-b). After obtaining the encoded semantic and intent representations via dual-level graph updating (c), a dynamic pathway-based graph alignment strategy is utilized to enable cross-signal alignment within a common space (d). The illustrative intent analysis framework is provided as an example and can be replaced with alternative ones.", "placement": "method", "caption": "语义图与意图图分别构建和更新，中间经过动态路径对齐，最后融合分类。先看两路输入各是什么，再看它们在哪里互相影响。"}, {"number": 5, "page": 16, "src": "figures/paper-32-fig-05.webp", "original_caption": "Figure 5: Case visualization analysis of a news item from the Weibo dataset after Graph Alignment. Darker edges indicate critical information pathways. The pseudo nodes (in green) act as dynamic bridges between semantic nodes (in blue) and intent nodes (in orange), enabling flexible message passing.", "placement": "evidence", "caption": "案例图展示对齐后的信息路径，较深的边代表更重要连接，伪节点作为两类节点间的动态桥梁。这让“跨图联合”不只停留在最后拼接向量。"}], "paper_url": "https://doi.org/10.1145/3746252.3761400"}, {"id": "paper-33", "title": "Exploring news intent and its application: A theory-driven approach", "chinese_title": "NINT 与 DMInt：新闻意图的理论框架和建模", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Cao, S Ma, H Cheng", "publication": {"venue": "Information Processing & Management 62(6)", "date_label": "卷期", "date": "2025-11", "preprint_date": "2023-12-27", "arxiv_id": "2312.16490"}, "motivation": "新闻的事实内容相近，写作目的却可能不同：告知、劝服、塑造印象或推动某种行为。缺少统一定义时，“新闻意图”容易成为模糊标签，难以比较或用于下游任务。本文从理论框架、数据和模型三方面建立可操作的研究对象。", "context": "这篇工作不是先发明一个网络，再给网络输出起名为意图。作者先分析新闻生产中的行动与结果，用理论框架规定意图的组成，再围绕这些维度构造数据和模型。读者需要先弄清概念，才能理解下游预测在利用什么。", "analysis": "意图不能简单等同于真假、情绪或立场，也往往没有一句明确的自我声明。需要把抽象心理概念拆成能够从文本分析的要素，再考虑不同要素对具体任务的贡献。", "rationale": "论文以信念—欲望—计划组织新闻意图，将抽象意图分解成可分析维度，并据此构建 NewsInt 和 DMInt。DMInt 的多视角局部—全局提取与动态门控用于聚合这些维度，这是原文理论框架到数据与模型的对应。", "basis_reference": "NINT 理论框架与 DMInt 方法", "basis_title": "信念、欲望和计划怎样进入新闻分析", "method_title": "从理论定义到数据，再到模型", "result_title": "意图表示可以用于哪些任务", "connection": "NINT 定义分析维度，NewsInt 提供数据，分解式提示把概念变成可处理信号，DMInt 再通过局部—全局特征与门控用于下游任务。理论、数据和预测模型是不同层次，不应全部统称为一个分类器。", "architecture": [{"name": "NINT：意图定义", "flow": "新闻表达 → 信念、欲望与计划维度", "explanation": "理论框架先规定要分析哪些意图维度，避免把情绪、立场和真假统称为同一个意图标签。", "operation": "提出 NINT 框架，以信念、欲望与计划组织新闻意图，细化为立场、目标影响和写作策略等维度，明确各维度之间的关系。"}, {"name": "NewsInt：数据与信号", "flow": "文章、讨论 → 意图分析数据", "explanation": "文章与 Reddit 讨论提供研究材料，分解式推理将框架转成可使用的意图信号，为模型提供统一接口。", "operation": "构建 NewsInt，包含 12,959 篇文章及 Reddit 讨论，用分解式推理形成意图信号，为理论概念提供可研究的数据基础。"}, {"name": "DMG：分解式意图提问", "flow": "文章、NINT 维度 → 多维意图信号", "operation": "按照理论维度分解提问，使信念、欲望和计划不只成为一个笼统标签。", "explanation": "图7展示提示结构，随后这些信号再进入 DMInt。"}, {"name": "DMInt：多视角聚合", "flow": "文本及意图信号 → 下游任务特征", "explanation": "RoBERTa 编码文本，局部—全局提取器保留不同粒度，动态门控决定各视角贡献，再交给下游预测。", "operation": "DMInt 采用 RoBERTa、多视角局部—全局提取器和动态门控，聚合不同层面的意图特征，并将其接入下游任务。"}], "findings": "研究提供意图分析框架、数据集和下游建模方法，为后续意图—语义联合学习等工作建立基础。", "limitations": "主要是文本新闻；数据源与推断框架可能带来文化、政治及平台偏差；推断意图不能等同事实核查结论。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-33-fig-01.webp", "original_caption": "Figure 1: Process of news production. News intent controls news writing as a rational action, subsequently eliciting social reactions as outcomes. This motivates us to deconstruct news intent from aspects of rational action and outcome.", "placement": "intro", "caption": "新闻意图影响写作，写作又可能引发社会反应。作者由这一过程同时分析行动与结果，而不是把意图仅理解为文中一句显式声明。"}, {"number": 2, "page": 3, "src": "figures/paper-33-fig-02.webp", "original_caption": "Figure 2: The proposed Nint framework. Nint deconstructs the concept of news intent into beliefs, desires, and plans using interdisciplinary theories. It further situates these elements within the specific context of news to investigate the concrete manifestations of news intent.", "placement": "basis", "caption": "NINT 将意图拆为信念、欲望与计划，并放入新闻场景。它规定后续数据与模型究竟要分析什么，是这篇论文理论部分的核心。"}, {"number": 7, "page": 10, "src": "figures/paper-33-fig-07.webp", "original_caption": "Figure 7: Illustration of DMG Prompting.", "placement": "detail", "caption": "DMG Prompting 将意图分析分解成有顺序的提问和推理，展示抽象理论怎样变成具体可用的模型信号。"}, {"number": 8, "page": 12, "src": "figures/paper-33-fig-08.webp", "original_caption": "Figure 8: Overview of DMInt method.", "placement": "method", "caption": "DMInt 的局部、全局与不同视角提取器处理意图信息，动态门控决定各部分贡献，最后用于相应下游任务。"}], "paper_url": "https://doi.org/10.1016/j.ipm.2025.104229", "code_url": "https://github.com/ICTMCG/NewsInt"}, {"id": "paper-34", "title": "The staircase of ethics: Probing llm value priorities through multi-step induction to complex moral dilemmas", "chinese_title": "递进道德困境：观察大模型的价值优先序", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Wu, Q Sheng, D Wang, G Yang, Y Sun, Z Wang, Y Bu, J Cao", "publication": {"venue": "EMNLP 2025", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-05-23", "arxiv_id": "2505.18154"}, "motivation": "问模型一道孤立的道德题，往往只能看到一条简短原则。现实困境会逐步增加代价和冲突，同一模型也可能随情境变化改选其他价值。本文用递进式困境观察模型的选择过程，而非只记录一次静态答案。", "context": "同一个模型先选择照顾某人，增加额外代价后又选择公平，并不一定自相矛盾，可能是情境中的价值冲突变了。论文因此沿同一故事逐步增加压力，观察选择什么时候变化，而不是只比较互不相关的道德题。", "analysis": "不同问题之间的价值差异可能来自情景本身，难以判断模型到底改变了什么。若在同一故事中逐步升级冲突，就能比较选择从哪一步转变，再分析其中关怀、公平等价值如何竞争。", "rationale": "本文明确采用道德基础理论和 Schwartz 价值理论组织价值类别，并将五阶段递进困境中的选择映射到这些类别。逐阶段比较与成对竞争分析用于观察模型优先序如何变化；它测量的是情境化行为，不把模型当作拥有固定人格的道德主体。", "basis_reference": "困境构造与价值映射部分", "basis_title": "冲突逐步升级时，模型会怎样改选", "method_title": "困境构造、价值映射与行为比较", "result_title": "哪些价值优先序会改变", "connection": "故事生成提供连续问题，模型回答提供选择，价值映射再把选择转成理论类别。最后比较的是阶段间分布和两类价值的竞争；理论提供解释坐标，不是给每个回答直接盖上“道德正确”的标签。", "architecture": [{"name": "五阶段困境构造", "flow": "道德规范、初始故事 → 递进故事组", "explanation": "同组故事保持情境关联并逐步增加冲突，允许观察模型何时转变，而不只对比无关问题。", "operation": "从 Moral Stories 的规范出发，用 GPT-4o 构造 3,302 组、每组五阶段的递进道德困境，保持故事关联并逐步增加决策压力。"}, {"name": "理论价值映射", "flow": "模型选择 → 理论定义的价值类别", "explanation": "道德基础理论与 Schwartz 价值理论提供分类视角，多个模型的共识用于降低单一标注者判断波动。", "operation": "依据道德基础理论与 Schwartz 价值理论，将模型选择映射到较明确的价值类别，由多个模型形成共识标注。"}, {"name": "逐阶段行为分析", "flow": "九个模型的选择 → 价值分布及竞争关系", "explanation": "比较各阶段和成对价值竞争，结果描述模型在所测情境中的行为优先序，不把它解释成人类心理测量的直接等价物。", "operation": "评测九个 LLM，跟踪各阶段选择、价值分布和成对价值竞争，观察价值优先顺序随困境升级发生的变化。"}], "findings": "价值选择会随困境升级变化；关怀经常占优，但在部分条件下，公平等价值会超过它。结果描述的是所测情境中的行为倾向。", "limitations": "价值框架偏西方，情境多为线性升级且主要由模型生成；观察输出不能推断模型拥有价值观，也不能直接推断实际行为。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-34-fig-01.webp", "original_caption": "Figure 1: Comparison of existing value evaluation protocols and ours for LLMs. Instead of asking a single question or situating an isolated moral dilemma, our proposed MMDs framework sets a multi-step moral dilemma questionnaire to progressively induce models into stronger and more complex ethical conflicts to expose their underlying value priorities.", "placement": "intro", "caption": "递进困境与一次性道德提问的区别在于连续性。后续阶段加入新条件，使价值取舍的变化可以沿同一条情境线索追踪。"}, {"number": 2, "page": 4, "src": "figures/paper-34-fig-02.webp", "original_caption": "Figure 2: ①Moral Dilemmas Generation: A five-level dilemma series (S1–S5) is generated, each with context (Ctx), decision (D), action (A), and action (B). ②Model Value Mapping: Decisions and actions are mapped to values such as Liberty, Care, Fairness, Loyalty, and Sanctity. ③LLM Value Evaluation: A language model evaluates the values, producing scores VA 1 –VA 5 and VB 1 –VB 5 . ④Value Preference Analysis: Reveals model tendencies to prioritize or overlook certain value dimensions.", "placement": "method", "caption": "五阶段故事、模型价值映射和后续分析在图中分开。先有具体选择，再映射到价值类别，避免把类别名称当成已经测得的行为。"}, {"number": 3, "page": 7, "src": "figures/paper-34-fig-03.webp", "original_caption": "Figure 3: The preference and ranking change of nine LLMs across six value dimensions: care, fairness, authority, sanctity, loyalty, and liberty. The left panels depict the preference scores over five steps (Step 1 to Step 5). Preference scores are determined by the proportion of times a model selects a specific moral dimension relative to the total occurrences at each step, normalized within a range of -0.5 to 0.5. A positive score indicates a preference for the dimension, while a negative score suggests aversion. The right panels showcase LLMs’ rank changes across six moral dimensions between Step 1 and Step 5 evaluations. ▲show rank improvements, ▼show rank declines and • indicates no change in ranking.", "placement": "evidence", "caption": "九个模型在六类价值上的偏好和排名随阶段变化。曲线用于看选择转折与相对优先序，而不说明某模型具有固定的人类人格。"}], "paper_url": "https://aclanthology.org/2025.emnlp-main.806/"}, {"id": "paper-36", "title": "Adversarial robust memory-based continual learner", "chinese_title": "持续学习中的对抗鲁棒性：输出校准与记忆选择", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "X Mi, F Tang, Z Yang, D Wang, J Cao, P Li, Y Liu", "publication": {"venue": "ICCV 2025", "date_label": "arXiv 首发", "date": "2023-11-29", "preprint_date": "2023-11-29", "arxiv_id": "2311.17608"}, "motivation": "持续学习系统不断接收新类别，只能保存少量旧样本；若还要求抵抗对抗扰动，就需要同时防止旧知识遗忘和鲁棒性遗忘。本文研究基于记忆回放的分类器，怎样在连续任务中保留对旧类别的稳定判断。", "context": "持续学习只能保留少量旧样本，缓存选错就会影响下一任务。与此同时，新类别不断加入，分类输出的竞争关系也发生变化。本文不是只给已有持续学习器加对抗样本，而是同时处理输出偏置和缓存质量。", "analysis": "新任务更新会挤压旧类别的输出空间，有限缓存中难分、异常或不稳定的样本又可能降低回放质量。单纯增加对抗训练强度，不能同时解决类别竞争和缓存选择。", "rationale": "作者将遗忘原因拆为输出层类别偏置与记忆样本选择两个方面，AFLC 与 RAER 分别对应这两处问题。RAER 利用对抗过程判断样本稳定性，避免仅按普通分类置信度挑选缓存。", "basis_reference": "方法部分：AFLC 与 RAER", "basis_title": "普通遗忘与鲁棒性遗忘并不相同", "method_title": "分类输出与记忆选择分别怎样改", "result_title": "旧知识能否在扰动后保住", "connection": "当前数据与旧缓存一起生成对抗版本，AFLC 调整类别输出，RAER 决定哪些样本进入下一轮记忆。一个改变当前怎样学习，另一个改变未来还能看到什么旧样本，两者通过后续回放形成联系。", "architecture": [{"name": "AFLC：输出校准", "flow": "类别阶段信息、分类输出 → 校准后的学习信号", "explanation": "过去、当前和未来类别在连续学习中地位不同，校准减少新类别对旧类别学习的压制。", "operation": "AFLC 根据过去、当前和未来类别校准分类输出，调整不同类别在学习中的影响，缓解新任务对旧类别的负面梯度作用。"}, {"name": "RAER：缓存选择", "flow": "PGD 过程中的稳定性 → 新记忆集合", "explanation": "按样本被成功攻击次数筛选候选，结合回放维持鲁棒旧知识。它影响下一任务能看到什么旧样本。", "operation": "RAER 统计样本在 PGD-10 过程中的被成功攻击次数，以文中 k<5 的规则筛选缓存候选，优先保留鲁棒且有代表性的样本，再更新记忆。"}], "findings": "在 Split-CIFAR10/100 和 Split-Tiny-ImageNet 上评估；论文报告 ResNet 与 ViT 的对抗遗忘明显下降。", "limitations": "测试为划分式图像分类任务与有限缓存，不能直接等同真实长期开放流；依赖对抗训练和任务阶段信息。旧预印本摘要结果与正式版口径不同，已采用正式版。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-36-fig-01.webp", "original_caption": "Figure 1. A preliminary analysis of the combination of contin- ual learning and adversarial training on Split-CIFAR10 with buffer size 200. We consider the ﬁnal average accuracy (FAA) and for- getting of adversarial and clean samples in both class incremental and task incremental settings. The red numbers indicate the per- formance after adding our approach.", "placement": "intro", "caption": "初步比较同时展示正常与对抗样本的准确率、遗忘情况。它说明普通持续学习表现较好，并不能保证扰动下也保留旧任务。"}, {"number": 3, "page": 4, "src": "figures/paper-36-fig-03.webp", "original_caption": "Figure 3. The gradient cosine similarities between robust joint model and robust continual model, which indicates a special gra- dient obfuscation only in continual learning. We experiment with buffer size=200/5,120 on the Split-CIFAR10 dataset. Gradient ob- fuscation weakens as the buffer size gets larger, and our method also mitigates gradient obfuscation.", "placement": "basis", "caption": "梯度相似性分析用于检查鲁棒联合训练和鲁棒持续学习之间的差异。作者据此分析连续任务中特有的学习冲突，而非只用最终分数说明问题。"}, {"number": 4, "page": 5, "src": "figures/paper-36-fig-04.webp", "original_caption": "Figure 4. The pipeline of our adversarial robust memory-based continual learner. First, generate adversarial samples ( \u0002 Xt, \u0002 XM) and robust difﬁculty factors (Kt) for both current task data (Xt, Yt) and memory data (XM, YM). The model then processes these samples through AFLC (Sec. 4.2), which calibrates logits based on task order to reduce negative gradients toward past tasks. Meanwhile, RAER (Sec. 4.3) leverages the robust difﬁculty factors Kt to select representative samples for memory storage, mitigating gradient obfuscation.", "placement": "method", "caption": "总图从当前任务和记忆数据生成对抗样本，再进入输出校准及缓存筛选。两部分都作用在训练流程，最终部署仍是得到的分类器。"}], "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Mi_Adversarial_Robust_Memory-Based_Continual_Learner_ICCV_2025_paper.html"}, {"id": "paper-37", "title": "Model synthesis for zero-shot model attribution", "chinese_title": "零样本模型归因：以合成模型学习生成指纹", "year": "2025", "theme": "视觉取证与内容保护", "authors": "Tianyun Yang, Juan Cao, Danding Wang, Chang Xu（所读期刊预印本顺序；保留Scholar原始作者字段供对照）", "publication": {"venue": "IEEE Transactions on Multimedia 27 · 2025", "date_label": "arXiv 首发", "date": "2023-07-29", "preprint_date": "2023-07-29", "arxiv_id": "2307.15977"}, "motivation": "图像来源模型不断出现，逐个下载并运行所有生成器来训练归因器，成本高且难以持续更新。本文希望不依赖目标生成模型的训练样本，仍能判断两张图是否同源，或将未知图像与给定模型图册匹配。", "context": "模型指纹指生成处理留下的统计特征，不是图中可见的模型名称。论文用容易训练的合成网络制造多样处理痕迹，再学习提取这些特征，希望减少对真实生成器训练样本的依赖。", "analysis": "归因器若只认识训练过的几个模型，遇到新架构就可能失效。作者关注生成网络留下的指纹，尝试用更容易构造的大量合成模型，覆盖多种结构因素，再学习可迁移的指纹表示。", "rationale": "论文以网络架构变化会影响生成指纹为出发点，通过合成模型扩展训练指纹的多样性，并在未见生成器上检验迁移。分类损失学习区别，度量损失支持新来源之间的相似度比较。", "basis_reference": "方法部分：模型合成与指纹度量", "basis_title": "为什么用大量小模型学习生成指纹", "method_title": "模型合成、指纹训练与未知来源判断", "result_title": "识别和同源验证是两种使用方式", "connection": "合成模型负责生产训练图，指纹提取器负责从图中读出来源相关表示。部署时不再运行整套合成模型库，而是用提取器比较待测图与参考图，或者判断两张图是否同源。", "architecture": [{"name": "合成模型库", "flow": "架构组合、随机种子 → 多样处理网络", "explanation": "浅层自编码器用于构造指纹来源，不等于收集了所有真实生成器。它们是训练指纹表示的代理模型。", "operation": "组合浅层自编码器的架构和随机种子，训练 288 种架构、5,760 个合成模型，以较低成本获得大量不同的模型指纹。"}, {"name": "指纹提取器训练", "flow": "不同网络处理的图像 → 来源相关指纹", "explanation": "分类损失区分训练来源，度量损失组织相似度空间。图像内容与网络处理痕迹需要在训练中区分。", "operation": "让真实图像经过这些模型，形成带不同网络处理痕迹的图像；用分类与度量学习训练指纹提取器，使同源特征接近、异源特征分离。"}, {"name": "模型验证", "flow": "两张图像的指纹 → 是否同源", "operation": "计算指纹表示之间的距离，判断是否可能来自相同模型。", "explanation": "这个任务不要求预先列出所有来源名称。"}, {"name": "模型识别", "flow": "待测指纹、参考图册 → 来源匹配", "operation": "将待测图与各模型参考图比较，选择更符合的来源。", "explanation": "参考图册是识别条件，不能把零样本解释为完全没有任何来源参照。"}], "findings": "在新兴模型识别实验中报告 93.20% 准确率，并比较未见模型识别与同源验证表现。", "limitations": "零样本指提取器没训练过目标模型；命名识别仍需参考图库。难区分同一基座的不同 LoRA 版本。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-37-fig-01.webp", "original_caption": "Fig. 1: Illustration of the existing methods (above) and ours (below). Existing methods depend on training with a limited set of real-world models, struggling to distinguish emerging unseen models like Stable Diffusion (SD) and DALL-E series. In contrast, our method trains on numerous synthetic models that replicate a broader range model fingerprints, enabling it to distinguish and attribute unseen models effectively.", "placement": "intro", "caption": "传统训练来源较少，新增生成器可能落到未知区域；本文用更丰富的合成来源训练可迁移指纹。这解释了“零样本”针对的是目标模型未进入训练。"}, {"number": 2, "page": 4, "src": "figures/paper-37-fig-02.webp", "original_caption": "Fig. 2: Images (top) produced by generative models and the associated (averaged) Fourier spectrum (bottom). The unique characteristics of the Fourier spectrum can be regarded as the fingerprints of generative models and used for model attribution. The spectrum are obtained from high-pass filtered images processed through a denoiser.", "placement": "basis", "caption": "生成图与其平均频谱并排展示，说明不同模型可能留下不同频率统计。频谱是作者分析指纹的一个观察工具，不是直接从主体外观猜来源。"}, {"number": 4, "page": 6, "src": "figures/paper-37-fig-04.webp", "original_caption": "Fig. 4: Our proposed model synthesis strategy. The synthetic model receives a real image as input, producing a fingerprinted image that contains the distinct fingerprint characteristics associated with the synthetic model.", "placement": "method", "caption": "浅层合成网络输入真实图片，输出带其处理痕迹的图像。原始内容基本作为载体，网络结构与参数变化用于产生不同指纹。"}, {"number": 6, "page": 8, "src": "figures/paper-37-fig-06.webp", "original_caption": "Fig. 6: Training the fingerprint extractor based-on synthetic models.", "placement": "detail", "caption": "不同合成模型产生训练样本，指纹提取器学习区别来源。这个训练阶段与后续只输入待测图的归因阶段需要分开。"}, {"number": 7, "page": 8, "src": "figures/paper-37-fig-07.webp", "original_caption": "Fig. 7: Illustration of the model verification (above) and identification (below) problem.", "placement": "evidence", "caption": "上半是两张图的同源验证，下半是对参考模型图册的识别。前者回答是否同源，后者回答更接近哪个已有参考来源。"}], "paper_url": "https://doi.org/10.1109/TMM.2025.3607778", "code_url": "https://github.com/TianyunYoung/Model-Fingerprint"}, {"id": "paper-38", "title": "Exploiting user comments for early detection of fake news prior to users’ commenting", "chinese_title": "CAS-FEND：在评论出现前利用评论知识检测新闻", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Q Nan, Q Sheng, J Cao, Y Zhu, D Wang, G Yang, J Li", "publication": {"venue": "Frontiers of Computer Science 19(10)", "date_label": "在线发表", "date": "2025-01-28", "preprint_date": "2023-10-16", "arxiv_id": "2310.10429"}, "motivation": "评论能指出新闻疑点、提供补充信息和反映社会情绪，但新新闻刚发布时还没有评论。CAS-FEND 希望在训练时利用历史评论，上线时仅凭正文完成早期检测，避免等评论积累后才响应。", "context": "训练时已经有历史新闻和评论，可以学习用户常指出哪些疑点。新新闻发布时没有评论，学生必须只凭正文预测。方法迁移的是从历史评论学到的表示，而不是要求模型凭空知道未来用户会说什么。", "analysis": "直接生成几条虚拟评论会引入额外噪声，所有新闻也未必同样需要情绪或细节信息。方法因此不把评论当作部署输入，而是将评论模型中的知识按类型蒸馏给正文模型。", "rationale": "教师—学生结构利用训练时可见、部署时不可见的信息；分类型蒸馏与自适应权重对应不同新闻对评论线索需求不一致的问题。这是论文训练与推理分工的核心。", "basis_reference": "方法部分：教师—学生蒸馏与知识偏好", "basis_title": "评论还没出现，怎样利用评论知识", "method_title": "教师看评论，学生只看正文", "result_title": "不同新闻需要的监督并不一样", "connection": "教师先学习内容与评论之间的线索，学生分别接收词级、情绪和综合知识。知识偏好评分器控制蒸馏权重，随后部署只保留学生；训练输入更多不等于上线也需要相同输入。", "architecture": [{"name": "有评论教师", "flow": "新闻、历史评论 → 多类教师知识", "explanation": "共注意力找正文与评论相关线索，社会情绪分支提供另一类判断信息。教师仅在训练阶段有这些评论输入。", "operation": "教师模型联合编码新闻与评论，通过共注意力寻找相关内容，并建模社会情绪，形成有评论条件下的判断。"}, {"name": "正文学生", "flow": "新闻正文 → 词级、情绪和综合表示", "explanation": "学生学习教师对应知识，部署时不生成或读取真实评论。虚拟社会情绪是学习到的特征，不是新收集到的用户反馈。", "operation": "学生只编码新闻正文，同时学习教师的重要词分布、虚拟社会情绪和综合特征，分别接收细粒度内容、情感与整体判断知识。"}, {"name": "知识偏好蒸馏", "flow": "新闻内容、各类监督 → 加权训练目标", "explanation": "评分器因新闻而异地分配蒸馏权重，使训练不要求所有知识对每篇文章同样重要。最终推理只运行学生。", "operation": "内容相关的知识偏好评分器为各蒸馏目标分配权重，让不同新闻选择更有帮助的监督。部署阶段只保留学生，不需要等待或输入真实评论。"}], "findings": "学生优于所比较的纯正文方法，并优于部分只获得四分之一评论的评论模型，支持发布时检测。", "limitations": "历史评论可能有偏差与噪声；虚拟情绪是预测特征，不能冒充实际用户态度；跨平台及未来事件仍需验证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-38-fig-01.webp", "original_caption": "Fig. 1 Difference between existing fake news detection methods (content-only and comment-aware) and ours in training-testing settings.", "placement": "intro", "caption": "表格式对照把纯正文、依赖评论和本文的训练／测试条件放在一起。CAS-FEND 的关键是训练可使用评论、测试不依赖评论。"}, {"number": 2, "page": 6, "src": "figures/paper-38-fig-02.webp", "original_caption": "Fig. 2 Overall architecture of the Comments Assisted Fake News Detection (CAS-FEND) framework, which consists of a teacher model and a student model. During the teacher model training, we exploit both news content and comments by aggregating the semantic feature of news content (st p) and user comments (st c) and the social emotion feature et. When training the student model, we only input the content and freeze the well-trained teacher model as guidance. We adopt a Social Emotion Predictor to get an alternative virtual social emotion feature es and aggregate it with content semantic feature ss p. With the help of Knowledge Preference Scorer, the student feature learning is guided by the teacher model through a loss- based adaptive knowledge distillation at the semantic, emotional, and overall knowledge levels.", "placement": "method", "caption": "上方教师联合正文与评论，下方学生仅看正文；中间蒸馏连接三类知识，偏好评分器决定各类监督权重。箭头表示训练指导，并不是推理时再查询教师。"}, {"number": 3, "page": 14, "src": "figures/paper-38-fig-03.webp", "original_caption": "Fig. 3 Distribution of average preference scores for fake and real categories.", "placement": "evidence", "caption": "不同真假类别的平均知识偏好权重不同。图用于检查自适应加权是否实际区分了知识需求，而不是三种蒸馏始终等权。"}], "paper_url": "https://link.springer.com/article/10.1007/s11704-024-40674-6"}, {"id": "paper-41", "title": "Forewarned is Forearmed: Pre-Synthesizing Jailbreak-like Instructions to Enhance LLM Safety Guardrail to Potential Attacks.", "chinese_title": "IMAGINE：提前模拟潜在越狱指令进行安全对齐", "year": "2025", "theme": "大模型可信与安全", "authors": "S Liu, Q Sheng, D Wang, Y Liu, G Yang, J Cao", "publication": {"venue": "EMNLP 2025 · Findings", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-08-27", "arxiv_id": "2508.20038"}, "motivation": "安全训练通常已有一批恶意指令，但实际越狱会把相同意图包装成不同情境。反复加入相似问法，未必覆盖新攻击的表达区域。IMAGINE 希望在攻击出现之前主动合成更多潜在包装，再用于安全对齐。", "context": "安全样本如果始终集中在熟悉表达附近，换一种情境包装就可能暴露空白。本文既要求改写后仍对应原意图，也要求它在表示空间里离开已经覆盖的区域；两项条件缺一，增强都可能流于表面。", "analysis": "合成数据既要保持原始意图，才能作为有效安全训练样本，又要拓展表达分布，而不只是近义改写。论文将“情境隐藏”和“表示空间覆盖”作为两个需要共同处理的问题。", "rationale": "论文明确把越狱文本与安全对齐语料之间的分布差异作为出发点。保持意图与扩展分布的联合目标，对应样本是否有效和是否足够多样两项要求；DPO 则将这批数据用于偏好学习。", "basis_reference": "§3：IMAGINE 生成与安全对齐", "basis_title": "潜在攻击表达为何不能只靠近义改写覆盖", "method_title": "让新数据保持意图，又扩展表达范围", "result_title": "更新后的数据分布是什么样", "connection": "生成模型负责逐轮产生包装变体，嵌入空间目标约束多样性与主题，目标语言模型再用这些数据进行 DPO。安全对齐的效果来自新增训练分布，不是部署时临时调用攻击生成器过滤回答。", "architecture": [{"name": "意图隐藏生成器", "flow": "原始指令 → 情境包装指令", "explanation": "生成器学习保留意图并改变表达场景，目的是为安全训练提供潜在陌生包装，不改变所对应的安全标签。", "operation": "先训练情境改写模型，学习将原指令意图放进不同表达背景，形成更接近潜在越狱包装的样本。"}, {"name": "迭代分布扩展", "flow": "上一轮样本与表示 → 新区域样本", "explanation": "主题、对比和距离相关目标协调意图保持与多样性。生成变体逐轮扩展，而非只重复同一模板。", "operation": "逐轮训练生成变体，在嵌入空间使用主题、对比及距离相关约束，使新样本保持原意图，同时向旧样本未充分覆盖的区域扩展。"}, {"name": "DPO 安全对齐", "flow": "合成指令、拒绝偏好 → 目标模型", "explanation": "DPO 是用成对偏好更新模型的训练方法。合成器负责数据，目标模型负责最终回答，两者不应混作同一个部署模块。", "operation": "将合成样本与拒绝回答组成偏好数据，通过 DPO 安全对齐目标模型，并检查正常任务能力和过度拒绝情况。"}], "findings": "在 Qwen2.5 与 Llama 系列三个模型上降低多种越狱攻击成功率，并评估正常能力和误拒绝。", "limitations": "仍依赖初始配对数据和嵌入模型；迭代生成有计算成本；未验证更大规模模型，也不能保证覆盖未来攻击。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-41-fig-01.webp", "original_caption": "Figure 1: Comparison between post hoc patching and IMAGINE enhanced safety alignment. (a) An illustration of the post hoc patching workflow. Model developers are always “one step slower” than the attackers, achieving less effect with more effort. (b) Align with IMAGINE, model developers could train unaligned models with jailbreak-like data. As a new jailbreak attack is proposed, the model has already been trained with similar data and could recognize and refuse the real attack instruction, reducing the cost of patching post hoc.", "placement": "intro", "caption": "被动补洞与提前模拟的时间线对比说明作者动机：部署后再修攻击可能总落后一步，增强希望提前拓展训练覆盖。"}, {"number": 2, "page": 4, "src": "figures/paper-41-fig-02.webp", "original_caption": "Figure 2: (a) An illustration of the iterative space expansion workflow. (b) An example of a simple malicious instruction and its intent concealed versions. (c) Training from base intent-concealing model M0 at iteration k.", "placement": "method", "caption": "迭代空间扩展、情境包装示例和第 k 轮训练放在同图。不同损失协调保持主题与生成新区域，不只是让文字看起来更长。"}, {"number": 3, "page": 9, "src": "figures/paper-41-fig-03.webp", "original_caption": "Figure 3: t-SNE (Van der Maaten and Hinton, 2008) visualization of latent spaces before and expanded by IMAGINE. Left: Original embedding distributions. Right: IMAGINE-added distribution. Rows from top to bottom: Llama3.1, Llama3.2, and Qwen2.5.", "placement": "evidence", "caption": "t-SNE 对比原有与扩展后的样本表示，用来直观展示覆盖变化。这是分布可视化，真正安全效果仍需结合攻击测试。"}], "paper_url": "https://aclanthology.org/2025.findings-emnlp.266/"}, {"id": "paper-43", "title": "Llm-generated fake news induces truth decay in news ecosystem: A case study on neural news recommendation", "chinese_title": "真相衰减：生成新闻如何影响推荐排序", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "B Hu, Q Sheng, J Cao, Y Li, D Wang", "publication": {"venue": "SIGIR 2025", "date_label": "在线发表", "date": "2025-07-13", "preprint_date": "2025-04-28", "arxiv_id": "2504.20013"}, "motivation": "大模型生成的新闻不只影响真假检测，还会进入推荐候选、用户阅读历史甚至推荐训练数据。本文研究这些介入会怎样改变真假新闻的相对排序，关心的是推荐生态中的系统性变化。", "context": "推荐系统不仅读取候选新闻，也读取用户历史，并通过训练数据学习偏好。生成内容进入不同位置，可能以不同方式改变结果。作者把这些位置逐步打开，避免一次加入全部生成数据后无法区分来源。", "analysis": "若所有生成新闻一次性加入系统，很难区分影响来自候选内容、历史表示还是训练过程。作者因此按介入位置逐步设置实验，并观察推荐模型对不同来源文本的偏好。", "rationale": "论文通过分阶段介入设计区分不同环节的作用，再从熟悉度视角分析“真相衰减”。这是一套控制变量的经验研究，并非对所有现实推荐系统给出的统一因果定理。", "basis_reference": "§4：分阶段介入实验与熟悉度分析", "basis_title": "生成新闻进入推荐系统的哪一环", "method_title": "先构造可比较数据，再逐步介入", "result_title": "真实新闻的排序优势怎样变化", "connection": "先把真假检测数据改造成推荐序列，再生成和检查不同新闻样本，最后固定推荐模型比较各阶段。研究对象是相对排序变化，而不是直接证明每个真实用户都会被生成内容说服。", "architecture": [{"name": "推荐数据构建", "flow": "真假标签、互动、生成新闻 → 序列推荐数据", "explanation": "保持新闻类型可区分，使排序结果能够按真假与生成来源统计。生成内容采用多种方式构造。", "operation": "把 GossipCop 的真假标签与社交互动记录整理为推荐序列数据，构建约 5.6 万条多种方式生成的新闻，为真假和生成来源提供可比较的样本。"}, {"name": "分阶段介入", "flow": "固定推荐模型、不同介入位置 → 排名结果", "explanation": "分别改变候选、用户历史和训练数据中的生成内容，区分这些环节的作用，而不一次同时改变全部条件。", "operation": "依次设置生成新闻不介入、进入候选、进入历史、进入训练数据等条件，在 LSTUR、NRMS 等推荐模型中比较排序变化。"}, {"name": "机制分析", "flow": "排序指标、熟悉度信号 → 真相衰减解释", "explanation": "MRR 与 nDCG 等衡量排名，熟悉度和困惑度用于分析偏好来源。这是经验研究流程，不是新增三层推荐网络。", "operation": "以 MRR、nDCG 和前列占比等指标观察真假新闻位置，并结合模型熟悉度与困惑度分析生成内容为何更容易获得推荐优势。"}], "findings": "观察到生成内容逐步介入时，真实新闻相对假新闻的排序优势减弱，作者称之为“真相衰减”。", "limitations": "这是模拟推荐环境中的排名现象，并非真实平台因果实验或人类信念实验证据；未覆盖下一代 LLM 推荐器和完全自主造假。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-43-fig-01.webp", "original_caption": "Figure 1: Illustration of Truth Decay phenomenon, where real news gradually loses its advantageous position in rankings against fake news as LLM-generated news penetrates.", "placement": "intro", "caption": "示意图定义真相衰减：生成新闻介入后，真实新闻原有的排序优势减弱。它先说明要测什么，再进入推荐模型和数据设计。"}, {"number": 2, "page": 3, "src": "figures/paper-43-fig-02.webp", "original_caption": "Figure 2: Illustration of a typical news recommendation model in the (Left) training and (Right) inference phases.", "placement": "basis", "caption": "训练阶段与推理阶段的新闻／用户编码流程不同。把这张图与介入实验一起看，能理解生成候选、生成历史和生成训练数据为何不是同一种操作。"}, {"number": 3, "page": 5, "src": "figures/paper-43-fig-03.webp", "original_caption": "Figure 3: Illustration of dataset construction process, which consists of (Top) repurposing a fake news detection dataset for news recommendation and (Bottom) prompting LLMs to generate news data and performing quality check.", "placement": "method", "caption": "上半部分将带真假标签及用户互动的数据整理为推荐材料，下半部分生成并检查新闻。这样后续排名可以按内容类型分别统计。"}, {"number": 7, "page": 13, "src": "figures/paper-43-fig-07.webp", "original_caption": "Figure 7: Variation in Ratio@5 for real and fake news. The red dashed line and blue dashed line represent the Ratio@5 values for real and fake news, respectively, when no LLM-generated news is present. The red shaded area illustrates the extent to which real news leads fake news, while the blue shaded area shows the extent to which fake news leads real news.", "placement": "evidence", "caption": "真实与虚假新闻在前列的占比随生成内容介入而变化。基线线条提供参照，观察的是排序结构如何变，而不是把某一类新闻的分数单独拉高多少。"}], "paper_url": "https://doi.org/10.1145/3726302.3730027"}, {"id": "paper-44", "title": "Enhancing the comprehensibility of text explanations via unsupervised concept discovery", "chinese_title": "ECO-Concept：自动发现可理解的文本分类概念", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Sun, D Wang, Q Sheng, J Cao, J Li", "publication": {"venue": "ACL 2025 · Findings", "date_label": "论文集", "date": "2025-07", "preprint_date": "2025-05-26", "arxiv_id": "2505.20293"}, "motivation": "文本分类的词级高亮虽能指出局部关注，却不一定告诉读者模型学到了什么概念。预先人工定义概念又难以覆盖不同任务。ECO-Concept 希望自动发现任务相关概念，并让概念成为模型实际分类所依赖的中间表示。", "context": "如果分类先完成，再让大模型写一句解释，解释可能并非真实预测依据。ECO-Concept 让分类器只能使用概念激活量，再检查这些概念能否被描述、能否在新文本中找到对应片段，形成可回到训练里的反馈。", "analysis": "无监督聚类得到的概念可能很难解释，而分类后再让 LLM 编一段说明，也未必忠实于模型。论文把概念提取、分类和可理解性反馈放进一个训练循环，使解释能够影响模型本身。", "rationale": "论文采用概念瓶颈与槽注意力作为结构基础，并将“人能否从概念描述找到同样片段”转成可训练的差异目标。概念不只是事后命名，而是参与分类与反馈优化的变量。", "basis_reference": "§3.1—3.4：概念瓶颈、槽注意力与反馈", "basis_title": "概念解释怎样真正参与分类", "method_title": "发现概念、通过概念预测，再反馈修正", "result_title": "一个具体文本例子怎样变化", "connection": "槽注意力分配文本片段，概念激活进入分类器；评估器则总结高激活样本，并在新样本中重新定位概念。重新定位与模型实际注意力之间的差异回到概念训练，使解释不只是一张事后标签。", "architecture": [{"name": "槽注意力概念提取", "flow": "词元特征、可学习概念 → 概念激活", "explanation": "多个槽竞争解释输入片段，并通过一致性和差异性约束形成分工；槽是模型中的可学习向量，不是手写词典。", "operation": "槽注意力让多个可学习概念竞争文本中的词元，通过一致性与差异性约束形成不同概念关注区域，而不是依赖预先写好的概念词表。"}, {"name": "概念瓶颈分类", "flow": "各概念激活量 → 类别预测", "explanation": "分类器仅利用概念汇总特征，确保概念参与预测。它与先用黑箱分类、再额外生成解释的流程不同。", "operation": "汇总各概念的激活量作为分类输入，分类器只通过这一概念瓶颈作判断，使概念与预测建立结构上的联系。"}, {"name": "可理解性反馈", "flow": "概念描述、高亮和模型注意力 → 概念更新", "explanation": "LLM 总结概念并定位新样本相关片段，二者与实际槽注意力的差异构成反馈，反过来优化概念。", "operation": "让 LLM 总结高激活样本，再在新样本中高亮该概念对应片段；比较高亮与实际注意力的差异，形成可理解性反馈并微调概念，迭代至较稳定状态。"}], "findings": "在七个文本分类数据集和人工实验中比较分类能力与概念可理解性，多项分类结果接近黑箱模型。", "limitations": "主要为较轻量文本分类模型；LLM 评价有成本和偏差；概念数量预先固定，并未直接解决大生成模型的全部可解释性问题。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-44-fig-01.webp", "original_caption": "Figure 1: Comparison of explanations between our pro- posed ➂ECO-Concept and existing typical ➀super- vised and ➁unsupervised concept-based methods. Su- pervised methods explain based on predefined concepts, while ECO-Concept and unsupervised methods explain via concept-related highlighted text. ECO-Concept elim- inates the need for concept annotations and can discover unseen concepts with improved comprehensibility.", "placement": "intro", "caption": "三种概念解释路线比较是否依赖预定义概念、是否能发现新概念、是否可读。本文关注自动发现与可理解性的结合。"}, {"number": 2, "page": 4, "src": "figures/paper-44-fig-02.webp", "original_caption": "Figure 2: (a) Illustration of the proposed framework ECO-Concept. ECO-Concept consists of a concept extractor, a classifier, and a concept evaluator. (b) The concept extractor takes the encoded text X as input and interacts with the concept prototypes C to obtain a slot attention matrix A and concept features U. The concept prototypes are optimized using consistency and distinctiveness loss. (c) The concept evaluator utilizes exemplars with the highest concept attention values to construct two sets, Dsum and Dhigh. Using the corresponding slot attention matrices Asum and Ahigh, the evaluator highlights these exemplars to perform concept summarization and highlighting, thus getting the comprehensibility loss to guide model fine-tuning.", "placement": "method", "caption": "主框架连接概念提取器、瓶颈分类器和概念评估器。读者应先看分类是否真的经由概念，再看评估反馈怎样回到概念参数。"}, {"number": 6, "page": 14, "src": "figures/paper-44-fig-06.webp", "original_caption": "Figure 6: Comparison of explanations before and after concept enhancement in a beer review case", "placement": "evidence", "caption": "同一啤酒评论在概念增强前后的解释并排展示。具体词句对应哪些概念、概念能否被人读懂，比只列可理解性总分更直观。"}], "paper_url": "https://aclanthology.org/2025.findings-acl.758/"}, {"id": "paper-46", "title": "PhantomHunter: Detecting Unseen Privately-Tuned LLM-Generated Text via Family-Aware Learning", "chinese_title": "PhantomHunter：家族感知的私有微调文本检测", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Shi, Y Yang, Q Sheng, H Mi, B Hu, C Xu, J Cao", "publication": {"venue": "arXiv:2506.15683", "date_label": "预印本首发", "date": "2025-06-18", "preprint_date": "2025-06-18", "arxiv_id": "2506.15683"}, "motivation": "私有微调后的语言模型通常不公开权重，检测器无法收集它的输出建立专门训练集。单纯针对公开模型训练的检测方法，又可能随着微调而退化。PhantomHunter 希望利用基座与后代模型共享的家族特征，识别未知私有模型生成的文本。", "context": "检测器无法调用未知私有模型，但可以拿同一段文本去问多个公开基座：每个基座认为这串词有多大概率。这里计算的是已知文本的概率，不是让代理重新生成一段相似文本。多个概率序列共同形成待检测特征。", "analysis": "语义风格随领域微调变化较大，但文本在多个公开基座下的概率模式，可能仍保留家族关系。方法不仅需要真假判别，还要从多个家族中选出更适合当前文本的检测专家。", "rationale": "作者以基座与微调后代之间共享家族级特征的观察为依据，对比学习显式鼓励保留家族共性，专家门控则利用这一共性进行检测。它不假定不同家族都能由一个固定判别边界充分覆盖。", "basis_reference": "§3.1—3.3：概率特征、家族学习与专家融合", "basis_title": "私有微调改变风格后，还剩哪些共同线索", "method_title": "公开代理概率、家族编码与专家融合", "result_title": "为什么家族信息可能帮助检测", "connection": "概率编码器先学习序列特征，家族对比把同源后代拉近，家族预测再控制专家融合。家族来源不必先由人正确指定，而是模型内部估计；估计不准也会影响后面的专家权重。", "architecture": [{"name": "公开基座概率特征", "flow": "待测文本、多个公开基座 → 逐词元概率表示", "explanation": "每个基座为同一段文本计算概率序列，再由 CNN 和 Transformer 编码。它们是代理评估模型，不是未知私有生成器。", "operation": "把待测文本分别送入多个公开基座，计算逐词元概率序列，再用 CNN 与 Transformer 编码这些序列，获得概率特征。"}, {"name": "家族对比编码", "flow": "生成文本的家族关系 → 家族相关特征", "explanation": "同家族样本作为正对，鼓励微调后代与基座保留共同表示，并预测来源家族，为专家选择提供权重。", "operation": "同一家族生成文本作为正样本进行对比学习，并学习来源家族，使同基座不同微调后代的特征更接近。"}, {"name": "家族专家融合", "flow": "家族概率、专家判断 → 真假预测", "explanation": "每个专家提供对应家族下的检测意见，门控按概率融合。仍需运行多个公开代理模型，不能描述成只读一次文本即可零成本推理。", "operation": "以家族预测概率作为门控，融合多个家族专家的真假判断。推理不需要访问未知私有模型本身，但需要运行这些公开代理基座。"}], "findings": "实验和消融支持概率特征、家族对比学习及专家门控的贡献；来源家族识别仍比真假二分类更难。", "limitations": "对训练覆盖外的全新家族与复杂改写的泛化不能保证；需要运行多个基座计算概率，部署成本高于单模型分类；私有微调设置仍是实验近似。", "figures": [{"number": 1, "page": 3, "src": "figures/paper-46-fig-01.webp", "original_caption": "Figure 1: Detection accuracy for LLM-generated text with increasing amounts of fine-tuning data.", "placement": "intro", "caption": "随着微调数据增多，原有语义或概率检测器准确率下降。该分析说明只认识公开基座本身，可能不足以识别它的私有后代。"}, {"number": 2, "page": 4, "src": "figures/paper-46-fig-02.webp", "original_caption": "Figure 2: Cosine similarity between the token probability lists of fine-tuned models and those of the base ones. Darker colors indicate higher similarity.", "placement": "basis", "caption": "微调模型与不同基座的词元概率序列相似度支持家族相关性的观察。较深颜色表示更相近，但并不说明所有后代都能被无误归家族。"}, {"number": 3, "page": 5, "src": "figures/paper-46-fig-03.webp", "original_caption": "Figure 3: Overall architecture of PhantomHunter. Given a text sample x, it 1) extracts the probability feature from M base models and encode them with CNN and transformer blocks; 2) predicts the family of x to determine the family gating weights; and 3) feeds the representation RF to a mixture-of-experts network controlled by the gating weights from Step 2 for final prediction of x being LLM-generated. During training, a contrastive learning is applied in each mini-batch to better model family relationships.", "placement": "method", "caption": "从多个公开基座取概率，经过家族编码，再用家族权重融合专家。三个阶段的中间输出分别是概率表示、来源倾向和真假判断。"}], "paper_url": "https://arxiv.org/abs/2506.15683"}, {"id": "paper-48", "title": "Attend to not attended: Structure-then-detail token merging for post-training dit acceleration", "chinese_title": "SDTM：依据结构—细节去噪过程合并 token", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "H Fang, S Tang, J Cao, E Zhang, F Tang, TY Lee", "publication": {"venue": "CVPR 2025", "date_label": "arXiv 首发", "date": "2025-05-16", "preprint_date": "2025-05-16", "arxiv_id": "2505.11707"}, "motivation": "扩散生成前期主要形成整体结构，后期逐步补充细节。若所有步骤都用相同 token 合并规则，可能在关键阶段丢掉有用信息。SDTM 利用这一去噪规律，研究无需额外训练的动态计算压缩。", "context": "早期整体轮廓还没稳定，随意把相似位置并在一起可能破坏布局；后期布局基本确定，更值得保留局部纹理变化。论文将 token 冗余视为随时间变化的问题，而不是给所有步骤一个固定删除比例。", "analysis": "冗余的位置与程度会随时间变化：早期应保护全局布局，后期需要避免损伤细节。只看当前特征相似度或固定压缩率，难以适应这两种需求。", "rationale": "论文第 3 节分析去噪过程中结构与细节的先后规律，第 4 节据此设计动态合并、压缩率和提示词重加权。其依据来自作者对扩散去噪冗余的分析，而非把所有相似 token 一律视作无用。", "basis_reference": "§3—4：去噪分析与 SDTM", "basis_title": "去噪前后期，哪些计算是重复的", "method_title": "局部结构与全局细节采用不同合并方式", "result_title": "合并位置是否随阶段改变", "connection": "结构相似性合并与细节不关注合并分别服务不同阶段，动态比例控制压缩强度，提示重加权照顾当前生成重点。它们都接入已有 DiT，部署时改变推理计算，不要求先重新训练基座。", "architecture": [{"name": "前期局部结构合并", "flow": "早期 token → 压缩结构表示", "explanation": "按局部结构相似性减少重复计算，目标是保留布局所需差异。该阶段不直接采用后期的全局细节规则。", "operation": "早期根据局部结构相似性合并 token，降低重复计算，同时保留生成布局所需的局部结构差异。"}, {"name": "后期细节导向合并", "flow": "后期 token → 压缩细节表示", "explanation": "根据细节不关注程度在更大范围合并，将计算留给仍需细化的位置，使策略适应去噪阶段变化。", "operation": "后期转为依据细节不关注程度进行全局合并，将计算更多留给当前仍需细化的位置。"}, {"name": "动态压缩率", "flow": "去噪阶段 → 合并比例或阈值", "operation": "随结构和细节生成阶段调整压缩程度，避免全程同一强度。", "explanation": "它决定每一步省多少计算。"}, {"name": "提示词重加权", "flow": "结构／细节提示 → 阶段相关文字指导", "operation": "相应提高当前阶段所需语义的作用，配合 token 合并。", "explanation": "它不改变用户的任务目标，而是调整生成过程中指导的分配。"}], "findings": "跨骨干、采样器和数据集测试，论文报告约 1.55 倍加速，画质变化较小。", "limitations": "压缩收益取决于输入与模型，过度合并仍可能损失细节；“无损”不能泛化。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-48-fig-01.webp", "original_caption": "Figure 1. Illustration. Upper: Our SDTM represents a dynamic multi-resolution generation process by reducing feature redundan- cies in areas not unattended by the denoising process. Lower: Compared to the baseline method, our approach achieves 1.55× acceleration with negligible impact on generation quality.", "placement": "intro", "caption": "前后两条去噪序列展示压缩后的多分辨率变化及最终结果。它让读者先看到：减少 token 计算不等于始终使用同样粗糙的表示。"}, {"number": 2, "page": 3, "src": "figures/paper-48-fig-02.webp", "original_caption": "Figure 2. Preliminaries. Left: Evolution of Denoising Process: The L2 norm of (a) LL, (b) LH, HL, and HH subbands of estimated noise during the DiT denoising process. Right: Evolution of Feature Redundancies: (c) Location and (d) Degree evolution of token redundancies across DiT different steps and layers. Experiments were conducted on MMDiT [9] with 50-step RF schedule [25] based on 10k samples.", "placement": "basis", "caption": "频率子带和冗余随去噪变化，是结构先、细节后的原文分析依据。该观察随后决定不同阶段采用不同规则。"}, {"number": 3, "page": 4, "src": "figures/paper-48-fig-03.webp", "original_caption": "Figure 3. Overview. Grey: Our SDTM compresses weak-structure redundancies in the early stage and weak-detail redundancies in the later stage. Blue: Compression ratio adjusting (CRA) dynamically adjusts the ratio or threshold to control the pruning degree. Yellow: Prompt token reweighting (PTR) categorizes each prompt token into structure or detail groups, optimizing the denoising direction by reweighting attention map. Here, increase and decrease in red and green, while bold implies intensity.", "placement": "method", "caption": "总图中动态合并、压缩率调整和提示重加权分别标出，说明加速并非只靠一个固定阈值。"}, {"number": 4, "page": 4, "src": "figures/paper-48-fig-04.webp", "original_caption": "Figure 4. Visual Token Merging. By measuring structure similar- ity, unmerged frequency, and detail inattentiveness, SSM and IDM target different types of feature redundancies for reduction.", "placement": "module-1", "caption": "SSM 与 IDM 的合并依据不同：前者关注结构相似性，后者关注细节不关注程度。看这张图能分清两种策略到底合并哪些位置。"}, {"number": 9, "page": 8, "src": "figures/paper-48-fig-09.webp", "original_caption": "Figure 9. Visualization of merged tokens selected. White masks represent independent sampling, while gray masks represent merg- ing. In the later stage, only inattentive merged tokens are grayed.", "placement": "evidence", "caption": "不同步骤实际选择的合并位置可视化。它用于检查策略是否按设计改变关注区域，而不是仅在文字上声称动态。"}], "paper_url": "https://arxiv.org/abs/2505.11707", "code_url": "https://github.com/ICTMCG/SDTM"}, {"id": "paper-49", "title": "Understanding and mitigating hallucination in large vision-language models via modular attribution and intervention", "chinese_title": "视觉语言模型幻觉：模块归因与定向干预", "year": "2025", "theme": "大模型可信与安全", "authors": "T Yang, Z Li, J Cao, C Xu", "publication": {"venue": "ICLR 2025", "date_label": "会议", "date": "2025-04-24—28"}, "motivation": "视觉语言模型可能说出图片里并不存在的物体。仅从输出统计幻觉，难以知道该干预模型哪里；大规模重新训练也成本较高。本文先定位与幻觉有关的内部模块，再实施局部干预。", "context": "模型提到不存在的物体时，不能仅看哪个注意力头颜色最深，就断言它造成错误。作者通过内部干预比较模块对幻觉词概率的影响，再研究高贡献头是否更偏向文字，从定位走向可执行修改。", "analysis": "注意力高不代表对输出有因果作用。作者采用因果中介分析比较注意力与前馈模块，追查哪些部件真正推动幻觉词，并进一步研究这些注意力头是否过度依赖文本而忽视视觉。", "rationale": "这里明确使用的是论文中的因果中介分析框架：通过对内部变量的干预评估其对结果的作用。随后两种方法针对已定位的幻觉头修改计算，分别对应解码干预和局部微调。", "basis_reference": "因果中介分析与模块干预部分", "basis_title": "注意力大不等于导致幻觉", "method_title": "先做因果定位，再决定怎样干预", "result_title": "减少幻觉也要保住生成质量", "connection": "分析得到的幻觉头用于两种不同方案：AD-HH 在解码中改文本注意力，TF-HH 只微调相关部分。两者不是必须先后执行的网络层，读者可以分别理解无需整体重训的推理干预和局部训练干预。", "architecture": [{"name": "因果模块归因", "flow": "模型内部变量、幻觉输出 → 模块贡献", "explanation": "通过干预评估对输出的作用，避免仅用注意力数值大小判断因果关系。该分析先定位应处理的头。", "operation": "通过模块级因果中介分析，干预并比较内部模块对幻觉输出的贡献，定位高贡献注意力头，而不只用相关性可视化选位置。"}, {"name": "幻觉头特征分析", "flow": "已定位头 → 文本偏好与模块位置", "explanation": "作者比较语言底座和指令微调相关行为，检查高贡献头是否过度关注文本，为干预方式提供依据。", "operation": "分析这些头的位置、文本偏好及其与语言底座、指令微调的关系，建立后续干预应针对哪些计算通路的依据。"}, {"name": "AD-HH：解码干预", "flow": "已定位的头 → 调整后的文本注意力", "operation": "生成时对过度偏向文字的幻觉头关闭文本注意力。", "explanation": "这是一种推理阶段方案，不需要整体重新训练模型。"}, {"name": "TF-HH：局部微调", "flow": "相关注意力头与语言头 → 更新的模型", "operation": "只微调定位相关的参数，论文实现中特别处理注意力的 Query／Key。", "explanation": "这是另一种训练方案，不与 AD-HH 强制串联。"}], "findings": "LLaVA-v1.5-7B 的 COCO 描述实验中，幻觉率最多降至原来的约 1/1.7，同时检查生成质量。", "limitations": "无需训练方案需要显式注意力权重，与 FlashAttention 等实现不兼容；定位与干预需模型内部访问；结论不能外推为所有幻觉的唯一原因。", "figures": [{"number": 1, "page": 4, "src": "figures/paper-49-fig-01.webp", "original_caption": "Figure 1: Influence scores of MLP and MHAs in LLaVa-7B on generation probability of hal- lucination objects.", "placement": "basis", "caption": "MLP 与多头注意力的中介效应比较用于定位更相关的模块类型。纵轴是干预后效应，不是一般注意力权重。"}, {"number": 2, "page": 5, "src": "figures/paper-49-fig-02.webp", "original_caption": "Figure 2: Contrastive influence values of atten- tion heads in the LLaVA-7B model, with blue boxes for the top 20 hallucination heads and red boxes for non-hallucination heads.", "placement": "basis", "caption": "不同层、不同注意力头的对照影响值帮助定位少数高贡献头。定位结果告诉后续方法应优先改哪里。"}, {"number": 3, "page": 5, "src": "figures/paper-49-fig-03.webp", "original_caption": "Figure 3: Attention weights on text and image tokens for hallucination and non-hallucination heads. Hallucination heads strongly favor text tokens over image tokens.", "placement": "method", "caption": "幻觉头和非幻觉头在文字／图像注意力上的差别，为“过度偏向文字”的机制解释提供经验依据。"}, {"number": 6, "page": 7, "src": "figures/paper-49-fig-06.webp", "original_caption": "Figure 6: (a) Downscaling text attention weights reduce hallucination rate. (b) Upscaling image attention weights does not work. (c) Downscaling text attentions weights to zero lead to the drop in generation quality of BLEU.", "placement": "detail", "caption": "改变文本或图像注意力强度的对照同时观察幻觉和质量。它说明降低文本影响不是越强越好，直接全关也可能损伤正常生成。"}, {"number": 7, "page": 9, "src": "figures/paper-49-fig-07.webp", "original_caption": "Figure 7: Visualization of attention weights for the top hallucination head when predicting the next token (shown in blue). We accumulate the attention weights on a total of 576 image tokens into the placeholder <image> to simplify visualization. Redder values in the context indicate larger attention weights. The original LLaVA-7B model significantly relies on the previously generated tokens, resulting in hallucination. Our model through targeted fine-tuning does not have this issue.", "placement": "evidence", "caption": "具体生成案例展示相关头的注意力和输出差别，把内部干预与用户能看到的描述联系起来。"}], "paper_url": "https://proceedings.iclr.cc/paper_files/paper/2025/hash/8001c3568152d134d821cd46d4d84768-Abstract-Conference.html", "code_url": "https://github.com/TianyunYoung/Hallucination-Attribution"}, {"id": "paper-50", "title": "B4m: Breaking low-rank adapter for making content-style customization", "chinese_title": "B4M：可组合的内容—风格低秩适配", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, J Cao, Y Zhang, O Deussen, W Dong, J Li, TY Lee", "publication": {"venue": "ACM Transactions on Graphics 44(2)", "date_label": "正式发表", "date": "2025-04-17", "preprint_date": "2024-03-28", "arxiv_id": "2403.19456"}, "motivation": "用户可能希望把某个定制主体画成多种风格，也希望同一种风格应用到不同主体。独立训练的内容与风格 LoRA 直接合并，容易互相干扰；把两者一起学，又可能绑定成一个不可拆的组合。B4M 从参数空间组织方式入手处理这个问题。", "context": "如果一张训练图总是同一主体配同一画风，模型很容易把两者一起记住。用户换主体或换风格时，就暴露出这种绑定。B4M 同时从可学习参数的位置和训练配对关系入手，试图让两类概念更可组合。", "analysis": "LoRA 的上下投影矩阵共同决定更新，把内容和风格都放在共享可学习参数中，难以保证组合时仍各自保留作用。训练数据若只有一对一对应，也会鼓励记住固定内容—风格配对。", "rationale": "论文以正交先验构造内容与风格的子参数空间，PLP 分开可学习部分，MCP 用多对应配对减轻绑定。正式版摘要另明确采用黎曼预条件来平衡组合时的内容与风格学习；此处说明其原文用途，不补写未核对的黎曼优化推导。", "basis_reference": "早期全文 PLP／MCP；正式版摘要的黎曼预条件", "basis_title": "内容与风格为何会在参数里纠缠", "method_title": "先分开学习，再组合优化", "result_title": "组合是否保留两边的特征", "connection": "PLP 决定内容和风格分别学习哪些参数，MCP 决定训练时怎样交叉配对，组合阶段再重建可用适配器。这里图示主要来自 Break-for-Make 预印本；正式版关于黎曼预条件的补充仍按其摘要明确的用途说明。", "architecture": [{"name": "PLP：部分可学习投影", "flow": "原 LoRA → 分离的内容／风格子空间", "explanation": "LoRA 用低秩上下投影表示参数更新；PLP 固定其中一部分、学习另一部分，并用近似正交基减少组合干扰。", "operation": "PLP 只学习上下投影矩阵中的部分参数，将内容与风格分配到不同子参数空间；冻结部分用近似正交基初始化，减少矩阵乘积带来的干扰。"}, {"name": "MCP：多对应训练", "flow": "内容与多风格、风格与多内容 → 可组合投影", "explanation": "多对应安排打破一对一绑定，避免一个内容投影只会和训练时唯一风格配合，反向也相同。", "operation": "MCP 让同一内容对应多种参考风格，也让同一风格对应多种内容，打破一对一绑定，学习更可组合的参数空间。"}, {"name": "组合与平衡优化", "flow": "内容／风格 PLP → 组合适配器", "explanation": "正式版使用黎曼预条件平衡两类学习。它调整组合优化，不是对图像后处理；具体推导不从摘要补写。", "operation": "组合阶段重新拼接内容与风格的 PLP 矩阵。正式期刊摘要进一步采用黎曼预条件（Riemannian preconditioning）自适应平衡内容与风格学习，再进行组合适配；这里的预条件用于调整优化过程，而不是新增一个生成器。"}], "findings": "通过参数分布、内容与风格重建、编辑、人类偏好及组件消融检验组合生成效果。", "limitations": "仍需参考样本训练与组合微调，复杂多主体与基础模型薄弱概念仍受限。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-50-fig-01.webp", "original_caption": "Figure 1: By separately learning content and style in “partly learnable projection” (PLP), our method is able to generate images of customized content and style aligned with various prompts while successfully disentangling content and style and maintaining high fidelity of them.", "placement": "intro", "caption": "同一主体换风格、同一风格换主体的示例明确可组合定制的目标。不是只在训练时那一对参考组合上看起来相似。"}, {"number": 2, "page": 3, "src": "figures/paper-50-fig-02.webp", "original_caption": "Figure 2: Frameworks of the two main approaches and ours for customized content-style image generation. LoRA joint training incorporates image-text pairs to fine-tuning the overall model parameters. ZipLoRA [Shah et al. 2023] effectively merging independently trained content and style LoRAs, then add to per-trained weights to generaet images of the customized content and style. Our method trains content and style in separated parameter subspaces of LoRA, results in disentanglement of content and style while maintaining high level of fidelity.", "placement": "basis", "caption": "联合训练、适配器合并和本文分离投影的结构对照。它帮助理解各方法把内容与风格放在哪些参数中，以及组合发生在何处。"}, {"number": 3, "page": 5, "src": "figures/paper-50-fig-03.webp", "original_caption": "Figure 3: Analysis of the two main methods and ours using LoRA for customized content-style image generation. Joint training LoRA will mix the parameter space of content and style, leads to entanglement of content and style. Merging LoRAs after independent training has problem of conflict parameters from content LoRA and style LoRA, leads to content and/or style unfaithful after fusion. Our proposed method trains the content and style in separate parameter subspaces of the LoRA modules, with orthogonal fixed parameter spaces, resulting in disentangled and faithful fusion of content and style.", "placement": "method", "caption": "参数空间分析展示联合学习与简单合并可能出现的干扰，并对照 PLP 的分离方式，为参数设计提供原文证据。"}, {"number": 4, "page": 5, "src": "figures/paper-50-fig-04.webp", "original_caption": "Figure 4: Illustration of the multi-correspondence projection. We present the learned content distribution on the left of the top row. When training specific content and style in a one-to-one manner, the content will tend to overfit to the specific style, as illustrated on the middle of the top row. By leveraging our proposed multi-correspondence projection, we learn multiple styles with the content in PLP, enhance the generalization of the learned content.", "placement": "module-1", "caption": "MCP 中同一内容与不同风格交叉对应，反向也同样组织。图把“打破一对一绑定”落实为训练关系，而不只是新增一个正则名称。"}, {"number": 14, "page": 14, "src": "figures/paper-50-fig-14.webp", "original_caption": "Figure 14: Ablation study evaluating the impact of the proposed Multi-Correspondence Projection (“MCP”). We train specific content (e.g., “vase”) and style (e.g., “glass”) in a one-to-one manner and directly inference after training. Results are presented in W/o MCP - I column. We train specific content (e.g., “vase”) and style (e.g., “yarn”) in a one-to-one manner in the first stage, and combine the content (e.g., “vase”) adapters with other style (e.g., “glass”) adapters in the second stage, then inference with the combined adapters. Results are presented in W/o MCP - II column. The visual comparison highlights the effectiveness of MCP in enhancing the details while preserving the disentanglement of content and style, as well as maintaining high-level fidelity of them.", "placement": "evidence", "caption": "移除多对应训练后的对比用于检查配对策略是否影响新组合。关注内容与风格是否各自保持，而不是只看整体画质。"}], "paper_url": "https://doi.org/10.1145/3728461", "code_url": "https://github.com/ICTMCG/Break-for-make"}, {"id": "paper-52", "title": "Multi-level feature dynamic fusion neural radiance fields for audio-driven talking head generation", "chinese_title": "MLDF-NeRF：多层特征融合的音频驱动说话头像", "year": "2025", "theme": "人物与交互视频生成", "authors": "W Song, Q Liu, Y Liu, P Zhang, J Cao", "publication": {"venue": "Applied Sciences 15(1)", "date_label": "正式发表", "date": "2025-01-06"}, "motivation": "音频驱动说话头像时，嘴部受声音影响最直接，其他面部区域变化规律不同。若所有空间位置都用同一种音频融合方式，重要动态区域的信息可能丢失，无关区域也可能受到干扰。MLDF-NeRF 改进空间表示及音视频融合。", "context": "音频直接影响嘴部运动，却不应让所有面部区域都产生同样变化。论文用多层空间表示保留粗细特征，再让不同区域与音频建立不同联系。渲染器最后把这些条件转为画面，而不是用音频直接预测整张人脸像素。", "analysis": "单一尺度难以同时表达全局轮廓与细小动作；声音与空间位置的对应关系也不应固定。论文分别增加多层级三平面表示，以及区域相关的音视频交互。", "rationale": "论文第 3 节以 NeRF 的颜色—密度场和体渲染为基础，随后用多层三平面与注意力融合增强条件表示。作者明确针对音频与不同面部区域映射不一致、重要区域信息不足两项问题设计模块。", "basis_reference": "§3.1—3.3：体渲染、三平面与音视频融合", "basis_title": "嘴部与其他面部区域，不应同样响应声音", "method_title": "多尺度空间表示怎样与音频结合", "result_title": "图像细节与音画对应分别看什么", "connection": "音频提取器产生时间特征，三平面编码器产生空间特征，动态融合与注意力将二者结合，NeRF 再预测射线上各点的颜色与密度。前面的表示学习和最后的体渲染是不同职责。", "architecture": [{"name": "音频特征提取", "flow": "语音窗口 → 时间音频表示", "operation": "滑动窗口切分声音，再结合语音识别相关表示、一维卷积和自注意力。", "explanation": "输出保留时间结构，供空间融合使用。"}, {"name": "多层三平面哈希", "flow": "射线上的三维点 → 多尺度空间特征", "explanation": "每个三维点映射到多个二维平面，不同分辨率捕捉粗细结构。哈希表示压缩存储与查询空间特征。", "operation": "对射线采样的三维点使用三组不同分辨率上限的三平面哈希表示，编码全局与细粒度空间动态。三平面将三维位置映射到多个二维平面特征。"}, {"name": "动态多层融合", "flow": "不同分辨率空间特征 → 聚合空间表示", "operation": "结合多层三平面特征，减少重复信息，同时保留粗细动态。", "explanation": "这一部分先处理空间信息，随后再与音频发生区域相关交互。"}, {"name": "音视频注意力融合", "flow": "空间、声音和眼动 → 条件化面部特征", "operation": "用注意力为不同空间区域重加权声音相关信息，减少无关区域干扰。", "explanation": "嘴部与其他区域不必使用相同响应，图3给出可视化。"}, {"name": "NeRF 与体渲染", "flow": "条件特征、相机射线 → 说话头像图像", "explanation": "NeRF 预测采样点颜色与密度，体渲染沿射线累积成像。该网络针对人物数据学习，不能当作任意身份的单图通用动画器。", "operation": "将融合后的空间、音频和眼部运动信息交给 NeRF，预测颜色与密度，再沿相机射线进行体渲染，生成目标人物图像。"}], "findings": "表 3 中 PSNR 与 FID 优于所列 ER-NeRF，但 LPIPS 略差，说明不同质量指标的改善并不完全一致。", "limitations": "需要个体训练；同名作者归属未与ICT证实，应从团队主统计剔除并保留说明。", "figures": [{"number": 1, "page": 3, "src": "figures/paper-52-fig-01.webp", "original_caption": "Figure 1. Overview of the proposed MLDF-NeRF.", "placement": "method", "caption": "总图连接声音、眼部运动、多层三平面与体渲染，下半部分展开多层空间表示。先看条件入口，再看它们如何汇成 NeRF 的输入。"}, {"number": 2, "page": 7, "src": "figures/paper-52-fig-02.webp", "original_caption": "Figure 2. Audio feature extraction: Using the sliding window approach, we split the provided audio stream into several parts. Following the ASR classification of each audio clip, we apply 1D convolution and self-attention modules to temporally smooth the audio clips in order to produce the final audio feature αs.", "placement": "module-0", "caption": "音频按滑动窗口分段，经过语音识别相关特征、一维卷积与自注意力形成表示。它说明网络实际接收到的不是一个整段音频标签，而是有时间结构的特征。"}, {"number": 3, "page": 8, "src": "figures/paper-52-fig-03.webp", "original_caption": "Figure 3. Visualization of the audio-visual fusion module. We display the attention map visualized through the norm of the attention vector in the generated head space image.", "placement": "module-3", "caption": "音视频融合的注意力可视化显示不同空间区域怎样响应音频信息。这与全脸均匀使用同一个声音条件有区别。"}, {"number": 5, "page": 12, "src": "figures/paper-52-fig-05.webp", "original_caption": "Figure 5. The comparison of the details. We show the generated details of the baselines (AD-NeRF, RAD-NeRF, and ER-NeRF) to compare with our method.", "placement": "evidence", "caption": "局部细节并排比较帮助观察口部和面部纹理。它补充整体指标，因为不同质量指标并不总朝同一方向变化。"}], "paper_url": "https://www.mdpi.com/2076-3417/15/1/479", "author_affiliation": "中国传媒大学"}]</script>
<script>
const papers=JSON.parse(document.querySelector('#paper-data').textContent);
const themes=['虚假信息与新闻理解','大模型可信与安全','视觉取证与内容保护','人物与交互视频生成','图像编辑与生成评估','高效模型与鲁棒学习'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=x=>Array.isArray(x)?x.join('；'):typeof x==='object'&&x?Object.entries(x).map(([k,v])=>k+'：'+plain(v)).join('；'):String(x??'');
const para=x=>esc(plain(x)).replace(/\n/g,'<br>');
const safeURL=x=>/^https?:\/\//.test(x||'')?esc(x):'#';
themes.forEach(name=>{document.querySelector('#side-themes').insertAdjacentHTML('beforeend',`<a href="#library" data-theme="${name}">${name}</a>`);document.querySelector('#category').insertAdjacentHTML('beforeend',`<option>${name}</option>`)});
function figureGroup(p,placement){return p.figures.filter(f=>f.placement===placement).map(f=>`<figure><img loading="lazy" src="${esc(f.src)}" alt="${esc(f.caption)}" data-zoom><figcaption><p class="original-caption" lang="en">${para(f.original_caption)}</p><p class="caption-explanation">${para(f.caption)}</p></figcaption></figure>`).join('')}
function card(p){const pub=p.publication;return `<article class="paper" id="${p.id}"><header class="paper-head"><div class="tags"><span>${esc(p.year)}</span><span>${esc(p.theme)}</span></div><h3>${esc(p.chinese_title||p.title)}</h3><div class="publication"><span class="venue">${esc(pub.venue)}</span><span class="date">${esc(pub.date)}</span>${pub.preprint_date&&!pub.date_label.includes('首发')?`<span class="date">arXiv ${esc(pub.preprint_date)}</span>`:''}</div><div class="english" lang="en">${esc(p.title)}</div><div class="authors">${esc(plain(p.authors))}${p.author_affiliation?` · ${esc(p.author_affiliation)}`:''}</div></header><div class="paper-body"><p>${para(p.motivation)}</p><p>${para(p.context)}</p>${figureGroup(p,'intro')}<h4>${esc(p.basis_title)}</h4><p>${para(p.analysis)}</p><p>${para(p.rationale)}</p><p class="basis-ref">原文对应：${esc(p.basis_reference)}</p>${figureGroup(p,'basis')}<h4>${esc(p.method_title)}</h4><p>${para(p.connection)}</p>${figureGroup(p,'method')}<div class="architecture">${p.architecture.map((b,i)=>`<section class="module"><h5>${esc(b.name)}</h5><div class="flow">${esc(b.flow)}</div><p>${para(b.operation)}</p><p class="module-note">${para(b.explanation)}</p>${figureGroup(p,'module-'+i)}</section>`).join('')}</div>${figureGroup(p,'detail')}<h4>${esc(p.result_title)}</h4><p class="results">${para(p.findings)}</p>${figureGroup(p,'evidence')}${p.limitations?`<div class="limitations"><strong>适用范围与局限</strong>　${para(p.limitations)}</div>`:''}<div class="sources"><a class="paper-link" href="${safeURL(p.paper_url)}" target="_blank" rel="noopener">论文原文 ↗</a>${p.code_url?`<a class="code-link" href="${safeURL(p.code_url)}" target="_blank" rel="noopener">代码 ↗</a>`:''}</div></div></article>`}

function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),y=document.querySelector('#year').value,c=document.querySelector('#category').value;const rows=papers.filter(p=>(!y||String(p.year)===y)&&(!c||p.theme===c)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));document.querySelector('#papers').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">未找到匹配的论文。</div>';document.querySelector('#status').textContent=q||y||c?`${rows.length} 篇${c?' · '+c:''}${y?' · '+y+' 年':''}`:''}
['search','year','category'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.querySelector('#reset').onclick=()=>{['search','year','category'].forEach(id=>document.getElementById(id).value='');render()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme],[data-year],[data-reset]');if(t){document.querySelector('#reset').click();if(t.dataset.theme)document.querySelector('#category').value=t.dataset.theme;if(t.dataset.year)document.querySelector('#year').value=t.dataset.year;render();document.querySelector('#library').scrollIntoView()}if(e.target.matches('[data-zoom]')){const d=document.querySelector('#lightbox');d.querySelector('img').src=e.target.src;d.querySelector('img').alt=e.target.alt;d.showModal()}});document.querySelector('#close-lightbox').onclick=()=>document.querySelector('#lightbox').close();document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});
render();function openHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('paper-'))return;let p=document.getElementById(id);if(!p){document.querySelector('#reset').click();p=document.getElementById(id)}if(p)requestAnimationFrame(()=>p.scrollIntoView())}window.addEventListener('hashchange',openHash);openHash();
</script></body></html>
