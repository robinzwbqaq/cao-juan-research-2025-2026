<script id="paper-data" type="application/json">[{"id": "paper-01", "title": "Who Does What and Where to Go: Orthogonal Alignment and Hierarchical Planning for Multi-entity Trajectories", "chinese_title": "多实体三维轨迹生成：身份动作绑定与分层空间规划", "year": "2026", "theme": "人物与交互视频生成", "authors": "Z Wan, Y Li, T Huang, J Cao, S Tang", "publication": {"venue": "ECCV 2026", "date_label": "在线发表", "date": "2026-09-15"}, "motivation": "在交互视频里，单个人物动作自然还不够。输入“猫向左跑、狗向右跳”时，系统既要把每个动作交给正确的实体，也要让它们在同一空间中合理移动。直接生成视频很难单独检查这些约束，因此论文先研究多实体三维轨迹，把轨迹作为后续视频生成可以使用的结构条件。", "analysis": "困难分成两层：语义层上，身份、动作和方向容易混在一起，导致角色互换；几何层上，二维画面里看似错开的物体，在深度方向仍可能碰撞。把两类问题都交给端到端坐标回归，会使语义错误与空间错误彼此叠加。", "rationale": "作者把语义—物理落差拆成身份动作耦合和缺少几何先验两项问题。§4.2 用外积融合身份与动作，并最小化不同实体意图向量的归一化内积：L_ortho = ∑ᵢ∑ⱼ≠ᵢ |〈Fᵢ,Fⱼ〉| / (‖Fᵢ‖‖Fⱼ‖)。约束施加在意图特征上，不是要求运动轨迹互相垂直。§4.3 再用俯视空间先验引导三维去噪。", "basis_reference": "§4.2—4.3：StructVLA 与分层规划", "architecture": [{"name": "实体拆分", "flow": "参考帧、逐实体动作描述 → 身份特征与运动特征", "explanation": "身份掩码是标出某个实体像素范围的二值图，负责限定视觉编码对象；动作分支则描述该实体做什么、向哪里运动。两路信息先独立提取，再进入后面的绑定，避免一开始就混合其他角色。", "operation": "先建立逐实体的输入表示。分割参考帧得到身份掩码，单独编码每个主体；再把文本拆成以动作为中心的描述，提取对应运动特征，避免整张图和整句话压成一个混合向量。"}, {"name": "StructVLA：身份—动作绑定", "flow": "身份特征、运动特征 → 可区分的实体意图表示", "explanation": "外积融合同时保留身份与动作之间的组合关系。正交约束降低不同实体意图向量之间的相似度；它约束的是表示空间，允许角色执行同行等相关运动。每个实体的绑定结果继续交给轨迹模型。", "operation": "StructVLA 用因子化张量融合绑定身份与动作，并对不同实体的意图特征施加正交约束。这里要求的是特征容易区分，并不要求两个人物的运动方向互相垂直，也允许同行等相关动作。"}, {"name": "几何先验与渐进去噪", "flow": "深度、实体意图 → 多实体三维轨迹", "explanation": "BEV 是从上方观察场景的俯视表示，用来组织物体占据区域与通行边界。扩散 Transformer 在这个几何条件下逐步恢复连续坐标，最终输出轨迹，供下游视频生成使用。", "operation": "从场景深度构建几何感知俯视图，先确定占据区域和可通行空间，再用这一空间先验引导扩散模型渐进生成三维轨迹。规划先解决空间关系，去噪再细化连续坐标。"}], "findings": "在 Stepwise-ME 合成多实体数据上验证动作归属与空间一致性。补充实验平均碰撞率为 7.3%；对比独立生成再合并的轨迹更少发生碰撞。", "limitations": "与部分单实体方法的比较采用独立生成后聚合协议；数据主要来自合成环境，仍会发生碰撞，不能解释为严格物理安全保证。", "figure": "figures/acd3c9d8746948.webp", "figure_caption": "补充材料图3：左侧分别生成每个角色轨迹时，各自看不到别人，合并后可能穿透；右侧以统一模型与几何感知俯视图共同规划多个角色。此图来自原论文公开补充材料。（原PDF第6页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://link.springer.com/chapter/10.1007/978-3-032-37029-7_34", "code_url": "https://github.com/wzbos-token/Who-Does-What-and-Where-to-Go"}, {"id": "paper-02", "title": "TryOnCrafter: Unleashing Camera Trajectories for Realistic Video Virtual Try-on via a Renderable 4D Try-on Proxy", "chinese_title": "TryOnCrafter：可控制相机轨迹的视频试衣", "year": "2026", "theme": "人物与交互视频生成", "authors": "H Sun, H Yan, M Chen, Q Song, Y Li, J Cao, J Lan, X Zhu, B Zheng, ...", "publication": {"venue": "ECCV 2026", "date_label": "arXiv 首发", "date": "2026-06-24", "preprint_date": "2026-06-24", "arxiv_id": "2606.26092"}, "motivation": "视频试衣通常默认沿用原视频的机位。如果还想让镜头绕着人物移动，就必须同时补出衣服侧面、人物遮挡关系和新视角背景。论文希望把“给人物换衣”和“重新安排镜头”放在同一个流程中，让试衣结果能够跟随新的相机轨迹。", "analysis": "二维换衣模型能修改可见衣服，却没有稳定的三维场景表示；直接让视频模型猜新机位，又容易让衣纹、人物比例和背景漂移。另一个具体问题是，重建点云与人体模型处在不同坐标和尺度中，即使各自在原视角投影正确，合起来仍可能错位。", "rationale": "§3.1 明确指出，单目重建的人体与场景存在尺度和坐标差异，因此用人体点云作锚，通过相似变换 T(v)=sRv+t 对齐。§3.2 将可渲染代理提供的结构先验与跨视角参考特征结合，分别对应新机位下的空间布局和外观细节保持。", "basis_reference": "§3.1—3.2：四维代理与代理引导生成", "architecture": [{"name": "场景与人体对齐", "flow": "原视频 → 统一坐标中的背景和人体动作", "explanation": "SMPL-X 是参数化人体表示，给出身体及手部等姿态；点云来自场景重建。锚定对齐解决它们之间的尺度和坐标差异，是后续新视角渲染前必须完成的连接步骤。", "operation": "从原视频估计深度、相机和动态点云，分离人物与背景；同时恢复 SMPL-X 人体运动。以可靠的人体点云区域为锚，通过相似变换把人体动作对齐到场景的世界坐标。"}, {"name": "四维试衣代理", "flow": "关键帧、目标服装、人体动作 → 可渲染的动态人物与场景", "explanation": "三维高斯人物用一组带位置、形状和颜色的高斯表示外观，再由人体动作驱动形变。“四维”指三维表示随时间变化，使同一人物能够沿不同相机轨迹被渲染。", "operation": "选择正面可见、遮挡较少的关键帧，先完成二维换衣，再生成穿目标服装的三维高斯人物。用对齐的人体动作驱动这个人物，并把它放回保留的背景，形成可随时间变化的四维试衣代理。"}, {"name": "代理引导的视频生成", "flow": "代理渲染、源视频与参考图 → 新机位试衣视频", "explanation": "代理先给出结构较稳定的粗结果，DiT 即扩散 Transformer，在此基础上生成细节。跨视角参考适配器把原片中的身份和背景信息送入模型，弥补代理纹理不完整的问题。", "operation": "沿用户指定的新机位渲染代理，把它作为 DiT 的结构引导。跨视角参考适配器再从源视频与参考图提取身份、衣料和背景信息，补足粗代理缺失的细节。"}], "findings": "在 CaM-VVTBench 上检查服装保持、生成质量和镜头控制，并展示环绕、子弹时间及人物重定位等效果。", "limitations": "依赖上游人体、深度和三维头像重建；看不见的衣服背面仍需推测，不能理解为真实服装测量。", "figure": "figures/077ed979a816b4.webp", "figure_caption": "原论文图2（PDF第5页）：4D试衣代理构建与代理锚定视频生成。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2606.26092"}, {"id": "paper-03", "title": "Multi-Tool Image Editing Attribution in Facial Forgery", "chinese_title": "多工具人脸编辑归因：追查连续编辑中的参与工具", "year": "2026", "theme": "视觉取证与内容保护", "authors": "S Liu, Q Sheng, D Wang, Y Li, C Zhou, J Cao", "publication": {"venue": "ACM Multimedia 2026", "date_label": "arXiv 首发", "date": "2026-09-02", "preprint_date": "2026-09-02", "arxiv_id": "2609.02751"}, "motivation": "一张人脸可能先被换脸，再美颜、化妆和修图。对最终图像只预测一种来源工具，往往只能识别最近一次操作，无法回答它是否还经历过其他编辑。论文将取证目标改成多标签归因：找出所有参与过编辑的工具。", "analysis": "连续编辑会覆盖或改变先前痕迹，而不同工具的线索也未必出现在同一位置。全图语义容易被人物外观主导；只看空间局部又可能忽略频域残留。因此，训练样本和特征提取都要对应真实的多步骤编辑过程。", "rationale": "作者将多次编辑引发的痕迹覆盖视为单工具归因失效的原因，提出从空间与频率两域提取局部补丁证据，并以多标签目标预测参与工具集合。按错误调整的课程学习用于逐步处理更难的组合；这些是论文的问题分析与方法设计，不是关于所有编辑链可恢复性的定理。", "basis_reference": "§3—4：MultiEdit 与 DPEC", "architecture": [{"name": "MultiEdit：多步编辑数据", "flow": "源人像、六类编辑工具 → 带多标签的编辑链样本", "explanation": "标签记录各工具是否参与，目标不要求恢复操作先后。这使同一图像可以同时有多个真标签，也决定最后不能采用只允许一个答案的普通多分类输出。", "operation": "构建 MultiEdit 数据集，从 200 张源人像出发组合六类工具，生成约 51 万张、最多五步的编辑结果，并为每张图保留参与工具的集合标签。"}, {"name": "DPEC：双域补丁证据", "flow": "最终人脸图 → 增强后的局部取证特征", "explanation": "空间域关注局部纹理和边界，频率域提供另一种残留表达。补丁是图像小块，增强模块优先放大具有区分力的区域，不把整张脸的内容特征直接当作工具证据。", "operation": "DPEC 在空间域和频率域分别编码局部补丁，让细节纹理与频率异常提供互补证据；随后增强更有区分力的补丁，减少与归因无关的人脸内容影响。"}, {"name": "错误驱动课程与多标签预测", "flow": "双域特征、当前学习难点 → 参与工具集合", "explanation": "课程学习改变训练难度安排，不是推理时增加一次编辑过程。预测阶段每种工具分别得到是否参与的判断，最后组合成集合；整组都正确才计为严格命中。", "operation": "采用按错误调整的课程学习安排训练难度，让模型逐渐适应更复杂的编辑组合，最终同时输出多个工具是否参与，而非把它们当成互斥类别。"}], "findings": "在六类工具的组合测试中，平均严格准确率为 92.93%，五步编辑时为 87.40%。严格准确率要求整组工具全部预测正确。", "limitations": "只覆盖人脸与六种工具；换脸仅放第一步。识别工具集合不等于恢复先后顺序；源人像仅 200 张。", "figure": "figures/d32d3097422fed.webp", "figure_caption": "原论文图6：DPEC双域局部特征增强与按错误调整的课程学习流程。（原PDF第10页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2609.02751", "code_url": "https://github.com/ICTMCG/MIEA"}, {"id": "paper-06", "title": "AgentHOI: Multi-Agent Reasoning for Human-Object-Interaction Video Generation via Implicit Representation Alignment", "chinese_title": "AgentHOI：以多角色推理驱动人—物交互视频", "year": "2026", "theme": "人物与交互视频生成", "authors": "Z Huang, S Li, J Cao, C Li, Y Zhang, Z Zhou, C Wang, Y Zhou, Q Lu, ...", "publication": {"venue": "arXiv:2607.22241", "date_label": "预印本首发", "date": "2026-07-24", "preprint_date": "2026-07-24", "arxiv_id": "2607.22241"}, "motivation": "让人物拿起某件物体，仅提供人物图、物体图和一句话仍很困难：模型需要决定哪只手先动、什么时候接触、怎样转移物体。要求用户额外提供骨架或完整运动序列，又把最难的规划工作交回了用户。AgentHOI 尝试在生成前补出动作计划。", "analysis": "语言模型可以描述合理动作，却未必能把这种知识直接传给视频模型；视频模型擅长合成外观，也未必理解手部接触的时序。论文因此同时处理显式动作推理和隐式运动表示，两者分别解决计划可读性与生成可执行性。", "rationale": "论文明确区分生成前的结构化动作推理和训练期的运动表示对齐。前者把用户意图拆成可检查的交互计划，后者从文本到运动教师蒸馏隐式运动知识，使视频模型学会利用计划；作者据此实现推理时不输入显式运动序列的设定。", "basis_reference": "§3.1—3.2：交互推理与隐式运动对齐", "architecture": [{"name": "四角色动作推理", "flow": "人物图、物体图、指令 → 秒级动作计划", "explanation": "感知角色先看物理属性，交互角色判断可行操作，规划角色安排时序，检查角色修正穿模。四者是生成前的分工，动作要求仍以用户指令为锚。", "operation": "视觉感知角色分别分析人物和物体的姿态、手部占用、形状等属性，交互分析角色再结合用户意图判断可行操作，减少从一开始就把两张图误当作已有交互场景的偏差。"}, {"name": "训练期运动表示对齐", "flow": "动作文本、运动教师特征 → 具有运动知识的视频表示", "explanation": "文本到运动教师提供隐式特征，投影与对齐损失让视频模型吸收相关知识。这里迁移的是表示，不是把教师生成的骨架序列作为推理输入。", "operation": "动作规划角色将交互拆成秒级步骤，穿模检查角色复核并修改不合理接触；用户明确指定的动作和左右手要求保留为规划约束。"}, {"name": "无显式运动条件的生成", "flow": "参考图、文字动作计划 → 人—物交互视频", "explanation": "视频模型把计划落实为连续画面。训练混合真实与合成交互数据；部署时用户仍只需要给图像和文字，避免额外准备逐帧动作条件。", "operation": "训练视频模型时，引入文本到运动教师，通过表示对齐蒸馏隐式运动知识。真实与合成交互数据共同支持训练，推理时使用参考图和文字计划，不要求输入显式骨架序列。"}], "findings": "论文通过跨动作测试和消融，检查多角色推理、穿模检查、运动对齐及混合数据各自的贡献。", "limitations": "语义检查不等于物理仿真；原文不保证严格时间控制，VLM幻觉可导致错误动作时间线，且生成分辨率限制细节。", "figure": "figures/b3382370589c5d.webp", "figure_caption": "原论文图2（PDF第4页）：多角色互动推理与隐式运动表征对齐生成。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2607.22241", "code_url": "https://github.com/bone-11/agenthoi"}, {"id": "paper-07", "title": "Beyond the Final Actor: Modeling the Dual Roles of Creator and Editor for Fine-Grained LLM-Generated Text Detection", "chinese_title": "混合写作检测：区分创作者与编辑者", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Z Wang, Y Yang, D Wang, J Cao", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-04-06", "arxiv_id": "2604.04932"}, "motivation": "现实文本常由人和大模型共同完成，例如人写初稿后让模型润色，或模型起草后由人重写。把所有文本只分成人写和机器写，会丢失创作者与编辑者的差别。论文希望区分四种生产过程，从而更细致地识别混合写作。", "analysis": "改写会改变词汇和句式，却不一定重建文章的论证顺序与篇章关系。仅依赖表面用词，容易把编辑者误认为唯一作者。因此，方法同时观察局部语言表达和较稳定的修辞组织，寻找不同角色留下的互补信息。", "rationale": "作者以修辞结构理论（RST）作为篇章组织的表示基础：文章被分成基本篇章单元，并按修辞关系构树。方法再以关系特定的图卷积传播信息，区分因果、转折等连接。信息瓶颈投影用于减少表面词汇噪声，帮助关注与创作角色有关的结构差异。", "basis_reference": "§3：逻辑图与修辞引导消息传递", "architecture": [{"name": "RST 解析", "flow": "文本 → 篇章单元与修辞树", "explanation": "基本篇章单元是小段表达，修辞树表示它们怎样形成因果、转折等组织关系。它提供后续图的节点与连接，保留文本跨句结构。", "operation": "使用修辞结构理论解析器把文本切成基本篇章单元，并建立因果、转折、论证等关系树，将写作组织转换为可以计算的结构。"}, {"name": "逻辑图与瓶颈投影", "flow": "内容单元、关系树 → 紧凑节点表示", "explanation": "图同时保留内容与关系节点；投影降低原始语言特征中的冗余。这样后续网络处理的既有说了什么，也有这些内容如何组织。", "operation": "构建同时包含内容单元节点和修辞关系节点的逻辑图。内容提供具体表达，关系节点汇集所辖片段的信息，再通过紧凑投影减少与作者结构分析无关的词汇噪声。"}, {"name": "修辞关系消息传递", "flow": "逻辑图 → 四种创作／编辑角色预测", "explanation": "不同修辞关系采用对应传播规则，分类与对比目标联合训练。最后输出的是生产过程类别，而不只是当前文字像不像大模型。", "operation": "采用关系特定的图消息传递，区分不同修辞边的作用，并结合分类与对比学习，识别纯人、纯 AI、人改 AI 和 AI 改人四类。"}], "findings": "在 HART 上与 12 种基线比较，并补充同源文本分组划分实验，检查对创作与编辑角色的识别能力。", "limitations": "仅一个适配四分类的基准，其他语言与领域未知；多轮交替编辑未覆盖；预测精度不足以单独作为处罚依据。", "figure": "figures/d5f38f42a5a422.webp", "figure_caption": "图 3，第 4 页：抽取篇章内容与修辞结构，构图后分辨四类创作流程（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2026.acl-long.235/"}, {"id": "paper-08", "title": "Logical Consistency as a Bridge: Improving LLM Hallucination Detection via Label Constraint Modeling between Responses and Self-Judgments", "chinese_title": "LaaB：用逻辑一致性训练幻觉检测器", "year": "2026", "theme": "大模型可信与安全", "authors": "H Mi, Q Sheng, S Wang, B Hu, Y Sun, Z Wang, H Zeng, Y Li, D Wang, ...", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-05-05", "arxiv_id": "2605.03971"}, "motivation": "模型生成一个错误答案后，自检有时能发现问题，有时又会自信地认可原答案。另一方面，隐藏状态和生成概率虽包含不确定性线索，也可能漏掉高置信度幻觉。LaaB 研究如何让内部神经信号与自检判断互相提供训练约束。", "analysis": "自检的 Yes/No 是离散判断，内部特征则是连续表示，直接拼接不容易保证两路含义一致。论文把自检也看作一段可能说错的回答：不仅判断原回答是否正确，也判断这次自检本身是否正确，从而建立可计算的逻辑关系。", "rationale": "论文的核心逻辑规则是：若自检断言“原回答正确”，原回答真实性与自检正确性标签相同；若自检断言“原回答错误”，两者标签相反。由此，自检探针的概率 q 可按 Yes／No 转为 q 或 1−q，与原回答探针对齐，再用稳健损失和置信度权重互学。该规则是训练约束，不代表自检天然可靠。", "basis_reference": "§3：逻辑约束互学习", "architecture": [{"name": "原回答探针", "flow": "回答生成中的内部信号 → 原回答真实性概率", "explanation": "探针是利用模型内部特征训练的轻量判别器，不负责重新回答问题。它也是最终部署时保留的分支。", "operation": "从原回答提取隐藏状态、生成概率或注意力等内部特征，训练一个回答真实性探针，输出原回答为真的概率。"}, {"name": "自检正确性探针", "flow": "自检文本及其内部信号 → 自检本身正确的概率", "explanation": "第二路判断的是“自检是否说对”，不等同于把自检的 Yes 当真、No 当假。它的输出需结合自检内容转回对原回答的判断。", "operation": "要求同一模型自检原回答，并从自检生成过程提取特征，训练第二个探针，判断这次自检是否正确，而不是无条件相信它给出的 Yes/No。"}, {"name": "逻辑约束互学", "flow": "两路概率、Yes／No 关系 → 校准后的回答探针", "explanation": "两个预测按原文逻辑对齐后互相约束。训练结束后，自检分支移除，推理不会再运行两路融合或反复自我检查。", "operation": "当自检声称原回答正确时，两路真实性标签应一致；声称错误时，两路标签应相反。训练用逻辑约束、Huber 损失与置信度加权进行互学；部署时只保留原回答探针。"}], "findings": "在四套问答或幻觉数据、四个开源模型上比较八类基线，多数组合得到改善，推理阶段不需要额外生成自检。", "limitations": "必须访问模型内部信息，适合服务提供方；强制二选一自检会引入噪声；两路同时犯错时没有保证能纠正。", "figure": "figures/464525ae0707dd.webp", "figure_caption": "图 2，第 3 页：回答探针与自检探针通过逻辑关系相互学习（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2026.acl-long.286/", "code_url": "https://github.com/ICTMCG/LaaB"}, {"id": "paper-09", "title": "Fleet: Few Shots Lead Effective AI-generated Image Detection", "chinese_title": "Fleet：持续少样本适应的生成图像检测", "year": "2026", "theme": "视觉取证与内容保护", "authors": "J Wang, S Liu, Y Li, K Yang, J Cao, S Tang", "publication": {"venue": "ICML 2026 · PMLR 306", "date_label": "会议", "date": "2026-07-06—11", "preprint_date": "2026-06-30", "arxiv_id": "2606.31082"}, "motivation": "图像检测器在旧数据上表现很好，也可能在新生成器上线后迅速失效。Fleet 将重点放在持续少样本适应：获得少量新模型生成图后，尽快修正检测器，同时保留对旧模型的识别能力。", "analysis": "新生成图可能被错误送进表示“真实图”的特征路径。若直接用几张新样本更新整个表示空间，容易过拟合甚至破坏旧边界。论文把适应目标缩小到特征路由的纠正，而不是要求少量样本重新学出完整分类空间。", "rationale": "§4.2 用 AI／非 AI 平均路由权重的内积作为正交约束，并用覆盖约束抑制路由塌缩；§4.3 的 avoidance routing 则阻止新生成图继续流入非 AI 主导子空间。作者据此将少样本适应表述为受约束的路由纠正，区别于自由更新全部特征。", "basis_reference": "§4.1—4.3：子空间路由", "architecture": [{"name": "视觉特征与频率路由", "flow": "图像 → 视觉表示与高频路由权重", "explanation": "DINOv3 提取视觉表示，LoRA 用少量可学习参数适配检测。高频分支过滤低频后提取痕迹信号，用它决定多个子空间的激活权重。", "operation": "以 DINOv3 加 LoRA 提取视觉特征，同时由高频分支提供低层痕迹信号。多个可学习子空间各自提供地址与特征，高频信号决定输入应主要激活哪些子空间。"}, {"name": "互斥子空间预训练", "flow": "已有真假样本 → 分工后的 AI／非 AI 路径", "explanation": "路由正交约束减少两类样本使用同一路径；覆盖约束防止只用少数子空间。输出特征由各子空间按权重组合后完成真假判别。", "operation": "预训练通过分类、路由正交和覆盖约束，让 AI 与非 AI 样本倾向不同路径，并防止所有样本塌缩到少数路径。"}, {"name": "新生成器少样本适应", "flow": "少量新 AI 图、旧样本 → 更新的检测器", "explanation": "避让路由压低新 AI 图在非 AI 路径的激活，重新分配它们的特征流；回放和蒸馏保留旧知识。适应阶段需要真实取得的新生成器样本。", "operation": "少样本适应时，抑制新生成图进入非 AI 主导的路径，引导其转向相关 AI 子空间；结合旧样本回放和蒸馏，减少新旧生成器之间的遗忘。"}], "findings": "在 Treasure 的 64 种生成模型上测试。豆包 Seedream 4.0 的 AI 图检测准确率从 20.4% 提高到 10-shot 适应后的 73.1%。", "limitations": "研究整图生成，局部编辑与换脸仍需验证；依赖带标签新样本和回放。已有20阶段连续适配实验，但真实开放环境的长期表现仍需验证。", "figure": "figures/e38beb6477c784.webp", "figure_caption": "原论文图3：高频分支决定子空间路由，少样本适配将新伪造特征从非AI路由移开。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://proceedings.mlr.press/v306/wang26eo.html", "code_url": "https://github.com/ICTMCG/Fleet"}, {"id": "paper-10", "title": "ComMark: Covert and Robust Black-Box Model Watermarking with Compressed Samples", "chinese_title": "ComMark：基于压缩样本的黑盒模型水印", "year": "2026", "theme": "视觉取证与内容保护", "authors": "Y Yang, X Chen, Z Zhao, Y Zhou, X Gu, J Cao", "publication": {"venue": "ICMR 2026", "date_label": "在线发表", "date": "2026-06-15", "preprint_date": "2025-12-16", "arxiv_id": "2512.15641"}, "motivation": "模型通过接口被复制或提取后，拥有者未必能检查可疑模型的参数。黑盒水印希望只靠查询输入与输出证明模型来源，但明显的贴片触发器容易被发现，也容易被裁剪或压缩破坏。ComMark 尝试把触发模式藏进较自然的压缩过程。", "analysis": "水印需要同时满足两点：正常用户看图时不容易察觉异常，模型在样本经过常见预处理后仍能给出约定输出。只优化触发成功率，可能得到显眼而脆弱的模式；只追求不可见，也可能让触发信号不够稳定。", "rationale": "论文借鉴 JPEG 的分块离散余弦变换与量化：主要保留承载视觉内容的低频，压缩不易察觉的高频成分，以压缩行为构造触发模式。随后用预处理增强和相似性约束训练稳定关联。作者给出的是频域构造与实验鲁棒性依据，不是对任意攻击的不可移除证明。", "basis_reference": "§3.3—3.5：频域压缩与水印训练", "architecture": [{"name": "频域水印构造", "flow": "正常图片 → 带目标标签的压缩水印图", "explanation": "图像先做分块频率变换与量化，触发模式来自压缩行为。目标标签由拥有者预先指定，用于之后检查模型是否保留约定反应。", "operation": "从正常图像构造水印样本：转入亮度与色度空间，分块做离散余弦变换，再以量化压缩改变频率成分，为处理后的样本分配预设目标标签。"}, {"name": "鲁棒联合训练", "flow": "正常样本、水印及变换样本 → 带水印模型", "explanation": "模型同时学习正常任务与水印任务，预处理增强覆盖常见变换。相似性损失补充目标类别关联，并不是在模型输出中显示一段可见标记。", "operation": "联合训练正常分类与水印识别，并在训练中加入多种预处理后的水印样本，使触发器适应裁剪、缩放、旋转和 JPEG 等变化。"}, {"name": "黑盒所有权核验", "flow": "可疑模型 API、水印测试图 → 命中率与核验结论", "explanation": "核验只读取预测标签，不读取权重。用多张样本的目标类命中比例与阈值比较，比单张触发更能检验水印关联是否存在。", "operation": "引入相似性约束巩固水印与目标类之间的关联。核验时将保留的水印样本提交给可疑模型，以目标标签命中比例是否超过阈值判断水印是否存在。"}], "findings": "四个视觉数据集上原模型水印成功率约 99.7%—100%；论文进一步检验微调、剪枝与输入预处理后的保留情况。", "limitations": "需在原模型训练时植入；较高命中率是实验条件下证据，不能自动代表法律确权或抵抗任意攻击。", "figure": "figures/9fbc33bc6eacc4.webp", "figure_caption": "原论文图3：压缩水印样本构建、联合训练与黑盒所有权验证。（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3805622.3810742"}, {"id": "paper-13", "title": "Headrouter: A training-free image editing framework for mm-dits by adaptively routing attention heads", "chinese_title": "HeadRouter：按注意力头语义进行图像编辑", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Fan Tang, Juan Cao, Yuxin Zhang, Xiaoyu Kong, Jintao Li, Oliver Deussen, Tong-Yee Lee（所读原文顺序）", "publication": {"venue": "ACM Transactions on Graphics 45(3)", "date_label": "在线发表", "date": "2026-04-24", "preprint_date": "2024-11-22", "arxiv_id": "2411.15034"}, "motivation": "修改图像中的材质、颜色或主体时，用户希望目标属性改变，其他内容尽量稳定。MM-DiT 的不同注意力头可能对不同编辑语义有不同敏感性，平均使用所有头会削弱这种分工。HeadRouter 尝试利用现成模型内部结构，提高无需训练的编辑控制。", "analysis": "同一句修改指令对不同图像的作用位置不同，固定指定一组注意力头缺少适应性；仅增强文本也可能改变过多画面。方法需要根据当前实例识别有效的头，并协调文字与图像 token 的更新。", "rationale": "作者先分析不同注意力头对编辑语义的敏感性，再在方法中比较重建与编辑分支的头输出相似度，动态调整贡献。双 token 细化分别作用于文字指导和图像区域表达。设计依据来自头部响应分析及删除、替换实验，而非预设每个头都有固定语义名称。", "basis_reference": "§3：注意力头分析；§4.1—4.2：路由与细化", "architecture": [{"name": "注意力头响应分析", "flow": "语义成对提示 → 头部敏感性观察", "explanation": "作者用多类语义文本对检查各头对不同编辑因素的响应，建立路由机制的经验依据；没有把头直接命名为固定的颜色头或材质头。", "operation": "先通过多类语义和文本对分析注意力头响应，确认不同头对编辑因素具有差异敏感性，为选择性控制提供依据。"}, {"name": "IARouter：实例自适应路由", "flow": "重建／编辑分支头输出 → 调整后的头贡献", "explanation": "依据当前图像和修改目标比较响应差异，再改变各头权重。路由随实例变化，相关路径被强调，其他路径尽量维持已有图像信息。", "operation": "推理中比较重建与编辑分支对应头的输出差异，根据本次编辑目标动态调整各头贡献，强调相关变化，同时保留不相关头原有信息。"}, {"name": "DTR：双 token 细化", "flow": "文本与视觉 token → 更准确的编辑结果", "explanation": "token 是模型处理的特征单元。文字侧维持目标语义，图像侧细化对应区域，随后交回原扩散模型生成，不需另训练编辑模型。", "operation": "双 token 细化一方面增强编辑文本的表达，另一方面借助文本到图像的联系调整相关视觉 token，在无需额外训练的流程中改善目标语义落地。"}], "findings": "论文在多种编辑基准上比较质量与指令对齐，并用注意力头删除、替换实验检验头部选择的作用。", "limitations": "“语义专长”是经验敏感性，不能视为完全独立的开关；超出基础生成模型能力的编辑仍难。", "figure": "figures/2ca325676486e8.webp", "figure_caption": "原论文图4（PDF第5页）：实例自适应注意力头路由与双token细化。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3797956", "code_url": "https://github.com/ICTMCG/HeadRouter"}, {"id": "paper-14", "title": "From judgment to interference: Early stopping llm harmful outputs via streaming content monitoring", "chinese_title": "SCM：在生成过程中检测并截停有害回答", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Y Yang, X Zhang, J Cao", "publication": {"venue": "NeurIPS 2025", "date_label": "arXiv 首发", "date": "2025-06-11", "preprint_date": "2025-06-11", "arxiv_id": "2506.09996"}, "motivation": "聊天服务往往边生成边把文字发送给用户。如果等完整回答结束再检测，有害内容已经暴露；把完整文本检测器直接用于短前缀，又可能误判“先拒绝、后转折”或尚未完成的句子。SCM 将检测目标改为生成过程中的及时截停。", "analysis": "模型必须从不完整内容判断风险，还要尽量区分只是讨论危险主题与正在提供有害帮助。词元级信号有利于快速反应，整篇判断有利于理解语境，但部署时反复运行整篇检测会增加等待和计算。", "rationale": "论文用句子／词元级监督构建流式检测，并在训练中加入整篇评分器和层级逻辑一致性约束，协调局部风险与全文判断。Delay-k 要求累计一定数量的危险词元再截停，论文通过该参数实验分析及时性与误报之间的取舍。", "basis_reference": "方法部分：层级检测与 Delay-k", "architecture": [{"name": "FineHarm：细粒度监督", "flow": "回答文本 → 有害句与危险词元标签", "explanation": "标注流程先识别有害句，再用词性规则寻找实义词，形成可供局部评分学习的位置监督，避免只有整篇一个真假标签。", "operation": "构建 FineHarm，先识别有害句子，再用词性规则定位实义词，形成细粒度监督，使检测器学习危险内容从哪里开始出现。"}, {"name": "层级联合训练", "flow": "词元特征、全文特征 → 协调的风险评分器", "explanation": "局部分支学习及时识别，整篇分支提供完整语境，逻辑一致性约束协调两者。整篇分支在训练后可以移除。", "operation": "训练时联合词元评分器与可拆卸的整篇评分器，并使用层级逻辑一致性约束，使局部风险与整体判断互相协调。"}, {"name": "Delay-k：流式截停", "flow": "逐步到达的输出 → 继续生成或停止", "explanation": "推理只运行词元分支，累计危险信号达到阈值后截停。阈值改变需要等待多少风险证据，因此影响反应速度与误报。", "operation": "部署只保留流式词元分支。随着输出到达持续评分，危险词元累积达到设定数量后停止生成；调整延迟阈值，在更快响应与减少误报之间取舍。"}], "findings": "实验平均读取约 18% 的回答词元即可完成检测，宏 F1 超过 0.95；超过 80% 的有害回答在前 30% 词元内被识别。", "limitations": "细粒度标签含自动规则噪声；指标不意味着所有内容均能在有害信息出现前阻止；实际延迟还取决于审核器与主模型部署。", "figure": "figures/d7c0265f73efbe.webp", "figure_caption": "图 3，第 6 页：训练时联合词元评分和整篇评分，推理时仅用词元分支流式监测（原PDF第6页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://proceedings.neurips.cc/paper_files/paper/2025/hash/4e3157021c5f833bb2204081f1dda573-Abstract-Conference.html"}, {"id": "paper-15", "title": "Reasoning about the unsaid: Misinformation detection with omission-aware graph inference", "chinese_title": "OmiGraph：通过跨报道遗漏信息检测误导新闻", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Wu, J Cao", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-01", "preprint_date": "2025-12-01", "arxiv_id": "2512.01728"}, "motivation": "误导性新闻不一定包含明显假句子，也可能只挑一部分事实，让读者形成错误印象。只读目标文章，很难知道哪些关键内容被省略。OmiGraph 引入同一时期的相关报道，研究通过跨来源比较识别“没有说出的信息”。", "analysis": "相关报道之间既有正常选题差异，也可能存在有意遗漏。把所有背景报道拼在一起，会引入大量无关内容，并掩盖具体哪句话与哪段背景存在关系。需要细化比较单位，同时保留报道内部语境。", "rationale": "作者以同一时期相关报道可互相提供背景为出发点。§3.1 只从目标新闻发布前的时间窗口检索，并定义句子级节点及报道内／跨来源边；后续将 LLM 生成的遗漏意图编码为边属性。这里的遗漏是相对背景信息的建模关系，并非“没有提及即为虚假”的逻辑规则。", "basis_reference": "§3.1—3.3：遗漏感知图推理", "architecture": [{"name": "时间受限背景检索", "flow": "目标新闻、此前新闻池 → 相关背景报道", "explanation": "背景只来自目标发布前的时间窗口；语义相似度筛选相关主题。时间限制对应发布时检测，不让未来核查结果提前进入输入。", "operation": "从目标新闻发布之前的近期新闻池检索语义相关报道，构建可用背景，避免使用事件之后才出现的信息作为当时判断的依据。"}, {"name": "遗漏感知图", "flow": "目标与背景句子 → 带上下文及遗漏边的图", "explanation": "节点是句子级片段，不是另加实体节点。同报道内部边保留语境，跨来源边连接目标与背景之间的比较关系。", "operation": "将目标与背景报道拆成句子级原子片段作为节点，同一报道内连接上下文边，目标与背景片段之间建立跨来源的遗漏关系边。"}, {"name": "意图边与消息聚合", "flow": "遗漏关系描述、图节点 → 增强后的真假判断", "explanation": "LLM 描述被编码为边属性，注意力传播决定哪些跨来源线索值得聚合，最后把遗漏相关表示交给原真假分类器。", "operation": "由 LLM 描述跨来源片段的遗漏意图，将其编码为边属性。局部注意力消息传递与全局聚合提取相关线索，再增强原有真假分类器。"}], "findings": "在中英文数据上，论文报告平均 F1 提高 5.4 个百分点、准确率提高 5.3 个百分点，并分析不同遗漏类型。", "limitations": "依赖外部新闻覆盖与检索质量；相关报道不天然等于完整事实；用 LLM 模拟背景可能引入生成偏差。", "figure": "figures/8a8cb123c3c73f.webp", "figure_caption": "图 2，第 4 页：从同事件背景构图，再沿遗漏关系传递消息（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/37097", "code_url": "https://github.com/ICTMCG/OmiGraph"}, {"id": "paper-16", "title": "Beyond Semantic Features: Pixel-level Mapping for Generalized AI-Generated Image Detection", "chinese_title": "像素级映射：减少生成图像检测中的语义偏差", "year": "2026", "theme": "视觉取证与内容保护", "authors": "C Zhou, J Wang, Y Li, L Li, J Cao, S Tang", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-19", "preprint_date": "2025-12-19", "arxiv_id": "2512.17350"}, "motivation": "检测器可能记住训练集中“哪些东西经常出现在假图里”，而不是学到生成过程的痕迹。换一种生成模型或图像主题后，这类语义捷径就会失效。论文用简单的输入变换，迫使分类器减少对可辨认内容的依赖。", "analysis": "高通滤波和打乱图块未必足以消除语义，而且可能损失取证所需的局部关系。问题不是把图像任意破坏，而是在削弱可见语义的同时，尽量保留能够区分生成机制的像素统计。", "rationale": "作者先通过实验说明，高通滤波和图块打乱仍可能保留语义信息，再提出改变像素值映射而保留局部空间关系。其解释是削弱低频语义捷径、突出生成相关高频痕迹；随机映射与语义分类对照用于检验这一解释。", "basis_reference": "引言与方法：语义偏差分析、像素映射", "architecture": [{"name": "像素值重映射", "flow": "原图 → 语义被削弱的输入", "explanation": "改变的是像素数值映射，不是像素所在位置。固定映射和随机映射实验帮助分析效果来自何种变化。", "operation": "在真假分类器之前加入逐像素数值重映射，打破像素亮度原有的单调次序，改变人眼和语义模型熟悉的外观。"}, {"name": "映射对照与语义分析", "flow": "多种处理输入 → 语义保留及泛化证据", "explanation": "这一步是作者验证解释的分析实验，和部署模块不同；它比较语义分类能力等现象，以检查变换是否减少语义捷径。", "operation": "通过固定映射增强相邻像素数值差异，使低频语义模式受到抑制；使用随机映射等对照，检查效果是否主要来自语义削弱。"}, {"name": "真假分类", "flow": "保留局部结构的变换图 → 真假概率", "explanation": "处理后的图仍保留局部对应关系，分类器从中学习生成相关统计。推理需要执行同类输入处理，再调用训练好的检测器。", "operation": "保持像素空间位置及局部对应关系，再用变换后的图像训练真假分类器，使学习重点更多转向生成相关的局部痕迹。"}], "findings": "在 GAN 与扩散生成器之间的跨模型测试中获得改善；语义分类和映射对照实验支持其减少语义偏差的解释。", "limitations": "收益是所测跨模型性能，不能推出对所有未来生成器通用；压缩可能削弱高频线索。", "figure": "figures/81c20e2e788985.webp", "figure_caption": "原论文图3：逐像素固定或随机数值映射后，再送入真假分类器。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2512.17350"}, {"id": "paper-17", "title": "Visual-friendly concept protection via selective adversarial perturbations", "chinese_title": "VCPro：兼顾视觉质量的选择性概念保护", "year": "2026", "theme": "视觉取证与内容保护", "authors": "X Mi, F Tang, Y Wu, J Cao, P Li, Y Liu", "publication": {"venue": "AAAI 2026", "date_label": "正式发表", "date": "2026-03-14", "preprint_date": "2024-08-16", "arxiv_id": "2408.08518"}, "motivation": "发布照片的人可能希望别人正常观看，却不希望照片被用于未经许可的个性化生成。对整张图施加强扰动容易损伤观感，弱扰动又可能挡不住概念学习。VCPro 研究如何把保护重点放到真正需要保护的概念与区域。", "analysis": "生成模型学习的概念未必对应普通分类器最关注的区域。若把有限扰动平均分布到背景、衣物和脸部，会浪费保护预算，也增加可见噪声。因此，保护目标与空间范围需要由拥有者明确指定。", "rationale": "论文将保护目标与最低可见扰动组织为约束优化，并用拉格朗日乘子求解放松问题。用户掩码指定应保护的概念区域，选择性扰动用于避免把预算无差别分配到整张图。这是原文优化问题的设计依据，不是对所有个性化训练过程的保护保证。", "basis_reference": "方法部分：选择性扰动与拉格朗日优化", "architecture": [{"name": "概念与掩码选择", "flow": "用户保护目标 → 重点区域", "explanation": "掩码明确哪些像素属于要保护的概念。它是扰动分配依据，不能由普通分类器最关注的位置自动等同推出。", "operation": "由用户提供希望保护的概念和区域掩码，将隐私或身份相关部分标记为重点；掩码也可结合其他检测工具得到。"}, {"name": "选择性对抗扰动", "flow": "目标区域、概念学习目标 → 扰动图", "explanation": "优化优先干扰目标概念学习，减少对不需要保护区域的无差别修改。输出是仍可被人观看的保护图片。", "operation": "在概念学习过程上构造选择性对抗扰动，优先干扰生成模型对目标概念的吸收，而不是无差别破坏整幅图像。"}, {"name": "视觉与保护约束协调", "flow": "保护损失、扰动约束 → 最终发布图片", "explanation": "拉格朗日形式协调两项目标，决定为保护效果付出多少可见变化。保护检验通过后续个性化生成实验完成。", "operation": "把保护有效性与可见扰动之间的权衡写成放松优化问题，利用拉格朗日乘子协调约束，在满足保护需求时尽量减少额外视觉变化。"}], "findings": "在人脸个性化生成实验中，相较全图扰动方法，展示了更好的保护效果与视觉质量折中。", "limitations": "主要验证 DreamBooth / Textual Inversion 与特定扩散模型；不能理解成对任意新模型或去噪处理的绝对保护。", "figure": "figures/d625f9b8381ca0.webp", "figure_caption": "原论文图2：用户指定保护区域，选择性优化扰动以保护概念并保持观感。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/41250", "code_url": "https://github.com/KululuMi/VCPro"}, {"id": "paper-18", "title": "Tailoring Rumor Debunking to You: Diversifying Chinese Rumor-Debunking Passages with an LLM-Driven Simulated Feedback-Enhanced Framework", "chinese_title": "MURSE：面向不同读者的中文辟谣生成", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "X Pang, D Wang, Q Sheng, Y Sun, B Hu, J Cao", "publication": {"venue": "EACL 2026 · Industry Track", "date_label": "会议", "date": "2026-03-25—27"}, "motivation": "同一份辟谣证据，对不同读者未必同样有效。专业术语可能让一部分人难以理解，生硬纠正也可能增加抵触。MURSE 在不改变核查结论的前提下，研究怎样为不同用户组织更容易接受的中文辟谣文章。", "analysis": "事实正确、文字流畅与读者愿意接受并不是同一件事。真实用户反馈收集慢，自动生成又容易停留在“换一种语气”。方法需要把预期读者反应转换成具体修改意见，并控制改写不偏离原有证据。", "rationale": "作者引用面向用户的纠正研究，将“可读”与“被读者接受”区分开，并据此引入用户画像和模拟反馈。MURSE 用读者、顾问与编辑之间的迭代，将预期反应转成修改建议；论文检验的是生成文本偏好，未把它当作真实信念转变的理论证明。", "basis_reference": "§1 与方法部分：用户接受度、模拟反馈", "architecture": [{"name": "通用证据稿", "flow": "谣言、专业核查证据 → 初始辟谣稿", "explanation": "先固定事实依据与结论，再考虑用户表达偏好，避免读者画像决定真假立场。初稿进入反馈循环，而非直接发布。", "operation": "先以谣言主张和专业核查证据生成通用稿，明确辟谣应保留的事实与结论，避免从用户偏好直接生成立场。"}, {"name": "模拟读者与顾问", "flow": "初稿、用户画像 → 反馈与修改意见", "explanation": "模拟读者给出反应，顾问将反应整理成可执行建议。画像包含年龄、性别和教育组合，不代表读取某位真实读者心理。", "operation": "按年龄、性别、教育程度组合出 24 类读者画像，让模拟读者对稿件给出反馈；顾问角色将这些反应整理为可以执行的改写建议。"}, {"name": "编辑与筛选", "flow": "修改意见、事实证据 → 面向用户的辟谣稿", "explanation": "编辑多轮调整后，按情绪友好、信息和冗余等要求筛选；核查结论继续保留。实验中的偏好比较针对文本接受度。", "operation": "编辑角色据此多轮修改，并结合情绪友好、信息量和低冗余等要求筛选文本，形成面向目标用户的辟谣稿。"}], "findings": "在 CHEF 的 333 条被驳斥主张上评估；多数人工比较情形中，个性化稿的偏好次数约为通用稿的两倍。", "limitations": "画像只有三个维度，可能强化群体刻板印象；偏好选择不能证明真实用户信念长期改变；主要实验依赖特定模型组合。", "figure": "figures/f34f025c89545f.webp", "figure_caption": "图 2，第 4 页：评论者、顾问和编辑三种角色循环优化辟谣稿（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2026.eacl-industry.45/"}, {"id": "paper-20", "title": "Anchorcrafter: Animate cyber-anchors selling your products via human-object interacting video generation", "chinese_title": "AnchorCrafter：面向商品展示的人—物交互视频", "year": "2026", "theme": "人物与交互视频生成", "authors": "Ziyi Xu, Ziyao Huang, Juan Cao, Yong Zhang, Xiaodong Cun, Qing Shuai, Yuchen Wang, Linchao Bo, Fan Tang（所读v2）", "publication": {"venue": "IEEE TVCG 32(7)", "date_label": "卷期", "date": "2026-07", "preprint_date": "2024-11-26", "arxiv_id": "2411.17383"}, "motivation": "数字主播展示商品时，难点不只在于脸和身体动作自然。商品需要保持形状与纹理，手指要抓在正确位置，遮挡关系也要随动作变化。AnchorCrafter 将人物动画扩展到商品展示中的人—物交互。", "analysis": "人物和商品的外观信息需要独立保存，而手、商品与身体运动又必须协调。只用人体骨架不能充分约束手指与物体接触；全图训练损失还可能忽略面积较小却很重要的商品细节。", "rationale": "作者将问题分别归为商品外观保持、手—物交互和小区域细节。多视角外观与双适配器、手网格／深度条件、交互区域加权损失分别回应这些问题；方法图与消融用于检验各组件。", "basis_reference": "方法部分：双适配器、交互控制与加权损失", "architecture": [{"name": "HOI 外观感知", "flow": "人物图、多视角商品图 → 分离的外观条件", "explanation": "DINO 是视觉特征提取器，多视角商品图提供不同可见面；人物与物体适配器分别保存外观，避免商品细节与人物混合。", "operation": "使用商品多视角图像的 DINO 特征补充外观信息，并用人物与物体双适配器分别注入两类外观，减少商品信息被人物特征淹没。"}, {"name": "HOI 运动注入", "flow": "骨架、手网格、商品深度 → 交互运动条件", "explanation": "身体骨架描述整体动作，手网格补细粒度抓握，商品深度提供几何与遮挡线索。它们共同进入视频生成，而不是只控制人物四肢。", "operation": "结合人体骨架、三维手网格和商品深度图提供运动与几何条件，显式处理人和物体之间的遮挡，让控制信号覆盖身体、手和商品。"}, {"name": "区域加权训练", "flow": "生成视频、手与商品区域 → 更关注交互的模型", "explanation": "局部权重提高这些小区域在训练目标中的作用。部署仍由同一视频模型输出，不是最后再贴一张商品图进行修补。", "operation": "训练中提高交互手部与商品区域的损失权重，促使模型关注抓握和小物体细节，而不只优化大面积背景或人物轮廓。"}], "findings": "交互数据与对比实验检验商品保持和手部运动；所读 v2 表中 Object-IoU 为 0.906、Object-CLIP 为 0.921。", "limitations": "需针对商品微调、依赖演员动作和上游估计；最新v2局限部分明确透明物体困难。", "figure": "figures/782d98bd7f5b10.webp", "figure_caption": "原论文图4（v2 PDF第4页）：外观感知、互动动作注入及互动区域重加权训练。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1109/TVCG.2026.3662720", "code_url": "https://github.com/cangcz/AnchorCrafter"}, {"id": "paper-21", "title": "Beyond pixels: Visual metaphor transfer via schema-driven agentic reasoning", "chinese_title": "Beyond Pixels：基于图式的视觉隐喻迁移", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Yuxin Zhang, Juan Cao, Lin Gao, Chunyu Wang, Oliver Deussen, Tong-Yee Lee, Fan Tang（v1）", "publication": {"venue": "arXiv:2602.01335v1", "date_label": "预印本首发", "date": "2026-02-01", "preprint_date": "2026-02-01", "arxiv_id": "2602.01335"}, "motivation": "视觉隐喻的核心往往是两个事物之间的关系，而不是某一种颜色或画风。例如把主体替换后，仍希望保留原图表达的讽刺、冲突或寓意。论文研究如何将参考图的隐喻逻辑迁移到新主体，避免只复制表面构图。", "analysis": "让模型直接模仿参考图，容易保留无关外观，却丢掉真正的类比关系。另一方面，只有一句抽象寓意也不足以决定新图中应该出现什么载体、哪些部件应如何组合。因此需要可分析、可修改的中间表示。", "rationale": "论文用七元图式显式表示视觉隐喻，迁移阶段保留跨领域共同关系 G，同时重新实例化主体、载体、属性、不协调点与寓意。这个关系不变量是作者组织迁移推理的约束；诊断角色再检查新图式与视觉实现是否一致。", "basis_reference": "§3：Schema Grammar；§4：四角色推理", "architecture": [{"name": "感知图式", "flow": "参考隐喻图 → 七元图式", "explanation": "主体与载体是具体对象，属性描述对象，共同关系是可跨领域迁移的核心，不协调点与涌现寓意解释隐喻为何成立。", "operation": "感知角色把参考图整理为七元图式，描述主体、载体、相关属性、共同关系、不协调点及涌现寓意，将隐含创意显式化。"}, {"name": "跨域迁移", "flow": "参考图式、新主体 → 新图式", "explanation": "保留关系 G，但重新寻找适合新主体的载体和冲突方式。迁移输出仍是结构化描述，尚不是最终图像。", "operation": "迁移角色保留跨领域的关系核心，分析新主体的属性，寻找适合的新载体并重新安排冲突点，使新图表达类似寓意但不机械复制原对象。"}, {"name": "生成与诊断", "flow": "新图式 → 图像与针对性修正", "explanation": "生成角色负责视觉实现，诊断角色定位逻辑、部件或提示问题，返回相关阶段修改。不是每次失败都重新执行全部推理。", "operation": "生成角色将新图式转成图像。诊断角色分别检查逻辑、部件和提示词问题，必要时回到对应阶段修改，形成针对性迭代。"}], "findings": "以隐喻一致性、类比合理性、创意评价与人工评测比较方法。此处解读采用曹娟署名的 arXiv v1。", "limitations": "创意评估包含主观判断，且依赖VLM理解与图像生成器执行；文化隐喻可能歧义。", "figure": "figures/06ddbe9d7b4dff.webp", "figure_caption": "原论文v1图3（PDF第4页）：感知、迁移、生成和分层诊断四角色的闭环回溯。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2602.01335v1", "code_url": "https://github.com/ICTMCG/Beyond-Pixels"}, {"id": "paper-23", "title": "Interactive Visual Assessment for Text-to-Image Generation Models", "chinese_title": "DyEval：交互式探索文生图模型的能力边界", "year": "2026", "theme": "图像编辑与生成评估", "authors": "X Mi, F Tang, J Cao, Q Sheng, Z Huang, P Li, Y Liu, TY Lee", "publication": {"venue": "IEEE TVCG 32(4)", "date_label": "卷期", "date": "2026-04", "preprint_date": "2024-11-23", "arxiv_id": "2411.15509"}, "motivation": "固定提示词集合能比较模型在已知任务上的表现，却很难不断找到新错误。生成模型升级后，旧测试还可能过于简单，或已经进入训练数据。DyEval 把评估做成可持续探索的过程，让人和 LLM 根据结果继续提出更有针对性的测试。", "analysis": "随机增加提示词会浪费测试预算，单纯追逐失败又可能陷在一个很窄的问题里。发现失败后，还需要知道是某个词、关系还是组合造成问题，才有助于后续改进。测试组织和失败解释因此需要一起设计。", "rationale": "论文从固定覆盖、测试难度演化和数据泄漏风险提出动态评估需求。测试树组织分层探索，人工反馈驱动新输入，场景图分解用于寻找失败触发条件。其依据是论文提出的交互评估目标与实验分析，不是对完整能力边界的穷尽证明。", "basis_reference": "§III：设计目标；§IV：动态测试与上下文反思", "architecture": [{"name": "测试树与新提示", "flow": "用户主题、已有反馈 → 层级测试输入", "explanation": "树记录从宽主题到细子问题的探索，LLM 生成下一批提示。人工判定图像表现，为后续探索提供方向。", "operation": "以测试树组织主题、提示词、生成图和人工反馈，让不同层次的能力覆盖与测试历史在同一界面中可见。LLM 根据主题和已有反馈生成新的测试输入。"}, {"name": "自适应深化", "flow": "已有测试结果 → 更细或更难的测试", "explanation": "反馈改变测试覆盖和难度，使评估随被测模型能力演进，而不只是无限随机造提示。", "operation": "对已经掌握的主题继续加深难度或细化条件，使测试随着模型表现变化，而不是始终重复相同的简单样本。"}, {"name": "上下文反思", "flow": "失败提示及其场景图 → 失败触发条件", "explanation": "场景图显式表示对象与关系，分治缩小导致失败的组合，再总结可供人检查的模式，帮助从错误案例走向可解释诊断。", "operation": "遇到失败后，把提示转成场景图，用分治方式缩小触发错误的条件组合，再让 LLM 反思可能的失败模式，形成可供人检查的诊断。"}], "findings": "在相同测试样本预算下，论文报告最多发现 2.56 倍失败案例，并展示代词、隐含关系和文化语境等较难问题。", "limitations": "仍需要人工评判；发现更多失败不直接代表模型整体错误率，受搜索策略影响。", "figure": "figures/02f52389cba287.webp", "figure_caption": "原论文图2（PDF第4页）：动态测试树、人工反馈和失败定位循环。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1109/TVCG.2026.3658714"}, {"id": "paper-25", "title": "Tag-moe: Task-aware gating for unified generative mixture-of-experts", "chinese_title": "TAG-MoE：用任务语义指导生成模型的专家分工", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Y Xu, H Yan, J Cao, Y Cheng, T Hang, R He, Z Yin, S Zhang, Y Zhang, ...", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07", "preprint_date": "2026-01-12", "arxiv_id": "2601.08881"}, "motivation": "统一图像模型既要生成新图，也要处理局部编辑、风格变化和主体定制。这些任务对“哪些内容该变、哪些必须保留”的要求不同，用完全共享的计算路径可能互相牵制。TAG-MoE 希望让稀疏专家按任务语义形成分工。", "analysis": "普通路由器主要根据特征选择专家，却未必学到用户意图。只给“编辑”这样的粗标签，也分不清换背景与改表情。方法需要更细的语义监督，同时避免推理时再增加一套外部标注流程。", "rationale": "作者将任务分成 Scope、Type、Preservation 三层语义，并用余弦对齐把聚合路由特征与语义监督联系起来。语义标签只用于训练；推理仍由内部路由器选择专家。稀疏激活的目的，是在相近激活计算下增加容量并形成任务分工。", "basis_reference": "§3.2—3.3：层级任务语义与路由对齐", "architecture": [{"name": "训练期层级标注", "flow": "图像、指令、目标图 → 三层任务语义", "explanation": "Scope 表示范围，Type 表示操作，Preservation 表示必须保留的内容。视觉语言模型仅在训练数据处理中提供这些标签。", "operation": "训练期用视觉语言模型为样本标注三层语义：作用范围、操作类型和保持约束。例如区分局部与全局变化，并标明身份、背景或结构应当保持。"}, {"name": "稀疏专家骨干", "flow": "图像与文字 token → 专家处理后的特征", "explanation": "后十层图像前馈网络包含四专家，每个 token 选择一个。专家增大总容量，而每次只激活一部分参数。", "operation": "以 Qwen-Image 为基座，在末十层图像前馈网络中引入四个专家，采用 top-1 稀疏路由，让模型容量增加而每个 token 只激活有限计算。"}, {"name": "语义对齐路由", "flow": "路由特征、训练标签 → 有语义分工的门控", "explanation": "聚合路由特征与任务语义做对齐，促成不同专家分工。推理输入仍是原有图像与指令，不需外部再生成任务标签。", "operation": "聚合路由特征并预测任务语义，通过余弦对齐损失把专家选择与任务含义联系起来。推理依靠内部路由，不需要额外输入任务标签。"}], "findings": "在 ICE-Bench 等五组基准上评估，并通过移除语义对齐的消融检验任务监督的作用。", "limitations": "仍依赖VLM预处理，不能联合理解图像内数学等内容；部分训练数据为私有。", "figure": "figures/d78dd69f9ace1d.webp", "figure_caption": "原论文图2（PDF第4页）：训练时以层级任务语义对齐MoE路由，推理由门控自动分派专家。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2601.08881", "code_url": "https://github.com/ICTMCG/TAG-MoE"}, {"id": "paper-26", "title": "GeoHOI: Geometry-Enhanced Human-Object Interaction Video Generation via Hierarchical Multi-Modal Injection", "chinese_title": "GeoHOI：以多视角几何约束人—物交互", "year": "2026", "theme": "人物与交互视频生成", "authors": "Ziyi Xu, Zejing Rao, Juan Cao, Xiaoqiang Liu, Zhixue Fang, Haoxian Zhang, Songlin Tang, Fan Tang（正式PDF）", "publication": {"venue": "CVPR 2026 · Findings", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "人物转动物品时，商品纹理像原图还不够，形状和手部接触也必须在多视角下稳定。普通外观编码更擅长描述二维纹理，容易在转动或遮挡后把物体生成变形。GeoHOI 引入多视角几何先验来约束交互视频。", "analysis": "几何、纹理和语言控制不一定应在每层以相同方式混合。较早阶段需要建立空间结构，后续阶段才逐步补充外观；若纹理信息过早压过几何，模型可能生成“看起来像”却结构不稳的商品。", "rationale": "§3.1 采用 Flow Matching，定义 x_t=(1−t)x₀+tx₁，并学习由数据到噪声的速度场。几何条件部分使用 VGGT 多层特征和相机姿态调制，层级注入再按浅层几何、中层混合、深层纹理语义组织条件。二者分别是生成基础与本文的条件设计。", "basis_reference": "§3.1、§3.3—3.4：Flow Matching 与层级注入", "architecture": [{"name": "多视角几何提取", "flow": "物体多视角图、相机姿态 → 几何条件", "explanation": "VGGT 提供几何相关特征，相机姿态调制将物体视角信息带入潜变量。DINO 另提纹理，避免把几何与外观视为同一信号。", "operation": "从多视角物体图中提取 VGGT 多层几何特征，并以相机姿态调制物体潜变量；同时提取 DINO 纹理特征，分别描述结构与表面外观。"}, {"name": "层级多模态注入", "flow": "几何、纹理、文字 → 各层条件化特征", "explanation": "浅层、中层、深层接收的条件重点不同。该策略对应作者希望先稳定结构、再细化外观的生成安排。", "operation": "按照层级注入策略，在浅层主要加入几何与文字，中层逐步引入纹理，深层重点细化纹理和语义，让不同信息进入更适合的计算阶段。"}, {"name": "动作控制与视频去噪", "flow": "首帧、手势、物体点轨迹 → 交互视频", "explanation": "共享 VAE 将不同视觉条件编码到潜空间，DiT 在这些条件下去噪。VAE 是把图像压成潜变量、再解码回图像的编码器—解码器。", "operation": "以手部姿态序列、稀疏物体点轨迹和参考首帧控制视频运动，并构建自动数据处理流程，提供较一致的交互监督。"}], "findings": "相对 Wan2.2-5B，Object-IoU 提高 26.2%，手部 LMD 下降 19.6%；两项均为论文所报相对变化。", "limitations": "依赖上游姿态、分割与跟踪；透明、反光物体及复杂多人互动仍困难。", "figure": "figures/0b6847586bd847.webp", "figure_caption": "原论文图2（PDF第3页）：多视角几何先验提取与分层多模态注入。（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://openaccess.thecvf.com/content/CVPR2026F/html/Xu_GeoHOI_Geometry-Enhanced_Human-Object_Interaction_Video_Generation_via_Hierarchical_Multi-Modal_Injection_CVPRF_2026_paper.html"}, {"id": "paper-27", "title": "ResCa: Residual Caching for Diffusion Transformers Acceleration", "chinese_title": "ResCa：用代理 token 与残差缓存加速扩散模型", "year": "2026", "theme": "高效模型与鲁棒学习", "authors": "H Fang, Y Li, F Tang, Y Lu, J Cao, S Tang", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "扩散 Transformer 反复更新大量视觉 token，成本很高。直接复用上一时刻特征可以省计算，却可能让画面停留在过时状态。ResCa 研究能否只计算少量代表 token，再用它们的变化推算其他 token 的更新。", "analysis": "当前看起来相似的 token，后续去噪方向未必一致；缓存绝对特征也容易积累误差。因此需要根据历史轨迹判断谁可以共同更新，并复用“变化量”而非简单冻结所有内容。", "rationale": "作者观察到，相似历史去噪轨迹对应更可复用的残差，且低阶残差更稳定。TETC 用近期加权的历史相似度聚类，代理模拟再按历史关系复用残差更新。依据来自论文轨迹分析与残差实验，不是所有 token 都可无误差共享计算的假设。", "basis_reference": "§3：残差复用观察；§4.2—4.3：TETC 与代理模拟", "architecture": [{"name": "密集更新与 TETC", "flow": "全部 token 历史 → 轨迹相似分组", "explanation": "轨迹表示某 token 随去噪步骤的特征变化，TETC 综合多个步骤而非只看当前状态，并提高近期相似性的权重。", "operation": "在密集计算步骤正常更新所有 token，缓存历史特征。TETC 结合多个时间步的轨迹相似度，并给近期信息更高权重，将后续变化可能相近的 token 分组。"}, {"name": "代理 token 更新", "flow": "每组代表 token → 当前真实去噪残差", "explanation": "稀疏步骤只完整计算代理，减少大部分 token 的昂贵计算。其他 token 仍需更新，并非被冻结不变。", "operation": "在稀疏计算步骤，每组选择代理 token 真正执行去噪，其余 token 不再逐一通过全部计算。代理提供本组当前变化的参考。"}, {"name": "残差模拟与校准", "flow": "代理变化、组内历史 → 全部 token 新状态", "explanation": "残差是特征相对已有状态的变化量。方法按历史关系复用变化，后续密集步骤再校准，控制近似持续积累。", "operation": "利用代理的低阶残差及历史关系，模拟组内其他 token 的更新，并通过后续密集步骤重新校准，形成密集与稀疏计算交替的过程。"}], "findings": "在 DiT、FLUX 和 HunyuanVideo 上评估；论文报告 FLUX 最高达到 5.5 倍 GFLOPs 加速，不能直接等同于端到端耗时缩短 5.5 倍。", "limitations": "GFLOPs倍数不等于实际运行速度；聚类/代理误差会随压缩加大影响质量。", "figure": "figures/329aff2e479ce9.webp", "figure_caption": "原论文图3（PDF第4页）：时间增强轨迹聚类和代理驱动去噪，复用跨步多阶残差。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Fang_ResCa_Residual_Caching_for_Diffusion_Transformers_Acceleration_CVPR_2026_paper.html", "code_url": "https://github.com/Fanghaipeng/ResCa_Residual_Caching"}, {"id": "paper-28", "title": "HOMA: Towards Generic Human-Object Interaction in Multimodal Driven Human Animation with Weak Conditions", "chinese_title": "HOMA：弱条件控制的人—物交互视频生成", "year": "2025", "theme": "人物与交互视频生成", "authors": "Z Huang, Z Zhou, J Cao, Y Ma, Y Chen, Z Rao, Z Xu, H Wang, Q Lin, ...", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-06-10", "preprint_date": "2025-06-10", "arxiv_id": "2506.08797"}, "motivation": "人—物交互生成若要求完整身体、手指与物体姿态序列，用户准备条件的成本很高，数据也难以大规模获得。HOMA 希望用较弱、可缺省的运动条件生成通用交互，并支持音频驱动的说话动作。", "analysis": "控制条件太少会让动作和物体关系漂移，条件过细又限制使用场景。人物、物体与动作还处于不同表示方式中，需要在视频基座里协调，而不是简单把参考图堆在输入侧。", "rationale": "作者定义可缺省的人体姿态和点式物体轨迹作为弱条件，在潜变量与 token 空间组织人物、物体、动作，再通过 HOI 适配器建模交互。论文以不同弱条件实验和组件消融检验这种控制与灵活性的组合。", "basis_reference": "HunyuanVideo-HOMA v3 §3.1—3.3；HOMA 正式摘要", "architecture": [{"name": "弱条件编码", "flow": "参考人物、物体、弱骨架与点轨迹 → 条件表示", "explanation": "正式论文将单臂骨架与物体中心点作为最小运动条件，并允许更弱条件设置。文字与音频提供补充，不要求完整三维运动捕捉。", "operation": "以可缺省的人体骨架和物体中心点轨迹表示弱条件，保留基本位置与运动约束，同时降低对精细手部或完整三维标注的依赖。"}, {"name": "上下文融合与 HOI 适配器", "flow": "外观和运动表示 → 交互视频特征", "explanation": "外观与动作进入 MMDiT 的上下文空间，HOI 适配器以预训练 HunyuanVideo 参数初始化，利用基座先验补全未控制部分。", "operation": "在 HunyuanVideo 的潜变量与 token 空间融合人物、物体和运动信息，并用 HOI 适配器建模两者的交互联系，承接预训练基座已有的生成能力。"}, {"name": "面部音频控制", "flow": "语音特征、面部区域 → 同步说话动作", "explanation": "音频交叉注意力将语音注入面部相关区域，补充身体／物体动作之外的唇形控制。各条件共同决定最终视频。", "operation": "进一步用面部音频交叉注意力支持说话，将声音条件与面部变化联系起来；训练与评估覆盖不同对象、弱姿态和运动轨迹组合。"}], "findings": "比较不同对象、轨迹与弱条件设定，并通过消融检验上下文融合和 HOI 适配器。解读以 HunyuanVideo-HOMA 预印本为基础。", "limitations": "仍需要稀疏动作输入，点轨迹不保证精确接触；真实物理合理性主要靠生成先验。", "figure": "figures/176b8f34ebf47d.webp", "figure_caption": "预印本图3（PDF第5页）：latent/token双空间上下文融合、HOI适配器与音频适配器。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3757377.3763861"}, {"id": "paper-29", "title": "In-context brush: Zero-shot customized subject insertion with context-aware latent space manipulation", "chinese_title": "In-Context Brush：无需微调的定制主体插入", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, Y Wu, L Gao, O Deussen, H Yan, J Li, J Cao, TY Lee", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-05-26", "preprint_date": "2025-05-26", "arxiv_id": "2505.20271"}, "motivation": "把参考图中的某个主体放进新场景，需要既保留其身份和形状，又与背景的光照、尺度和文字要求协调。为每个主体重新微调模型效率较低。In-Context Brush 尝试在一次推理中完成主体插入。", "analysis": "只依赖文字描述容易丢失参考主体的独特外观；直接复制局部像素又难以适应新场景。主体信息必须能进入目标区域，同时避免把参考图背景和其他无关因素一起带过去。", "rationale": "作者利用扩散模型上下文中的参考主体信息，在注意力头内执行潜变量特征位移，并通过跨头重加权及 token blending 协调主体与场景。原文对照实验检验各操作对身份、文本对齐和融合的作用。", "basis_reference": "方法部分：上下文组织、特征位移与 token 混合", "architecture": [{"name": "参考主体与场景准备", "flow": "主体图、目标场景和掩码 → 上下文输入", "explanation": "分割移除参考背景，目标掩码界定允许生成的区域。拼接让模型同时访问主体和目标环境。", "operation": "先分割出较干净的参考主体，将其与目标场景拼接成上下文输入，并扩展目标区域掩码，为新主体及其边缘融合留出生成空间。"}, {"name": "注意力头内特征位移", "flow": "参考主体潜变量 → 目标区域主体表示", "explanation": "在模型内部特征空间迁移主体语义，而非直接复制像素。后续去噪仍需结合目标上下文恢复姿态与外观。", "operation": "在注意力头内部进行潜变量特征位移，将参考主体语义送向目标位置，让已有模型在新场景中重新合成主体，而非只在像素层粘贴。"}, {"name": "重加权与混合", "flow": "主体表示、文字和场景 → 融合图像", "explanation": "跨头重加权增强目标文字作用，token blending 协调上下文。三者一起在已有模型推理中工作，无需为该主体微调。", "operation": "跨头重加权增强文本控制，并通过 token blending 协调目标区域与上下文，兼顾身份保持、修改要求和场景融合。"}], "findings": "与主体插入方法比较身份保持、文字对齐和图像质量，并展示试衣、组合及局部插入等应用。", "limitations": "依赖分割与掩码位置，复杂遮挡及大幅形变受基础修复模型限制。", "figure": "figures/f709fd386dfefc.webp", "figure_caption": "原论文图2（PDF第3页）：上下文拼接、注意力头内latent迁移、跨头重加权与token融合。（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3757377.3763820", "code_url": "https://github.com/ICTMCG/In-context-Brush"}, {"id": "paper-31", "title": "Enhancing Fake News Video Detection via LLM-Driven Creative Process Simulation", "chinese_title": "AgentAug：通过造假制作过程模拟增强视频检测", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Y Bu, Q Sheng, J Cao, S Wang, P Qi, Y Shi, B Hu", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-10-05", "arxiv_id": "2510.04024"}, "motivation": "真实虚假新闻视频难以快速收集和标注，而生成技术又不断带来新制作方式。直接生成更多假视频未必有帮助，可能只让检测器学会识别合成痕迹。AgentAug 希望模拟具体造假过程，生成与真实检测难点更相关的训练样本。", "analysis": "训练数据需要同时覆盖文字叙事与视频素材之间的误导关系，并与当前检测器真正不确定的样本匹配。只扩大数量、不控制来源和选择方式，可能增加噪声，甚至造成训练测试信息泄漏。", "rationale": "作者将造假制作过程作为增强依据，用四类基本操作构造误导关系，再围绕真实样本不确定性选择训练数据。多折筛选用于控制合成样本的实际帮助，测试只使用人类制作视频以检查迁移。", "basis_reference": "方法部分：创作过程模拟与数据选择", "architecture": [{"name": "训练素材库", "flow": "训练视频 → 镜头片段及语言描述", "explanation": "视觉语言模型将素材转成可检索描述，使后续流程可以按造假意图选择片段，数据来源限定在训练部分。", "operation": "把训练视频分成镜头，用视觉语言模型描述素材，建立可检索的文字与视频片段库；合成只使用训练部分素材。"}, {"name": "创作过程模拟", "flow": "素材、四类造假操作 → 合成新闻视频", "explanation": "模拟改变的是叙事、事实与素材对应关系，不只是把图像做视觉扰动。输出仍需接受筛选。", "operation": "通过 LLM 驱动的制作流程，模拟事实歪曲、无中生有、误导替换和选择性剪辑等操作，再组合文字与视频，生成有制作逻辑的多模态样本。"}, {"name": "不确定性选择与重训", "flow": "难真实样本、合成候选 → 增强后的检测器", "explanation": "真实难例确定需要补的数据区域，多折筛选控制候选稳定性。最终检验放在人类制作视频上，而不是仅测合成识别。", "operation": "围绕检测器高不确定的真实样本检索候选合成数据，再用多折筛选保留稳定有帮助的样本，加入原检测器重新训练。"}], "findings": "在 FakeSV、FakeTT 与四种检测器上均报告改善；合成数据仅来自训练素材，测试仍使用人类制作视频。", "limitations": "不覆盖完全生成式假新闻视频；只研究固定任务工作流；随机加入合成样本有时反而降低性能，增强质量和选样都关键。", "figure": "figures/6364e133b246a5.webp", "figure_caption": "图 2，第 3 页：LLM模拟制作流程合成数据，再主动筛选有效样本（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3746252.3760933", "code_url": "https://github.com/ICTMCG/AgentAug"}, {"id": "paper-32", "title": "Bridging thoughts and words: Graph-based intent-semantic joint learning for fake news detection", "chinese_title": "InSide：联合新闻意图与语义的图学习", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, Q Sheng, D Wang, B Hu, J Cao", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-09-01", "arxiv_id": "2509.01660"}, "motivation": "假新闻不只体现在错误事实，也可能通过选择细节、安排叙事来服务某种意图。直接让 LLM 判断作者动机可能忽略文章细节；只编码正文又难以捕捉较抽象的目的。InSide 尝试把意图与具体语言证据连接起来。", "analysis": "意图推断属于较粗的解释，句子与实体属于较细的语义单元。两者粒度不同，如果只是拼接最终向量，难以知道哪个意图对应哪段表达，也不利于在相互矛盾时调整判断。", "rationale": "作者以信念、欲望等意图分析组织粗粒度信息，同时用句子和实体图保留细粒度语义。动态路径对齐和跨图消息传递建立两种粒度间的联系，回应直接拼接无法充分连接意图与表达的问题。", "basis_reference": "方法部分：意图图、语义图与动态路径对齐", "architecture": [{"name": "语义图", "flow": "正文句子与实体 → 细粒度语义结构", "explanation": "句子保留叙事片段，实体提供跨句连接，后续图传播可聚合局部与跨句信息。", "operation": "用句子和实体构建语义图，保留局部叙事及跨句联系，让具体表达不只压缩为整篇文本的一个向量。"}, {"name": "意图图", "flow": "正文、LLM 意图推断 → 粗细意图表示", "explanation": "信念与欲望等推断组织目的层信息，细粒度表达使它能够与正文对应。推断仍是模型输出，非作者心理事实。", "operation": "让 LLM 从信念、欲望等角度推断粗粒度意图，再结合细粒度表达建立意图图，显式表示作者可能想传达和实现的内容。"}, {"name": "动态路径对齐", "flow": "两张图 → 联合表示与真假判断", "explanation": "在共享空间中匹配路径并跨图传消息，使抽象意图与具体表达相互约束，最后执行检测分类。", "operation": "分别更新两张图，通过动态路径对齐建立共同空间，进行跨图消息传递后分类，使意图解释能够影响具体证据聚合，反过来也接受正文约束。"}], "findings": "在 PolitiFact、GossipCop、Weibo 和 LLMFake 上验证；前三者按时间切分，LLMFake 使用随机划分。", "limitations": "对非故意错误的适用性不明；LLM 的意图推断会出错；并未证明可以普遍识别真实内容里的操纵框架。", "figure": "figures/bc51c59e5e7fb4.webp", "figure_caption": "图 2，第 4 页：语义图与意图图分别建模，再进行动态路径对齐（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3746252.3761400"}, {"id": "paper-33", "title": "Exploring news intent and its application: A theory-driven approach", "chinese_title": "NINT 与 DMInt：新闻意图的理论框架和建模", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Cao, S Ma, H Cheng", "publication": {"venue": "Information Processing & Management 62(6)", "date_label": "卷期", "date": "2025-11", "preprint_date": "2023-12-27", "arxiv_id": "2312.16490"}, "motivation": "新闻的事实内容相近，写作目的却可能不同：告知、劝服、塑造印象或推动某种行为。缺少统一定义时，“新闻意图”容易成为模糊标签，难以比较或用于下游任务。本文从理论框架、数据和模型三方面建立可操作的研究对象。", "analysis": "意图不能简单等同于真假、情绪或立场，也往往没有一句明确的自我声明。需要把抽象心理概念拆成能够从文本分析的要素，再考虑不同要素对具体任务的贡献。", "rationale": "论文以信念—欲望—计划组织新闻意图，将抽象意图分解成可分析维度，并据此构建 NewsInt 和 DMInt。DMInt 的多视角局部—全局提取与动态门控用于聚合这些维度，这是原文理论框架到数据与模型的对应。", "basis_reference": "NINT 理论框架与 DMInt 方法", "architecture": [{"name": "NINT：意图定义", "flow": "新闻表达 → 信念、欲望与计划维度", "explanation": "理论框架先规定要分析哪些意图维度，避免把情绪、立场和真假统称为同一个意图标签。", "operation": "提出 NINT 框架，以信念、欲望与计划组织新闻意图，细化为立场、目标影响和写作策略等维度，明确各维度之间的关系。"}, {"name": "NewsInt：数据与信号", "flow": "文章、讨论 → 意图分析数据", "explanation": "文章与 Reddit 讨论提供研究材料，分解式推理将框架转成可使用的意图信号，为模型提供统一接口。", "operation": "构建 NewsInt，包含 12,959 篇文章及 Reddit 讨论，用分解式推理形成意图信号，为理论概念提供可研究的数据基础。"}, {"name": "DMInt：多视角聚合", "flow": "文本及意图信号 → 下游任务特征", "explanation": "RoBERTa 编码文本，局部—全局提取器保留不同粒度，动态门控决定各视角贡献，再交给下游预测。", "operation": "DMInt 采用 RoBERTa、多视角局部—全局提取器和动态门控，聚合不同层面的意图特征，并将其接入下游任务。"}], "findings": "研究提供意图分析框架、数据集和下游建模方法，为后续意图—语义联合学习等工作建立基础。", "limitations": "主要是文本新闻；数据源与推断框架可能带来文化、政治及平台偏差；推断意图不能等同事实核查结论。", "figure": "figures/d564f2e73934ec.webp", "figure_caption": "图 2，第 3 页：NINT 把新闻意图拆为信念、欲望与计划（原PDF第3页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1016/j.ipm.2025.104229", "code_url": "https://github.com/ICTMCG/NewsInt"}, {"id": "paper-34", "title": "The staircase of ethics: Probing llm value priorities through multi-step induction to complex moral dilemmas", "chinese_title": "递进道德困境：观察大模型的价值优先序", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Wu, Q Sheng, D Wang, G Yang, Y Sun, Z Wang, Y Bu, J Cao", "publication": {"venue": "EMNLP 2025", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-05-23", "arxiv_id": "2505.18154"}, "motivation": "问模型一道孤立的道德题，往往只能看到一条简短原则。现实困境会逐步增加代价和冲突，同一模型也可能随情境变化改选其他价值。本文用递进式困境观察模型的选择过程，而非只记录一次静态答案。", "analysis": "不同问题之间的价值差异可能来自情景本身，难以判断模型到底改变了什么。若在同一故事中逐步升级冲突，就能比较选择从哪一步转变，再分析其中关怀、公平等价值如何竞争。", "rationale": "本文明确采用道德基础理论和 Schwartz 价值理论组织价值类别，并将五阶段递进困境中的选择映射到这些类别。逐阶段比较与成对竞争分析用于观察模型优先序如何变化；它测量的是情境化行为，不把模型当作拥有固定人格的道德主体。", "basis_reference": "困境构造与价值映射部分", "architecture": [{"name": "五阶段困境构造", "flow": "道德规范、初始故事 → 递进故事组", "explanation": "同组故事保持情境关联并逐步增加冲突，允许观察模型何时转变，而不只对比无关问题。", "operation": "从 Moral Stories 的规范出发，用 GPT-4o 构造 3,302 组、每组五阶段的递进道德困境，保持故事关联并逐步增加决策压力。"}, {"name": "理论价值映射", "flow": "模型选择 → 理论定义的价值类别", "explanation": "道德基础理论与 Schwartz 价值理论提供分类视角，多个模型的共识用于降低单一标注者判断波动。", "operation": "依据道德基础理论与 Schwartz 价值理论，将模型选择映射到较明确的价值类别，由多个模型形成共识标注。"}, {"name": "逐阶段行为分析", "flow": "九个模型的选择 → 价值分布及竞争关系", "explanation": "比较各阶段和成对价值竞争，结果描述模型在所测情境中的行为优先序，不把它解释成人类心理测量的直接等价物。", "operation": "评测九个 LLM，跟踪各阶段选择、价值分布和成对价值竞争，观察价值优先顺序随困境升级发生的变化。"}], "findings": "价值选择会随困境升级变化；关怀经常占优，但在部分条件下，公平等价值会超过它。结果描述的是所测情境中的行为倾向。", "limitations": "价值框架偏西方，情境多为线性升级且主要由模型生成；观察输出不能推断模型拥有价值观，也不能直接推断实际行为。", "figure": "figures/70190935aa18b0.webp", "figure_caption": "图 2，第 4 页：五级困境构造、价值映射与逐步偏好评测（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2025.emnlp-main.806/"}, {"id": "paper-36", "title": "Adversarial robust memory-based continual learner", "chinese_title": "持续学习中的对抗鲁棒性：输出校准与记忆选择", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "X Mi, F Tang, Z Yang, D Wang, J Cao, P Li, Y Liu", "publication": {"venue": "ICCV 2025", "date_label": "arXiv 首发", "date": "2023-11-29", "preprint_date": "2023-11-29", "arxiv_id": "2311.17608"}, "motivation": "持续学习系统不断接收新类别，只能保存少量旧样本；若还要求抵抗对抗扰动，就需要同时防止旧知识遗忘和鲁棒性遗忘。本文研究基于记忆回放的分类器，怎样在连续任务中保留对旧类别的稳定判断。", "analysis": "新任务更新会挤压旧类别的输出空间，有限缓存中难分、异常或不稳定的样本又可能降低回放质量。单纯增加对抗训练强度，不能同时解决类别竞争和缓存选择。", "rationale": "作者将遗忘原因拆为输出层类别偏置与记忆样本选择两个方面，AFLC 与 RAER 分别对应这两处问题。RAER 利用对抗过程判断样本稳定性，避免仅按普通分类置信度挑选缓存。", "basis_reference": "方法部分：AFLC 与 RAER", "architecture": [{"name": "正常与对抗记忆回放", "flow": "当前样本、旧任务缓存 → 联合训练批次", "explanation": "回放使旧类别继续参与更新，对抗版本检验扰动后的稳定性。缓存容量有限，之后需要选择要留下的样本。", "operation": "对当前任务与记忆中的样本生成对抗版本，训练模型在正常输入及扰动输入下保持分类能力，旧任务依靠少量样本回放参与更新。"}, {"name": "AFLC：输出校准", "flow": "类别阶段信息、分类输出 → 校准后的学习信号", "explanation": "过去、当前和未来类别在连续学习中地位不同，校准减少新类别对旧类别学习的压制。", "operation": "AFLC 根据过去、当前和未来类别校准分类输出，调整不同类别在学习中的影响，缓解新任务对旧类别的负面梯度作用。"}, {"name": "RAER：缓存选择", "flow": "PGD 过程中的稳定性 → 新记忆集合", "explanation": "按样本被成功攻击次数筛选候选，结合回放维持鲁棒旧知识。它影响下一任务能看到什么旧样本。", "operation": "RAER 统计样本在 PGD-10 过程中的被成功攻击次数，以文中 k<5 的规则筛选缓存候选，优先保留鲁棒且有代表性的样本，再更新记忆。"}], "findings": "在 Split-CIFAR10/100 和 Split-Tiny-ImageNet 上评估；论文报告 ResNet 与 ViT 的对抗遗忘明显下降。", "limitations": "测试为划分式图像分类任务与有限缓存，不能直接等同真实长期开放流；依赖对抗训练和任务阶段信息。旧预印本摘要结果与正式版口径不同，已采用正式版。", "figure": "figures/950310aaca1841.webp", "figure_caption": "原论文图4：抗遗忘输出校准与鲁棒性感知记忆回放。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Mi_Adversarial_Robust_Memory-Based_Continual_Learner_ICCV_2025_paper.html"}, {"id": "paper-37", "title": "Model synthesis for zero-shot model attribution", "chinese_title": "零样本模型归因：以合成模型学习生成指纹", "year": "2025", "theme": "视觉取证与内容保护", "authors": "Tianyun Yang, Juan Cao, Danding Wang, Chang Xu（所读期刊预印本顺序；保留Scholar原始作者字段供对照）", "publication": {"venue": "IEEE Transactions on Multimedia 27 · 2025", "date_label": "arXiv 首发", "date": "2023-07-29", "preprint_date": "2023-07-29", "arxiv_id": "2307.15977"}, "motivation": "图像来源模型不断出现，逐个下载并运行所有生成器来训练归因器，成本高且难以持续更新。本文希望不依赖目标生成模型的训练样本，仍能判断两张图是否同源，或将未知图像与给定模型图册匹配。", "analysis": "归因器若只认识训练过的几个模型，遇到新架构就可能失效。作者关注生成网络留下的指纹，尝试用更容易构造的大量合成模型，覆盖多种结构因素，再学习可迁移的指纹表示。", "rationale": "论文以网络架构变化会影响生成指纹为出发点，通过合成模型扩展训练指纹的多样性，并在未见生成器上检验迁移。分类损失学习区别，度量损失支持新来源之间的相似度比较。", "basis_reference": "方法部分：模型合成与指纹度量", "architecture": [{"name": "合成模型库", "flow": "架构组合、随机种子 → 多样处理网络", "explanation": "浅层自编码器用于构造指纹来源，不等于收集了所有真实生成器。它们是训练指纹表示的代理模型。", "operation": "组合浅层自编码器的架构和随机种子，训练 288 种架构、5,760 个合成模型，以较低成本获得大量不同的模型指纹。"}, {"name": "指纹提取器训练", "flow": "不同网络处理的图像 → 来源相关指纹", "explanation": "分类损失区分训练来源，度量损失组织相似度空间。图像内容与网络处理痕迹需要在训练中区分。", "operation": "让真实图像经过这些模型，形成带不同网络处理痕迹的图像；用分类与度量学习训练指纹提取器，使同源特征接近、异源特征分离。"}, {"name": "未知模型归因", "flow": "待测图与参考图册 → 同源判断或来源匹配", "explanation": "新目标模型不必进入提取器训练集，但图册匹配仍需要参考图像；没有图册时可进行图像对的同源验证。", "operation": "推理时提取待测图像指纹，比较两张图的同源性，或与参考模型图册匹配；这里的零样本指归因器训练时不需要见过目标生成模型。"}], "findings": "在新兴模型识别实验中报告 93.20% 准确率，并比较未见模型识别与同源验证表现。", "limitations": "零样本指提取器没训练过目标模型；命名识别仍需参考图库。难区分同一基座的不同 LoRA 版本。", "figure": "figures/f409a4167bd31e.webp", "figure_caption": "原论文图4：组合不同浅层网络模块，让真实图像带上多样合成模型指纹。（原PDF第6页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1109/TMM.2025.3607778", "code_url": "https://github.com/TianyunYoung/Model-Fingerprint"}, {"id": "paper-38", "title": "Exploiting user comments for early detection of fake news prior to users’ commenting", "chinese_title": "CAS-FEND：在评论出现前利用评论知识检测新闻", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Q Nan, Q Sheng, J Cao, Y Zhu, D Wang, G Yang, J Li", "publication": {"venue": "Frontiers of Computer Science 19(10)", "date_label": "在线发表", "date": "2025-01-28", "preprint_date": "2023-10-16", "arxiv_id": "2310.10429"}, "motivation": "评论能指出新闻疑点、提供补充信息和反映社会情绪，但新新闻刚发布时还没有评论。CAS-FEND 希望在训练时利用历史评论，上线时仅凭正文完成早期检测，避免等评论积累后才响应。", "analysis": "直接生成几条虚拟评论会引入额外噪声，所有新闻也未必同样需要情绪或细节信息。方法因此不把评论当作部署输入，而是将评论模型中的知识按类型蒸馏给正文模型。", "rationale": "教师—学生结构利用训练时可见、部署时不可见的信息；分类型蒸馏与自适应权重对应不同新闻对评论线索需求不一致的问题。这是论文训练与推理分工的核心。", "basis_reference": "方法部分：教师—学生蒸馏与知识偏好", "architecture": [{"name": "有评论教师", "flow": "新闻、历史评论 → 多类教师知识", "explanation": "共注意力找正文与评论相关线索，社会情绪分支提供另一类判断信息。教师仅在训练阶段有这些评论输入。", "operation": "教师模型联合编码新闻与评论，通过共注意力寻找相关内容，并建模社会情绪，形成有评论条件下的判断。"}, {"name": "正文学生", "flow": "新闻正文 → 词级、情绪和综合表示", "explanation": "学生学习教师对应知识，部署时不生成或读取真实评论。虚拟社会情绪是学习到的特征，不是新收集到的用户反馈。", "operation": "学生只编码新闻正文，同时学习教师的重要词分布、虚拟社会情绪和综合特征，分别接收细粒度内容、情感与整体判断知识。"}, {"name": "知识偏好蒸馏", "flow": "新闻内容、各类监督 → 加权训练目标", "explanation": "评分器因新闻而异地分配蒸馏权重，使训练不要求所有知识对每篇文章同样重要。最终推理只运行学生。", "operation": "内容相关的知识偏好评分器为各蒸馏目标分配权重，让不同新闻选择更有帮助的监督。部署阶段只保留学生，不需要等待或输入真实评论。"}], "findings": "学生优于所比较的纯正文方法，并优于部分只获得四分之一评论的评论模型，支持发布时检测。", "limitations": "历史评论可能有偏差与噪声；虚拟情绪是预测特征，不能冒充实际用户态度；跨平台及未来事件仍需验证。", "figure": "figures/9762c88c589d78.webp", "figure_caption": "图 2，第 6 页：评论教师向纯正文学生蒸馏语义、情绪与整体知识（原PDF第6页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://link.springer.com/article/10.1007/s11704-024-40674-6"}, {"id": "paper-41", "title": "Forewarned is Forearmed: Pre-Synthesizing Jailbreak-like Instructions to Enhance LLM Safety Guardrail to Potential Attacks.", "chinese_title": "IMAGINE：提前模拟潜在越狱指令进行安全对齐", "year": "2025", "theme": "大模型可信与安全", "authors": "S Liu, Q Sheng, D Wang, Y Liu, G Yang, J Cao", "publication": {"venue": "EMNLP 2025 · Findings", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-08-27", "arxiv_id": "2508.20038"}, "motivation": "安全训练通常已有一批恶意指令，但实际越狱会把相同意图包装成不同情境。反复加入相似问法，未必覆盖新攻击的表达区域。IMAGINE 希望在攻击出现之前主动合成更多潜在包装，再用于安全对齐。", "analysis": "合成数据既要保持原始意图，才能作为有效安全训练样本，又要拓展表达分布，而不只是近义改写。论文将“情境隐藏”和“表示空间覆盖”作为两个需要共同处理的问题。", "rationale": "论文明确把越狱文本与安全对齐语料之间的分布差异作为出发点。保持意图与扩展分布的联合目标，对应样本是否有效和是否足够多样两项要求；DPO 则将这批数据用于偏好学习。", "basis_reference": "§3：IMAGINE 生成与安全对齐", "architecture": [{"name": "意图隐藏生成器", "flow": "原始指令 → 情境包装指令", "explanation": "生成器学习保留意图并改变表达场景，目的是为安全训练提供潜在陌生包装，不改变所对应的安全标签。", "operation": "先训练情境改写模型，学习将原指令意图放进不同表达背景，形成更接近潜在越狱包装的样本。"}, {"name": "迭代分布扩展", "flow": "上一轮样本与表示 → 新区域样本", "explanation": "主题、对比和距离相关目标协调意图保持与多样性。生成变体逐轮扩展，而非只重复同一模板。", "operation": "逐轮训练生成变体，在嵌入空间使用主题、对比及距离相关约束，使新样本保持原意图，同时向旧样本未充分覆盖的区域扩展。"}, {"name": "DPO 安全对齐", "flow": "合成指令、拒绝偏好 → 目标模型", "explanation": "DPO 是用成对偏好更新模型的训练方法。合成器负责数据，目标模型负责最终回答，两者不应混作同一个部署模块。", "operation": "将合成样本与拒绝回答组成偏好数据，通过 DPO 安全对齐目标模型，并检查正常任务能力和过度拒绝情况。"}], "findings": "在 Qwen2.5 与 Llama 系列三个模型上降低多种越狱攻击成功率，并评估正常能力和误拒绝。", "limitations": "仍依赖初始配对数据和嵌入模型；迭代生成有计算成本；未验证更大规模模型，也不能保证覆盖未来攻击。", "figure": "figures/afcb5835a93473.webp", "figure_caption": "图 2，第 4 页：IMAGINE 的迭代空间扩展与情境改写流程（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2025.findings-emnlp.266/"}, {"id": "paper-43", "title": "Llm-generated fake news induces truth decay in news ecosystem: A case study on neural news recommendation", "chinese_title": "真相衰减：生成新闻如何影响推荐排序", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "B Hu, Q Sheng, J Cao, Y Li, D Wang", "publication": {"venue": "SIGIR 2025", "date_label": "在线发表", "date": "2025-07-13", "preprint_date": "2025-04-28", "arxiv_id": "2504.20013"}, "motivation": "大模型生成的新闻不只影响真假检测，还会进入推荐候选、用户阅读历史甚至推荐训练数据。本文研究这些介入会怎样改变真假新闻的相对排序，关心的是推荐生态中的系统性变化。", "analysis": "若所有生成新闻一次性加入系统，很难区分影响来自候选内容、历史表示还是训练过程。作者因此按介入位置逐步设置实验，并观察推荐模型对不同来源文本的偏好。", "rationale": "论文通过分阶段介入设计区分不同环节的作用，再从熟悉度视角分析“真相衰减”。这是一套控制变量的经验研究，并非对所有现实推荐系统给出的统一因果定理。", "basis_reference": "§4：分阶段介入实验与熟悉度分析", "architecture": [{"name": "推荐数据构建", "flow": "真假标签、互动、生成新闻 → 序列推荐数据", "explanation": "保持新闻类型可区分，使排序结果能够按真假与生成来源统计。生成内容采用多种方式构造。", "operation": "把 GossipCop 的真假标签与社交互动记录整理为推荐序列数据，构建约 5.6 万条多种方式生成的新闻，为真假和生成来源提供可比较的样本。"}, {"name": "分阶段介入", "flow": "固定推荐模型、不同介入位置 → 排名结果", "explanation": "分别改变候选、用户历史和训练数据中的生成内容，区分这些环节的作用，而不一次同时改变全部条件。", "operation": "依次设置生成新闻不介入、进入候选、进入历史、进入训练数据等条件，在 LSTUR、NRMS 等推荐模型中比较排序变化。"}, {"name": "机制分析", "flow": "排序指标、熟悉度信号 → 真相衰减解释", "explanation": "MRR 与 nDCG 等衡量排名，熟悉度和困惑度用于分析偏好来源。这是经验研究流程，不是新增三层推荐网络。", "operation": "以 MRR、nDCG 和前列占比等指标观察真假新闻位置，并结合模型熟悉度与困惑度分析生成内容为何更容易获得推荐优势。"}], "findings": "观察到生成内容逐步介入时，真实新闻相对假新闻的排序优势减弱，作者称之为“真相衰减”。", "limitations": "这是模拟推荐环境中的排名现象，并非真实平台因果实验或人类信念实验证据；未覆盖下一代 LLM 推荐器和完全自主造假。", "figure": "figures/55f0b5ef0fc897.webp", "figure_caption": "图 3，第 5 页：将带真假标签的新闻与社交互动改造成推荐数据，再生成不同新闻变体（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3726302.3730027"}, {"id": "paper-44", "title": "Enhancing the comprehensibility of text explanations via unsupervised concept discovery", "chinese_title": "ECO-Concept：自动发现可理解的文本分类概念", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Sun, D Wang, Q Sheng, J Cao, J Li", "publication": {"venue": "ACL 2025 · Findings", "date_label": "论文集", "date": "2025-07", "preprint_date": "2025-05-26", "arxiv_id": "2505.20293"}, "motivation": "文本分类的词级高亮虽能指出局部关注，却不一定告诉读者模型学到了什么概念。预先人工定义概念又难以覆盖不同任务。ECO-Concept 希望自动发现任务相关概念，并让概念成为模型实际分类所依赖的中间表示。", "analysis": "无监督聚类得到的概念可能很难解释，而分类后再让 LLM 编一段说明，也未必忠实于模型。论文把概念提取、分类和可理解性反馈放进一个训练循环，使解释能够影响模型本身。", "rationale": "论文采用概念瓶颈与槽注意力作为结构基础，并将“人能否从概念描述找到同样片段”转成可训练的差异目标。概念不只是事后命名，而是参与分类与反馈优化的变量。", "basis_reference": "§3.1—3.4：概念瓶颈、槽注意力与反馈", "architecture": [{"name": "槽注意力概念提取", "flow": "词元特征、可学习概念 → 概念激活", "explanation": "多个槽竞争解释输入片段，并通过一致性和差异性约束形成分工；槽是模型中的可学习向量，不是手写词典。", "operation": "槽注意力让多个可学习概念竞争文本中的词元，通过一致性与差异性约束形成不同概念关注区域，而不是依赖预先写好的概念词表。"}, {"name": "概念瓶颈分类", "flow": "各概念激活量 → 类别预测", "explanation": "分类器仅利用概念汇总特征，确保概念参与预测。它与先用黑箱分类、再额外生成解释的流程不同。", "operation": "汇总各概念的激活量作为分类输入，分类器只通过这一概念瓶颈作判断，使概念与预测建立结构上的联系。"}, {"name": "可理解性反馈", "flow": "概念描述、高亮和模型注意力 → 概念更新", "explanation": "LLM 总结概念并定位新样本相关片段，二者与实际槽注意力的差异构成反馈，反过来优化概念。", "operation": "让 LLM 总结高激活样本，再在新样本中高亮该概念对应片段；比较高亮与实际注意力的差异，形成可理解性反馈并微调概念，迭代至较稳定状态。"}], "findings": "在七个文本分类数据集和人工实验中比较分类能力与概念可理解性，多项分类结果接近黑箱模型。", "limitations": "主要为较轻量文本分类模型；LLM 评价有成本和偏差；概念数量预先固定，并未直接解决大生成模型的全部可解释性问题。", "figure": "figures/099b62c975388e.webp", "figure_caption": "图 2，第 4 页：槽注意力提取概念，LLM总结和高亮后反馈改进（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://aclanthology.org/2025.findings-acl.758/"}, {"id": "paper-46", "title": "PhantomHunter: Detecting Unseen Privately-Tuned LLM-Generated Text via Family-Aware Learning", "chinese_title": "PhantomHunter：家族感知的私有微调文本检测", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Shi, Y Yang, Q Sheng, H Mi, B Hu, C Xu, J Cao", "publication": {"venue": "arXiv:2506.15683", "date_label": "预印本首发", "date": "2025-06-18", "preprint_date": "2025-06-18", "arxiv_id": "2506.15683"}, "motivation": "私有微调后的语言模型通常不公开权重，检测器无法收集它的输出建立专门训练集。单纯针对公开模型训练的检测方法，又可能随着微调而退化。PhantomHunter 希望利用基座与后代模型共享的家族特征，识别未知私有模型生成的文本。", "analysis": "语义风格随领域微调变化较大，但文本在多个公开基座下的概率模式，可能仍保留家族关系。方法不仅需要真假判别，还要从多个家族中选出更适合当前文本的检测专家。", "rationale": "作者以基座与微调后代之间共享家族级特征的观察为依据，对比学习显式鼓励保留家族共性，专家门控则利用这一共性进行检测。它不假定不同家族都能由一个固定判别边界充分覆盖。", "basis_reference": "§3.1—3.3：概率特征、家族学习与专家融合", "architecture": [{"name": "公开基座概率特征", "flow": "待测文本、多个公开基座 → 逐词元概率表示", "explanation": "每个基座为同一段文本计算概率序列，再由 CNN 和 Transformer 编码。它们是代理评估模型，不是未知私有生成器。", "operation": "把待测文本分别送入多个公开基座，计算逐词元概率序列，再用 CNN 与 Transformer 编码这些序列，获得概率特征。"}, {"name": "家族对比编码", "flow": "生成文本的家族关系 → 家族相关特征", "explanation": "同家族样本作为正对，鼓励微调后代与基座保留共同表示，并预测来源家族，为专家选择提供权重。", "operation": "同一家族生成文本作为正样本进行对比学习，并学习来源家族，使同基座不同微调后代的特征更接近。"}, {"name": "家族专家融合", "flow": "家族概率、专家判断 → 真假预测", "explanation": "每个专家提供对应家族下的检测意见，门控按概率融合。仍需运行多个公开代理模型，不能描述成只读一次文本即可零成本推理。", "operation": "以家族预测概率作为门控，融合多个家族专家的真假判断。推理不需要访问未知私有模型本身，但需要运行这些公开代理基座。"}], "findings": "实验和消融支持概率特征、家族对比学习及专家门控的贡献；来源家族识别仍比真假二分类更难。", "limitations": "对训练覆盖外的全新家族与复杂改写的泛化不能保证；需要运行多个基座计算概率，部署成本高于单模型分类；私有微调设置仍是实验近似。", "figure": "figures/119ea38f7c2e65.webp", "figure_caption": "图 3，第 5 页：多基座概率编码、家族对比学习与门控专家检测（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2506.15683"}, {"id": "paper-48", "title": "Attend to not attended: Structure-then-detail token merging for post-training dit acceleration", "chinese_title": "SDTM：依据结构—细节去噪过程合并 token", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "H Fang, S Tang, J Cao, E Zhang, F Tang, TY Lee", "publication": {"venue": "CVPR 2025", "date_label": "arXiv 首发", "date": "2025-05-16", "preprint_date": "2025-05-16", "arxiv_id": "2505.11707"}, "motivation": "扩散生成前期主要形成整体结构，后期逐步补充细节。若所有步骤都用相同 token 合并规则，可能在关键阶段丢掉有用信息。SDTM 利用这一去噪规律，研究无需额外训练的动态计算压缩。", "analysis": "冗余的位置与程度会随时间变化：早期应保护全局布局，后期需要避免损伤细节。只看当前特征相似度或固定压缩率，难以适应这两种需求。", "rationale": "论文第 3 节分析去噪过程中结构与细节的先后规律，第 4 节据此设计动态合并、压缩率和提示词重加权。其依据来自作者对扩散去噪冗余的分析，而非把所有相似 token 一律视作无用。", "basis_reference": "§3—4：去噪分析与 SDTM", "architecture": [{"name": "前期局部结构合并", "flow": "早期 token → 压缩结构表示", "explanation": "按局部结构相似性减少重复计算，目标是保留布局所需差异。该阶段不直接采用后期的全局细节规则。", "operation": "早期根据局部结构相似性合并 token，降低重复计算，同时保留生成布局所需的局部结构差异。"}, {"name": "后期细节导向合并", "flow": "后期 token → 压缩细节表示", "explanation": "根据细节不关注程度在更大范围合并，将计算留给仍需细化的位置，使策略适应去噪阶段变化。", "operation": "后期转为依据细节不关注程度进行全局合并，将计算更多留给当前仍需细化的位置。"}, {"name": "动态比例与提示重加权", "flow": "时间阶段、结构／细节提示 → 最终生成过程", "explanation": "压缩率和提示权重随阶段变化，使压缩策略与所需生成信息协调。无需重新训练原 DiT。", "operation": "随去噪阶段动态调整压缩率，并重加权结构与细节提示词，使压缩策略与当前生成任务协调。合并作为后训练插件接入已有 DiT。"}], "findings": "跨骨干、采样器和数据集测试，论文报告约 1.55 倍加速，画质变化较小。", "limitations": "压缩收益取决于输入与模型，过度合并仍可能损失细节；“无损”不能泛化。", "figure": "figures/2caade1a8ca775.webp", "figure_caption": "原论文图3/4（PDF第4页）：前期结构合并、后期细节合并及压缩率和提示权重调整。（原PDF第4页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://arxiv.org/abs/2505.11707", "code_url": "https://github.com/ICTMCG/SDTM"}, {"id": "paper-49", "title": "Understanding and mitigating hallucination in large vision-language models via modular attribution and intervention", "chinese_title": "视觉语言模型幻觉：模块归因与定向干预", "year": "2025", "theme": "大模型可信与安全", "authors": "T Yang, Z Li, J Cao, C Xu", "publication": {"venue": "ICLR 2025", "date_label": "会议", "date": "2025-04-24—28"}, "motivation": "视觉语言模型可能说出图片里并不存在的物体。仅从输出统计幻觉，难以知道该干预模型哪里；大规模重新训练也成本较高。本文先定位与幻觉有关的内部模块，再实施局部干预。", "analysis": "注意力高不代表对输出有因果作用。作者采用因果中介分析比较注意力与前馈模块，追查哪些部件真正推动幻觉词，并进一步研究这些注意力头是否过度依赖文本而忽视视觉。", "rationale": "这里明确使用的是论文中的因果中介分析框架：通过对内部变量的干预评估其对结果的作用。随后两种方法针对已定位的幻觉头修改计算，分别对应解码干预和局部微调。", "basis_reference": "因果中介分析与模块干预部分", "architecture": [{"name": "因果模块归因", "flow": "模型内部变量、幻觉输出 → 模块贡献", "explanation": "通过干预评估对输出的作用，避免仅用注意力数值大小判断因果关系。该分析先定位应处理的头。", "operation": "通过模块级因果中介分析，干预并比较内部模块对幻觉输出的贡献，定位高贡献注意力头，而不只用相关性可视化选位置。"}, {"name": "幻觉头特征分析", "flow": "已定位头 → 文本偏好与模块位置", "explanation": "作者比较语言底座和指令微调相关行为，检查高贡献头是否过度关注文本，为干预方式提供依据。", "operation": "分析这些头的位置、文本偏好及其与语言底座、指令微调的关系，建立后续干预应针对哪些计算通路的依据。"}, {"name": "AD-HH／TF-HH", "flow": "已定位头、解码或微调 → 降低幻觉的模型", "explanation": "AD-HH 改变解码中的文本注意力，TF-HH 更新相关头及语言头。两者是可比较的干预方案，不是必须串联执行的两个阶段。", "operation": "AD-HH 在解码时对过度偏向文本的幻觉头关闭文本注意力；TF-HH 则只微调相关注意力头与语言头，以局部更新降低幻觉。"}], "findings": "LLaVA-v1.5-7B 的 COCO 描述实验中，幻觉率最多降至原来的约 1/1.7，同时检查生成质量。", "limitations": "无需训练方案需要显式注意力权重，与 FlashAttention 等实现不兼容；定位与干预需模型内部访问；结论不能外推为所有幻觉的唯一原因。", "figure": "figures/fb479a2fb03fbe.webp", "figure_caption": "图 3，第 5 页：幻觉头与非幻觉头对文字和图像的注意力比较（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://proceedings.iclr.cc/paper_files/paper/2025/hash/8001c3568152d134d821cd46d4d84768-Abstract-Conference.html", "code_url": "https://github.com/TianyunYoung/Hallucination-Attribution"}, {"id": "paper-50", "title": "B4m: Breaking low-rank adapter for making content-style customization", "chinese_title": "B4M：可组合的内容—风格低秩适配", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, J Cao, Y Zhang, O Deussen, W Dong, J Li, TY Lee", "publication": {"venue": "ACM Transactions on Graphics 44(2)", "date_label": "正式发表", "date": "2025-04-17", "preprint_date": "2024-03-28", "arxiv_id": "2403.19456"}, "motivation": "用户可能希望把某个定制主体画成多种风格，也希望同一种风格应用到不同主体。独立训练的内容与风格 LoRA 直接合并，容易互相干扰；把两者一起学，又可能绑定成一个不可拆的组合。B4M 从参数空间组织方式入手处理这个问题。", "analysis": "LoRA 的上下投影矩阵共同决定更新，把内容和风格都放在共享可学习参数中，难以保证组合时仍各自保留作用。训练数据若只有一对一对应，也会鼓励记住固定内容—风格配对。", "rationale": "论文以正交先验构造内容与风格的子参数空间，PLP 分开可学习部分，MCP 用多对应配对减轻绑定。正式版摘要另明确采用黎曼预条件来平衡组合时的内容与风格学习；此处说明其原文用途，不补写未核对的黎曼优化推导。", "basis_reference": "早期全文 PLP／MCP；正式版摘要的黎曼预条件", "architecture": [{"name": "PLP：部分可学习投影", "flow": "原 LoRA → 分离的内容／风格子空间", "explanation": "LoRA 用低秩上下投影表示参数更新；PLP 固定其中一部分、学习另一部分，并用近似正交基减少组合干扰。", "operation": "PLP 只学习上下投影矩阵中的部分参数，将内容与风格分配到不同子参数空间；冻结部分用近似正交基初始化，减少矩阵乘积带来的干扰。"}, {"name": "MCP：多对应训练", "flow": "内容与多风格、风格与多内容 → 可组合投影", "explanation": "多对应安排打破一对一绑定，避免一个内容投影只会和训练时唯一风格配合，反向也相同。", "operation": "MCP 让同一内容对应多种参考风格，也让同一风格对应多种内容，打破一对一绑定，学习更可组合的参数空间。"}, {"name": "组合与平衡优化", "flow": "内容／风格 PLP → 组合适配器", "explanation": "正式版使用黎曼预条件平衡两类学习。它调整组合优化，不是对图像后处理；具体推导不从摘要补写。", "operation": "组合阶段重新拼接内容与风格的 PLP 矩阵。正式期刊摘要进一步采用黎曼预条件（Riemannian preconditioning）自适应平衡内容与风格学习，再进行组合适配；这里的预条件用于调整优化过程，而不是新增一个生成器。"}], "findings": "通过参数分布、内容与风格重建、编辑、人类偏好及组件消融检验组合生成效果。", "limitations": "仍需参考样本训练与组合微调，复杂多主体与基础模型薄弱概念仍受限。", "figure": "figures/a4b5130ee849bf.webp", "figure_caption": "预印本图3/4（PDF第5页）：内容/风格参数冲突对比与多对应投影训练。（原PDF第5页图页节选，保留原图与图注；放大可读。）", "paper_url": "https://doi.org/10.1145/3728461", "code_url": "https://github.com/ICTMCG/Break-for-make"}, {"id": "paper-52", "title": "Multi-level feature dynamic fusion neural radiance fields for audio-driven talking head generation", "chinese_title": "MLDF-NeRF：多层特征融合的音频驱动说话头像", "year": "2025", "theme": "人物与交互视频生成", "authors": "W Song, Q Liu, Y Liu, P Zhang, J Cao", "publication": {"venue": "Applied Sciences 15(1)", "date_label": "正式发表", "date": "2025-01-06"}, "motivation": "音频驱动说话头像时，嘴部受声音影响最直接，其他面部区域变化规律不同。若所有空间位置都用同一种音频融合方式，重要动态区域的信息可能丢失，无关区域也可能受到干扰。MLDF-NeRF 改进空间表示及音视频融合。", "analysis": "单一尺度难以同时表达全局轮廓与细小动作；声音与空间位置的对应关系也不应固定。论文分别增加多层级三平面表示，以及区域相关的音视频交互。", "rationale": "论文第 3 节以 NeRF 的颜色—密度场和体渲染为基础，随后用多层三平面与注意力融合增强条件表示。作者明确针对音频与不同面部区域映射不一致、重要区域信息不足两项问题设计模块。", "basis_reference": "§3.1—3.3：体渲染、三平面与音视频融合", "architecture": [{"name": "多层三平面哈希", "flow": "射线上的三维点 → 多尺度空间特征", "explanation": "每个三维点映射到多个二维平面，不同分辨率捕捉粗细结构。哈希表示压缩存储与查询空间特征。", "operation": "对射线采样的三维点使用三组不同分辨率上限的三平面哈希表示，编码全局与细粒度空间动态。三平面将三维位置映射到多个二维平面特征。"}, {"name": "动态融合与音视频注意力", "flow": "多层空间、音频及眼动 → 区域条件特征", "explanation": "动态聚合减少重复信息，多头注意力使不同区域接受不同音频权重，避免声音无差别影响全脸。", "operation": "通过动态融合聚合多层信息，减少冗余特征，再用多头注意力式音视频融合，让声音特征按不同平面区域重新加权。"}, {"name": "NeRF 与体渲染", "flow": "条件特征、相机射线 → 说话头像图像", "explanation": "NeRF 预测采样点颜色与密度，体渲染沿射线累积成像。该网络针对人物数据学习，不能当作任意身份的单图通用动画器。", "operation": "将融合后的空间、音频和眼部运动信息交给 NeRF，预测颜色与密度，再沿相机射线进行体渲染，生成目标人物图像。"}], "findings": "表 3 中 PSNR 与 FID 优于所列 ER-NeRF，但 LPIPS 略差，说明不同质量指标的改善并不完全一致。", "limitations": "需要个体训练；同名作者归属未与ICT证实，应从团队主统计剔除并保留说明。", "figure": "figures/dd9de895109cad.webp", "figure_caption": "原文图1：音频和眨眼特征与多层三平面哈希表示融合，再经体渲染生成说话人；下半部分展开三平面表示。作者机构归属另见本篇说明。", "paper_url": "https://www.mdpi.com/2076-3417/15/1/479", "author_affiliation": "中国传媒大学"}]</script>
<script>
const papers=JSON.parse(document.querySelector('#paper-data').textContent);
const themes=['虚假信息与新闻理解','大模型可信与安全','视觉取证与内容保护','人物与交互视频生成','图像编辑与生成评估','高效模型与鲁棒学习'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=x=>Array.isArray(x)?x.join('；'):typeof x==='object'&&x?Object.entries(x).map(([k,v])=>k+'：'+plain(v)).join('；'):String(x??'');
const para=x=>esc(plain(x)).replace(/\n/g,'<br>');
const safeURL=x=>/^https?:\/\//.test(x||'')?esc(x):'#';
themes.forEach(name=>{document.querySelector('#side-themes').insertAdjacentHTML('beforeend',`<a href="#library" data-theme="${name}">${name}</a>`);document.querySelector('#category').insertAdjacentHTML('beforeend',`<option>${name}</option>`)});
function card(p){const pub=p.publication;return `<article class="paper" id="${p.id}"><header class="paper-head"><div class="tags"><span>${esc(p.year)}</span><span>${esc(p.theme)}</span></div><h3>${esc(p.chinese_title||p.title)}</h3><div class="publication"><span class="venue">${esc(pub.venue)}</span><span class="date">${esc(pub.date_label)} ${esc(pub.date)}</span>${pub.preprint_date&&!pub.date_label.includes('首发')?`<span class="date">arXiv ${esc(pub.preprint_date)}</span>`:''}</div><div class="english" lang="en">${esc(p.title)}</div><div class="authors">${esc(plain(p.authors))}${p.author_affiliation?` · ${esc(p.author_affiliation)}`:''}</div></header><div class="paper-body"><h4>研究问题与动机</h4><p>${para(p.motivation)}</p><p>${para(p.analysis)}</p><h4>作者的理论与设计依据</h4><p>${para(p.rationale)}</p><p class="basis-ref">原文对应：${esc(p.basis_reference)}</p><h4>方法与架构</h4><div class="architecture">${p.architecture.map((b,i)=>`<section class="module"><h5><span class="step">${String(i+1).padStart(2,'0')}</span>${esc(b.name)}</h5><div class="flow">${esc(b.flow)}</div><p>${para(b.operation)}</p><p class="module-note">${para(b.explanation)}</p></section>`).join('')}</div>${p.figure?`<figure><img loading="lazy" src="${esc(p.figure)}" alt="${esc(p.figure_caption)}" data-zoom><figcaption>${para(p.figure_caption)}</figcaption></figure>`:''}<h4>结果与收益</h4><p class="results">${para(p.findings)}</p>${p.limitations?`<div class="limitations"><strong>适用范围与局限</strong>　${para(p.limitations)}</div>`:''}<div class="sources"><a class="paper-link" href="${safeURL(p.paper_url)}" target="_blank" rel="noopener">论文原文 ↗</a>${p.code_url?`<a class="code-link" href="${safeURL(p.code_url)}" target="_blank" rel="noopener">代码 ↗</a>`:''}</div></div></article>`}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),y=document.querySelector('#year').value,c=document.querySelector('#category').value;const rows=papers.filter(p=>(!y||String(p.year)===y)&&(!c||p.theme===c)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));document.querySelector('#papers').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">未找到匹配的论文。</div>';document.querySelector('#status').textContent=q||y||c?`${rows.length} 篇${c?' · '+c:''}${y?' · '+y+' 年':''}`:''}
['search','year','category'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.querySelector('#reset').onclick=()=>{['search','year','category'].forEach(id=>document.getElementById(id).value='');render()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme],[data-year],[data-reset]');if(t){document.querySelector('#reset').click();if(t.dataset.theme)document.querySelector('#category').value=t.dataset.theme;if(t.dataset.year)document.querySelector('#year').value=t.dataset.year;render();document.querySelector('#library').scrollIntoView()}if(e.target.matches('[data-zoom]')){const d=document.querySelector('#lightbox');d.querySelector('img').src=e.target.src;d.querySelector('img').alt=e.target.alt;d.showModal()}});document.querySelector('#close-lightbox').onclick=()=>document.querySelector('#lightbox').close();document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});
render();function openHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('paper-'))return;let p=document.getElementById(id);if(!p){document.querySelector('#reset').click();p=document.getElementById(id)}if(p)requestAnimationFrame(()=>p.scrollIntoView())}window.addEventListener('hashchange',openHash);openHash();
</script></body></html>
