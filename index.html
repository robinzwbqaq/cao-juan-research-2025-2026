合理结合。", "analysis": "单一尺度难以同时表达全局轮廓与细小动作；声音与空间位置的对应关系也不应固定。论文分别增加多层级三平面表示，以及区域相关的音视频交互。", "rationale": "论文第 3 节以 NeRF 的颜色—密度场和体渲染为基础，随后用多层三平面与注意力融合增强条件表示。作者明确针对音频与不同面部区域映射不一致、重要区域信息不足两项问题设计模块。", "basis_title": "嘴部与其他面部区域，不应同样响应声音", "method_title": "多尺度空间表示怎样与音频结合", "method_input": "目标人物的单目训练视频、音频和眨眼信息；生成时提供驱动音频与相机射线。", "method_output": "音频驱动、包含唇形与眼部动作的目标人物图像序列。", "result_title": "图像细节与音画对应分别看什么", "connection": "音频提取器产生时间特征，三平面编码器产生空间特征，动态融合与注意力将二者结合，NeRF 再预测射线上各点的颜色与密度。前面的表示学习和最后的体渲染是不同职责。", "architecture": [{"name": "音频特征提取", "flow": "语音窗口 → 时间音频表示", "operation": "先用语音识别模型提取声音特征，再读取当前视频帧附近的一段音频，结合卷积和注意力处理，让相邻帧的口型变化更平滑。\n\n自动语音识别（ASR）模型先为每个短音频片段提取分类 logits，即归一化之前的语音预测分数，再用滑动窗口收集当前视频帧附近的声音。之后的一维卷积与自注意力进行时间聚合和平滑，形成逐帧音频表示。读取邻近时间窗口可以保留发音过渡，使后面的空间融合模块不必只根据一个瞬时声音点判断口型。"}, {"name": "多层三平面哈希", "flow": "射线上的三维点 → 多尺度空间特征", "operation": "对射线采样的三维点使用三组不同分辨率上限的三平面哈希表示，编码全局与细粒度空间动态。三平面将三维位置映射到多个二维平面特征。\n\n对每条相机射线上的三维采样点，把坐标分别投影到 XY、YZ、XZ 三个平面，并查询多层二维哈希网格。每个平面有多组不同分辨率表示，分别编码粗轮廓和细小局部变化。三平面把三维点的空间信息拆成较低维查询，所得特征再送往动态融合，而非直接把二维网格当作最终视频帧。"}, {"name": "动态多层融合", "flow": "不同分辨率空间特征 → 聚合空间表示", "operation": "结合多层三平面特征，减少重复信息，同时保留粗细动态。\n\n同一平面不同层级的特征按权重求和，得到该平面的融合表示，再将三个平面拼接成几何特征。该阶段负责整合不同尺度的空间信息，还没有决定某个位置该随哪段音频运动。空间聚合完成后，后续音视频模块才能针对唇部、眼部等位置生成不同条件权重。"}, {"name": "音视频注意力融合", "flow": "空间、声音和眼动 → 条件化面部特征", "operation": "用注意力为不同空间区域重加权声音相关信息，减少无关区域干扰。\n\n三个平面的融合特征分别经过不共享参数的两层 MLP，产生位置相关的音频权重，再与音频表示逐元素相乘、拼接。静态区域的音频响应可被压低，唇部保留更强联系。眼动走单独路径：从空间特征预测 Sigmoid 权重，再乘眨眼标量，使眼动主要作用于相关位置，不直接复用唇形的声音权重。"}, {"name": "NeRF 与体渲染", "flow": "条件特征、相机射线 → 说话头像图像", "operation": "将融合后的空间、音频和眼部运动信息交给 NeRF，预测颜色与密度，再沿相机射线进行体渲染，生成目标人物图像。\n\n条件化特征与视线方向输入隐式场，预测采样点的颜色 c 和密度 σ，再沿射线按透射与吸收关系累积成像素，这就是体渲染。训练先用像素均方误差建立整体重建，细化阶段再加入图块感知损失改善细节。各帧使用对应音频条件重复渲染，组合成同一人物的连续说话头像。"}], "findings": "表 3 中 PSNR 与 FID 优于所列 ER-NeRF，但 LPIPS 略差，说明不同质量指标的改善并不完全一致。", "limitations": "需要针对目标人物单独训练。", "figures": [{"number": 1, "page": 3, "src": "figures/paper-52-fig-01.webp", "original_caption": "Figure 1. Overview of the proposed MLDF-NeRF.", "placement": "method", "caption": "总图连接声音、眼部运动、多层三平面与体渲染，下半部分展开多层空间表示。先看条件入口，再看它们如何汇成 NeRF 的输入。"}, {"number": 2, "page": 7, "src": "figures/paper-52-fig-02.webp", "original_caption": "Figure 2. Audio feature extraction: Using the sliding window approach, we split the provided audio stream into several parts. Following the ASR classification of each audio clip, we apply 1D convolution and self-attention modules to temporally smooth the audio clips in order to produce the final audio feature αs.", "placement": "module-0", "caption": "音频按滑动窗口分段，经过语音识别相关特征、一维卷积与自注意力形成表示。它说明网络实际接收到的不是一个整段音频标签，而是有时间结构的特征。"}, {"number": 3, "page": 8, "src": "figures/paper-52-fig-03.webp", "original_caption": "Figure 3. Visualization of the audio-visual fusion module. We display the attention map visualized through the norm of the attention vector in the generated head space image.", "placement": "module-3", "caption": "音视频融合的注意力可视化显示不同空间区域怎样响应音频信息。这与全脸均匀使用同一个声音条件有区别。"}, {"number": 5, "page": 12, "src": "figures/paper-52-fig-05.webp", "original_caption": "Figure 5. The comparison of the details. We show the generated details of the baselines (AD-NeRF, RAD-NeRF, and ER-NeRF) to compare with our method.", "placement": "evidence", "caption": "局部细节并排比较帮助观察口部和面部纹理。它补充整体指标，因为不同质量指标并不总朝同一方向变化。"}], "paper_url": "https://www.mdpi.com/2076-3417/15/1/479", "author_affiliation": "中国传媒大学", "sort_date": "2025-01-06", "experiment": {"summary": "在整体头像生成测试中，MLDF-NeRF 的 PSNR 为 26.27、FID 为 4.85，优于 ER-NeRF 的 25.76 和 5.70；但 LPIPS 为 0.0474，略差于其 0.0456，几项质量指标并非一致改善。", "caption": "PSNR 越高越好，LPIPS、LMD 与 FID 越低越好。该表评价整体画面，唇形同步在原文中另列实验。", "src": "figures/paper-52-main-experiment.webp"}, "novelty": {"score": 2}, "fine_tags": ["说话头像", "音频驱动", "NeRF", "三平面表示", "动态融合"]}, {"id": "paper-37", "title": "Model synthesis for zero-shot model attribution", "chinese_title": "零样本模型归因：以合成模型学习生成指纹", "year": "2025", "theme": "大模型可信与安全", "authors": "Tianyun Yang, Juan Cao, Danding Wang, Chang Xu（所读期刊预印本顺序；保留Scholar原始作者字段供对照）", "publication": {"venue": "IEEE Transactions on Multimedia 27 · 2025", "date_label": "卷期", "date": "2025", "preprint_date": "2023-07-29", "arxiv_id": "2307.15977"}, "motivation": "一张 AI 图片究竟来自哪个生成模型？常见办法要先收集各个模型的大量作品，但新模型不断出现，有些还无法下载运行。这篇论文希望少依赖这种收集。它先训练一些容易获得的合成网络，制造多样的生成痕迹，再学习识别图像里的来源特征，用于此前未见过的生成模型。", "context": "模型指纹指生成处理留下的统计特征，不是图中可见的模型名称。论文用容易训练的合成网络制造多样处理痕迹，再学习提取这些特征，希望减少对真实生成器训练样本的依赖。", "analysis": "归因器若只认识训练过的几个模型，遇到新架构就可能失效。作者关注生成网络留下的指纹，尝试用更容易构造的大量合成模型，覆盖多种结构因素，再学习可迁移的指纹表示。", "rationale": "论文以网络架构变化会影响生成指纹为出发点，通过合成模型扩展训练指纹的多样性，并在未见生成器上检验迁移。分类损失学习区别，度量损失支持新来源之间的相似度比较。", "basis_title": "为什么用大量小模型学习生成指纹", "method_title": "模型合成、指纹训练与未知来源判断", "method_input": "训练时为真实图片与合成处理网络；部署时为待测图和所需参考图。", "method_output": "图像指纹表示，以及同源验证或来源模型匹配结果。", "result_title": "识别和同源验证是两种使用方式", "connection": "合成模型负责生产训练图，指纹提取器负责从图中读出来源相关表示。部署时不再运行整套合成模型库，而是用提取器比较待测图与参考图，或者判断两张图是否同源。", "architecture": [{"name": "合成模型库", "flow": "架构组合、随机种子 → 多样处理网络", "operation": "组合浅层自编码器的架构和随机种子，训练 288 种架构、5,760 个合成模型，以较低成本获得大量不同的模型指纹。\n\n合成网络采用浅层自编码器：下采样后重建输入图像，改变上采样方式、激活、归一化、层数及排列，形成 288 种架构；每种再训练不同随机种子，总计 5,760 个模型。它们不承担生成丰富新内容的任务，而以简单重建快速产生不同网络痕迹，为指纹学习提供更大的结构与参数变化范围。"}, {"name": "指纹提取器训练", "flow": "不同网络处理的图像 → 来源相关指纹", "operation": "让真实图像经过这些模型，形成带不同网络处理痕迹的图像；用分类与度量学习训练指纹提取器，使同源特征接近、异源特征分离。\n\n每次从真实图库与合成网络库抽样，真实图经所选网络重建后，先减去去噪器输出得到残差，再做傅里叶变换，交给 ResNet50 提取频谱指纹。训练联合来源分类与三元组损失：一方面识别合成来源，另一方面让同源指纹接近、异源指纹分开。这样部署时可以使用距离，而不依赖训练类别中必须包含目标模型。"}, {"name": "模型验证", "flow": "两张图像的指纹 → 是否同源", "operation": "计算指纹表示之间的距离，判断是否可能来自相同模型。\n\n验证任务输入两张图，分别经过相同的残差、频谱和指纹提取流程，再比较嵌入距离。输出关心它们是否同一来源，即使这个来源未参与训练也可进行比较。因而“零样本”首先体现在不必为每个新生成器重新收集训练类；它仍需要两张可比较的图，不是只凭一张图推断任意模型名称。"}, {"name": "模型识别", "flow": "待测指纹、参考图册 → 来源匹配", "operation": "将待测图与各模型参考图比较，选择更符合的来源。\n\n识别任务另外提供来源参考图册，每个候选模型的参考图先得到指纹表示并汇总。待测图与这些来源表示比较距离，选择最匹配的候选。它与同源验证共用提取器，但问题不同：前者在已给出的候选中找来源，后者只判断两图是否相同，方法图因而将它们画成两条部署路径。"}], "findings": "在新兴模型识别实验中报告 93.20% 准确率，并比较未见模型识别与同源验证表现。", "limitations": "零样本指提取器没训练过目标模型；命名识别仍需参考图库。难区分同一基座的不同 LoRA 版本。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-37-fig-01.webp", "original_caption": "Fig. 1: Illustration of the existing methods (above) and ours (below). Existing methods depend on training with a limited set of real-world models, struggling to distinguish emerging unseen models like Stable Diffusion (SD) and DALL-E series. In contrast, our method trains on numerous synthetic models that replicate a broader range model fingerprints, enabling it to distinguish and attribute unseen models effectively.", "placement": "intro", "caption": "传统训练来源较少，新增生成器可能落到未知区域；本文用更丰富的合成来源训练可迁移指纹。这解释了“零样本”针对的是目标模型未进入训练。"}, {"number": 2, "page": 4, "src": "figures/paper-37-fig-02.webp", "original_caption": "Fig. 2: Images (top) produced by generative models and the associated (averaged) Fourier spectrum (bottom). The unique characteristics of the Fourier spectrum can be regarded as the fingerprints of generative models and used for model attribution. The spectrum are obtained from high-pass filtered images processed through a denoiser.", "placement": "basis", "caption": "生成图与其平均频谱并排展示，说明不同模型可能留下不同频率统计。频谱是作者分析指纹的一个观察工具，不是直接从主体外观猜来源。"}, {"number": 4, "page": 6, "src": "figures/paper-37-fig-04.webp", "original_caption": "Fig. 4: Our proposed model synthesis strategy. The synthetic model receives a real image as input, producing a fingerprinted image that contains the distinct fingerprint characteristics associated with the synthetic model.", "placement": "method", "caption": "浅层合成网络输入真实图片，输出带其处理痕迹的图像。原始内容基本作为载体，网络结构与参数变化用于产生不同指纹。"}, {"number": 6, "page": 8, "src": "figures/paper-37-fig-06.webp", "original_caption": "Fig. 6: Training the fingerprint extractor based-on synthetic models.", "placement": "detail", "caption": "不同合成模型产生训练样本，指纹提取器学习区别来源。这个训练阶段与后续只输入待测图的归因阶段需要分开。"}, {"number": 7, "page": 8, "src": "figures/paper-37-fig-07.webp", "original_caption": "Fig. 7: Illustration of the model verification (above) and identification (below) problem.", "placement": "evidence", "caption": "上半是两张图的同源验证，下半是对参考模型图册的识别。前者回答是否同源，后者回答更接近哪个已有参考来源。"}], "paper_url": "https://doi.org/10.1109/TMM.2025.3607778", "code_url": "https://github.com/TianyunYoung/Model-Fingerprint", "sort_date": "2025-01-01", "experiment": {"summary": "将只用合成模型训练的提取器直接用于未见生成器，Emerging Models 的来源识别准确率为 93.20%，高于 POSE 的 49.80%。另行微调后达到 94.02%，两种设置在表中分开报告。", "caption": "重点看右侧未见模型列：Only-Syn 仅用合成网络样本训练，Fine-tune 则在这一基础上继续微调。", "src": "figures/paper-37-main-experiment.webp"}, "novelty": {"score": 5}, "fine_tags": ["模型指纹", "零样本归因", "模型合成", "度量学习"]}]</script>
<script>
const papers=JSON.parse(document.querySelector('#paper-data').textContent);
const NOTES_KEY='cao-juan-reader-notes-v1';
let annotations={};
try{const saved=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))for(const p of papers)if(Array.isArray(saved[p.id]))annotations[p.id]=saved[p.id].filter(n=>n&&typeof n.id==='string'&&typeof n.body==='string'&&typeof n.quote==='string')}catch{}
const localPaperNotes=id=>annotations[id]||[];
const paperNotes=id=>{const rows=new Map((sharedAnnotations[id]||[]).filter(n=>!hiddenSharedNotes.has(n.id)).map(n=>[n.id,n]));for(const n of localPaperNotes(id))rows.set(n.id,{...rows.get(n.id),...n});return [...rows.values()]};
let notePaperId='',noteEditingId=null,pendingSelection=null,notesReturnFocus=null,noteAnchor=null;
const noteDrafts={};
const notesPanel=document.querySelector('#notes-panel'),noteText=document.querySelector('#note-text'),noteQuote=document.querySelector('#note-quote-preview'),noteStatus=document.querySelector('#notes-status');
function updateNoteButtons(){document.querySelectorAll('[data-annotate]').forEach(b=>{const n=paperNotes(b.dataset.annotate).length;b.textContent=n?'批注 '+n:'写批注'});document.querySelector('#export-notes').disabled=!Object.values(annotations).some(rows=>rows.length)}
function saveNoteDraft(){if(notePaperId)noteDrafts[notePaperId]={body:noteText.innerText,runs:readNoteRuns(),quote:noteQuote.textContent,editingId:noteEditingId,anchor:noteAnchor}}
function fillNoteForm(draft={}){noteText.innerHTML=renderNoteBody(draft);noteEditorRange=null;document.querySelector('#note-bold').setAttribute('aria-pressed','false');document.querySelector('#note-underline').setAttribute('aria-pressed','false');document.querySelector('#note-size').value='16';document.querySelector('#note-color').value='#282b29';noteQuote.textContent=draft.quote||'';noteQuote.hidden=!draft.quote;noteEditingId=draft.editingId||null;noteAnchor=draft.anchor||null;document.querySelector('#note-save').textContent=noteEditingId?'保存修改':'保存批注';document.querySelector('#note-cancel').hidden=!noteEditingId;noteStatus.textContent=''}
function openNotes(id,quote=null,trigger=null,anchor=null){saveNoteDraft();notePaperId=id;notesReturnFocus=trigger||document.querySelector(`[data-annotate="${id}"]`);const p=papers.find(p=>p.id===id);if(!p)return;document.querySelector('#notes-paper-title').textContent=p.chinese_title||p.title;notesPanel.hidden=false;if(quote!==null)noteDrafts[id]={body:'',quote,editingId:null,anchor};fillNoteForm(noteDrafts[id]);document.querySelector('#selection-note').hidden=true;noteText.focus()}
function closeNotes(){saveNoteDraft();notesPanel.hidden=true;if(notesReturnFocus?.isConnected)notesReturnFocus.focus({preventScroll:true})}
function persistNotes(next){try{localStorage.setItem(NOTES_KEY,JSON.stringify(next));annotations=next;updateNoteButtons();applyAnnotationHighlights();return true}catch{noteStatus.textContent='浏览器未能保存，请先复制批注内容，再重试。';return false}}
function clearNoteForm(){delete noteDrafts[notePaperId];fillNoteForm();noteText.focus()}
document.querySelector('#notes-close').onclick=closeNotes;
document.querySelector('#note-cancel').onclick=clearNoteForm;
document.querySelector('#note-form').onsubmit=e=>{e.preventDefault();const runs=readNoteRuns(),body=runs.map(r=>r.text).join('').trim();if(!body){noteStatus.textContent='先写一点批注内容。';return}const now=new Date().toISOString(),existing=paperNotes(notePaperId).find(n=>n.id===noteEditingId);const note={id:existing?.id||String(Date.now())+'-'+Math.random().toString(36).slice(2),body,runs,quote:noteQuote.textContent,anchor:noteAnchor,createdAt:existing?.createdAt||now,updatedAt:now};const rows=existing?localPaperNotes(notePaperId).map(n=>n.id===note.id?note:n):[...localPaperNotes(notePaperId),note];if(persistNotes({...annotations,[notePaperId]:rows})){clearNoteForm();noteStatus.textContent=existing?'修改已保存':'批注已保存';closeNotes()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-annotate]');if(b)openNotes(b.dataset.annotate,null,b)});
const selectionButton=document.querySelector('#selection-note');let selectionTimer;
document.addEventListener('selectionchange',()=>{clearTimeout(selectionTimer);selectionTimer=setTimeout(()=>{const s=getSelection(),a=s?.anchorNode?.parentElement?.closest('.paper'),b=s?.focusNode?.parentElement?.closest('.paper');if(!s||s.isCollapsed||!a||a!==b||s.anchorNode.parentElement.closest('.margin-notes')||s.focusNode.parentElement.closest('.margin-notes')||!s.toString().trim()){selectionButton.hidden=true;pendingSelection=null;return}const rect=s.getRangeAt(0).getBoundingClientRect();const selected=s.getRangeAt(0),body=a.querySelector('.paper-body'),scope=body.contains(selected.startContainer)&&body.contains(selected.endContainer)?body:a,prefix=document.createRange();prefix.selectNodeContents(scope);prefix.setEnd(selected.startContainer,selected.startOffset);const start=prefix.toString().length;pendingSelection={id:a.id,quote:s.toString().trim(),anchor:{scope:scope===body?'body':'article',start,end:start+selected.toString().length,text:selected.toString()}};selectionButton.style.left=Math.max(10,Math.min(innerWidth-155,rect.left))+'px';selectionButton.style.top=Math.max(10,Math.min(innerHeight-48,rect.bottom+7))+'px';selectionButton.hidden=false},90)});
selectionButton.onmousedown=e=>e.preventDefault();selectionButton.onclick=()=>{if(pendingSelection){const {id,quote,anchor}=pendingSelection;openNotes(id,quote,null,anchor);getSelection()?.removeAllRanges()}};
window.addEventListener('scroll',()=>{selectionButton.hidden=true},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!notesPanel.hidden&&!document.querySelector('#lightbox').open)closeNotes()});
window.addEventListener('pagehide',saveNoteDraft);
window.addEventListener('storage',e=>{if(e.key!==NOTES_KEY)return;try{const next=JSON.parse(e.newValue||'{}');if(next&&typeof next==='object'&&!Array.isArray(next)){annotations=next;updateNoteButtons();applyAnnotationHighlights();}}catch{}});

function annotationRange(scope,note){const raw=scope.textContent,text=note.anchor?.text||note.quote;if(!text)return null;let start=-1;const expected=note.anchor?.start;if(Number.isInteger(expected)&&raw.slice(expected,expected+text.length)===text)start=expected;else start=raw.indexOf(text);if(start>=0)return {start,end:start+text.length};const positions=[],characters=[];for(let i=0;i<raw.length;i++)if(!/\s/.test(raw[i])){positions.push(i);characters.push(raw[i])}const needle=text.replace(/\s/g,'');if(!needle)return null;const index=characters.join('').indexOf(needle);return index<0?null:{start:positions[index],end:positions[index+needle.length-1]+1}}
function applyAnnotationHighlights(){document.querySelectorAll('.margin-notes').forEach(n=>n.remove());document.querySelectorAll('.paper').forEach(p=>{p.classList.remove('has-margin-notes');p.style.minHeight=''});document.querySelectorAll('.annotation-mark').forEach(mark=>{const parent=mark.parentNode;mark.replaceWith(...mark.childNodes);parent.normalize()});for(const article of document.querySelectorAll('.paper'))for(const note of paperNotes(article.id)){if(!note.quote)continue;const scope=note.anchor?.scope==='article'?article:article.querySelector('.paper-body'),match=annotationRange(scope,note);if(!match)continue;const walker=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT),parts=[];let node,offset=0;while(node=walker.nextNode()){const end=offset+node.length;if(end>match.start&&offset<match.end)parts.push({node,start:Math.max(0,match.start-offset),end:Math.min(node.length,match.end-offset)});offset=end;if(offset>=match.end)break}for(const part of parts.reverse()){if(part.start===part.end)continue;const range=document.createRange();range.setStart(part.node,part.start);range.setEnd(part.node,part.end);const mark=document.createElement('mark');mark.className='annotation-mark';mark.dataset.annotationNote=note.id;mark.dataset.annotationPaper=article.id;mark.title='查看批注';range.surroundContents(mark)}}renderMarginNotes()}
document.addEventListener('click',e=>{const mark=e.target.closest('.annotation-mark');if(!mark||!getSelection()?.isCollapsed)return;e.preventDefault();const article=mark.closest('.paper'),card=[...article.querySelectorAll('.margin-note')].find(n=>n.dataset.marginNote===mark.dataset.annotationNote);if(card){card.scrollIntoView({block:'nearest',behavior:'smooth'});card.classList.add('note-highlight');setTimeout(()=>card.classList.remove('note-highlight'),2000)}});

function renderMarginNotes(){document.querySelectorAll('.margin-notes').forEach(n=>n.remove());for(const article of document.querySelectorAll('.paper')){article.style.minHeight='';const rows=paperNotes(article.id);article.classList.toggle('has-margin-notes',rows.length>0);if(!rows.length)continue;const aside=document.createElement('aside');aside.className='margin-notes';aside.setAttribute('aria-label','论文批注');aside.innerHTML=rows.map(n=>`<section class="margin-note" data-margin-note="${esc(n.id)}">${n.publishedBy?`<div class="margin-note-author">${esc(n.publishedBy)}</div>`:''}<p class="margin-note-text">${renderNoteBody(n)}</p><div class="margin-note-actions">${n.quote?`<button type="button" data-margin-jump="${esc(n.id)}">原文</button>`:''}${isLocalNote(article.id,n.id)?`<button type="button" data-margin-edit="${esc(n.id)}">编辑</button><button type="button" data-margin-delete="${esc(n.id)}">删除</button>`:''}</div></section>`).join('');article.append(aside);if(innerWidth<=980)continue;const body=article.querySelector('.paper-body'),articleRect=article.getBoundingClientRect(),bodyRect=body.getBoundingClientRect();aside.style.left=(bodyRect.right-articleRect.left+24)+'px';const cards=[...aside.children].map(card=>{const mark=[...article.querySelectorAll('.annotation-mark')].find(m=>m.dataset.annotationNote===card.dataset.marginNote);const y=(mark||article.querySelector('.paper-head')).getBoundingClientRect().top-articleRect.top;return {card,y}}).sort((a,b)=>a.y-b.y);let bottom=0;for(const {card,y} of cards){const top=Math.max(40,y,bottom?bottom+16:0);card.style.top=top+'px';bottom=top+card.getBoundingClientRect().height}aside.style.height=bottom+'px';if(bottom+48>article.getBoundingClientRect().height)article.style.minHeight=(bottom+48)+'px'}}
let marginLayoutTimer;function scheduleMarginLayout(){clearTimeout(marginLayoutTimer);marginLayoutTimer=setTimeout(renderMarginNotes,80)}
window.addEventListener('resize',scheduleMarginLayout);
document.addEventListener('load',e=>{if(e.target.matches?.('.paper img'))scheduleMarginLayout()},true);
document.fonts.ready.then(scheduleMarginLayout);
document.fonts.addEventListener('loadingdone',scheduleMarginLayout);
document.addEventListener('click',e=>{const b=e.target.closest('[data-margin-edit],[data-margin-delete],[data-margin-jump]');if(!b)return;const article=b.closest('.paper'),id=b.dataset.marginEdit||b.dataset.marginDelete||b.dataset.marginJump,n=paperNotes(article.id).find(n=>n.id===id);if(!n)return;if(b.hasAttribute('data-margin-delete')){if(n.shared)hidePublishedNote(id);if(persistNotes({...annotations,[article.id]:localPaperNotes(article.id).filter(n=>n.id!==id)})){if(noteDrafts[article.id]?.editingId===id)delete noteDrafts[article.id];if(notePaperId===article.id){if(noteEditingId===id)clearNoteForm();}}return}if(b.hasAttribute('data-margin-edit')){openNotes(article.id,null,b);fillNoteForm({...n,editingId:n.id});noteText.focus();return}const marks=[...article.querySelectorAll('.annotation-mark')].filter(m=>m.dataset.annotationNote===id);if(marks.length)marks[0].scrollIntoView({block:'center',behavior:'smooth'})});

const NOTE_SIZES=[14,16,18,20,24,28];
function noteColor(value){return typeof value==='string'&&/^(#[0-9a-f]{3,8}|rgba?\([\d.,%\s]+\)|[a-z]+)$/i.test(value)&&CSS.supports('color',value)?value:null}
function renderNoteBody(note){if(!Array.isArray(note.runs))return esc(note.body||'');return note.runs.map(run=>{if(!run||typeof run.text!=='string')return '';const styles=[];if(run.bold===true)styles.push('font-weight:700');if(run.underline===true)styles.push('text-decoration:underline');const color=noteColor(run.color);if(color)styles.push('color:'+color);if(NOTE_SIZES.includes(run.size))styles.push('font-size:'+run.size+'px');return `<span${styles.length?` style="${esc(styles.join(';'))}"`:''}>${esc(run.text)}</span>`}).join('')}
function readNoteRuns(){const runs=[];function add(text,style){if(!text)return;const last=runs.at(-1);if(last&&last.bold===style.bold&&last.underline===style.underline&&last.color===style.color&&last.size===style.size)last.text+=text;else runs.push({text,...style})}function walk(node,parent){if(node.nodeType===Node.TEXT_NODE){add(node.nodeValue,parent);return}if(node.nodeType!==Node.ELEMENT_NODE||['SCRIPT','STYLE','IFRAME','OBJECT','IMG'].includes(node.tagName))return;if(node.tagName==='BR'){add('\n',parent);return}const style={...parent},weight=node.style.fontWeight;if(['B','STRONG'].includes(node.tagName))style.bold=true;if(weight)style.bold=weight==='bold'||Number(weight)>=600;if(node.tagName==='U'||node.style.textDecoration.includes('underline'))style.underline=true;const color=noteColor(node.style.color||node.getAttribute('color'));if(color)style.color=color;const size=parseInt(node.style.fontSize,10);if(NOTE_SIZES.includes(size))style.size=size;const block=['DIV','P','LI'].includes(node.tagName);if(block&&runs.length&&!runs.at(-1).text.endsWith('\n'))add('\n',parent);for(const child of node.childNodes)walk(child,style);if(block&&!runs.at(-1)?.text.endsWith('\n'))add('\n',parent)}for(const child of noteText.childNodes)walk(child,{bold:false,underline:false,color:'#282b29',size:16});while(runs.length){runs[0].text=runs[0].text.replace(/^\s+/,'');if(runs[0].text)break;runs.shift()}while(runs.length){runs.at(-1).text=runs.at(-1).text.replace(/\s+$/,'');if(runs.at(-1).text)break;runs.pop()}return runs}
let noteEditorRange=null;
function rememberNoteSelection(){const s=getSelection();if(s?.rangeCount&&noteText.contains(s.anchorNode)&&noteText.contains(s.focusNode))noteEditorRange=s.getRangeAt(0).cloneRange()}
function restoreNoteSelection(){noteText.focus();const s=getSelection();s.removeAllRanges();if(noteEditorRange&&noteText.contains(noteEditorRange.commonAncestorContainer))s.addRange(noteEditorRange);else{const r=document.createRange();r.selectNodeContents(noteText);r.collapse(false);s.addRange(r)}}
function syncNoteToolbar(){rememberNoteSelection();document.querySelector('#note-bold').setAttribute('aria-pressed',String(document.queryCommandState('bold')));document.querySelector('#note-underline').setAttribute('aria-pressed',String(document.queryCommandState('underline')))}
function formatNote(command,value){restoreNoteSelection();document.execCommand(command,false,value);if(command==='fontSize'){noteText.querySelectorAll('font[size="7"]').forEach(font=>{font.style.fontSize=document.querySelector('#note-size').value+'px';font.removeAttribute('size')})}rememberNoteSelection();syncNoteToolbar()}
for(const [id,command] of [['note-bold','bold'],['note-underline','underline']]){const b=document.getElementById(id);b.onmousedown=e=>e.preventDefault();b.onclick=()=>formatNote(command)}
document.querySelector('#note-color').addEventListener('pointerdown',rememberNoteSelection);
document.querySelector('#note-color').addEventListener('change',e=>formatNote('foreColor',e.target.value));
document.querySelector('#note-size').addEventListener('pointerdown',rememberNoteSelection);
document.querySelector('#note-size').addEventListener('change',()=>formatNote('fontSize','7'));
noteText.addEventListener('keyup',syncNoteToolbar);noteText.addEventListener('mouseup',syncNoteToolbar);
document.addEventListener('selectionchange',rememberNoteSelection);
noteText.addEventListener('input',scheduleMarginLayout);
noteText.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
noteText.addEventListener('drop',e=>{e.preventDefault();document.execCommand('insertText',false,e.dataTransfer.getData('text/plain'))});

document.querySelector('#export-notes').onclick=()=>{const data={version:2,annotations},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='论文批注.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

const SHARED_NOTES_REPO='robinzwbqaq/cao-juan-research-2025-2026';
const SHARED_NOTES_TITLE='[论文批注] 共享阅读笔记';
const SHARED_NOTES_MARKER='CAO_READER_NOTES_V2';
const SHARED_CACHE_KEY='cao-juan-shared-notes-cache-v1';
const HIDDEN_SHARED_KEY='cao-juan-hidden-shared-notes-v1';
let sharedAnnotations={},hiddenSharedNotes=new Set(),sharedNotesLoading=false,lastSharedNotesFetch=0;
try{sharedAnnotations=JSON.parse(localStorage.getItem(SHARED_CACHE_KEY)||'{}')||{}}catch{}
try{hiddenSharedNotes=new Set(JSON.parse(localStorage.getItem(HIDDEN_SHARED_KEY)||'[]'))}catch{}
function hidePublishedNote(id){hiddenSharedNotes.add(id);localStorage.setItem(HIDDEN_SHARED_KEY,JSON.stringify([...hiddenSharedNotes]))}
function isLocalNote(paperId,id){return localPaperNotes(paperId).some(n=>n.id===id)}
async function packSharedNotes(data){const raw=new TextEncoder().encode(JSON.stringify(data)),gzip=typeof CompressionStream==='function',bytes=gzip?new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()):raw;let binary='';for(let i=0;i<bytes.length;i+=4096)binary+=String.fromCharCode(...bytes.subarray(i,i+4096));return (gzip?'gzip:':'plain:')+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpackSharedNotes(text){const [format,payload]=text.split(':'),binary=atob(payload.replace(/-/g,'+').replace(/_/g,'/')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)),raw=format==='gzip'?await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(bytes);return JSON.parse(raw)}
function sharedNoteRows(data,author){const valid={};for(const p of papers){const rows=data?.annotations?.[p.id];if(!Array.isArray(rows))continue;valid[p.id]=rows.filter(n=>n&&typeof n.id==='string'&&typeof n.body==='string'&&typeof n.quote==='string').map(n=>({...n,shared:true,publishedBy:author}))}return valid}
async function refreshSharedNotes(manual=false){if(sharedNotesLoading)return;sharedNotesLoading=true;lastSharedNotesFetch=Date.now();const button=document.querySelector('#refresh-shared-notes');button.disabled=true;const collected={},authors=new Set();try{let url=`https://api.github.com/repos/${SHARED_NOTES_REPO}/issues?state=all&sort=created&direction=desc&per_page=100`;while(url){const response=await fetch(url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('GitHub '+response.status);const rows=await response.json();for(const issue of rows){if(issue.pull_request||issue.title!==SHARED_NOTES_TITLE||authors.has(issue.user.login))continue;const match=issue.body?.match(/<!-- CAO_READER_NOTES_V2:((?:gzip|plain):[A-Za-z0-9_-]+) -->/);if(!match)continue;try{const data=await unpackSharedNotes(match[1]);authors.add(issue.user.login);if(issue.state==='closed')continue;for(const [id,notes]of Object.entries(sharedNoteRows(data,issue.user.login)))collected[id]=[...(collected[id]||[]),...notes]}catch{}}const link=response.headers.get('Link');url=link?.match(/<([^>]+)>; rel="next"/)?.[1]||null}sharedAnnotations=collected;try{localStorage.setItem(SHARED_CACHE_KEY,JSON.stringify(collected))}catch{}updateNoteButtons();applyAnnotationHighlights();button.textContent='刷新共享批注';if(manual)document.querySelector('#share-notes-status').textContent='共享批注已更新'}catch{button.textContent='重试共享批注';if(manual)document.querySelector('#share-notes-status').textContent='暂时无法读取 GitHub，请稍后重试。'}finally{sharedNotesLoading=false;button.disabled=false}}
const publishDialog=document.querySelector('#publish-notes-dialog');
document.querySelector('#publish-notes').onclick=async()=>{const local=Object.fromEntries(papers.map(p=>[p.id,localPaperNotes(p.id)]).filter(([,rows])=>rows.length)),count=Object.values(local).reduce((n,rows)=>n+rows.length,0);publishDialog.showModal();document.querySelector('#publish-notes-count').textContent=`本次发布 ${count} 条批注。`;document.querySelector('#publish-github-link').hidden=true;document.querySelector('#copy-publish-notes').hidden=true;document.querySelector('#publish-notes-status').textContent='正在准备…';try{const packed=await packSharedNotes({version:2,annotations:local});const readable=Object.entries(local).map(([id,rows])=>'### '+papers.find(p=>p.id===id).chinese_title+'\n\n'+rows.map(n=>n.body).join('\n\n')).join('\n\n');const body=readable+`\n\n<!-- ${SHARED_NOTES_MARKER}:${packed} -->`;publishDialog.dataset.body=body;const url=`https://github.com/${SHARED_NOTES_REPO}/issues/new?title=${encodeURIComponent(SHARED_NOTES_TITLE)}&body=${encodeURIComponent(body)}`;const link=document.querySelector('#publish-github-link'),copy=document.querySelector('#copy-publish-notes');if(url.length<=7500){link.href=url;document.querySelector('#publish-notes-status').textContent='在 GitHub 页面提交后，所有访客都能看到。'}else{link.href=`https://github.com/${SHARED_NOTES_REPO}/issues/new?title=${encodeURIComponent(SHARED_NOTES_TITLE)}`;copy.hidden=false;document.querySelector('#publish-notes-status').textContent='先复制批注内容，再到 GitHub 粘贴并提交。'}link.hidden=false}catch{document.querySelector('#publish-notes-status').textContent='未能准备发布内容，请先导出批注备份。'}};
document.querySelector('#copy-publish-notes').onclick=async()=>{try{await navigator.clipboard.writeText(publishDialog.dataset.body);document.querySelector('#publish-notes-status').textContent='已复制，请到 GitHub 粘贴并提交。'}catch{document.querySelector('#publish-payload').value=publishDialog.dataset.body;document.querySelector('#publish-payload').hidden=false;document.querySelector('#publish-payload').select();document.querySelector('#publish-notes-status').textContent='请复制下方内容，到 GitHub 粘贴并提交。'}};
document.querySelector('#close-publish-notes').onclick=()=>publishDialog.close();
document.querySelector('#refresh-shared-notes').onclick=()=>refreshSharedNotes(true);
window.addEventListener('focus',()=>{if(Date.now()-lastSharedNotesFetch>15000)refreshSharedNotes()});
setTimeout(()=>refreshSharedNotes(),0);

updateNoteButtons();

const themes=['虚假信息与新闻理解','大模型可信与安全','可控视频生成','图像编辑与生成评估','高效模型与鲁棒学习'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=x=>Array.isArray(x)?x.join('；'):typeof x==='object'&&x?Object.entries(x).map(([k,v])=>k+'：'+plain(v)).join('；'):String(x??'');
const para=x=>esc(plain(x)).replace(/\n/g,'<br>');
const paragraphs=x=>String(x||'').split(/\n\s*\n/).filter(Boolean).map(t=>`<p>${para(t)}</p>`).join('');
const safeURL=x=>/^https?:\/\//.test(x||'')?esc(x):'#';
themes.forEach(name=>{document.querySelector('#side-themes').insertAdjacentHTML('beforeend',`<a href="#library" data-theme="${name}">${name}</a>`);document.querySelector('#category').insertAdjacentHTML('beforeend',`<option>${name}</option>`)});
function figureGroup(p,placement){return p.figures.filter(f=>f.placement===placement&&f.src!==p.experiment.src).map(f=>`<figure><img loading="lazy" src="${esc(f.src)}" alt="${esc(f.caption)}" data-zoom><figcaption><p class="original-caption" lang="en">${para(f.original_caption)}</p><p class="caption-explanation">${para(f.caption)}</p></figcaption></figure>`).join('')}
function card(p){const pub=p.publication;return `<article class="paper" id="${p.id}"><header class="paper-head"><div class="tags"><span>${esc(p.year)}</span><span>${esc(p.theme)}</span></div><h3>${esc(p.chinese_title||p.title)} <span class="novelty" aria-label="${esc('新颖性 '+p.novelty.score+' 星，满分 5 星；整理者评估')}"><span class="novelty-label">新颖性</span> ${'★'.repeat(p.novelty.score)}${'☆'.repeat(5-p.novelty.score)}</span></h3><div class="fine-tags" aria-label="论文标签">${p.fine_tags.map(t=>`<button type="button" class="paper-tag" data-tag="${esc(t)}" aria-pressed="${activeTag===t}">${esc(t)}</button>`).join('')}<button type="button" class="annotation-open" data-annotate="${p.id}">${paperNotes(p.id).length?'批注 '+paperNotes(p.id).length:'写批注'}</button></div><div class="publication"><span class="venue">${esc(pub.venue)}</span><span class="date">${esc(pub.date)}</span>${pub.preprint_date&&!pub.date_label.includes('首发')?`<span class="date">arXiv ${esc(pub.preprint_date)}</span>`:''}</div><div class="english" lang="en">${esc(p.title)}</div><div class="authors">${esc(plain(p.authors))}${p.author_affiliation?` · ${esc(p.author_affiliation)}`:''}</div></header><div class="paper-body"><p>${para(p.motivation)}</p><p>${para(p.context)}</p>${figureGroup(p,'intro')}<h4>${esc(p.basis_title)}</h4><p>${para(p.analysis)}</p><p>${para(p.rationale)}</p>${figureGroup(p,'basis')}<section class="method-framework" aria-labelledby="${p.id}-method"><h4 id="${p.id}-method">方法框架</h4><p class="method-title">${esc(p.method_title)}</p><div class="framework-io"><p><strong>输入</strong>${para(p.method_input)}</p><p><strong>输出</strong>${para(p.method_output)}</p></div><p>${para(p.connection)}</p>${figureGroup(p,'method')}<div class="architecture">${p.architecture.map((b,i)=>`<section class="module"><h5>${esc(b.name)}</h5><div class="flow">${esc(b.flow)}</div>${paragraphs(b.operation)}${figureGroup(p,'module-'+i)}</section>`).join('')}</div>${figureGroup(p,'detail')}</section><section class="experiment-results"><h4>实验结果</h4><p class="results">${para(p.experiment.summary)}</p><figure class="main-experiment"><img loading="lazy" src="${esc(p.experiment.src)}" alt="${esc(p.experiment.caption)}" data-zoom><figcaption>${p.experiment.original_caption?`<p class="original-caption" lang="en">${para(p.experiment.original_caption)}</p>`:''}<p class="caption-explanation">${para(p.experiment.caption)}</p></figcaption></figure>${figureGroup(p,'evidence')}</section>${p.limitations?`<div class="limitations"><strong>适用范围与局限</strong>　${para(p.limitations)}</div>`:''}<div class="sources"><a class="paper-link" href="${safeURL(p.paper_url)}" target="_blank" rel="noopener">论文原文 ↗</a>${p.code_url?`<a class="code-link" href="${safeURL(p.code_url)}" target="_blank" rel="noopener">代码 ↗</a>`:''}</div></div></article>`}

let activeTag='';
function compareNewest(a,b){return b.sort_date.localeCompare(a.sort_date)||a.id.localeCompare(b.id)}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),y=document.querySelector('#year').value,c=document.querySelector('#category').value;const rows=papers.filter(p=>(!activeTag||p.fine_tags.includes(activeTag))&&(!y||String(p.year)===y)&&(!c||p.theme===c)&&(!q||JSON.stringify(p).toLowerCase().includes(q))).sort(compareNewest);document.querySelector('#papers').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">未找到匹配的论文。</div>';applyAnnotationHighlights();document.querySelector('#status').textContent=q||y||c||activeTag?`${rows.length} 篇${c?' · '+c:''}${y?' · '+y+' 年':''}${activeTag?' · 标签：'+activeTag:''}`:''}
['search','year','category'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.querySelector('#reset').onclick=()=>{activeTag='';['search','year','category'].forEach(id=>document.getElementById(id).value='');render()};
document.addEventListener('click',e=>{const tag=e.target.closest('[data-tag]');if(tag){activeTag=activeTag===tag.dataset.tag?'':tag.dataset.tag;render();document.querySelector('#library').scrollIntoView();return}const t=e.target.closest('[data-theme],[data-year],[data-reset]');if(t){document.querySelector('#reset').click();if(t.dataset.theme)document.querySelector('#category').value=t.dataset.theme;if(t.dataset.year)document.querySelector('#year').value=t.dataset.year;render();document.querySelector('#library').scrollIntoView()}if(e.target.matches('[data-zoom]')){const d=document.querySelector('#lightbox');d.querySelector('img').src=e.target.src;d.querySelector('img').alt=e.target.alt;d.showModal()}});document.querySelector('#close-lightbox').onclick=()=>document.querySelector('#lightbox').close();document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});
render();function openHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('paper-'))return;let p=document.getElementById(id);if(!p){document.querySelector('#reset').click();p=document.getElementById(id)}if(p)requestAnimationFrame(()=>p.scrollIntoView())}window.addEventListener('hashchange',openHash);openHash();
</script></body></html>
