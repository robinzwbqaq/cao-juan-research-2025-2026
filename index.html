<script id="paper-data" type="application/json">[{"id": "paper-01", "title": "Who Does What and Where to Go: Orthogonal Alignment and Hierarchical Planning for Multi-entity Trajectories", "chinese_title": "多实体三维轨迹生成：身份动作绑定与分层空间规划", "year": "2026", "theme": "可控视频生成", "authors": "Z Wan, Y Li, T Huang, J Cao, S Tang", "publication": {"venue": "ECCV 2026", "date_label": "在线发表", "date": "2026-09-15"}, "motivation": "想让一段视频里“猫向左跑、狗向右跳”，光把画面做漂亮还不够：猫和狗不能做反对方的动作，也不能在移动时撞在一起。直接生成整段视频，很难单独控制这些问题。这篇论文先给每个角色安排三维运动路线，再把路线交给视频模型，让“谁做什么”和“往哪里走”都能被明确检查。", "context": "论文输出的核心不是一段成片，而是每个实体随时间变化的三维位置。这样可以分别检查两件事：角色有没有执行指定动作，以及轨迹是否发生碰撞。后续视频模型再把这份结构条件转成画面，因而轨迹质量与最终画质不是同一个评价目标。", "analysis": "难点分成两层：一是不能把角色、动作和方向配错；二是要看清三维空间里哪里能走，避免角色相撞。二维画面中看似错开的物体，在前后方向上仍可能碰到。若把所有信息直接转换成运动坐标，就很难分别纠正动作分配和空间规划中的错误。", "rationale": "作者先为每个角色分别提取身份和动作信息，再把它们组合成该角色的动作条件。训练时约束不同角色的条件不要过于相似，减少动作被分给错误对象的情况。空间方面，则根据深度建立俯视图，告诉轨迹模型哪些位置被占用、哪些区域可以移动。具体的特征组合与正交约束见下面的身份—动作绑定模块。", "basis_title": "先分清动作归属，再处理空间约束", "method_title": "从实体表示到三维轨迹", "method_input": "参考画面，以及逐个描述实体动作的文字指令。", "method_output": "每个实体在连续各帧中的三维坐标序列，可进一步作为视频生成条件。", "result_title": "轨迹条件能为视频带来什么", "connection": "流程先读取参考帧和文字，为每个角色形成独立的动作条件；再根据深度建立场景俯视图；最后用两类条件指导轨迹生成。身份分支负责“是谁”，动作分支负责“做什么”，俯视图负责“哪里能走”，三者在生成运动路线时汇合。", "architecture": [{"name": "实体拆分", "flow": "参考帧、逐实体动作描述 → 身份特征与运动特征", "operation": "先建立逐实体的输入表示。分割参考帧得到身份掩码，单独编码每个主体；再把文本拆成以动作为中心的描述，提取对应运动特征，避免整张图和整句话压成一个混合向量。\n\n画面与文字分别处理：图像一侧用分割掩码取出各个实体，再编码它的外观；文字一侧用 LLM 拆出以动词为中心的动作描述，再交给运动编码器。以猫和狗为例，模型先得到两份身份表示和各自的动作表示，随后才能一一绑定，而不是让一个全局向量同时负责所有角色。"}, {"name": "StructVLA：身份—动作绑定", "flow": "身份特征、运动特征 → 可区分的实体意图表示", "operation": "StructVLA 先把身份与动作信息组合起来，再限制不同角色的动作条件过于相似。它区分的是每个角色收到的动作指令，因此仍允许两个角色朝同一方向移动。\n\n身份向量与动作向量先做外积，即将两者各分量两两相乘组成矩阵，把身份与动作的组合显式保留下来，再投影成一个实体意图向量。训练时比较不同实体意图的余弦相似度，惩罚它们过于接近。这样区分的是“猫的动作条件”和“狗的动作条件”；两只动物依然可以沿同一方向移动，因为约束施加在表示上，而非坐标上。"}, {"name": "几何感知俯视图", "flow": "场景深度 → 占据与可通行区域", "operation": "根据深度把场景转换成从上往下看的网格图，称为鸟瞰图（BEV）。图中标出占用位置与边界，为多个角色的运动规划提供共同参照。\n\n深度值与相机内参先把画面像素反投影到三维，每个点同时携带对应的视觉特征。接着沿高度方向池化，将点云压到俯视的 X–Z 平面，得到 BEV 网格。它提供相对占据、空闲区域和实体边界，帮助区分屏幕上重叠、实际却前后分开的区域；这一步使用的是粗空间先验，不依赖完全精确的测距。"}, {"name": "渐进轨迹去噪", "flow": "实体意图、BEV → 连续三维轨迹", "operation": "扩散模型在语义与几何条件下逐步恢复各实体的位置序列。\n\nDiT 从带噪声的三维位置序列出发，在每轮去噪中同时读取实体意图和 BEV 条件。前者说明动作属于谁，后者限制动作发生的空间，两类条件共同作用于同一组轨迹。最终输出按实体、时间和三维坐标组织，因而能够单独检查角色是否互换、路线是否交叉，再用于后续视频合成。"}], "findings": "在 Stepwise-ME 合成多实体数据上验证动作归属与空间一致性。补充实验平均碰撞率为 7.3%；对比独立生成再合并的轨迹更少发生碰撞。", "limitations": "与部分单实体方法的比较采用独立生成后聚合协议；数据主要来自合成环境，仍会发生碰撞，不能解释为严格物理安全保证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-01-fig-01.webp", "original_caption": "Fig. 1: Qualitative comparison between end-to-end baselines and our ProgTraj-Director. End-to-end baselines suffer from inter-entity collisions (penetra- tion) and motion binding confusion. In contrast, our hierarchical decoupled framework achieves physics-consistent, collision-free trajectories with precise entity-motion binding via geometry-aware spatial planning.", "placement": "intro", "caption": "图中把角色动作绑定错误和空间碰撞放在一起比较。前者是把某个动作交给了错误对象，后者是轨迹位置冲突；两个错误可能同时出现，因此不能只检查视频整体是否流畅。"}, {"number": 2, "page": 5, "src": "figures/paper-01-fig-02.webp", "original_caption": "Fig. 2: Empirical analysis of semantic entanglement and static bias. (a) Radar charts show a “static bias” where CLIP variants favor static content words over dynamic motion verbs. (b) Relational tests reveal a role binding collapse when swapping entity roles (e.g., Cat ↔Dog). (c) Attention heatmaps visualize the resulting semantic leakage and attribute misbinding.", "placement": "basis", "caption": "作者分析视觉语言模型对静态内容词和动态动作词的响应差异，以及角色关系绑定问题。这是 StructVLA 拆开身份与动作的经验依据，不是先假定分支越多就越有效。"}, {"number": 3, "page": 6, "src": "figures/paper-01-fig-03.webp", "original_caption": "Fig. 3: The semantic-physical gap and geometric uncertainty. (a-b) Depth (Z-axis) ambiguity results in physical collisions despite plausible 2D projections. (c) Statistical analysis shows that geometric errors and inter-entity collision rates accumulate exponentially over longer sequences due to the lack of explicit spatial priors.", "placement": "basis", "caption": "二维投影里位置合理，三维深度上仍可能相撞。俯视表示把原来在画面中不明显的前后关系转成空间占据关系，说明为什么只有文本与二维外观还不够。"}, {"number": 4, "page": 6, "src": "figures/paper-01-fig-04.webp", "original_caption": "Fig. 4: Overview of the ProgTraj-Director framework. Our model integrates a StructVLA module for identity-action decoupling and a hierarchical spatial planning mechanism guided by Geometry-Aware BEV priors.", "placement": "method", "caption": "总图先看左侧的身份掩码和动作解析，再看中间的实体绑定；另一条路径从深度生成 BEV，两条路径共同进入右侧轨迹去噪模型。输出是各实体的连续三维轨迹。"}, {"number": 9, "page": 14, "src": "figures/paper-01-fig-09.webp", "original_caption": "Fig. 9: Trajectory-guided versus text-only multi-entity video generation. Without 3D priors (Bottom), text-only generation suffers from tangled trajectories, missing spatial coordination, and entity merging. With 3D trajectory control (Top), ProgTraj-Director provides geometric guidance that improves entity separation and physical plausibility.", "placement": "evidence", "caption": "图中比较使用三维轨迹条件与只用文字的视频生成。它展示这项工作和下游视频合成的关系：先改善运动结构，再观察视频中实体纠缠、合并等问题是否减轻。"}], "paper_url": "https://link.springer.com/chapter/10.1007/978-3-032-37029-7_34", "code_url": "https://github.com/wzbos-token/Who-Does-What-and-Where-to-Go", "sort_date": "2026-09-15", "experiment": {"summary": "在 DataDop 单实体和 Stepwise-ME 多实体设置中比较轨迹生成。Stepwise-ME 上轨迹 F1 为 0.875、碰撞率为 7.3%，均优于表中多实体对比项；结果同时检查动作归属和空间合理性。", "caption": "上半部分是单实体，下半部分是多实体，需在相同数据集内比较。F1、CLIP、覆盖度越高越好，FID 和碰撞率越低越好。", "src": "figures/paper-01-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["多实体轨迹", "身份—动作对齐", "几何先验", "扩散模型"]}, {"id": "paper-03", "title": "Multi-Tool Image Editing Attribution in Facial Forgery", "chinese_title": "多工具人脸编辑归因：追查连续编辑中的参与工具", "year": "2026", "theme": "大模型可信与安全", "authors": "S Liu, Q Sheng, D Wang, Y Li, C Zhou, J Cao", "publication": {"venue": "ACM Multimedia 2026", "date_label": "arXiv 首发", "date": "2026-09-02", "preprint_date": "2026-09-02", "arxiv_id": "2609.02751"}, "motivation": "一张人脸照片可以先换脸，再化妆、磨皮。只问“它用哪一种工具做的”，可能只认出最后一次修图，漏掉前面的操作。这篇论文想找出所有参与编辑的工具。困难是后一步会遮盖前一步的痕迹，所以不能把它当成只选一个答案的普通分类题。", "context": "这里的“归因”不是判断照片真假，也不是寻找唯一生成模型。只要某种工具参与过，就应被标出来。例如换脸之后又化妆，正确答案应同时包含两类工具；后一步把前一步痕迹盖住，正是任务的困难所在。", "analysis": "连续编辑会覆盖先前痕迹，不同工具的线索也可能出现在不同位置。只看整张脸的内容，容易忽略细微修改；只看局部外观，又可能漏掉纹理变化频率中的异常。因此，作者同时研究局部图块的外观和频率特征，并用真实的多步骤编辑过程构造训练数据。", "rationale": "作者认为，后续编辑覆盖先前痕迹，是单工具归因容易失效的重要原因。方法从局部图块的外观与频率特征中提取证据，对每种工具分别预测“参与或未参与”。训练时根据不同编辑组合上的错误率调整抽样，让模型逐步学习更难的多步编辑样本。", "basis_title": "连续编辑为什么会让归因更难", "method_title": "局部痕迹怎样汇成工具集合", "method_input": "经过一次或多次工具处理的最终人脸图像。", "method_output": "每个候选编辑工具参与处理的概率；预测的是工具集合，不预测操作先后顺序。", "result_title": "模型看的是哪些编辑区域", "connection": "训练数据先提供每张图参与过哪些工具的标签，检测网络再从最终人脸图中提取证据。图块特征增强负责突出有用的局部线索，课程学习负责安排训练难度。预测时只需最终图像，无需重放编辑过程。", "architecture": [{"name": "MultiEdit：多步编辑数据", "flow": "源人像、六类编辑工具 → 带多标签的编辑链样本", "operation": "构建 MultiEdit 数据集，从 200 张源人像出发组合六类工具，生成约 51 万张、最多五步的编辑结果，并为每张图保留参与工具的集合标签。\n\n每执行一步编辑，都保留当前结果以及累计参与工具的标签，因而同一张图可以同时属于换脸、化妆等多个类别。随着步骤增加，后续操作可能覆盖先前痕迹，数据由此呈现取证中真正困难的混合效果。数据集负责提供这样的训练目标，实际部署时检测器只接收最终图像，不需要拿到中间版本。"}, {"name": "DPEC：双域补丁证据", "flow": "最终人脸图 → 增强后的局部取证特征", "operation": "DPEC 一路读取局部图块的外观，另一路读取图块中不同频率的变化，再让两路信息互相补充。它还会增强更有区分力的图块，减少与工具识别无关的人脸内容影响。\n\n频率分支先对滑动窗口内的图块做离散余弦变换（DCT），空间分支则读取原图。两路分别提取特征并加入位置编码，然后双向交叉注意：空间特征查询频率证据，频率特征也反过来查询空间证据。两次更新都保留残差，输出再融合送往分类器，因此局部区域的位置、纹理与频率痕迹能够在同一预测中配合。"}, {"name": "错误驱动课程与多标签预测", "flow": "双域特征、当前学习难点 → 参与工具集合", "operation": "采用按错误调整的课程学习安排训练难度，让模型逐渐适应更复杂的编辑组合，最终同时输出多个工具是否参与，而非把它们当成互斥类别。\n\n训练集按编辑步数分成子集，每轮结束后分别计算各子集的验证错误率，再更新下一轮的采样权重。自步学习参数随训练推进变化，让模型逐渐纳入更难的多步组合，而不是始终按固定比例抽样。最终分类头给每个工具一个独立概率，因此“工具 A 参与”不会排除“工具 B 也参与”。"}], "findings": "在六类工具的组合测试中，平均严格准确率为 92.93%，五步编辑时为 87.40%。严格准确率要求整组工具全部预测正确。", "limitations": "只覆盖人脸与六种工具；换脸仅放第一步。识别工具集合不等于恢复先后顺序；源人像仅 200 张。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-03-fig-01.webp", "original_caption": "Figure 1: Multi-Tool Image Editing and Attribution. A polished portrait often undergoes multiple editing operations from different tools, and the whole editing process remains unseen and undisclosed. Existing single-tool attribution methods focus on extracting specific features produced by a single tool, which, to their best, only produces an incomplete prediction. In this paper, we explore how to build a multi-tool attributor that can identify all involved tools in the image editing process from a given edited result image.", "placement": "intro", "caption": "图中对照单工具与多工具归因：观察者只能看到最终人像，看不到实际编辑过程。新任务需要找出多个参与者，因此输出应是一个集合。"}, {"number": 3, "page": 8, "src": "figures/paper-03-fig-03.webp", "original_caption": "Figure 3: Ridge graph of the spatial and frequency domains among editing tools. We analyze the spatial and frequency domain differences between the images before and after editing by specific tools on different facial regions. In the spatial domain, CSD-MT, SHMT, and DeepFake show similar distributions, while totally differing in the frequency domain. Likewise, the distributions of OpenCV and FLUX are similar in the frequency domain while varying in the spatial domain.", "placement": "basis", "caption": "图按面部区域比较不同工具在空间域与频率域的变化分布。不同工具的可辨线索不完全相同，这为同时使用双域、局部补丁提供了原文依据。"}, {"number": 6, "page": 10, "src": "figures/paper-03-fig-06.webp", "original_caption": "Figure 6: Overview of DPEC. DPEC consists of a) Patchwise Feature Enhancement (PFE) module and b) Error-based Curriculum Learning (ECL) module. PFE applies Slide Window DCT and a patchwise cross-attention to capture distinguishable, locality-aware features in both spatial and frequency domains. ECL adjusts data sampling weights of each subset of different difficulties during training based on error rate feedback, enabling the model to learn progressively from simple to hard samples. Based on the fused feature, a multi-label classifier finally predicts which tools in the candidates manipulated the given edited image IS.", "placement": "method", "caption": "DPEC 包括补丁级特征增强 PFE 和基于错误的课程学习 ECL。滑窗 DCT 与补丁交叉注意力用于提取、强调局部证据；ECL 另外调整训练的难易安排。"}, {"number": 8, "page": 15, "src": "figures/paper-03-fig-08.webp", "original_caption": "Figure 8: Decisive ROI Visualization for Different Editing Tools. The red-highlighted regions indicate the areas that DPEC focuses on when attributing each tool. a) Original images; b) Multi-tool edited images; c)-g) Grad-CAM heatmaps for different editing tools. Editing targets are marked with colored boxes for clarity.", "placement": "evidence", "caption": "热图显示模型为不同工具关注的区域。它能帮助检查预测是否依赖局部编辑线索，但热图本身不等于恢复了编辑顺序，也不构成工具参与的独立证明。"}], "paper_url": "https://arxiv.org/abs/2609.02751", "code_url": "https://github.com/ICTMCG/MIEA", "sort_date": "2026-09-02", "experiment": {"summary": "在 MultiEdit 的一至五步编辑上评估工具集合归因。DPEC 平均严格准确率为 92.93%，五步编辑时仍为 87.40%；说明编辑链变长后，方法仍能保留较多先前工具的证据。", "caption": "Acc-S 要求整组工具全部预测正确，Acc-T 则逐工具计分。优先看各编辑步数的 Acc-S 和最后的平均值，两项均越高越好。", "src": "figures/paper-03-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["多工具归因", "人脸取证", "空间—频率融合", "多标签学习", "课程学习"]}, {"id": "paper-06", "title": "AgentHOI: Multi-Agent Reasoning for Human-Object-Interaction Video Generation via Implicit Representation Alignment", "chinese_title": "AgentHOI：以多角色推理驱动人—物交互视频", "year": "2026", "theme": "可控视频生成", "authors": "Z Huang, S Li, J Cao, C Li, Y Zhang, Z Zhou, C Wang, Y Zhou, Q Lu, ...", "publication": {"venue": "arXiv:2607.22241", "date_label": "预印本首发", "date": "2026-07-24", "preprint_date": "2026-07-24", "arxiv_id": "2607.22241"}, "motivation": "给模型一张人物图、一张杯子图，再说“把杯子拿起来”，它仍要解决一连串问题：杯子在哪里、哪只手能拿、手什么时候碰到杯子。让用户自己准备完整动作骨架又太麻烦。这篇论文让多个负责不同工作的智能体先商量动作步骤，再交给视频模型执行，减少对用户提供精细动作的依赖。", "context": "用户只给两张参考图时，人物和物体还没有共同场景，甚至可能姿态不适配。系统不能直接假定人物已经拿着物体，而要先看清现有姿态、手是否空闲，再按文字要求安排接近、抓取和移动等动作关系。", "analysis": "把动作计划写清楚，还不等于视频模型能执行。例如计划写着“先伸手，再握住杯子”，生成时仍可能出现手没碰到杯子、杯子却已经移动的问题。论文一方面生成可检查的文字计划，另一方面在训练中教视频模型学习动作的时空关系，把计划与画面生成接起来。", "rationale": "生成前，系统把用户指令整理成按时间排列的动作计划。训练时，另一个能把文字转换成运动的模型提供指导，论文称它为“教师”。视频模型学习教师表示中的空间和时间关系，使文字计划能更好地落实成动作。训练完成后移除教师，用户生成视频时不必提供完整骨架序列。", "basis_title": "动作计划怎样进入视频模型", "method_title": "先规划交互，再生成连续画面", "method_input": "独立的人物图、物体图和用户动作指令；推理时不要求提供骨架视频。", "method_output": "符合动作计划的人—物交互视频。", "result_title": "哪些改动改善了交互", "connection": "动作推理在生成前运行，输出文字计划；运动教师主要在训练时提供特征监督。两者承担不同职责：一个把意图说具体，一个让视频模型学会把具体意图转成运动。部署时不需要教师再输出一套显式骨架。", "architecture": [{"name": "视觉感知角色", "flow": "独立人物图与物体图 → 物理属性", "operation": "分别记录人物姿态、手部占用，以及物体形状、材质等可见属性。\n\n人物一侧记录身体朝向、姿态、手部状态、视线和场景条件，物体一侧记录类别、形状、材料、纹理及可见部件。这个阶段把两张图分开观察，先形成可见属性清单，再交给交互分析角色。这样下一步推断抓取或佩戴方式时，有具体的手部与物体依据，而非仅凭类别名称编排动作。"}, {"name": "交互分析角色", "flow": "属性、用户动作要求 → 可行交互约束", "operation": "分析人物姿态与物体可供操作的方式，保留指令中明确的动作、左右手及转移要求。\n\n分析围绕三件事展开：当前身体和手部状态能否完成动作、物体有哪些可操作方式，以及用户希望达成什么目标。指令中的动词、左右手、换手和放置位置被作为优先约束。输出是一份交互规格，说明哪些动作可行、需要遵守哪些条件，再由规划角色把这些条件安排到时间线上。"}, {"name": "动作规划与穿模检查", "flow": "交互约束 → 经检查的秒级计划", "operation": "规划角色拆分动作时序，检查角色复核接触和穿模问题，并修正计划。\n\n规划按一秒粒度拆分最长五秒的动作，写成准备、接触、完成或展示的连续时间段。随后检查角色寻找瞬间贴附、突然大幅运动、穿过身体或衣服等高风险表述，把既有动作拆成对齐、边界接触、逐渐贴合等子步骤。这是文字层面的计划修订，输出仍是供视频模型读取的时间线。"}, {"name": "训练期运动表示对齐", "flow": "动作文本、运动教师特征 → 具有运动知识的视频表示", "operation": "训练期用文本到运动教师提供时空关系监督，让视频模型学习把文字动作转换为运动。\n\n运动教师把文字、人图和物图映射为骨架及物体掩码序列，训练时从其中间层提取运动表示。论文没有直接要求视频特征与教师逐点相等，而是比较同帧空间位置之间、不同帧之间的相对相似度，让两边的时空关系接近。这项 TRD 对齐损失与视频生成损失联合优化，教师在推理时移除。"}, {"name": "无显式运动条件的生成", "flow": "参考图、文字动作计划 → 人—物交互视频", "operation": "推理时把参考人物、物体图与文字计划交给视频基座，直接生成交互视频。\n\n人物与物体图先经变分自编码器（VAE）压缩，再划分成特征单元（token），与视频 token 沿时间维拼接；两张图的 CLIP 特征则投影后与 T5 文字条件一起，通过交叉注意力进入 Wan2.1 视频基座。文字计划提供动作顺序，两路图像条件提供外观。模型直接输出视频，训练期学到的运动关系保存在其参数中。"}], "findings": "论文通过跨动作测试和消融，检查多角色推理、穿模检查、运动对齐及混合数据各自的贡献。", "limitations": "语义检查不等于物理仿真；原文不保证严格时间控制，VLM幻觉可导致错误动作时间线，且生成分辨率限制细节。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-06-fig-01.webp", "original_caption": "Figure 1. Following a “thinking-before-generation” schema, the proposed AgentHOI first generates detailed textual motion controls and then generates corresponding HOI videos. The Action 1–Action 5 labels in the teaser are simplified for visualization; the actual motion plan uses second-level temporal intervals.", "placement": "intro", "caption": "示例先列动作阶段，再给出对应交互帧。阶段文字是“先想后生成”的可读中间结果，读者可以先检查动作要求，再看视频是否执行。"}, {"number": 2, "page": 4, "src": "figures/paper-06-fig-02.webp", "original_caption": "Figure 2. The pipeline for the proposed AgentHOI. Our framework consists of two core components: agent-based HOI reasoning and motion-free HOI video generation. The former employs a multi-agent architecture to infer structured and physically plausible HOI action plans from textual and image inputs, while the latter enhances text controllability by aligning video representations with implicit text-to- motion features during training, enabling robust text-driven HOI video generation without explicit motion inputs at inference time.", "placement": "method", "caption": "总图左侧为多角色交互推理，右侧为视频模型与文本到运动教师的训练对齐。需要区分文字计划作为条件，与教师表征作为训练监督这两条连接。"}, {"number": 3, "page": 7, "src": "figures/paper-06-fig-03.webp", "original_caption": "Figure 3. Visualization of real data pipeline and synthetic data pipeline. We build an HOI dataset via a hybrid real–synthetic pipeline. For real data, we develop an automated filtering system that mines high-quality HOI clips from large-scale online videos using multi- stage quality control, video understanding, and object/human decomposition, yielding 71K clips from 10M videos. For synthetic data, we generate diverse HOI samples via reference-based human-object synthesis and image-to-video animation, producing 37K additional clips to improve motion and object diversity.", "placement": "detail", "caption": "真实数据和合成数据采用不同处理流程，再共同服务训练。真实片段提供实际接触与外观，合成流程补充可控交互；这解释了混合数据不是简单增加样本数量。"}, {"number": 7, "page": 10, "src": "figures/paper-06-fig-07.webp", "original_caption": "Figure 7. Ablation on the agent-based HOI reasoning and planning module. More analysis of the optimized prompt is shown in the supplementary material.", "placement": "evidence", "caption": "移除交互推理与规划后的对比用于检查这一部分是否真有作用。关注动作是否完整、手物关系是否合理，而不是只比较某一帧的清晰度。"}], "paper_url": "https://arxiv.org/abs/2607.22241", "code_url": "https://github.com/bone-11/agenthoi", "sort_date": "2026-07-24", "experiment": {"summary": "跨动作驱动测试比较物体保持、运动与文字一致性。AgentHOI 的物体 DINO 相似度为 0.5107、文字—视频对齐分数为 0.6436，优于表中相应对比项；移除运动对齐或合成数据后，多项结果下降。", "caption": "上半表比较不同方法，下半表逐一去掉组件。物体保持、动作和文字匹配分别计分，可以看出哪些方面受益。", "src": "figures/paper-06-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["人—物交互", "视频生成", "多智能体", "表征对齐", "知识蒸馏"]}, {"id": "paper-09", "title": "Fleet: Few Shots Lead Effective AI-generated Image Detection", "chinese_title": "Fleet：持续少样本适应的生成图像检测", "year": "2026", "theme": "大模型可信与安全", "authors": "J Wang, S Liu, Y Li, K Yang, J Cao, S Tang", "publication": {"venue": "ICML 2026 · PMLR 306", "date_label": "会议", "date": "2026-07-06—11", "preprint_date": "2026-06-30", "arxiv_id": "2606.31082"}, "motivation": "检测器学会识别某些 AI 绘图工具后，遇到新工具生成的图片，可能又认不出来。每次都收集大量新图片、从头训练，成本很高。这篇论文研究能否只给少量新工具的样本，就让检测器适应新来源，同时不忘记原来会识别的工具。", "context": "Fleet 先把一张图片的信息转换成几组特征，再决定判断这张图时应该更侧重哪几组。这个分配权重的过程，论文称为“路由”。作者发现，新工具生成的图片有时会更多使用原先偏向真实照片的特征组合，因而被误判。少量新样本的作用，就是帮助模型纠正这种分配。", "analysis": "模型在旧数据上学到的特征组合，未必适合新工具生成的图片。若只用几张新图就修改整个检测器，容易过度迎合这几张图，还可能破坏原来会做的判断。Fleet 因此重点调整各组特征的使用权重，让新生成图少依赖那些原本更常用于真实照片的特征。", "rationale": "训练时，让真实照片和 AI 图片尽量使用不同的特征组合，同时让各组特征都参与判断，避免模型只依赖其中几组。学习新工具时，如果新生成图仍偏向真实照片常用的特征组合，就惩罚这种权重分配，引导模型调整。", "basis_title": "新生成器出现后，旧边界为什么失灵", "method_title": "把少样本更新变成路由纠正", "method_input": "待测图像；适应新生成器时另外提供少量带标签的新样本。", "method_output": "图像真假判断，以及更新后兼顾新旧生成器的检测器。", "result_title": "少量新样本改变了什么", "connection": "整个流程分成两步：先用已有真假图建立不同特征的分工，再用少量新 AI 图纠正权重分配。图中的细小纹理等高频信息帮助决定权重，视觉模型提供用于分类的特征。更新时还会复习少量旧图，并约束新旧模型对这些图的表示保持接近，减少遗忘。", "architecture": [{"name": "视觉特征与频率路由", "flow": "图像 → 视觉表示与高频路由权重", "operation": "先用视觉模型把图片变成可供判断的特征，再根据图中细小纹理等高频信息，给几组特征分配不同权重，让不同图片可以侧重不同判断线索。\n\nDINOv3 是提取图像特征的视觉模型；LoRA 只训练一小部分附加参数，使它适应取证任务。视觉基座的表示经多组线性投影，分别产生各子空间的地址和内容。另一分支对图像做 FFT、高通筛选和逆变换，再用卷积编码高频痕迹。高频向量与各地址做点积并经 Softmax，得到路由权重；这些权重缩放对应子空间内容，再拼接、投影成最终判别特征。地址决定匹配，内容承担分类，两者职责不同。"}, {"name": "互斥子空间预训练", "flow": "已有真假样本 → 分工后的 AI／非 AI 路径", "operation": "先用已有真假图学习各组特征的分工：减少两类图片对相同组合的依赖，同时让各组特征都有机会参与判断，避免模型只使用少数几组。\n\n对比分类损失让同类图像靠近、不同类分离。正交项先分别计算一个批次内真实图、AI 图的平均权重，再计算两组权重向量的内积：重合越多，内积越大，训练就会对这种重合施加更强约束。覆盖项则要求所有特征子空间得到一定利用，避免几组特征包办全部样本。三项共同训练，建立后续少样本适应所需的特征分工。"}, {"name": "少样本避让路由", "flow": "新生成器少量样本 → 修正的特征流向", "operation": "当新 AI 图仍偏向真实照片常用的特征组合时，降低这部分权重，引导它使用更适合生成图像的特征。论文将这一步称为避让路由。\n\n先用回放集计算真假两类的固定路由中心，再比较新样本与错误类别中心的重合程度。新 AI 图若仍大量使用非 AI 路径，就会受到避让损失惩罚。由于路由权重经过 Softmax、总量受归一化约束，被压低的路径会把权重让给其他更匹配的路径，从而改变新生成痕迹进入分类器的方式。"}, {"name": "旧知识保持", "flow": "旧样本与旧模型知识 → 对适应更新的约束", "operation": "通过样本回放和蒸馏限制新适应破坏既有检测能力。\n\n方法保留一小部分旧的真假训练图，并记录旧模型对它们的特征表示。适应新样本时，当前模型既学习新数据，也让回放样本的特征与旧版本保持相近；蒸馏约束比较两版特征的余弦相似度。这样更新不仅受到新样本驱动，还受到旧判别空间的约束，减轻少样本适应带来的遗忘。"}], "findings": "在 Treasure 的 64 种生成模型上测试。豆包 Seedream 4.0 的 AI 图检测准确率从 20.4% 提高到 10-shot 适应后的 73.1%。", "limitations": "研究整图生成，局部编辑与换脸仍需验证；依赖带标签新样本和回放。已有20阶段连续适配实验，但真实开放环境的长期表现仍需验证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-09-fig-01.webp", "original_caption": "Figure 1. Analysis of Benchmarks. (a) Performance of SOTA methods on common datasets. (AIGIBench-13 refers to AI- GIBench’s subset of 13 full-graph generation models.) (b) De- tection accuracy of SOTA methods on generated images across different release years. The models in the image (from left to right) are: SDv2.1, Midjourney v6, Playground v2.5, SD3, Midjourney v7, Doubao Seedream 3.0, Imagen 4, Nano Banana Pro.", "placement": "intro", "caption": "基准分析显示，旧测试集表现高不代表面对新生成器仍然可靠。这张图解释了作者为何从静态泛化转向持续适应。"}, {"number": 2, "page": 4, "src": "figures/paper-09-fig-02.webp", "original_caption": "Figure 2. Overview of Treasure Dataset. (a) We have meticulously collected a large number of images generated by current mainstream generative models, assigning authenticity labels and artistic style tags to each image. (b, c) Illustration of image and prompt source distribution. Our dataset maintains excellent diversity in data sources to ensure its ability to simulate real-world inputs. (d, e, f) Comparison with other benchmarks. Our dataset possesses significant advantages in both scale and novelty.", "placement": "basis", "caption": "Treasure 展示所覆盖生成模型和数据构成。其作用是让评估包含较新、不同架构及闭源引擎，而非只在少数早期生成器上验证。"}, {"number": 3, "page": 5, "src": "figures/paper-09-fig-03.webp", "original_caption": "Figure 3. Overview of Fleet.The model employs a dual-branch architecture, utilizing the high-frequency signal rfreq to generate subspace routing weights. During pre-training, Lorth and Lcov decouple high-dimensional features into mutually exclusive AI (Red) and Non-AI (Green) subspaces. In the few-shot adaptation phase, Lavoid forces the redirection of feature flows from novel generated images toward the most relevant AI subspaces while suppressing their activation in Non-AI subspaces.", "placement": "method", "caption": "上方两分支分别处理视觉特征与频率路由，下面区分预训练和少样本适应。避让机制改变新图像流向，不是简单把“新模型”作为一个额外类别。"}, {"number": 6, "page": 8, "src": "figures/paper-09-fig-06.webp", "original_caption": "Figure 6. Visualization of Subspace Routing Weights Before and After Few-shot Training. (a) Query set mean routing weights before and after few-shot training. (b) Mean routing weights on AI classes in the AIGIBench validation set. (c) Mean routing weights on Non-AI classes in the AIGIBench validation set.", "placement": "evidence", "caption": "路由权重可视化比较适应前后特征流向。它检查的正是论文机制：新生成图是否减少走入非 AI 路径，而不仅是分类得分发生变化。"}], "paper_url": "https://proceedings.mlr.press/v306/wang26eo.html", "code_url": "https://github.com/ICTMCG/Fleet", "sort_date": "2026-07-06", "experiment": {"summary": "在 Treasure 与 AIGIBench-13 上检验少样本适应。10-shot 时，Fleet 的平均准确率分别为 92.63% 和 94.89%；新 AI 图的识别提升，同时较好保留原预训练验证集表现。", "caption": "AI 与 Non-AI 分别对应两类图像准确率；右侧 Pretrain Val 用于观察适应是否损伤旧能力。1、5、10-shot 应分别比较。", "src": "figures/paper-09-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["生成图像检测", "少样本适应", "子空间路由", "频率特征", "持续学习"]}, {"id": "paper-07", "title": "Beyond the Final Actor: Modeling the Dual Roles of Creator and Editor for Fine-Grained LLM-Generated Text Detection", "chinese_title": "混合写作检测：区分创作者与编辑者", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Z Wang, Y Yang, D Wang, J Cao", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-04-06", "arxiv_id": "2604.04932"}, "motivation": "你写好文章让 AI 润色，和 AI 写好文章再由你修改，最后的文字都可能既像人写、又像机器写。只分“人类”或“AI”两类，就说不清这种差别。这篇论文分别识别最初写作者和后续修改者，区分四种写作过程，重点处理人机共同写作容易混淆的问题。", "context": "四种文本的差异在生产过程：谁先写，谁再改。人改 AI 文本可能保留机器初稿的组织方式，AI 润色人写文本又可能保留人的论证结构。只从最终词汇“像谁”判断，很容易把这些过程混为一谈。", "analysis": "改写会改变词汇和句式，却不一定重建文章的论证顺序与篇章关系。仅依赖表面用词，容易把编辑者误认为唯一作者。因此，方法同时观察局部语言表达和较稳定的修辞组织，寻找不同角色留下的互补信息。", "rationale": "作者用修辞结构理论（RST）表示文章怎样组织论述：先把文字拆成片段，再用因果、转折等关系连成树。图网络沿着这些关系交换信息，并对不同关系采用不同处理。信息瓶颈投影把表示压缩得更紧凑，减少无关用词的干扰，使分类更关注与写作过程有关的结构差异。", "basis_title": "创作者和编辑者留下的线索不同", "method_title": "用篇章关系组织检测特征", "method_input": "一篇待判断创作者与编辑者角色的文本。", "method_output": "纯人类、纯 LLM、LLM 起草后人类改写、人类起草后 LLM 润色四类概率。", "result_title": "四类写作过程怎样区分", "connection": "解析器先把线性文本变成篇章树，再把内容片段和修辞关系放进图中。节点初始化保留片段含义，关系特定传播保留组织差异，最后分类器才据此区分四类来源。", "architecture": [{"name": "RST 解析", "flow": "文本 → 篇章单元与修辞树", "operation": "使用修辞结构理论解析器把文本切成基本篇章单元，并建立因果、转折、论证等关系树，将写作组织转换为可以计算的结构。\n\n树的叶子对应连续文字片段，即基本篇章单元；内部节点记录扩展、对比等修辞关系。原文顺序与上下级依赖都保留下来，所以模型能够同时看到具体措辞和这些措辞怎样被组织。例如两篇文章可以谈相同主题，却分别采用“先给结论再补理由”与“先转折再表态”的组织方式，树结构使这种区别可以进入后续计算。"}, {"name": "逻辑图与瓶颈投影", "flow": "内容单元、关系树 → 紧凑节点表示", "operation": "构建同时包含内容单元节点和修辞关系节点的逻辑图。内容提供具体表达，关系节点汇集所辖片段的信息，再通过紧凑投影减少与作者结构分析无关的词汇噪声。\n\n内容节点对其文字跨度内的语言模型特征做平均，关系节点则汇集自己所辖叶子的信息，使“对比”等关系同时携带被比较内容。再加入区分内容节点与关系节点的类型嵌入，投影到更紧凑的空间。这里的压缩保留图计算所需表示，后续传播仍依赖真实的篇章连接。"}, {"name": "修辞关系消息传递", "flow": "逻辑图 → 四种创作／编辑角色预测", "operation": "采用关系特定的图消息传递，区分不同修辞边的作用，并结合分类与对比学习，识别纯人、纯 AI、人改 AI 和 AI 改人四类。\n\n关系图卷积为不同修辞关系使用不同变换，因果边与对比边因此不会以相同方式传递信息。为了控制参数量，各关系的变换又由共享基矩阵加权组合。多层传播后读取覆盖全文的根节点，送入四分类头；训练同时使用分类损失与监督对比损失，使同类创作过程的表示更接近。"}], "findings": "在 HART 上与 12 种基线比较，并补充同源文本分组划分实验，检查对创作与编辑角色的识别能力。", "limitations": "仅一个适配四分类的基准，其他语言与领域未知；多轮交替编辑未覆盖；预测精度不足以单独作为处罚依据。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-07-fig-01.webp", "original_caption": "Figure 1: Illustration of our research scope. (a) A Creator-Editor framework for categorizing different types of texts in fine-grained LLM-generated text de- tection. (b) Comparison of the existing settings and the complex 4-class setting that we focus on in this paper.", "placement": "intro", "caption": "创作者—编辑者框架把四类文本清楚分开。它改变了检测问题的标签定义：不只看最后一次操作由谁完成，也追踪初稿与编辑的组合。"}, {"number": 2, "page": 3, "src": "figures/paper-07-fig-02.webp", "original_caption": "Figure 2: Distribution of RST relations. (a) Divergence of Creators: Human creators build deeper rhetorical hi- erarchies (e.g., Attribution, Temporal), whereas LLMs produce flatter structures relying on surface-level re- lations (e.g., Elaboration, Cause). (b) LLM-Polished: underlying human architecture persists. (c) Humanized: underlying LLM architecture persists.", "placement": "basis", "caption": "作者比较不同来源文本的 RST 关系分布。图中结构差异为采用篇章关系提供经验支撑；这是一种统计差异，不意味着每篇人写文章都一定更深。"}, {"number": 3, "page": 4, "src": "figures/paper-07-fig-03.webp", "original_caption": "Figure 3: Overall architecture of RACE. Given a text piece, RACE (a) first captures both creator and editor traces through rhetorical structure construction and elementary discourse unit extraction. (b) These dual traces are then transformed into a logic-aware graph, where both linguistic expression and logical organization signals are encoded into node features via descendant span pooling and relation-aware projection. (c) Next, Rhetoric-Guided Message Passing propagates information through relation-specific aggregation with basis decomposition to capture complex rhetorical dependencies. (d) Finally, the global text representation is obtained via root pooling for classification.", "placement": "method", "caption": "RACE 从篇章解析得到内容单元与关系，再构建图表示并做修辞引导传播。图中的内容与逻辑分工说明，方法不只是把一篇文章整体送进分类器。"}], "paper_url": "https://aclanthology.org/2026.acl-long.235/", "sort_date": "2026-07-01", "experiment": {"summary": "在 HART 四分类任务上与 12 种基线比较，并报告三次运行的均值与波动。RACE 的平均 TPR@1%FPR 为 83.06%，高于表中对比方法，主要收益体现在混合写作类别的识别。", "caption": "TPR@1%FPR 表示将误报率控制在 1% 时的检出率。它与 AUROC 含义不同，表中的 AUROC 并非所有方法中最高。", "src": "figures/paper-07-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["大模型文本检测", "人机协作写作", "修辞结构", "图神经网络"]}, {"id": "paper-08", "title": "Logical Consistency as a Bridge: Improving LLM Hallucination Detection via Label Constraint Modeling between Responses and Self-Judgments", "chinese_title": "LaaB：用逻辑一致性训练幻觉检测器", "year": "2026", "theme": "大模型可信与安全", "authors": "H Mi, Q Sheng, S Wang, B Hu, Y Sun, Z Wang, H Zeng, Y Li, D Wang, ...", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-05-05", "arxiv_id": "2605.03971"}, "motivation": "向模型提问后，再追问“你刚才答对了吗”，它有时能自纠，有时会给错误答案打包票。只看模型内部信号，也可能漏掉它非常自信的错误。这篇论文把答案是否正确、自检是否正确之间的关系用于训练，让自检帮助改进检测器；使用时仍希望靠内部信号完成判断。", "context": "如果模型回答错了，却自检说“正确”，自检文本本身也就说错了。反过来，自检说“错误”时，自检是否正确与原答案是否正确正好相反。论文利用的是这种标签关系，而不是认为模型多问自己一次就更可靠。", "analysis": "这里的“探针”是读取模型内部信号、判断答案是否正确的小型分类器。方法分别为原回答和自检设置探针：前者判断原回答是否正确，后者判断这次自检是否正确。两路结果先按自检说的是 Yes 还是 No 转成相同含义，才能相互指导。", "rationale": "论文的核心逻辑规则是：若自检断言“原回答正确”，原回答真实性与自检正确性标签相同；若自检断言“原回答错误”，两者标签相反。由此，自检探针的概率 q 可按 Yes／No 转为 q 或 1−q，与原回答探针对齐，再用稳健损失和置信度权重互学。该规则是训练约束，不代表自检天然可靠。", "basis_title": "自检也可能说错，怎样利用它", "method_title": "两路训练，一路部署", "method_input": "用户问题、模型回答，以及训练时为该回答生成的自检。", "method_output": "原回答的真实性概率；部署只需保留原回答探针。", "result_title": "逻辑约束改善了哪些判断", "connection": "训练中有原回答探针和自检正确性探针，两路需要按 Yes／No 关系转成同一问题的概率再互学。推理图可以删掉自检一侧，仅用训练好的原回答探针，因此收益主要通过训练进入模型。", "architecture": [{"name": "原回答探针", "flow": "回答生成中的内部信号 → 原回答真实性概率", "operation": "从原回答提取模型内部信号，训练一个小型分类器，也就是探针，输出原回答正确的概率。可用信号包括内部特征、生成概率和注意力。\n\n探针是读取语言模型内部信号、学习预测真假结果的小型分类器。论文研究三种可用信号：回答末词元的隐藏状态、各层对已生成词元的预测概率，以及注意力在上下文各部分的分配。概率序列先聚合为整段特征，注意力则按系统提示、问题、触发部分和此前回答等片段统计。具体实现从这些特征类型中选择一种交给 MLP 探针，学习其与回答真假标签的关系。"}, {"name": "自检正确性探针", "flow": "自检文本及其内部信号 → 自检本身正确的概率", "operation": "要求同一模型自检原回答，并从自检生成过程提取特征，训练第二个探针，判断这次自检是否正确，而不是无条件相信它给出的 Yes/No。\n\n第二个探针的目标是“这次 Yes／No 判断是否正确”。因此，同样一句 Yes，在原回答正确时应被视为正确自检，在原回答错误时则是错误自检。它读取的是生成自检时的内部信号，而不是只把 Yes 转成 1。对概率特征，方法还聚合 Yes、No 同义表达的概率及两者差值，以表达判断的方向和强弱。"}, {"name": "逻辑约束互学", "flow": "两路概率、Yes／No 关系 → 校准后的回答探针", "operation": "当自检声称原回答正确时，两路真实性标签应一致；声称错误时，两路标签应相反。训练用逻辑约束、Huber 损失与置信度加权进行互学；部署时只保留原回答探针。\n\n设自检探针给出“自检正确”的概率 q：自检说 Yes 时，q 对应原回答正确的概率；自检说 No 时，则要转换成 1−q。完成这个方向转换后，两路预测才可比较。Huber 损失与置信度权重用于约束互学，降低不可靠一侧的干扰；部署只运行已学好的回答探针，避免每次检测都额外生成自检。"}], "findings": "在四套问答或幻觉数据、四个开源模型上比较八类基线，多数组合得到改善，推理阶段不需要额外生成自检。", "limitations": "必须访问模型内部信息，适合服务提供方；强制二选一自检会引入噪声；两路同时犯错时没有保证能纠正。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-08-fig-01.webp", "original_caption": "Figure 1: Comparison between existing hallucination detection methods (a-b) and our proposed LaaB (c). Unlike methods that rely solely on micro-level intrinsic patterns (a) or macro-level symbolic judgment (b), LaaB bridges these two views by enforcing logical consistency via logic-constraint mutual learning.", "placement": "intro", "caption": "三种路线分别只看内部信号、只看自检文字，以及 LaaB 的结合方式。关键区别是，LaaB 还评估自检本身是否可信。"}, {"number": 2, "page": 3, "src": "figures/paper-08-fig-02.webp", "original_caption": "Figure 2: Overall architecture of LaaB. Given a user query and corresponding response, LaaB first performs (a) Response Hallucination Modeling, extracting intrinsic features from the response generation to capture implicit uncertainty. (b) Self-Judgment Hallucination Modeling introduces a meta-judgment process that analyzes the elicited verbal judgment to mitigate evaluative biases. Finally, (c) Logic-Constrained Mutual Learning bridges these dual views by enforcing logical consistency between response and judgment predictions, utilizing their inherent dependency for robust joint optimization.", "placement": "method", "caption": "原回答与自检分别提取内部特征，再通过逻辑约束互学习。图中标明训练后可移除的自检部分，不能把两路都画成每次推理必需。"}, {"number": 3, "page": 8, "src": "figures/paper-08-fig-03.webp", "original_caption": "Figure 3: Prediction correctness transitions before and after applying LaaB.", "placement": "evidence", "caption": "图统计应用 LaaB 前后预测正确性的变化，帮助观察哪些原先错误的判断被纠正，以及是否出现新的错误；比只看一个总分更能说明互学的影响。"}], "paper_url": "https://aclanthology.org/2026.acl-long.286/", "code_url": "https://github.com/ICTMCG/LaaB", "sort_date": "2026-07-01", "experiment": {"summary": "在四套问答或幻觉数据、四个开源模型上，对隐藏状态、预测概率和注意力探针分别加入 LaaB。多数配置的平均宏 F1 与准确率提升，收益随模型和特征类型变化；推理仍只运行回答探针。", "caption": "把同一种探针的原始行与紧接着的“+LaaB”行成对比较，右侧平均指标概括该组数据上的表现。", "src": "figures/paper-08-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["幻觉检测", "自检判断", "逻辑约束", "互学习"]}, {"id": "paper-20", "title": "Anchorcrafter: Animate cyber-anchors selling your products via human-object interacting video generation", "chinese_title": "AnchorCrafter：面向商品展示的人—物交互视频", "year": "2026", "theme": "可控视频生成", "authors": "Ziyi Xu, Ziyao Huang, Juan Cao, Yong Zhang, Xiaodong Cun, Qing Shuai, Yuchen Wang, Linchao Bo, Fan Tang（所读v2）", "publication": {"venue": "IEEE TVCG 32(7)", "date_label": "卷期", "date": "2026-07", "preprint_date": "2024-11-26", "arxiv_id": "2411.17383"}, "motivation": "让数字主播展示一件商品，不能只让人物动起来：手要抓对位置，商品不能忽大忽小，转动时商标和形状也要保持。仅根据人体动作生成视频，容易漏掉这些商品细节。这篇论文把商品本身和手与商品的接触关系一起纳入生成过程，面向主播带货中的展示动作。", "context": "展示视频中，商品往往比人物面积小，却承载最重要的信息：形状、商标、纹理和抓握关系都不能随便变化。只追踪人物骨架，可能让手动起来了，但商品静止、变形，或被误当成身体一部分。", "analysis": "人物和商品的外观信息需要独立保存，而手、商品与身体运动又必须协调。只用人体骨架不能充分约束手指与物体接触；全图训练损失还可能忽略面积较小却很重要的商品细节。", "rationale": "作者将问题分别归为商品外观保持、手—物交互和小区域细节。多视角外观与双适配器、手网格／深度条件、交互区域加权损失分别回应这些问题；方法图与消融用于检验各组件。", "basis_title": "商品为什么不能只当作人物的一部分", "method_title": "外观保持与交互运动分别怎样控制", "method_input": "主播参考图、商品多视角参考，以及人体、手和商品的运动条件。", "method_output": "展示目标商品的人—物交互视频；新商品按论文设定先用短视频适配。", "result_title": "商品与手部是否同时稳定", "connection": "人物图和商品多视角图进入外观路径，身体、手和物体几何进入运动路径，区域加权则改变训练关注重点。这些信号共同控制视频；新商品适配与新主播推理在论文中另外区分，不能把所有商品场景都理解为无需适配。", "architecture": [{"name": "HOI 外观感知", "flow": "人物图、多视角商品图 → 分离的外观条件", "operation": "使用商品多视角图像的 DINO 特征补充外观信息，并用人物与物体双适配器分别注入两类外观，减少商品信息被人物特征淹没。\n\n人物参考用 VAE 特征保留局部细节，并以 CLIP 特征提供整体外观；商品则使用正面、左右各约 45° 的多视角图，融合 DINO 特征补足不同侧面的形状和纹理。人物与物体通过不同适配器进入基座，正面参考的潜变量也与带噪声视频拼接。这样商品的外观有独立输入路径，模型不必从主播参考中推测商品。"}, {"name": "HOI 运动注入", "flow": "骨架、手网格、商品深度 → 交互运动条件", "operation": "结合人体骨架、三维手网格和商品深度图提供运动与几何条件，显式处理人和物体之间的遮挡，让控制信号覆盖身体、手和商品。\n\n人体骨架负责身体的大范围运动，手部三维网格补充手指形状，商品深度表示物体的空间位置和可见结构。这些条件随帧变化，并在注入前处理手与商品的遮挡关系。视频去噪因此同时得到身体姿态与更细的交互控制，而非只依赖二维骨架猜测物体应放在手前还是手后。"}, {"name": "区域加权训练", "flow": "生成视频、手与商品区域 → 更关注交互的模型", "operation": "训练中提高交互手部与商品区域的损失权重，促使模型关注抓握和小物体细节，而不只优化大面积背景或人物轮廓。\n\n训练的基本目标仍是预测加入视频潜变量的噪声，但手部与商品区域获得更高权重，让面积小的交互区域对参数更新有更大影响。系统先学习通用交互，再用某件商品约一分钟的展示视频适配其纹理；之后可以换主播参考和驱动动作。区域加权负责训练关注点，商品适配负责补足该商品的外观信息。"}], "findings": "交互数据与对比实验检验商品保持和手部运动；所读 v2 表中 Object-IoU 为 0.906、Object-CLIP 为 0.921。", "limitations": "需针对商品微调、依赖演员动作和上游估计；最新v2局限部分明确透明物体困难。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-20-fig-01.webp", "original_caption": "Fig. 1: Existing methods accurately follow human poses but struggle with realistic hand-object interactions, often misinterpreting the object as part of the human, leading to static animations. In contrast, our approach ensures natural and dynamic movement by precisely synthesizing human- object interactions while preserving object appearance.", "placement": "intro", "caption": "现有方法跟随人体姿态，却可能把手持商品误作身体一部分。对照图把“身体会动”和“真实人—物交互”之间的差别具体展示出来。"}, {"number": 2, "page": 2, "src": "figures/paper-20-fig-02.webp", "original_caption": "Fig. 2: We propose AnchorCrafter, a diffusion-based human video generation framework for creating high-fidelity anchor- style product promotion videos by animating reference human images with specific products and motion controls. By incorporating human-object interaction into the generation process, AnchorCrafter achieves high preservation of object appearance and enhanced interaction awareness.", "placement": "intro", "caption": "应用总览展示参考人物、指定商品与交互结果，明确输入既包含人物也包含物体，目标是共同保持两者，而不是只生成一个动作相近的人。"}, {"number": 4, "page": 4, "src": "figures/paper-20-fig-04.webp", "original_caption": "Fig. 4: Training pipeline for AnchorCrafter: Based on a video diffusion model, AnchorCrafter injects human and multi- view object references into the video via HOI-appearance perception. The motion is controlled through HOI-motion injection, with the training objective reweighted in the HOI region.", "placement": "method", "caption": "训练图中外观感知与运动注入是两条不同路径。人物和多视角商品参考提供外观，姿态及深度提供运动和遮挡条件，最后共同进入视频扩散模型。"}, {"number": 5, "page": 4, "src": "figures/paper-20-fig-05.webp", "original_caption": "Fig. 5: HOI-appearance perception: The feature of the target object fO is extracted through multi-view object feature fusion and combined with the human reference feature fH within a human-object dual adapter to achieve improved disentanglement results.", "placement": "module-0", "caption": "先融合多视角商品特征，再通过人物—物体双适配器注入。这样可以单独看商品信息怎样进入模型，避免把“用了参考图”当作已经解释完外观保持。"}], "paper_url": "https://doi.org/10.1109/TVCG.2026.3662720", "code_url": "https://github.com/cangcz/AnchorCrafter", "sort_date": "2026-07-01", "experiment": {"summary": "在主播—商品交互测试上，AnchorCrafter 的商品 IoU 为 0.906、商品 CLIP 相似度为 0.921，手部 LMD 为 12.19。相较表中对比方法，商品保持与手部位置误差表现较好。", "caption": "商品 IoU、CLIP 越高越好，手部 LMD 越低越好。下半部分删除外观、运动或区域训练组件，检查各模块贡献。", "src": "figures/paper-20-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["人—物交互", "视频生成", "多视角商品", "手部控制", "区域加权"]}, {"id": "paper-02", "title": "TryOnCrafter: Unleashing Camera Trajectories for Realistic Video Virtual Try-on via a Renderable 4D Try-on Proxy", "chinese_title": "TryOnCrafter：可控制相机轨迹的视频试衣", "year": "2026", "theme": "可控视频生成", "authors": "H Sun, H Yan, M Chen, Q Song, Y Li, J Cao, J Lan, X Zhu, B Zheng, ...", "publication": {"venue": "ECCV 2026", "date_label": "arXiv 首发", "date": "2026-06-24", "preprint_date": "2026-06-24", "arxiv_id": "2606.26092"}, "motivation": "在网上试衣时，你可能不仅想看正面，还想让镜头绕到侧面看看衣服。但换一个机位，就要补出原视频没拍到的衣服侧面和背景，还要让遮挡关系合理。现有视频试衣通常沿用原来的镜头。这篇论文希望用户换好衣服后，也能重新安排镜头，而人物和衣服依然保持一致。", "context": "换镜头并不是对原片做简单平移。镜头绕到侧面后，人物遮挡、衣服可见面和背景透视都变了。论文先建立一个可从新视角观察的粗场景，再由视频模型修细节，避免每一帧都从头猜几何关系。这个提供几何参考的中间场景，就是文中的“试衣代理”。", "analysis": "二维换衣模型能修改可见衣服，却没有稳定的三维场景表示；直接让视频模型猜新机位，又容易让衣纹、人物比例和背景漂移。另一个具体问题是，重建点云与人体模型处在不同坐标和尺度中，即使各自在原视角投影正确，合起来仍可能错位。", "rationale": "作者指出，从单个镜头重建出的人体和场景，可能使用不同的尺度和坐标。方法因此以人体上的可靠三维点为参照，通过缩放、旋转和平移把两者对齐，写成 T(v)=sRv+t，其中 s、R、t 分别对应这三种变换。对齐后的场景负责提供新机位下的空间布局，跨视角参考特征则补充人物与服装的外观细节。", "basis_title": "为什么先做一个能渲染的试衣代理", "method_title": "场景对齐、换衣人物与视频细化", "method_input": "原人物视频、目标服装图，以及希望采用的相机轨迹。", "method_output": "人物穿着目标服装、镜头沿指定路径移动的试衣视频。", "result_title": "换镜头后，哪些部分仍需保持", "connection": "先统一人体和场景的坐标，再把换好衣服的三维人物按原动作放回背景，沿目标镜头路径渲染。视频生成网络读取这些渲染结果，补回图像细节；跨视角参考适配器则从原片提取外观信息，帮助保持人物身份、衣料和场景特征。", "architecture": [{"name": "场景与人体对齐", "flow": "原视频 → 统一坐标中的背景和人体动作", "operation": "从原视频估计深度、相机和动态点云，分离人物与背景；同时恢复 SMPL-X 人体运动。以可靠的人体点云区域为锚，通过相似变换把人体动作对齐到场景的世界坐标。\n\nSMPL-X 用骨架姿态等参数描述人体，场景点云则记录观察到的三维位置。对齐要同时求尺度、旋转和平移，形式为 T(v)=sRv+t。优化比较重建人体点云与变换后 SMPL-X 表面的距离，并根据深度置信度和语义边界给点加权。躯干等可靠区域因此比噪声较大的边缘更有影响。完成后，人体动作与背景共用一套世界坐标，后续换衣人物才能按原动作移动而不漂离场景。"}, {"name": "四维试衣代理", "flow": "关键帧、目标服装、人体动作 → 可渲染的动态人物与场景", "operation": "选择正面可见、遮挡较少的关键帧，先完成二维换衣，再生成穿目标服装的三维高斯人物。用对齐的人体动作驱动这个人物，并把它放回保留的背景，形成可随时间变化的四维试衣代理。\n\n代理中的人物用三维高斯表示，每个高斯带有位置、形状、不透明度和外观属性。先把二维试衣关键帧转成规范姿态下的人物，再按 SMPL-X 骨骼用线性混合蒙皮驱动高斯，最后应用前一步的坐标变换放回背景。相机改变时，渲染的是同一个动态场景，因此各帧的人物位置和遮挡拥有共同的几何依据。"}, {"name": "代理引导 DiT", "flow": "新机位代理渲染 → 细化的视频特征", "operation": "沿目标相机路径渲染四维代理，给视频模型明确的空间布局，再由 DiT 恢复图像细节。\n\n代理渲染视频先经过 Wan 编码器，并与标明有效几何区域的掩码一起，在分块阶段和带噪声的视频潜变量按通道拼接。高质量试衣参考帧也被放进渲染序列首帧，以稳定早期外观。服装的 CLIP 图像特征与文字特征再通过交叉注意力补充语义，使去噪过程既接收明确的新机位布局，也接收服装材质和属性信息。"}, {"name": "跨视角参考适配器", "flow": "源视频与参考图 → 身份、衣料与背景补充", "operation": "参考适配器把原片特征引入新视角生成，补充粗代理缺失的细节。\n\nCRA 用生成分支的特征作查询，从参考分支读取细节，再以残差形式加回 DiT。它与基座共享 Key、Value 投影，但使用独立的 Query、输出投影，让参考读取能够单独学习。代理负责告诉模型人物和场景怎样投影，CRA 负责补回代理表达不足的身份、衣料和背景特征，两者在同一去噪过程中配合。"}], "findings": "在 CaM-VVTBench 上检查服装保持、生成质量和镜头控制，并展示环绕、子弹时间及人物重定位等效果。", "limitations": "依赖上游人体、深度和三维头像重建；看不见的衣服背面仍需推测，不能理解为真实服装测量。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-02-fig-01.webp", "original_caption": "Fig. 1: Examples synthesized by TryOnCrafter. We introduce a Renderable 4D Try-on Proxy (middle) as a geometric anchor to guide the Video Diffusion Transformer. This explicit 4D representation enables photorealistic try-on across unconstrained, novel camera trajectories (bottom) not present in the source video (top).", "placement": "intro", "caption": "原片、目标服装、四维代理与最终结果对应展示。中间代理并不是最终画面，它主要为新相机路径提供结构锚点；最后的生成阶段再恢复衣服和背景细节。"}, {"number": 2, "page": 5, "src": "figures/paper-02-fig-02.webp", "original_caption": "Fig. 2: Overview of TryOnCrafter. Top: 4D Try-on Proxy Construction. A metric- aligned scene in world space is established via anchor-based alignment of dynamic point clouds and SMPL-X sequences. Integrating a canonical 3DGS-based avatar distilled from reference image, the resulting 4D Try-on Proxy supports interactive editing and rendering across arbitrary camera trajectories. Bottom: Proxy-Anchored Try-on Video Generation. The try-on video is synthesized by the DiT under the integrated guidance of rendered priors, cross-view source features, and multimodal semantic conditions.", "placement": "method", "caption": "上半部分构建场景与换衣人物，下半部分用渲染视频、参考信息和语义条件驱动 DiT。两部分分开，便于理解为什么既需要三维代理，也需要视频生成器。"}, {"number": 3, "page": 6, "src": "figures/paper-02-fig-03.webp", "original_caption": "Fig. 3: Details of 4D Try-on Proxy Construction and CRA Module. (a) A similarity transformation {Rt, tt, st} maps the SMPL-X sequence from camera space to the world space, utilizing the human point cloud as a geometric anchor. (b) The canonical 3DGS- based avatar is dynamically warped via LBS driven by the aligned SMPL-X sequence, preserving structural integrity across the motion. (c) The CRA module facilitates inter- action between DiT features Fi and reference features Fl. By sharing K-V projections and utilizing independent Q′-O′ weights, it integrates a reference residual O′ l into the backbone to ensure cross-view identity and background consistency.", "placement": "module-1", "caption": "三个子图分别说明坐标对齐、人体动作驱动和跨视角参考适配器。对齐解决“放到哪里”，动作驱动解决“怎样随时间变”，适配器解决“怎样继续像原来的人和场景”。"}, {"number": 6, "page": 11, "src": "figures/paper-02-fig-06.webp", "original_caption": "Fig. 6: Versatile Applications of TryOnCrafter. Leveraging the decoupled 4D proxy, our model enables controllable synthesis: (a) Human Relocalization: Translating the motion sequence within Sw while maintaining scene-geometry consistency. (b) 360- degree Orbital Viewing: Synthesizing full orbital trajectories with robust structural integrity in unobserved viewpoints. (c) Bullet Time: Rendering a frozen temporal mo- ment from a moving camera by anchoring the generation to a single pose.", "placement": "evidence", "caption": "应用图展示人物重定位和镜头变化等控制。它们共享同一个场景与人物代理，因此可在几何表示上修改，而不是为每种效果另训练一套试衣模型。"}], "paper_url": "https://arxiv.org/abs/2606.26092", "sort_date": "2026-06-24", "experiment": {"summary": "主实验在 CaM-VVTBench 上比较自由镜头下的换衣与视频一致性。TryOnCrafter 的总体一致性得分为 9.61，高于表中两阶段方案；它在完成目标换衣的同时，能够较好保持新机位下的人物和场景。", "caption": "主表比较两阶段方案与本文方法。† 表示沿输入镜头轨迹运行的版本；最后一行是支持自由镜头的完整方法。", "src": "figures/paper-02-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["视频试衣", "自由镜头", "3D 高斯", "四维重建", "扩散模型"]}, {"id": "paper-10", "title": "ComMark: Covert and Robust Black-Box Model Watermarking with Compressed Samples", "chinese_title": "ComMark：基于压缩样本的黑盒模型水印", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Yang, X Chen, Z Zhao, Y Zhou, X Gu, J Cao", "publication": {"venue": "ICMR 2026", "date_label": "在线发表", "date": "2026-06-15", "preprint_date": "2025-12-16", "arxiv_id": "2512.15641"}, "motivation": "假如有人通过不断调用接口，复制了你训练的模型，你可能只能查询对方的接口，看不到它的参数。怎样证明它与你的模型有关？模型水印会预先让模型对少数特殊输入给出约定答案。本文研究把这些特殊输入藏在图像压缩过程中，让水印更不显眼，也更能经受图像处理。", "context": "水印不一定是照片角落的可见标志。本文将特殊压缩后的图像与指定类别绑定，拥有者保留这些查询样本。之后即使只拿到可疑模型的 API，也能检查它是否仍保留这种约定反应。", "analysis": "水印需要同时满足两点：正常用户看图时不容易察觉异常，模型在样本经过常见预处理后仍能给出约定输出。只优化触发成功率，可能得到显眼而脆弱的模式；只追求不可见，也可能让触发信号不够稳定。", "rationale": "方法借鉴 JPEG 压缩：把图像分成小块，转换成表示不同频率变化的系数，再通过量化改变部分系数。这样可以尽量保留主要视觉内容，同时形成模型能够识别的压缩模式。训练时让这些样本对应预设标签，并加入常见图像处理和相似性约束，增强水印响应的稳定性。", "basis_title": "压缩怎样成为不显眼的水印", "method_title": "构造、训练与黑盒验证", "method_input": "正常分类训练集、水印目标标签；验证时使用保留的水印测试图和可疑模型接口。", "method_output": "兼顾正常分类与水印响应的模型，以及黑盒查询得到的水印命中率。", "result_title": "保护效果与视觉观感", "connection": "构造样本决定触发模式，联合训练把模式写进模型，核验阶段只测命中率。正常分类能力和水印响应是同一模型学习的两项任务；输入预处理增强则用于让响应不被常见变换轻易抹掉。", "architecture": [{"name": "频域水印构造", "flow": "正常图片 → 带目标标签的压缩水印图", "operation": "从正常图像构造水印样本：转入亮度与色度空间，分块做离散余弦变换，再以量化压缩改变频率成分，为处理后的样本分配预设目标标签。\n\n图像先从 RGB 转为分开表达亮度与色度的 YCbCr，再切成 8×8 小块，做 DCT 得到各频率系数。亮度、色度使用不同量化表，对系数取整后再逆变换回图像。处理方式保留主要视觉内容，同时形成分布在整张图中的压缩模式；这些图被赋予约定的目标类，成为后续写入模型的水印样本。"}, {"name": "鲁棒联合训练", "flow": "正常样本、水印及变换样本 → 带水印模型", "operation": "联合训练正常分类与水印识别，并在训练中加入多种预处理后的水印样本，使触发器适应裁剪、缩放、旋转和 JPEG 等变化。\n\n每轮从正常数据和水印数据中分别抽取一部分，模拟裁剪、旋转、缩放、噪声、模糊以及多种压缩处理。正常图仍学习原类别，水印图学习约定目标类别，防止把任意压缩都误当成水印。联合目标还加入对比形式的相似性损失，拉近同标签样本的特征，并拉开不同标签特征。"}, {"name": "黑盒所有权核验", "flow": "可疑模型 API、水印测试图 → 命中率与核验结论", "operation": "引入相似性约束巩固水印与目标类之间的关联。核验时将保留的水印样本提交给可疑模型，以目标标签命中比例是否超过阈值判断水印是否存在。\n\n拥有者预先保留一组不参与嵌入训练的验证水印图。核验时只调用可疑模型的预测接口，逐张记录是否命中约定目标类，再计算命中比例并与阈值比较。触发图、约定标签和统计阈值共同组成验证过程，不需要读取模型权重；论文再用模型修改及输入预处理实验检验该响应能否保留。"}], "findings": "四个视觉数据集上原模型水印成功率约 99.7%—100%；论文进一步检验微调、剪枝与输入预处理后的保留情况。", "limitations": "需在原模型训练时植入；较高命中率是实验条件下证据，不能自动代表法律确权或抵抗任意攻击。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-10-fig-01.webp", "original_caption": "Figure 1: Examples of watermark samples from existing black-box methods including Abstract [1], Content [79], EWE [27], MEAD [41] and BlindMark [34].", "placement": "intro", "caption": "不同黑盒水印样本并排展示，用来理解“隐蔽性”具体指什么：触发图能否仍像普通照片，而不是出现容易识别的异常图案。"}, {"number": 2, "page": 2, "src": "figures/paper-10-fig-02.webp", "original_caption": "Figure 2: The effect of visual differences in the spatial domain resulting from different components being discarded in the frequency domain. The DCT and IDCT are the discrete cosine transform and its inverse transform, respectively.", "placement": "basis", "caption": "频域不同成分的取舍会产生不同视觉变化。DCT／IDCT 在图中连接空间图像与频率表示，为压缩触发器的构造提供直观说明。"}, {"number": 3, "page": 3, "src": "figures/paper-10-fig-03.webp", "original_caption": "Figure 3: An overview of our ComMark method.", "placement": "method", "caption": "从正常图片得到压缩水印，再联合训练，最后查询可疑模型。三段流程中，只有最后一段属于所有权核验，不需要再次训练目标。"}, {"number": 6, "page": 7, "src": "figures/paper-10-fig-06.webp", "original_caption": "Figure 6: Visual comparison of covertness of different watermarking methods. (On CIFAR10)", "placement": "evidence", "caption": "视觉比较用于查看保护样本的外观变化。它补充水印命中率，因为高命中但明显损伤图像，并不能满足本文追求的隐蔽性。"}], "paper_url": "https://doi.org/10.1145/3805622.3810742", "sort_date": "2026-06-15", "experiment": {"summary": "四个视觉分类数据集同时测量正常准确率与水印命中率。ComMark 的水印成功率为 99.71%—100%，正常分类表现接近多数对比水印方法；论文另外测试了模型提取与输入预处理后的保留情况。", "caption": "Acc 是正常任务准确率，WSR 是水印成功率，均越高越好。原始模型命中率与嵌入水印后的命中率应分开看。", "src": "figures/paper-10-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["模型水印", "黑盒验证", "频域压缩", "模型提取鲁棒性"]}, {"id": "paper-25", "title": "Tag-moe: Task-aware gating for unified generative mixture-of-experts", "chinese_title": "TAG-MoE：用任务语义指导生成模型的专家分工", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Y Xu, H Yan, J Cao, Y Cheng, T Hang, R He, Z Yin, S Zhang, Y Zhang, ...", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07", "preprint_date": "2026-01-12", "arxiv_id": "2601.08881"}, "motivation": "“把背景换成海滩”和“让人物微笑”都叫图像编辑，但前者要尽量保住人物，后者必须改变脸部。如果所有任务都走同一套计算路径，不同要求可能互相干扰。这篇论文让模型内部的多个“专家”分工，并根据具体任务决定调用哪些专家，使生成和不同编辑任务能共用一个模型。", "context": "这里的“专家”是模型内部参数不同的计算模块；“路由器”负责为当前输入选择使用哪个专家。例如换背景与改表情虽然都属于编辑，但需要保留和改变的内容不同。论文希望选择专家时能考虑这种具体差别，而不仅看一个笼统的任务标签。", "analysis": "如果只根据输入特征选择专家，却不明确训练模型理解任务要求，专家分工可能偏离用户意图。一个“编辑”标签也说不清该改背景还是改表情。因此，作者在训练时提供更细的任务说明，帮助路由器学习选择依据。", "rationale": "任务说明分成三层：改动范围（Scope）、操作类型（Type）和需要保持的内容（Preservation）。模型汇总各专家的使用分数，并用余弦对齐损失让这些分数对应任务说明。训练完成后，路由器根据输入自行选专家；每个特征单元只调用部分专家，从而控制实际计算量。", "basis_title": "换背景与改表情，为什么不能混成一种任务", "method_title": "训练标签怎样影响专家选择", "method_input": "生成或编辑指令，以及任务需要的条件图片。", "method_output": "由统一稀疏专家模型生成的目标图像。", "result_title": "专家分工是否真的帮助生成", "connection": "训练阶段先生成细粒度任务语义，路由器学习让专家选择与这些语义对应。部署时用户不用再准备标签：门控由模型内部特征运行。专家增加的是可用容量，不等于每次都把所有专家计算一遍。", "architecture": [{"name": "训练期层级标注", "flow": "图像、指令、目标图 → 三层任务语义", "operation": "训练期用视觉语言模型为样本标注三层语义：作用范围、操作类型和保持约束。例如区分局部与全局变化，并标明身份、背景或结构应当保持。\n\n标注器同时看源图、指令和目标图，再从三层标签表中选择作用范围、操作类型与保持要求。比如戴上墨镜属于局部物体编辑，同时要求身份、背景和风格保持。一个样本可以包含多个保持标签，这些标签的嵌入相加得到任务语义向量，用作训练监督；它描述的是“应当完成什么变化”，而非直接规定必须使用哪个专家。"}, {"name": "稀疏专家骨干", "flow": "图像与文字 token → 专家处理后的特征", "operation": "在 Qwen-Image 的最后十层图像前馈网络中加入四个参数不同的专家。每个图像特征单元只选择一个专家处理，这就是 top-1 稀疏路由。\n\n文字嵌入、条件图潜变量和带噪声目标图的视觉 token 在 MM-DiT 中联合处理。后部图像流的前馈层换成稀疏专家，每个 token 经门控选择 top-1 专家计算，再返回原网络。专家拥有不同参数，注意力仍承担文字与图像之间的联系；因此扩展的主要是后部生成容量，而不是给每种任务另外训练一套完整模型。"}, {"name": "语义对齐路由", "flow": "路由特征、训练标签 → 有语义分工的门控", "operation": "聚合路由特征并预测任务语义，通过余弦对齐损失把专家选择与任务含义联系起来。推理依靠内部路由，不需要额外输入任务标签。\n\n方法把各 MoE 层、各 token 的路由分数平均，形成整张样本的专家使用特征，再经小型预测头映射到任务语义空间，以余弦对齐损失监督它。训练还保留生成损失和负载均衡损失。推理不再需要训练标签，但会用 VLM 结合源图改写用户指令，再让内部门控自行选专家；“不输入标签”不等于完全移除文字预处理。"}], "findings": "在 ICE-Bench 等五组基准上评估，并通过移除语义对齐的消融检验任务监督的作用。", "limitations": "仍依赖VLM预处理，不能联合理解图像内数学等内容；部分训练数据为私有。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-25-fig-01.webp", "original_caption": "Figure 1. We present TAG-MoE, by injecting high-level task semantic intent into the local routing decisions of the MoE gating network, we enabling the diffusion transformer model to handle diverse generative tasks.", "placement": "intro", "caption": "不同生成与编辑任务放在同一框架中，体现统一模型要处理的要求差异。观察任务是否既执行了修改，也保住应保持的内容。"}, {"number": 2, "page": 4, "src": "figures/paper-25-fig-02.webp", "original_caption": "Figure 2. Pipeline of our method. TAG-MoE consists of: (1) A MM-DiT with MoE layers; (2) A Hierarchical Task Semantic Annotation that labels training data with atomic task descriptors; (3) A novel Semantic-Aligned Router explicitly aligns MoE routing behavior with task semantics through Predictive Alignment Regularization.", "placement": "method", "caption": "三个主要部分分别是带 MoE 的骨干、层级任务标注和语义对齐路由。标注线只存在于训练监督，不应误读为用户推理时额外调用一个标注模型。"}, {"number": 3, "page": 7, "src": "figures/paper-25-fig-03.webp", "original_caption": "Figure 3. Qualitative comparison on diverse tasks. Our model successfully resolves complex task conflicts where baselines fail.", "placement": "evidence", "caption": "跨任务对比说明作者关心的任务冲突：同一个模型能否根据指令改变操作，而不是在每个任务上套用同样的修改强度。"}], "paper_url": "https://arxiv.org/abs/2601.08881", "code_url": "https://github.com/ICTMCG/TAG-MoE", "sort_date": "2026-06-03", "experiment": {"summary": "在 ICE-Bench 统一任务中，TAG-MoE 的 VLM 问答评价分数为 0.852，高于表中开源对比项；美学分数为 5.399。不同保持和对齐指标存在差异，部分闭源方法仍有优势。", "caption": "开源与闭源方法分组列出。CLIP-src、CLIP-cap、CLIP-ref 分别衡量与源图、文字和参考信息的匹配程度。", "src": "figures/paper-25-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["统一生成与编辑", "混合专家", "语义门控", "稀疏激活"]}, {"id": "paper-26", "title": "GeoHOI: Geometry-Enhanced Human-Object Interaction Video Generation via Hierarchical Multi-Modal Injection", "chinese_title": "GeoHOI：以多视角几何约束人—物交互", "year": "2026", "theme": "可控视频生成", "authors": "Ziyi Xu, Zejing Rao, Juan Cao, Xiaoqiang Liu, Zhixue Fang, Haoxian Zhang, Songlin Tang, Fan Tang（正式PDF）", "publication": {"venue": "CVPR 2026 · Findings", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "让人物拿着商品转动时，商品正面像参考图还不够，侧面的厚度、轮廓和手指接触也要合理。一张参考图只能展示一个视角，模型很容易在转动后把商品画变形。这篇论文加入帮助理解物体三维形状的信息，并把它与手势、运动轨迹一起交给视频模型。", "context": "一张商品图只展示可见表面，视频里转动后还要保持体积和结构。多视角几何特征补充这种约束；手势与点轨迹说明运动，但它们本身不包含完整物体外观。方法把这些信息按职责接起来。", "analysis": "几何、纹理和文字不必在网络每层都以相同方式混合。作者让较浅的层更多使用几何信息，较深的层更多补充纹理和文字细节。这是在同一次生成更新中按网络深度分工，目的是减少商品外观像参考图、结构却在转动中变形的问题。", "rationale": "基础视频模型采用流匹配（Flow Matching）：将视频的压缩表示 x₀ 与噪声 x₁ 按 x_t=(1−t)x₀+tx₁ 混合，训练网络预测变化方向；生成时沿反方向从噪声恢复视频。GeoHOI 在此基础上加入参考条件，用 VGGT 几何视觉模型提取结构信息，再按网络深度安排几何、纹理和文字的注入位置。", "basis_title": "物体转过来以后，不能只保留纹理", "method_title": "几何、纹理和动作怎样分工", "method_input": "人物首帧、物体多视角图、文字描述、手势序列与稀疏物体轨迹。", "method_output": "物体几何和外观较稳定的人—物交互视频。", "result_title": "哪些组件帮助物体少变形", "connection": "几何提取器提供物体结构，纹理编码器提供表面细节，文字说明动作要求。它们被分配到视频网络的不同深度；首帧、手势和物体轨迹则提供外观起点与运动条件，最终共同决定生成视频。", "architecture": [{"name": "多视角几何提取", "flow": "物体多视角图、相机姿态 → 几何条件", "operation": "从多视角物体图中提取 VGGT 多层几何特征，并以相机姿态调制物体潜变量；同时提取 DINO 纹理特征，分别描述结构与表面外观。\n\nVGGT 从多视角物体图提取多个中间层的几何特征，覆盖局部轮廓到整体结构；DINO 另行提取纹理。相机头预测每张参考图的视角，再产生缩放与平移参数，对 VAE 物体特征做调制。这样模型接收的不只是多张外观图片，还能区分它们来自哪些视角，减少跨视角融合时把形状混淆。"}, {"name": "层级多模态注入", "flow": "几何、纹理、文字 → 各层条件化特征", "operation": "按照层级注入策略，在浅层主要加入几何与文字，中层逐步引入纹理，深层重点细化纹理和语义，让不同信息进入更适合的计算阶段。\n\n论文把 30 个 DiT 块分成三个区段：浅层以几何和文字条件为主，中间层逐渐降低几何权重、提高纹理权重，深层再以文字和纹理细化外观。每类条件经过各自的交叉注意力后加权合并。这是同一次去噪内部按网络深度分配信息，不能与去噪时间步的早晚混为一谈。"}, {"name": "动作控制与视频去噪", "flow": "首帧、手势、物体点轨迹 → 交互视频", "operation": "以手部姿态序列、稀疏物体点轨迹和参考首帧控制视频运动，并构建自动数据处理流程，提供较一致的交互监督。\n\n手势与轨迹序列先用共享 VAE 编码，加入带噪声的视频潜变量，再和调制后的物体参考特征拼接；首帧保持为不加噪的条件。训练素材通过物体检测、分割跟踪和点跟踪生成一致的控制序列。模型随后按 Flow Matching 学习视频变化，推理时让首帧外观随给定的手和物体运动展开。"}], "findings": "相对 Wan2.2-5B，Object-IoU 提高 26.2%，手部 LMD 下降 19.6%；两项均为论文所报相对变化。", "limitations": "依赖上游姿态、分割与跟踪；透明、反光物体及复杂多人互动仍困难。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-26-fig-01.webp", "original_caption": "Figure 1. We propose GeoHOI, a human–object interaction video generation framework built on the DiT architecture. By introducing object geometry priors and hierarchical injection policy, GeoHOI enhances object perception and modeling, enabling the preservation of shapes and textures under complex motions and achieving high-quality interaction generation.", "placement": "intro", "caption": "示例关注转动和交互时物体形状、纹理是否延续。不能只看首帧像参考图，还要看运动以后是否仍是同一物体。"}, {"number": 2, "page": 3, "src": "figures/paper-26-fig-02.webp", "original_caption": "Figure 2. Training pipeline of GeoHOI: based on a video generation model, GeoHOI employs the Multi-view Geometry Prior Extractor to capture object geometry priors and designs a Hierarchical Injection Policy to effectively integrate multimodal information while preventing confusion among features from different sources.", "placement": "method", "caption": "VGGT 几何、DINO 纹理、相机姿态、手势和物体点轨迹在图中各有入口；层级注入把不同来源安排到相应层，避免一开始无差别混合。"}, {"number": 6, "page": 7, "src": "figures/paper-26-fig-06.webp", "original_caption": "Figure 6. Ablation study. Unlike other variants that exhibit object deformation or texture errors, our method preserves consistency and produces plausible motion interactions.", "placement": "evidence", "caption": "移除几何、纹理或改变注入策略后的结果展示具体失败。消融让模块作用从名称变成可见现象，例如结构变形或纹理错误。"}], "paper_url": "https://openaccess.thecvf.com/content/CVPR2026F/html/Xu_GeoHOI_Geometry-Enhanced_Human-Object_Interaction_Video_Generation_via_Hierarchical_Multi-Modal_Injection_CVPRF_2026_paper.html", "sort_date": "2026-06-03", "experiment": {"summary": "在人—物交互测试中，相比 Wan2.2-Pose-5B，GeoHOI 的商品 IoU 从 0.61 提高到 0.77，手部 LMD 从 12.41 降到 9.98。删除几何或纹理特征后，商品与手部指标均变差。", "caption": "IoU 与 CLIP 越高越好，FID、FVD 和 LMD 越低越好。下半表同时给出组件删除与注入层交换结果。", "src": "figures/paper-26-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["人—物交互", "视频生成", "多视角几何", "分层条件注入"]}, {"id": "paper-27", "title": "ResCa: Residual Caching for Diffusion Transformers Acceleration", "chinese_title": "ResCa：用代理 token 与残差缓存加速扩散模型", "year": "2026", "theme": "高效模型与鲁棒学习", "authors": "H Fang, Y Li, F Tang, Y Lu, J Cao, S Tang", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "AI 绘图通常要反复修改画面很多次，每一次都计算整张图，速度就会很慢。直接沿用上一次的计算结果虽然省时，却可能让该变化的细节停在原地。这篇论文只重新计算一部分有代表性的图像位置，再利用它们的变化来估计其他位置该怎么更新，争取同时减少耗时和画面损失。", "context": "模型会把画面表示成许多个小单元，称为 token。每一轮生成都要更新它们的特征。本文缓存上一轮特征，但不直接照搬旧值，而是估计本轮应增加或减少多少；这种前后差值就是这里所说的“残差”。", "analysis": "当前看起来相似的 token，后续去噪方向未必一致；缓存绝对特征也容易积累误差。因此需要根据历史轨迹判断谁可以共同更新，并复用“变化量”而非简单冻结所有内容。", "rationale": "作者观察到，一段时间内变化相近的图像位置，其更新量更容易相互参考。因此，TETC 先根据近期历史把这些位置分组，再让组内一个位置承担代表性计算，为其他位置估计更新。论文还比较不同阶数的残差，选择更稳定的低阶变化作为近似更新的重要依据。", "basis_title": "缓存旧特征与复用变化量，有什么不同", "method_title": "怎样只算代表 token，又让其他位置继续更新", "method_input": "已有扩散 Transformer 的去噪过程、各视觉 token 的近期历史特征。", "method_output": "以较少完整 token 计算得到的生成结果。", "result_title": "近似计算是否保住细节", "connection": "完整步骤建立历史轨迹和缓存，分组找出变化相近的位置，稀疏步骤只算代理，再模拟其他 token 的更新。这里“代理”不是语言智能体，而是承担代表性计算的一个视觉特征单元。", "architecture": [{"name": "密集步骤缓存", "flow": "全部 token → 当前特征和历史轨迹", "operation": "完整计算当前状态并保存，为下一轮分组和近似更新提供参照。\n\n去噪时间步分成密集与稀疏两类。密集步让全部 token 正常通过网络，并保存各层特征及其历史变化，作为后续近似计算的参照。它承担定期校准的职责：稀疏步之间即使出现近似误差，后续完整更新仍会重新观察所有位置，分组与缓存也能随当前轨迹调整。"}, {"name": "TETC：历史轨迹聚类", "flow": "多步特征变化 → 轨迹相似组", "operation": "用近期加权的历史相似度分组，不只比较某一时刻的特征。\n\n每个历史时间步先计算 token 两两之间的余弦相似度，再用移动平均提高近期状态的权重，得到累积相似度。随后使用以真实数据点为中心的 K-medoids 聚类，将长期变化相近的位置放在同组。分组依据是一段变化历史，因而比单次截图式的相似度更贴近“后面能否共享更新”的问题。"}, {"name": "代理 token 更新", "flow": "每组代表 token → 当前真实去噪残差", "operation": "在稀疏计算步骤，每组选择代理 token 真正执行去噪，其余 token 不再逐一通过全部计算。代理提供本组当前变化的参考。\n\n每组随机选择一个实际 token 作为代理，在稀疏步真正执行网络更新，再通过相邻历史状态的有限差分计算多阶残差：一阶表示变化量，更高阶描述变化怎样继续改变。其余 token 跳过相应完整计算。代理提供的是当前这组轨迹怎样变化的参考，并不负责把自己的绝对特征覆盖给组内所有位置。"}, {"name": "残差模拟与校准", "flow": "代理变化、组内历史 → 全部 token 新状态", "operation": "组内其余 token 保留自己的低阶变化，再根据代理的新变化进行修正，估计下一步状态；后续完整计算步骤会重新校准所有位置。\n\n组内每个未单独计算的 token 先保留自己的残差，再依据它与代理残差的余弦一致性设置非负置信度，将自身残差与代理的新残差加权混合；一致性低时更多沿用自己的方向。所得多阶变化量进入隐式 ODE 更新，生成该 token 的下一状态。这样共享的是有置信度调节的变化信息，不同位置仍维持各自的特征。"}], "findings": "在 DiT、FLUX 和 HunyuanVideo 上评估；论文报告 FLUX 最高达到 5.5 倍 GFLOPs 加速，不能直接等同于端到端耗时缩短 5.5 倍。", "limitations": "GFLOPs倍数不等于实际运行速度；聚类/代理误差会随压缩加大影响质量。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-27-fig-01.webp", "original_caption": "Figure 1. Illustration of denoising trajectories. Solid and dashed line denotes the realized and the target trajectories. (a) Original trajectory. (b) Caching: reuse the previous step xa t , forming a non- updated denoising direction (does not stay fixed due to residual connections). (c) Merging: merge similar at and ct into bt, reusing the xb t, forming a non-self denoising direction. (d) Ours: computes multi-order residuals ∆kxc t to guide the cached xa t , thus achieving a both self and updated trajectory.", "placement": "intro", "caption": "轨迹示意对照原始去噪、缓存、合并与本文方式。它帮助分清各加速方法到底省掉了什么，以及输出偏离目标轨迹的方式。"}, {"number": 2, "page": 3, "src": "figures/paper-27-fig-02.webp", "original_caption": "Figure 2. Preliminaries. Upper: Where to find the similar residuals? Illustration of (a) feature- and (b) trajectory-based clusters, where the trajectory-based clusters groups the blue and red trajectories more accurately. (c) Comparison of the two methods showing that trajectory- based clusters have lower pairwise distance of residuals within each cluster. Lower: How to use the similar residuals? (d) Intra-cluster L2 distance of multi-order residuals, indicating that 1st-, 2nd-, and 3rd-order residuals are more reusable than 0th-order ones. (e) Intra-cluster residual relationships across timesteps, showing that smaller historical residual distance implies higher reuse value for future residuals.", "placement": "basis", "caption": "上半部分比较按当前特征和按历史轨迹分组，下半部分分析不同阶残差。作者据此选择轨迹聚类和更可复用的低阶变化，而非任意挑一个 token 代表其他位置。"}, {"number": 3, "page": 4, "src": "figures/paper-27-fig-03.webp", "original_caption": "Figure 3. Overview. grey: In the dense timestep, all tokens are processed to cache their features, followed by TETC to group tokens. In the sparse timestep, one proxy token from each group is selected for denoising, which then uses PDDS to guide the denoising of other tokens. blue: Temporal-Enhanced Trajectory Clustering (TETC): perform clustering using a similarity metric computed by token trajectories. orange: Proxy-driven Denoising Simulation (PDDS): use the driven token’s residuals as the main direction; the proxy token’s residuals provide directional corrections to estimate the future direction, and subsequently simulate the denoising process using an implicit ODE.", "placement": "method", "caption": "密集步骤缓存和分组，稀疏步骤更新代理并进行残差模拟。TETC 与 PDDS 分别回答“谁可以一起更新”和“怎样由代理推算更新”。"}, {"number": 5, "page": 7, "src": "figures/paper-27-fig-05.webp", "original_caption": "Figure 5. Qualitative comparison in text-to-video generation on HunyuanVideo. ResCa generates high-quality, semantically aligned videos, while others suffer from issues such as misplaced bottle caps, missing water splash details, and missing drumstick objects.", "placement": "evidence", "caption": "视频对比观察语义和局部细节是否保住。计算量少只是效率指标，瓶盖、水花、鼓槌等细节是否丢失则体现近似代价。"}], "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Fang_ResCa_Residual_Caching_for_Diffusion_Transformers_Acceleration_CVPR_2026_paper.html", "code_url": "https://github.com/Fanghaipeng/ResCa_Residual_Caching", "sort_date": "2026-06-03", "experiment": {"summary": "FLUX.1-dev 的 50 步设置下，一组 ResCa-IT 配置将耗时从 25.82 秒降到 7.17 秒，即 3.60 倍加速；DrawBench 的 Image Reward 从 0.9898 到 0.9937，基本保持质量。", "caption": "Latency 表示实际耗时，FLOPs 表示计算量。每组配置同时列出速度和生成质量，可以按需要选择取舍。", "src": "figures/paper-27-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["扩散加速", "残差缓存", "轨迹聚类", "代理去噪"]}, {"id": "paper-13", "title": "Headrouter: A training-free image editing framework for mm-dits by adaptively routing attention heads", "chinese_title": "HeadRouter：按注意力头语义进行图像编辑", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Fan Tang, Juan Cao, Yuxin Zhang, Xiaoyu Kong, Jintao Li, Oliver Deussen, Tong-Yee Lee（所读原文顺序）", "publication": {"venue": "ACM Transactions on Graphics 45(3)", "date_label": "在线发表", "date": "2026-04-24", "preprint_date": "2024-11-22", "arxiv_id": "2411.15034"}, "motivation": "把照片里的鹦鹉改成钩织材质时，你通常还希望它的位置、形状和背景别乱变。对整张图统一加强文字指令，可能连不该改的地方也改了。这篇论文观察模型内部负责联系文字和图像的不同“注意力头”，为这次编辑挑出更相关的部分，尝试直接使用现成模型完成更有针对性的修改。", "context": "模型内部有多个并行计算文字与图像联系的单元，称为“注意力头”。它们对同一次编辑的反应并不相同。把鹦鹉改成钩织材质时，论文希望挑出与这次修改更相关的头，提高它们的作用，同时保留主体、构图和不需要修改的内容。", "analysis": "同一句指令作用于不同图片时，要改的位置和内容可能不同，固定使用同一组注意力头不够灵活。方法因此根据当前图片和指令选择更相关的头，并进一步调整文字单元与图像特征单元（token），让修改落到合适的位置。", "rationale": "作者先分析不同注意力头对编辑语义的敏感性，再在方法中比较重建与编辑分支的头输出相似度，动态调整贡献。双 token 细化分别作用于文字指导和图像区域表达。设计依据来自头部响应分析及删除、替换实验，而非预设每个头都有固定语义名称。", "basis_title": "注意力头为什么值得分别控制", "method_title": "编辑目标怎样找到相关计算路径", "method_input": "原始图像、重建描述与目标编辑描述。", "method_output": "按目标指令修改、尽量保留其他内容的图像；无需额外训练。", "result_title": "语义修改与原图保留", "connection": "先用原图重建与目标编辑比较头部响应，再按实例分配权重。双 token 细化随后分别照顾文字指导和图像区域，使“选对计算路径”与“把修改落到正确位置”连起来。", "architecture": [{"name": "IARouter：实例自适应路由", "flow": "重建／编辑分支头输出 → 调整后的头贡献", "operation": "推理中比较重建与编辑分支对应头的输出差异，根据本次编辑目标动态调整各头贡献，强调相关变化，同时保留不相关头原有信息。\n\n重建分支按原描述恢复原图，编辑分支按目标描述生成修改图。每个注意力头都分别在重建分支和编辑分支产生输出，方法计算这两份输出的余弦相似度，再将差异归一化。差异大的头说明本次修改对它的响应影响较明显，路由器用平滑的 Sigmoid 权重增强这类输出；较不相关的头仍保留接近原先的贡献。权重随图像与指令变化，因此无需事先给每个头指定固定的语义类别。"}, {"name": "DTR：双 token 细化", "flow": "文本与视觉 token → 更准确的编辑结果", "operation": "双 token 细化一方面增强编辑文本的表达，另一方面借助文本到图像的联系调整相关视觉 token，在无需额外训练的流程中改善目标语义落地。\n\nDTR 同时处理“文字是否持续起作用”和“修改应落在哪些位置”。图像一侧根据文字与视觉 token 的注意力联系，对更相关的位置提高权重；文字一侧把前一块的文本输入通过残差传到后续块，减轻文字指导沿层数加深而衰减的问题。头级路由选择有用的计算贡献，token 级细化再调整这些贡献落到哪里。"}], "findings": "论文在多种编辑基准上比较质量与指令对齐，并用注意力头删除、替换实验检验头部选择的作用。", "limitations": "“语义专长”是经验敏感性，不能视为完全独立的开关；超出基础生成模型能力的编辑仍难。", "figures": [{"number": 2, "page": 3, "src": "figures/paper-13-fig-02.webp", "original_caption": "Figure 2. Analysis of multi-head attention in MM-DiTs. We illustrate the distribution of distinct semantics across attention heads. Dropping the most influential head leads to significant shifts in associated semantics while swapping the output features of this head enables targeted semantic injection to a certain degree.", "placement": "basis", "caption": "删除或交换重要注意力头，会改变相关语义，图中以实际生成结果说明不同头并非完全可互换。这是选择性路由的依据。"}, {"number": 3, "page": 4, "src": "figures/paper-13-fig-03.webp", "original_caption": "Figure 3. Analysis of text guidance on image tokens. Key image regions influenced by text guidance are identified within the joint self-attention map and visualized. Additionally, we observe that text guidance influence diminishes as attention blocks progress in the denoising steps, leading to weakened semantic representation from text-guided editing.", "placement": "basis", "caption": "文字指导对图像 token 的影响既有空间分布，也会在模型中衰减。该分析说明，仅选择注意力头还不够，需要维护文字指导和相关视觉区域。"}, {"number": 4, "page": 5, "src": "figures/paper-13-fig-04.webp", "original_caption": "Figure 4. Pipeline of our method. We mainly introduce instance-adaptive attention head router (IARouter) to adaptively activate attention heads based on their semantic sensitivity, enabling a more accurate representation of the edited specific images.", "placement": "method", "caption": "重建分支提供原图参照，编辑分支响应目标文字；IARouter 调整头贡献，DTR 进一步细化文字与图像 token，两者接入同一无需训练的编辑过程。"}, {"number": 6, "page": 7, "src": "figures/paper-13-fig-06.webp", "original_caption": "Figure 6. Qualitative comparison with baseline methods on various editing tasks. Our results demonstrate high alignment with the text guidance while keeping consistency with the reference image.", "placement": "evidence", "caption": "不同编辑任务的并排结果同时检查两点：目标语义有没有改出来，不需要改的原图内容是否还在。单看画面漂亮无法回答后一问题。"}], "paper_url": "https://doi.org/10.1145/3797956", "code_url": "https://github.com/ICTMCG/HeadRouter", "sort_date": "2026-04-24", "experiment": {"summary": "在 TEDBench++、PIE-Bench 等编辑测试中，同时检查原图保持与文字对齐。主表中 DINO 相似度为 0.9194、文字 CLIP 相似度为 0.3203，LPIPS 为 0.2103，体现了无需训练条件下的编辑与保持平衡。", "caption": "DINO 衡量图像内容保持，CLIP 衡量文字匹配，均越高越好；LPIPS 衡量感知差异，越低越好。", "src": "figures/paper-13-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["图像编辑", "无需训练", "注意力头路由", "多模态扩散"]}, {"id": "paper-23", "title": "Interactive Visual Assessment for Text-to-Image Generation Models", "chinese_title": "DyEval：交互式探索文生图模型的能力边界", "year": "2026", "theme": "图像编辑与生成评估", "authors": "X Mi, F Tang, J Cao, Q Sheng, Z Huang, P Li, Y Liu, TY Lee", "publication": {"venue": "IEEE TVCG 32(4)", "date_label": "卷期", "date": "2026-04", "preprint_date": "2024-11-23", "arxiv_id": "2411.15509"}, "motivation": "测试绘图模型时，反复使用一批固定提示词，可能很快测不出新问题：模型会画简单场景，却仍可能画错数量或物体关系。这篇论文让测试根据上一轮结果继续出题。能通过就进一步增加难度，失败就围绕出错点细查，从而持续找到模型的薄弱之处。", "context": "假设模型在一个简单主题上经常通过，继续问相同问题并不能发现边界；出现失败后，又需要区分是数量、关系还是文化含义导致。DyEval 让评估沿主题向下探索，同时在失败处做局部诊断。", "analysis": "随机增加提示词会浪费测试预算，单纯追逐失败又可能陷在一个很窄的问题里。发现失败后，还需要知道是某个词、关系还是组合造成问题，才有助于后续改进。测试组织和失败解释因此需要一起设计。", "rationale": "论文用一棵测试树记录主题、提示词和测试结果。根据人工反馈，系统继续细化已通过的主题，或拆解失败提示里的对象、属性和关系，检查哪个条件导致错误。它把“继续测什么”与“这次为什么失败”放在同一个交互流程中。", "basis_title": "评估不只要一个分数，还要找到问题", "method_title": "一次反馈怎样产生下一次测试", "method_input": "待测文生图模型、初始测试主题，以及评估者对生成图片的通过／失败反馈。", "method_output": "一棵记录测试主题、提示、图片、通过率和失败分析的测试树。", "result_title": "如何把失败缩小到具体条件", "connection": "测试树记录已经测过哪些内容，人对生成结果给出反馈，大模型再决定深入主题还是定位失败。定位时，将提示里的物体及关系整理成“场景图”，拆成较小条件分别复测，检查哪部分一加入就容易出错。", "architecture": [{"name": "测试树与新提示", "flow": "用户主题、已有反馈 → 层级测试输入", "operation": "以测试树组织主题、提示词、生成图和人工反馈，让不同层次的能力覆盖与测试历史在同一界面中可见。LLM 根据主题和已有反馈生成新的测试输入。\n\n每个节点保存主题、该主题下的提示与生成图、人工判断和已有反思。LLM 读取当前主题和父节点测试历史后产生新提示，先检查主题相关性并去重，再让待测模型为每条提示生成多张图片。评估者按预设标准标记通过或失败；CLIPScore 仅作初筛，自动失败项仍显示给人复核，之后结果写回节点。"}, {"name": "自适应深化", "flow": "已有测试结果 → 更细或更难的测试", "operation": "对已经掌握的主题继续加深难度或细化条件，使测试随着模型表现变化，而不是始终重复相同的简单样本。\n\n节点的平均通过率决定接下来走哪条路径：达到要求时，LLM 结合历史提出相关子主题，由评估者选择后继续向下探索；低于要求时，则先进入失败定位。测试树的深度和宽度控制探索范围，因而评估不是无限增加相似提示，而是带着已有表现逐层细化，直到达到设定的探索深度。"}, {"name": "上下文反思", "flow": "失败提示及其场景图 → 失败触发条件", "operation": "遇到失败后，把提示转成场景图，用分治方式缩小触发错误的条件组合，再让 LLM 反思可能的失败模式，形成可供人检查的诊断。\n\n失败提示先被转成描述对象、属性和关系的场景图，再分成两个较小子图，分别转回文字重新测试。若某个子集仍失败，就继续拆；若两边单独都成功，则进一步检查组合条件。找到较小的失败触发条件后，LLM 结合节点历史总结可能模式，供人检查并用于下一轮测试。这个过程保留实际复测结果，不只生成一段失败猜测。"}], "findings": "在相同测试样本预算下，论文报告最多发现 2.56 倍失败案例，并展示代词、隐含关系和文化语境等较难问题。", "limitations": "仍需要人工评判；发现更多失败不直接代表模型整体错误率，受搜索策略影响。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-23-fig-01.webp", "original_caption": "Fig. 1: Diagram of the DyEval, a dynamic interactive testing framework for Text-to-Image (T2I) models. DyEval leverages a Large Language Model (LLM) to generate test prompts based on model feedback dynamically. The T2I model outputs are assessed, and results are used to update a test tree. Nodes with high pass rates (green) continue to explore deeper layers, while nodes with high fail rates (brown) are analyzed by the LLM to analyze failure reasons.", "placement": "intro", "caption": "测试树中，通过较多的节点继续深入，失败较多的节点转向分析。它说明动态评估改变的是测试方向，而不只是自动写更多提示词。"}, {"number": 2, "page": 4, "src": "figures/paper-23-fig-02.webp", "original_caption": "Fig. 2: Overview of DyEval. The DyEval process begins with setting initial topics and model parameters (Step A). In the test input generation phase, the LLM creates initial test inputs for the selected topic (Step B). Evaluators then review and annotate the generated images (Step C) and update the test tree accordingly (Step D). If a test node shows low average pass rates (Step E), the LLM refines these inputs to identify potential failure triggers in the dynamic failure location module (Step F). It then reflects on all available information related to the current topic (Step G) and updates the test tree (Step H). If the pass rates are satisfactory, the LLM proposes new topics based on the test context (history testing records in the testing tree) (Step I). Evaluators can select these new topics (Step J) to generate additional test inputs, continuing the evaluation cycle. This iterative process continues until the maximum exploration depth is reached.", "placement": "method", "caption": "从设置主题、生成测试输入、人工评价到更新树和反思，图中每个步骤都有对应输出。反馈进入下一轮输入生成，是流程闭环的关键。"}, {"number": 5, "page": 8, "src": "figures/paper-23-fig-05.webp", "original_caption": "Fig. 5: A test process case of DyEval. The initial test topic is “Spacial relationships” and the APR of this test node is 0.60. Based on the test records of the current topic, LLM continuously generates new test topics to analyze the model capability boundaries further. We also provide specific test inputs in the path of the test tree. Green represents nodes with test pass rate greater than or equal to 0.6, light orange represents pass rate (0.6,0.3], and less than 0.3 is dark orange.", "placement": "detail", "caption": "一个空间关系主题沿测试树展开，展示抽象主题怎样变成具体提示及反馈。读者可以顺着节点理解，系统不是一次性罗列固定测试集。"}, {"number": 9, "page": 9, "src": "figures/paper-23-fig-09.webp", "original_caption": "Fig. 9: An error analysis example mentioned in the paper. Given the test input “A dog and its owner taking a leisurely walk in the park on a bright morning.” to test relation generation for SD1-5. While the model correctly generates a leash connecting two subjects, it fails to properly generate the dog and man themselves.", "placement": "evidence", "caption": "“狗与主人散步”的例子中，关系连接可能正确，主体本身却仍有问题。案例提醒我们，图像某一项通过不代表整条提示全部满足。"}], "paper_url": "https://doi.org/10.1109/TVCG.2026.3658714", "sort_date": "2026-04-01", "experiment": {"summary": "在相同测试输入预算下，对 SD1-5、SD2-1、SDXL、SD3 比较动态测试与非自适应测试。DyEval 能找到更多失败样例，在 SD1-5 上最多达到 2.56 倍，且发现的问题覆盖更多测试方向。", "caption": "这里通过率越低，代表测试找出了更多生成错误，因此更能体现测试方法发现薄弱点的能力。", "src": "figures/paper-23-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["文生图评测", "动态测试", "人类反馈", "失败定位"]}, {"id": "paper-18", "title": "Tailoring Rumor Debunking to You: Diversifying Chinese Rumor-Debunking Passages with an LLM-Driven Simulated Feedback-Enhanced Framework", "chinese_title": "MURSE：面向不同读者的中文辟谣生成", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "X Pang, D Wang, Q Sheng, Y Sun, B Hu, J Cao", "publication": {"venue": "EACL 2026 · Industry Track", "date_label": "会议", "date": "2026-03-25—27"}, "motivation": "同一篇辟谣文章，有人觉得证据清楚，有人却被专业术语劝退，也有人对生硬的纠正产生抵触。这篇论文研究如何面向不同读者调整辟谣文章的说法。核查结论和证据保持一致，改变的是解释顺序、措辞和信息安排，让读者更容易读懂和接受。", "context": "个性化在这里不改变谣言真假，也不按读者喜好改核查结论。变化的是解释顺序、措辞和信息安排。专业证据仍是共同依据，用户画像决定如何把证据讲得更容易理解和接受。", "analysis": "事实正确、文字流畅与读者愿意接受并不是同一件事。真实用户反馈收集慢，自动生成又容易停留在“换一种语气”。方法需要把预期读者反应转换成具体修改意见，并控制改写不偏离原有证据。", "rationale": "作者引用面向用户的纠正研究，将“可读”与“被读者接受”区分开，并据此引入用户画像和模拟反馈。MURSE 用读者、顾问与编辑之间的迭代，将预期反应转成修改建议；论文检验的是生成文本偏好，未把它当作真实信念转变的理论证明。", "basis_title": "同一份证据，怎样对不同读者说明白", "method_title": "反馈如何变成下一轮修改", "method_input": "谣言主张、专业核查证据，以及目标读者画像。", "method_output": "保留原核查事实、按目标读者特点调整的辟谣文章。", "result_title": "改写带来的收益是什么", "connection": "通用稿进入模拟反馈模块，读者角色先给反应，顾问整理建议，编辑再修改。下一轮重新评价稿件，因此反馈不是生成结束后的附加评语，而是直接参与下一次文本生产。", "architecture": [{"name": "通用证据稿", "flow": "谣言、专业核查证据 → 初始辟谣稿", "operation": "先以谣言主张和专业核查证据生成通用稿，明确辟谣应保留的事实与结论，避免从用户偏好直接生成立场。\n\n初稿以核查证据为事实基础，先完成通用辟谣，再进入用户定制阶段。这样后续编辑接收到的不只是“写给谁看”，还有必须解释的主张和能够使用的证据。原始谣言与支持材料也会继续交给编辑角色，避免迭代时只围绕模拟反馈改变语气，却逐渐丢失辟谣的事实依据。"}, {"name": "模拟读者与顾问", "flow": "初稿、用户画像 → 反馈与修改意见", "operation": "按年龄、性别、教育程度组合出 24 类读者画像，让模拟读者对稿件给出反馈；顾问角色将这些反应整理为可以执行的改写建议。\n\nCommenter 根据画像和谣言生成模拟读者反应，Advisor 再结合这些反应与当前辟谣稿提出修改建议。两者的职责不同：前者呈现读者可能在意或困惑的地方，后者把这些反应变成编辑任务。画像由年龄、性别和教育程度组合，迭代中始终面向指定读者，而非把不同画像的反馈混成一篇通用改写。"}, {"name": "编辑与筛选", "flow": "修改意见、事实证据 → 面向用户的辟谣稿", "operation": "编辑角色据此多轮修改，并结合情绪友好、信息量和低冗余等要求筛选文本，形成面向目标用户的辟谣稿。\n\nEditor 同时读取建议、谣言与证据，形成下一版文章；筛选检查语气、信息量，以及与谣言的冗余程度。三项达到设定要求才输出，否则把当前稿送回反馈环节继续修改。这里的低冗余特别关注避免反复重述错误说法，因此不是简单要求文章越短越好，而是让新增篇幅主要用于证据和解释。"}], "findings": "在 CHEF 的 333 条被驳斥主张上评估；多数人工比较情形中，个性化稿的偏好次数约为通用稿的两倍。", "limitations": "画像只有三个维度，可能强化群体刻板印象；偏好选择不能证明真实用户信念长期改变；主要实验依赖特定模型组合。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-18-fig-01.webp", "original_caption": "Figure 1: Paradigm comparison between existing ➀ex- tractive, ➁abstractive approaches, and our proposed method ➂MURSE. Our proposed MURSE considers the user profile to personalize the generation of debunk- ing passages, which can more effectively help vulnera- ble populations clarify misconceptions.", "placement": "intro", "caption": "三种范式分别抽取证据、生成通用说明和按用户画像改写。新增的重点是接受度，而非仅把证据拼接得更流畅。"}, {"number": 2, "page": 4, "src": "figures/paper-18-fig-02.webp", "original_caption": "Figure 2: Illustration of the proposed MURSE framework. MURSE consists of a Simulated Feedback Module and a Passage Refinement Module. The Simulated Feedback Module utilizes a Commenter to simulate target user responses to rumors and an Advisor to analyze user feedback and provide advice. The Passage Refinement Module uses an Editor to modify the debunking passage based on this advice. The debunking passage undergoes continuous improvement until it satisfies our established criteria.", "placement": "method", "caption": "MURSE 的反馈模块与改写模块形成循环。Commenter 模拟读者反应，顾问与编辑把反应转成具体改动，事实证据贯穿整个过程。"}, {"number": 3, "page": 6, "src": "figures/paper-18-fig-03.webp", "original_caption": "Figure 3: Three criteria changes with the iteration. Round 0 corresponds to the general debunking passage.", "placement": "evidence", "caption": "三项准则随迭代变化，用于观察改写是否逐步接近设定目标。它体现的是文本质量变化，不能直接当成真实用户信念改变的证据。"}], "paper_url": "https://aclanthology.org/2026.eacl-industry.45/", "sort_date": "2026-03-25", "experiment": {"summary": "在 CHEF 的 333 条被驳斥主张上评估个性化辟谣。相比通用稿，MURSE 的语气与信息量指标提高，冗余从 0.0974 降至 0.0690；另有人工偏好实验检验读者是否更喜欢这些稿件。", "caption": "主表的 Sentiment 与 Informativeness 越高越好，Redundancy 越低越好。它们是文本评价指标，不等同于读者信念已经改变。", "src": "figures/paper-18-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["个性化辟谣", "用户画像", "多智能体", "模拟反馈"]}, {"id": "paper-17", "title": "Visual-friendly concept protection via selective adversarial perturbations", "chinese_title": "VCPro：兼顾视觉质量的选择性概念保护", "year": "2026", "theme": "大模型可信与安全", "authors": "X Mi, F Tang, Y Wu, J Cao, P Li, Y Liu", "publication": {"venue": "AAAI 2026", "date_label": "正式发表", "date": "2026-03-14", "preprint_date": "2024-08-16", "arxiv_id": "2408.08518"}, "motivation": "你愿意公开照片供人观看，却不希望别人拿它训练模型，继续生成你的形象。给照片加一点干扰可以妨碍这种学习，但干扰太强会把照片本身弄坏。这篇论文研究怎样优先保护指定的人物或概念，把有限的扰动用在相关位置，在保护效果和正常观看之间取得平衡。", "context": "用户先用一张标记图圈出要保护的脸部或其他对象，这张图称为“掩码”。优化时优先考虑这些区域，让允许的微小修改更多用于妨碍目标概念被学习，其他区域则尽量维持原来的表现。", "analysis": "生成模型学习某个人物或概念时，使用的区域未必与普通分类器关注的位置一致。如果把允许的修改幅度平均用在背景、衣物和脸部，可能既浪费保护机会，也增加可见噪声。因此，用户需要明确指定保护对象及其所在区域。", "rationale": "论文同时考虑两个目标：让目标概念更难被学习，让发布图片的可见变化尽量小。作者把两者写进带约束的优化问题，再用拉格朗日乘子调节它们在迭代中的影响。区域掩码负责区分保护对象与其他部分，使扰动具有空间上的选择性。", "basis_title": "保护概念不等于破坏整张照片", "method_title": "从用户掩码到保护图片", "method_input": "待公开图片、需要保护的概念区域掩码，以及用于构造扰动的扩散模型。", "method_output": "带有选择性扰动的图片，供拥有者公开发布。", "result_title": "同时看保护效果和图像变化", "connection": "掩码决定优化重点，生成模型的概念学习目标提供对抗信号，视觉约束限制可见变化。最终发布的是处理后的图片，后续个性化训练则用于检验这张图是否更难被未经授权地学习。", "architecture": [{"name": "概念与掩码选择", "flow": "用户保护目标 → 重点区域", "operation": "由用户提供希望保护的概念和区域掩码，将隐私或身份相关部分标记为重点；掩码也可结合其他检测工具得到。\n\n用户可以直接提供掩码，或用 SAM 等分割工具圈出脸部、特定形象等保护对象。掩码在特征空间中区分保护区与其他区域，随后参与损失计算，而不是仅用于裁剪图像。原图与掩码一同进入优化，模型因此知道哪种概念需要重点干扰，哪些区域应尽量保留正常去噪表现。"}, {"name": "选择性对抗扰动", "flow": "目标区域、概念学习目标 → 扰动图", "operation": "在概念学习过程上构造选择性对抗扰动，优先干扰生成模型对目标概念的吸收，而不是无差别破坏整幅图像。\n\n论文把区域损失分成方向相反的两项：保护区内扩大扩散模型预测噪声与真实噪声的误差，非保护区则缩小这项误差。前一项干扰目标概念的去噪学习，后一项提供保持其他区域的约束。扰动由这两部分的梯度共同决定，因而“选择性”体现为不同区域采用不同优化方向，而不是简单把噪声掩码外全部置零。"}, {"name": "视觉与保护约束协调", "flow": "保护损失、扰动约束 → 最终发布图片", "operation": "把保护有效性与可见扰动之间的权衡写成放松优化问题，利用拉格朗日乘子协调约束，在满足保护需求时尽量减少额外视觉变化。\n\n原始区域目标可能继续增加扰动，即使已经达到所需保护程度。作者进一步把保护效果与扰动大小写入放松优化问题，用拉格朗日乘子调节两者影响，并在迭代中限制更新幅度和有效像素范围。优化结束交付的是处理后的图片，保护测试再用它进行个性化学习，比较未经授权生成的结果是否仍能恢复目标概念。"}], "findings": "在人脸个性化生成实验中，相较全图扰动方法，展示了更好的保护效果与视觉质量折中。", "limitations": "主要验证 DreamBooth / Textual Inversion 与特定扩散模型；不能理解成对任意新模型或去噪处理的绝对保护。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-17-fig-01.webp", "original_caption": "Figure 1: The first row shows protected images from Anti-DreamBooth (Le et al. 2023), Mist (Zhang et al. 2022), Meta- Cloak (Liu et al. 2024), SDS(-) (Xue et al. 2024), PhotoGuard (Salman et al. 2023), and our VCPro. Second and third rows show magnified regions and Textual Inversion results. At ϵ=8/255, our method better balances protection effectiveness and visual quality (higher PSNR/SSIM).", "placement": "intro", "caption": "上排显示保护后的原图，下面显示利用这些图进行个性化生成的效果。两组一起看，才能同时判断观感和保护是否兼顾。"}, {"number": 2, "page": 4, "src": "figures/paper-17-fig-02.webp", "original_caption": "Figure 2: VCPro pipeline. Users create protective masks via SAM or other tools. The masks and images are fed into our protec- tion module (Eq. 8), which uses regional adversarial learning to minimize perturbation visibility while maintaining protection.", "placement": "method", "caption": "用户先生成概念掩码，再进入区域对抗优化。图中保护模块连接掩码和原图，强调保护强度有空间选择，而不是整图平均加噪。"}, {"number": 3, "page": 5, "src": "figures/paper-17-fig-03.webp", "original_caption": "Figure 3: Qualitative comparison (ϵ = 8/255, SD v1-4). Rows show original and protected images from baseline methods and ours, with TI/DB results. Perturbations visualized in black-yellow. Please zoom in.", "placement": "evidence", "caption": "不同方法的保护图、生成结果与扰动可视化并列。扰动分布帮助理解方法为何能把修改更多集中在目标区域。"}], "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/41250", "code_url": "https://github.com/KululuMi/VCPro", "sort_date": "2026-03-14", "experiment": {"summary": "在 VGGFace2 与 CelebA-HQ 上，以相同扰动预算比较概念保护。VGGFace2 上 VCPro 的 SSIM 为 0.90、PSNR 为 35.3，在保持较高保护指标的同时，处理图更接近原图。", "caption": "Visibility 衡量发布图片的可见变化，TI／DB 部分衡量后续个性化学习受干扰程度。应结合两组指标判断保护与观感的取舍。", "src": "figures/paper-17-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["概念保护", "选择性扰动", "对抗优化", "个性化生成"]}, {"id": "paper-21", "title": "Beyond pixels: Visual metaphor transfer via schema-driven agentic reasoning", "chinese_title": "Beyond Pixels：基于图式的视觉隐喻迁移", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Yuxin Zhang, Juan Cao, Lin Gao, Chunyu Wang, Oliver Deussen, Tong-Yee Lee, Fan Tang（v1）", "publication": {"venue": "SIGGRAPH Asia 2026", "date_label": "预印本首发", "date": "2026-02-01", "preprint_date": "2026-02-01", "arxiv_id": "2602.01335"}, "motivation": "有些图片的意思来自事物之间的关系，而不是画风。例如一个画面可以靠不合常理的组合表达讽刺；只换掉其中的主角，这层意思可能就没了。这篇论文研究怎样换成新主体后仍保留原图的寓意。它先分析参考图靠什么关系表达含义，再让生成模型为新主体重新组织画面。", "context": "论文先把参考图的含义整理成一份结构化描述，记录主体、与它共同表达寓意的对象，以及它们之间的关系。后一个对象称为“载体”。更换主体时可以重新选择载体，但要保住让隐喻成立的核心关系；否则新图可能只剩表面拼贴。", "analysis": "让模型直接模仿参考图，容易保留无关外观，却丢掉真正的类比关系。另一方面，只有一句抽象寓意也不足以决定新图中应该出现什么载体、哪些部件应如何组合。因此需要可分析、可修改的中间表示。", "rationale": "论文用七元图式显式表示视觉隐喻，迁移阶段保留跨领域共同关系 G，同时重新实例化主体、载体、属性、不协调点与寓意。这个关系不变量是作者组织迁移推理的约束；诊断角色再检查新图式与视觉实现是否一致。", "basis_title": "迁移隐喻，究竟要保留什么", "method_title": "从概念图式到可见图像", "method_input": "一张参考视觉隐喻图，以及希望替换进去的新主体。", "method_output": "主体改变、但保留参考隐喻关系的新图像。", "result_title": "图式与诊断各起什么作用", "connection": "概念合成理论提供理解隐喻的框架，七元图式把它转成可处理的描述。感知角色抽出参考关系，迁移角色重新实例化，生成角色画出来，诊断角色再回查逻辑与实现。各角色不是重复写四份提示。", "architecture": [{"name": "感知图式", "flow": "参考隐喻图 → 七元图式", "operation": "感知角色把参考图整理为七元图式，描述主体、载体、相关属性、共同关系、不协调点及涌现寓意，将隐含创意显式化。\n\n感知角色依次识别主体与载体、它们的属性、共享关系、违背常规之处，以及由此形成的寓意。输出是一组结构化字段，后续角色能单独读取其中的关系或载体，不必重新从整幅图猜含义。七元图式因此承担可修改的中间表示：先把这张图为什么构成隐喻说清，再决定哪些关系可以迁移。"}, {"name": "跨域迁移", "flow": "参考图式、新主体 → 新图式", "operation": "迁移角色保留跨领域的关系核心，分析新主体的属性，寻找适合的新载体并重新安排冲突点，使新图表达类似寓意但不机械复制原对象。\n\n迁移先保留共同关系 G，再分析新主体具有哪些属性，寻找另一个能承载相同关系的对象。随后重设主体与载体之间的冲突点，检查新组合仍能表达预期寓意。输出是完整的新图式，而不是只替换原提示词中的一个名词；主体、载体和冲突的具体形态可以改变，关系核心则作为约束保留。"}, {"name": "生成角色", "flow": "新图式 → 视觉结果", "operation": "把新主体、载体、关系与冲突转成可执行的生成描述，生成图像。\n\n生成角色把新图式转成图像模型能够执行的描述：用载体确定空间构图，明确主体怎样违背载体的常规关系，再用光照、色彩和氛围表达寓意。随后调用预训练生图模型。这个阶段处理的是视觉实现，依赖上一阶段已经选好的概念组合，不再从零寻找隐喻主题。"}, {"name": "诊断角色", "flow": "图像与图式 → 分阶段修改意见", "operation": "检查逻辑、部件选择与提示实现，回到相关阶段调整。\n\n诊断分别检查主体可辨认性、冲突是否被画出来、关系是否连贯，以及寓意是否一致。发现问题后先修改提示的构图和描述；若仍无效，再回到载体和冲突设计，必要时回查参考图式的关系提取。反馈以具体问题描述返回相应阶段，达到满意条件或迭代上限后输出最终图。"}], "findings": "以隐喻一致性、类比合理性、创意评价与人工评测比较方法。此处解读采用曹娟署名的 arXiv v1。", "limitations": "创意评估包含主观判断，且依赖VLM理解与图像生成器执行；文化隐喻可能歧义。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-21-fig-01.webp", "original_caption": "Figure 1. Diverse image metaphor transfer results generated by our framework. For each pair, the left image serves as the Reference and the right is the Generated Result. Our model demonstrates robust capability across distinct cognitive levels.", "placement": "intro", "caption": "成对示例左侧是参考隐喻，右侧是迁移结果。比较时需要看寓意和关系是否延续，而不仅是颜色、材质或构图是否相似。"}, {"number": 2, "page": 3, "src": "figures/paper-21-fig-02.webp", "original_caption": "Figure 2. Conceptual Blending Theory.", "placement": "basis", "caption": "概念合成理论区分两个输入空间、共同结构和合成空间。本文据此提取可跨领域保留的关系，再组织新主体与载体，不是凭空给多智能体流程加一个理论名称。"}, {"number": 3, "page": 4, "src": "figures/paper-21-fig-03.webp", "original_caption": "Figure 3. Architecture of our Self-Reflective Agentic Framework for Visual Rhetoric Transfer. The system consists of Perception, Transfer, Generation, and Diagnostic agents. It transforms a reference visual metaphor (Iref) into a new target context (Igen) by extracting and mapping structured graph representations (Gref →Gtgt). A hierarchical feedback loop ensures the generated output faithfully preserves the rhetorical logic while adapting to the new subject matter.", "placement": "method", "caption": "四个角色依次处理感知、迁移、生成和诊断。回路表示失败可返回相关阶段修改，让读者分清错误来自隐喻逻
