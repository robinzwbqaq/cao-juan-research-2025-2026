辑，还是图像实现。"}, {"number": 6, "page": 8, "src": "figures/paper-21-fig-06.webp", "original_caption": "Figure 6. Qualitative comparison of ablation variants. w/o CBT & Phase 1,2 (Nano-Banana-Pro [6]) performs naive object replacement. w/o CBT fails to perform complex carrier migra- tion. w/o Phase 4 exhibits specific agent failures. The Full Model correctly reasons that coffee acts as a battery, rope represents hair texture, and the ashtray demonstrates the consequences of smok- ing via a dual-panel layout.", "placement": "evidence", "caption": "消融对照展示缺少理论图式、前期推理或诊断后的差别。重点是载体是否合理、寓意是否成立，以及部件是否正确落地。"}], "paper_url": "https://arxiv.org/abs/2602.01335v1", "code_url": "https://github.com/ICTMCG/Beyond-Pixels", "sort_date": "2026-02-01", "experiment": {"summary": "用三种视觉语言模型分别评价隐喻一致性、类比合理性与创意，并补充人工评测。主表中本文方法在三组语义评价上领先对比项；例如 Gemini-3-pro 的隐喻一致性评分为 9.31，对比 Banana-pro 为 8.75。", "caption": "三组 MC、AA、CI 分别来自不同评审模型，属于自动评分；消融行用来检查概念理论、迁移阶段及诊断反馈的作用。", "src": "figures/paper-21-main-experiment.webp"}, "novelty": {"score": 5}, "fine_tags": ["视觉隐喻迁移", "概念合成理论", "多智能体", "结构化推理", "创意生成"]}, {"id": "paper-16", "title": "Beyond Semantic Features: Pixel-level Mapping for Generalized AI-Generated Image Detection", "chinese_title": "像素级映射：减少生成图像检测中的语义偏差", "year": "2026", "theme": "大模型可信与安全", "authors": "C Zhou, J Wang, Y Li, L Li, J Cao, S Tang", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-19", "preprint_date": "2025-12-19", "arxiv_id": "2512.17350"}, "motivation": "如果训练集里的假图经常是某类题材，检测器可能偷懒，把题材当成真假线索；换个题材或新的生成工具就失效了。这篇论文希望检测器关注生成过程留下的细微痕迹。作者对输入像素做变换，减弱“画的是什么”这一线索，同时尽量保留有助于识别生成痕迹的局部关系。", "context": "这里不是把图像变得越难看越好。作者要削弱可辨认主体等语义捷径，同时保留与生成处理有关的局部关系。如果直接打乱位置，可能在破坏语义时也毁掉需要检测的统计线索。", "analysis": "高通滤波和打乱图块未必足以消除语义，而且可能损失取证所需的局部关系。问题不是把图像任意破坏，而是在削弱可见语义的同时，尽量保留能够区分生成机制的像素统计。", "rationale": "作者先通过实验说明，高通滤波和图块打乱仍可能保留语义信息，再提出改变像素值映射而保留局部空间关系。其解释是削弱低频语义捷径、突出生成相关高频痕迹；随机映射与语义分类对照用于检验这一解释。", "basis_title": "怎样阻止检测器记住图像主题", "method_title": "保留位置，改变像素值的呈现", "method_input": "一张原始 RGB 图像。", "method_output": "图像为真实或生成的概率。", "result_title": "映射后还能看到什么痕迹", "connection": "映射表先改变每个通道数值怎样呈现，像素仍留在原来的位置；分类器再从新图中学习真假。固定与随机映射是用于分析这种处理为何有效的不同设定，不意味着每次预测都要人为选择一张新表。", "architecture": [{"name": "像素值重映射", "flow": "原图 → 语义被削弱的输入", "operation": "在真假分类器之前加入逐像素数值重映射，打破像素亮度原有的单调次序，改变人眼和语义模型熟悉的外观。\n\n重映射操作改变的是像素数值，而非像素位置。固定方案把 0—255 的强度按非单调规则转成新数值，相同输入值始终得到相同输出值，原先平滑的亮度变化因此会呈现更强的高频变化。论文另外用每张图、每通道分别随机映射做对照，检查收益是否依赖某张特定映射表；两种设置共同用于分析语义抑制的作用。"}, {"name": "真假分类", "flow": "保留局部结构的变换图 → 真假概率", "operation": "保持像素空间位置及局部对应关系，再用变换后的图像训练真假分类器，使学习重点更多转向生成相关的局部痕迹。\n\n所有真假训练图都先经过映射，再送入分类网络，以二元交叉熵学习标签，因此模型需要从变换后的分布中寻找证据。测试也沿用相应的输入处理。像素邻接关系仍在，使局部生成统计有机会保留；与之相对，分类器更难直接借助原图中熟悉的物体外观完成判断。方法增加的是输入模块，不要求另建一个复杂取证网络。"}], "findings": "在 GAN 与扩散生成器之间的跨模型测试中获得改善；语义分类和映射对照实验支持其减少语义偏差的解释。", "limitations": "收益是所测跨模型性能，不能推出对所有未来生成器通用；压缩可能削弱高频线索。", "figures": [{"number": 2, "page": 2, "src": "figures/paper-16-fig-02.webp", "original_caption": "Figure 2: Visualization results of various semantic-reduction methods.", "placement": "intro", "caption": "不同语义削弱方法的可视化让“削弱”具体可见：关注主体是否仍容易识别，以及局部结构是否被完整打乱。"}, {"number": 3, "page": 4, "src": "figures/paper-16-fig-03.webp", "original_caption": "Figure 3: (a) The framework pipeline of the proposed method. The input image first passes through the pixel-level mapping module before being sent into the classification head. (b) The fixed pixel-level mapping module applies the same fixed mapping to all three channels of images. (c) The random pixel-level mapping module applies a different random mapping to the three channels of each image.", "placement": "method", "caption": "主流程先经过像素级映射，再进入分类器。方法改变输入表示，而不是在输出分数之后增加一个判决规则。"}, {"number": 4, "page": 4, "src": "figures/paper-16-fig-04.webp", "original_caption": "Figure 4: (a) Fixed pixel-level mapping table, which remains the same for each channel of each sample. (b) Four examples of random pixel-level mapping tables, which maintain ran- domness for each channel of each sample.", "placement": "module-1", "caption": "固定映射与随机映射表说明，亮度值不再按原有顺序呈现。横纵轴描述数值对应关系，像素的空间坐标并未因此重排。"}, {"number": 6, "page": 7, "src": "figures/paper-16-fig-06.webp", "original_caption": "Figure 6: Visualization results of anomalies in mapped im- ages.", "placement": "evidence", "caption": "映射后异常的可视化用于检查哪些局部痕迹仍可被暴露。它与跨生成器实验共同支持作者的取证解释。"}], "paper_url": "https://arxiv.org/abs/2512.17350", "sort_date": "2025-12-19", "experiment": {"summary": "在 GenImage 上只用 SDv1.4 训练，再跨生成器测试。固定映射的平均准确率为 98.4%，随机映射为 97.5%；结果支持削弱原图语义外观后，仍能学习可迁移的生成痕迹。", "caption": "最后两行对应固定和随机映射，最右列是平均准确率。训练生成器与未见测试生成器要区分，重点看跨模型表现。", "src": "figures/paper-16-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["生成图像检测", "像素重映射", "语义偏差", "跨生成器泛化"]}, {"id": "paper-15", "title": "Reasoning about the unsaid: Misinformation detection with omission-aware graph inference", "chinese_title": "OmiGraph：通过跨报道遗漏信息检测误导新闻", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Wu, J Cao", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-01", "preprint_date": "2025-12-01", "arxiv_id": "2512.01728"}, "motivation": "一篇新闻里的每句话都是真的，整篇文章也可能误导人：它可能只讲一部分事实，把会改变判断的条件藏起来。仅盯着文章查错，往往找不到这种问题。这篇论文把同一时期的相关报道找来比较，检查目标文章遗漏了哪些与判断有关的信息，再据此识别误导。", "context": "文章说出的每句话都可能是真的，但如果省略关键条件，读者仍会形成偏差。论文不要求模型凭空猜“作者没说什么”，而是检索当时已经存在的相关报道，明确以哪个背景为参照。", "analysis": "相关报道之间既有正常选题差异，也可能存在有意遗漏。把所有背景报道拼在一起，会引入大量无关内容，并掩盖具体哪句话与哪段背景存在关系。需要细化比较单位，同时保留报道内部语境。", "rationale": "作者从目标新闻发布之前的近期报道中检索背景，把文章拆成句子片段，并建立关系图：节点代表片段，边连接同一报道内或不同来源的片段。大模型进一步描述目标文章相对背景遗漏了什么、可能造成什么影响，再把这些描述作为边的信息交给检测网络。", "basis_title": "只说真话，也可能产生误导", "method_title": "把跨报道的缺失内容变成图关系", "method_input": "目标新闻，以及它发布之前的相关新闻库。", "method_output": "结合正文与背景遗漏线索得到的真假预测。", "result_title": "遗漏线索能补充什么", "connection": "检索提供背景，句子图确定比较单位，意图关系描述差异含义，消息聚合再把遗漏线索送回检测器。这样能区分原新闻表达的内容与背景提供的补充，而不是把所有报道当成一段无来源区分的大文本。", "architecture": [{"name": "时间受限背景检索", "flow": "目标新闻、此前新闻池 → 相关背景报道", "operation": "从目标新闻发布之前的近期新闻池检索语义相关报道，构建可用背景，避免使用事件之后才出现的信息作为当时判断的依据。\n\n先用发布日期截出目标新闻之前的时间窗口，再用 BERT 对候选与目标文章编码，按余弦相似度取最相关的若干报道。时间过滤先于语义排序，保证背景来自当时已存在的材料。选中的报道构成该条新闻的专属背景集合，后续分析在这些文章与目标新闻之间展开，而非无差别检索整个新闻库。"}, {"name": "遗漏感知图", "flow": "目标与背景句子 → 带上下文及遗漏边的图", "operation": "将目标与背景报道拆成句子级原子片段作为节点，同一报道内连接上下文边，目标与背景片段之间建立跨来源的遗漏关系边。\n\n每篇报道拆成句子级片段并编码成节点，保留片段属于哪篇文章的信息。同一来源的边描述报道内部的叙事关系，跨来源边连接目标新闻与背景片段。这两种边分别处理“文章自身怎样组织信息”和“与其他报道相比有哪些差别”，使背景证据进入模型时仍有明确的来源和比较对象。"}, {"name": "遗漏意图关系", "flow": "跨来源片段 → 带语义的遗漏边", "operation": "LLM 描述目标与背景片段之间的遗漏意图，再编码为关系属性。\n\n同文片段之间的边属性由两端表示及其绝对差值计算；跨来源边则借助 LLM 分析是否存在遗漏关系、遗漏可能产生什么影响，再把关系文字编码成特征。关系描述可以区分正常概括与可能误导的删减。模型读取的是这种有语义的差异，而非一个笼统的“少说了一句话”标记。"}, {"name": "消息传播与分类", "flow": "句子图及边属性 → 增强真假判断", "operation": "通过局部注意力与全局聚合读取遗漏线索，交给原检测器。\n\n消息传播同时参考节点内容与关系属性，让不同背景句对目标句产生不同权重的影响。局部注意力筛选相邻信息，全局聚合再形成新闻级遗漏表示，并与原检测表示结合用于分类。因而最终判断仍需要综合正文，背景只是提供额外证据；完整链条是先确定可比报道，再比较句子关系，最后汇入真假预测。"}], "findings": "在中英文数据上，论文报告平均 F1 提高 5.4 个百分点、准确率提高 5.3 个百分点，并分析不同遗漏类型。", "limitations": "依赖外部新闻覆盖与检索质量；相关报道不天然等于完整事实；用 LLM 模拟背景可能引入生成偏差。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-15-fig-01.webp", "original_caption": "Figure 1: Concept comparison between existing methods and our OmiGraph. In contrast to solely focusing on the presented information, OmiGraph extracts more complete deception features via omission-aware modeling, capturing omitted key information such as the background and causal relation, and thus enhancing the existing detectors.", "placement": "intro", "caption": "概念图对照只看已呈现信息与结合遗漏内容的判断。新增线索来自相关背景，而非把“文本没提到”直接判为假。"}, {"number": 2, "page": 4, "src": "figures/paper-15-fig-02.webp", "original_caption": "Figure 2: Overview of OmiGraph. Given a news piece, OmiGraph constructs an omission-aware graph based on the contextual environment (a). Then, omission-oriented relation modeling reasons over the graph nodes, identifying intra-source contextual dependencies and inter-source omission intents (b). Finally, an omission-guided message passing mechanism extracts omission-oriented deception features (c) to enhance conventional misinformation detectors.", "placement": "method", "caption": "先建立背景环境，再做句子级图和遗漏关系建模，最后聚合。图里的节点是内容片段，边负责保留同来源语境与跨来源比较。"}, {"number": 4, "page": 11, "src": "figures/paper-15-fig-04.webp", "original_caption": "Figure 4: Omission type distribution standardized using Z-scores in English (left) and Chinese (right) dataset.", "placement": "evidence", "caption": "遗漏类型分布在中英文数据上并不完全相同。这提示读者，遗漏不是单一固定模式，模型需要面对不同表达和报道习惯。"}], "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/37097", "code_url": "https://github.com/ICTMCG/OmiGraph", "sort_date": "2025-12-01", "experiment": {"summary": "在英文和中文新闻数据上比较遗漏感知检测效果。使用 BERT 时，英文宏 F1 从 0.7111 提高到 0.7530，中文从 0.7851 提高到 0.8407；相关报道提供的背景信息帮助模型识别只靠正文难以发现的误导。", "caption": "每个基础模型与紧接着的“+Ours”成对比较，可以看到加入遗漏信息建模后的收益。", "src": "figures/paper-15-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["虚假新闻检测", "遗漏信息", "跨报道检索", "图神经网络", "意图推理"]}, {"id": "paper-31", "title": "Enhancing Fake News Video Detection via LLM-Driven Creative Process Simulation", "chinese_title": "AgentAug：通过造假制作过程模拟增强视频检测", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Y Bu, Q Sheng, J Cao, S Wang, P Qi, Y Shi, B Hu", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-10-05", "arxiv_id": "2510.04024"}, "motivation": "虚假新闻视频不一定从头造假：真实镜头配上错误文字、替换部分片段，也能制造误导。现实中的这类样本难收集，单纯生成更多假画面又可能让检测器只学会认合成痕迹。这篇论文模拟具体制作步骤来构造训练样本，让检测器学习文字、事实与视频怎样被有意错配。", "context": "真实素材也能被剪成误导新闻。比如改变配文或替换部分镜头，不一定留下明显生成痕迹。作者围绕制作操作构造数据，让检测器学习文字与视频怎样错配，而不是只记住一种合成工具的外观。", "analysis": "训练数据需要同时覆盖文字叙事与视频素材之间的误导关系，并与当前检测器真正不确定的样本匹配。只扩大数量、不控制来源和选择方式，可能增加噪声，甚至造成训练测试信息泄漏。", "rationale": "作者将造假制作过程作为增强依据，用四类基本操作构造误导关系，再围绕真实样本不确定性选择训练数据。多折筛选用于控制合成样本的实际帮助，测试只使用人类制作视频以检查迁移。", "basis_title": "为何要模拟造假过程，而不只造假样本", "method_title": "从训练素材到有选择的数据增强", "method_input": "已有训练集中的新闻文字、视频素材，以及一个可输出真假概率的检测器。", "method_output": "经选择的合成训练样本，以及在原数据和这些样本上重训的检测器。", "result_title": "合成数据怎样帮助真实视频检测", "connection": "素材库限制可用训练来源，制作流程产生候选，选择机制再把候选与真实难例对应。生成与选择是两件事：不是每条合成内容都会进入最终训练，也不是把测试素材拿来重新组合。", "architecture": [{"name": "训练素材库", "flow": "训练视频 → 镜头片段及语言描述", "operation": "把训练视频分成镜头，用视觉语言模型描述素材，建立可检索的文字与视频片段库；合成只使用训练部分素材。\n\n文字库先过滤信息不足的新闻描述；视频库则用 TransNet-v2 切镜头，再由视觉语言模型记录片段中的对象、事件、素材类型和质量评分。这样合成流程既能按新闻语义检索镜头，也能按画面质量选择素材。片段与描述成对保存，后续组合保留可追溯的素材关系；库中的内容仅来自训练部分。"}, {"name": "创作过程模拟", "flow": "素材、四类造假操作 → 合成新闻视频", "operation": "通过 LLM 驱动的制作流程，模拟事实歪曲、无中生有、误导替换和选择性剪辑等操作，再组合文字与视频，生成有制作逻辑的多模态样本。\n\n四条流程由“已有哪种素材、改动哪一部分”区分：从画面编造新闻事件；为现有文字检索可能造成误导的片段；保留画面但修改事实细节；保留叙事而替换、插入或选择视频镜头。检索使用文字与片段描述的嵌入相似度，片段逐个添加到目标时长。合成结果由具体叙事与镜头组成，而不是只对原视频做压缩或加噪。"}, {"name": "不确定性选择与重训", "flow": "难真实样本、合成候选 → 增强后的检测器", "operation": "围绕检测器高不确定的真实样本检索候选合成数据，再用多折筛选保留稳定有帮助的样本，加入原检测器重新训练。\n\n先用原始人工标注数据训练检测器，再按预测熵找到它最拿不准的真实样本，以这些样本为锚，检索特征相近的合成候选。候选临时加入重训，只有改善验证表现时才保留；五折分别执行后，仅留下至少三折选中的合成样本。最后将它们与原训练集合并训练，避免把全部生成结果不加区分地灌入模型。"}], "findings": "在 FakeSV、FakeTT 与四种检测器上均报告改善；合成数据仅来自训练素材，测试仍使用人类制作视频。", "limitations": "不覆盖完全生成式假新闻视频；只研究固定任务工作流；随机加入合成样本有时反而降低性能，增强质量和选样都关键。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-31-fig-01.webp", "original_caption": "Figure 1: An example of how original real materials can be used for fabrication in multiple ways (highlighted in red), while some may not be shown in existing observed data.", "placement": "intro", "caption": "同一组真实素材可以通过多种方式被用于造假。图中强调的变化是信息与叙事关系，解释为什么只收集已观察到的假视频还不够。"}, {"number": 2, "page": 3, "src": "figures/paper-31-fig-02.webp", "original_caption": "Figure 2: Overall framework of AgentAug.", "placement": "method", "caption": "总图把素材库、制作模拟和选择增强连起来。候选生成之后还有筛选，最终收益应在真实视频测试上检查。"}, {"number": 4, "page": 5, "src": "figures/paper-31-fig-04.webp", "original_caption": "Figure 4: LLM-driven pipelines for video news fabrication.", "placement": "detail", "caption": "四类 LLM 驱动制作流程具体展示文字和视频如何被组织成不同误导操作，比笼统说“用大模型增强数据”更接近实际训练内容。"}], "paper_url": "https://doi.org/10.1145/3746252.3760933", "code_url": "https://github.com/ICTMCG/AgentAug", "sort_date": "2025-11-10", "experiment": {"summary": "在 FakeSV、FakeTT 与四种检测器上评估合成增强。以 SVFEND 为例，主动选择后 F1 从 80.54%／75.63% 提高到 82.98%／78.61%；随机加入合成数据并不总能带来改善。", "caption": "RAN、BAL、AL 分别对应随机、均衡与主动选择。应把同一检测器下的增强行与原始行比较，观察数据选择是否有效。", "src": "figures/paper-31-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["虚假新闻检测", "视频理解", "合成数据", "主动学习", "数据选择"]}, {"id": "paper-32", "title": "Bridging thoughts and words: Graph-based intent-semantic joint learning for fake news detection", "chinese_title": "InSide：联合新闻意图与语义的图学习", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, Q Sheng, D Wang, B Hu, J Cao", "publication": {"venue": "CIKM 2025", "date_label": "在线发表", "date": "2025-11-10", "preprint_date": "2025-09-01", "arxiv_id": "2509.01660"}, "motivation": "一篇新闻可能通过反复强调某些细节，引导读者形成特定印象。只看字面内容可能漏掉这种写作目的；直接让大模型猜作者意图，又可能脱离文章证据。这篇论文把推断出的意图与具体句子、实体连起来，让虚假新闻检测同时利用写作目的和支撑这个判断的文字。", "context": "方法把写作目的整理成一张“意图图”，把句子及其提到的人物、地点等实体整理成一张“语义图”。图中的节点保存各项信息，连线表示它们的关系。再让两张图交换信息，使推断的意图能对应到正文的具体表达。", "analysis": "意图推断属于较粗的解释，句子与实体属于较细的语义单元。两者粒度不同，如果只是拼接最终向量，难以知道哪个意图对应哪段表达，也不利于在相互矛盾时调整判断。", "rationale": "作者以信念、欲望等意图分析组织粗粒度信息，同时用句子和实体图保留细粒度语义。动态路径对齐和跨图消息传递建立两种粒度间的联系，回应直接拼接无法充分连接意图与表达的问题。", "basis_title": "文章的意图怎样对应具体措辞", "method_title": "两张图如何相互传递信息", "method_input": "新闻正文，以及由 LLM 根据正文推断的多维意图信号。", "method_output": "融合具体叙事与意图线索后的真假概率。", "result_title": "对齐到底连接了哪些证据", "connection": "两张图先各自编码，路径对齐再建立共同空间和动态连接。跨图消息传递不是先给文章定一个动机、再强制按动机分类，而是把意图与语义表示共同用于最终判断。", "architecture": [{"name": "语义图", "flow": "正文句子与实体 → 细粒度语义结构", "operation": "用句子和实体构建语义图，保留局部叙事及跨句联系，让具体表达不只压缩为整篇文本的一个向量。\n\n正文先分句并抽取实体，预训练语言模型分别编码句子节点和实体节点。句子之间只连接一定窗口内的邻居，用于保留局部叙事顺序；实体与提到它的句子连接，使相距较远、围绕同一对象的表达也能相互作用。局部联系与实体长程联系同时存在，避免把全部句子无差别全连接。"}, {"name": "意图图", "flow": "正文、LLM 意图推断 → 粗细意图表示", "operation": "让 LLM 从信念、欲望等角度推断粗粒度意图，再结合细粒度表达建立意图图，显式表示作者可能想传达和实现的内容。\n\n冻结的生成模型按信念、欲望等问题产出粗粒度意图分析，并编码为意图节点；每个粗节点还配有若干可学习细节点，通过对正文句子做注意力读取来初始化。粗节点表达分析维度，细节点吸收该篇文章的具体叙事。图中再连接不同维度及其下属细节点，使意图表示既有理论组织，也与本文内容相连。"}, {"name": "动态路径对齐", "flow": "两张图 → 联合表示与真假判断", "operation": "分别更新两张图，通过动态路径对齐建立共同空间，进行跨图消息传递后分类，使意图解释能够影响具体证据聚合，反过来也接受正文约束。\n\n两图先各自进行局部加权传播，并由超级根节点汇总、回传全文信息。跨图阶段不逐对连接所有异类节点，而引入少量可学习的中间节点（论文称伪节点）作中介；节点类型、边方向和当前表示决定动态注意力，让信息沿“语义—伪节点—意图”双向交换。最后平均池化伪节点并交给 MLP 分类，所用特征已经历两种信息的共同更新。"}], "findings": "在 PolitiFact、GossipCop、Weibo 和 LLMFake 上验证；前三者按时间切分，LLMFake 使用随机划分。", "limitations": "对非故意错误的适用性不明；LLM 的意图推断会出错；并未证明可以普遍识别真实内容里的操纵框架。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-32-fig-01.webp", "original_caption": "Figure 1: Comparison between existing works and our proposed framework. Existing detectors focus on surface semantic clues of news and often struggle when the writing pattern shifts. Instead, our method utilizes semantic-intent joint learning, integrating the thoughts (intents) and words (semantics) for enhanced detection.", "placement": "intro", "caption": "概念对照展示从只关注表面写作线索转向联合意图与语义。这里的意图是模型分析得到的表示，不是已知的作者心理事实。"}, {"number": 2, "page": 4, "src": "figures/paper-32-fig-02.webp", "original_caption": "Figure 2: Overview of InSide architecture. Given a news item, InSide leverages heterogeneous graph structures to represent the news semantics and intent (a-b). After obtaining the encoded semantic and intent representations via dual-level graph updating (c), a dynamic pathway-based graph alignment strategy is utilized to enable cross-signal alignment within a common space (d). The illustrative intent analysis framework is provided as an example and can be replaced with alternative ones.", "placement": "method", "caption": "语义图与意图图分别构建和更新，中间经过动态路径对齐，最后融合分类。先看两路输入各是什么，再看它们在哪里互相影响。"}, {"number": 5, "page": 16, "src": "figures/paper-32-fig-05.webp", "original_caption": "Figure 5: Case visualization analysis of a news item from the Weibo dataset after Graph Alignment. Darker edges indicate critical information pathways. The pseudo nodes (in green) act as dynamic bridges between semantic nodes (in blue) and intent nodes (in orange), enabling flexible message passing.", "placement": "evidence", "caption": "案例图展示对齐后的信息路径，较深的边代表更重要连接，伪节点作为两类节点间的动态桥梁。这让“跨图联合”不只停留在最后拼接向量。"}], "paper_url": "https://doi.org/10.1145/3746252.3761400", "sort_date": "2025-11-10", "experiment": {"summary": "在 PolitiFact、GossipCop、Weibo 和 LLMFake 四套数据上比较。InSide 在总体分类指标上优于表中语义单路、意图单路与多种联合方法，说明将意图对应到具体叙事有助于判断。", "caption": "四套数据分别列出 macF1 与 Acc。前三套按时间划分训练和测试，LLMFake 使用随机划分。", "src": "figures/paper-32-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["虚假新闻检测", "意图—语义对齐", "图神经网络", "跨图消息传递"]}, {"id": "paper-33", "title": "Exploring news intent and its application: A theory-driven approach", "chinese_title": "NINT 与 DMInt：新闻意图的理论框架和建模", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Cao, S Ma, H Cheng", "publication": {"venue": "Information Processing & Management 62(6)", "date_label": "卷期", "date": "2025-11", "preprint_date": "2023-12-27", "arxiv_id": "2312.16490"}, "motivation": "两篇文章可以报道相同事件，却分别希望读者“了解情况”和“支持某种行动”。要研究这种新闻意图，先得说清楚意图包含什么、怎样标注，否则不同模型说的不是同一件事。这篇论文先借助新闻生产相关理论定义意图，再建立数据和预测方法，研究它能否帮助理解与检测新闻。", "context": "这篇工作不是先发明一个网络，再给网络输出起名为意图。作者先分析新闻生产中的行动与结果，用理论框架规定意图的组成，再围绕这些维度构造数据和模型。读者需要先弄清概念，才能理解下游预测在利用什么。", "analysis": "意图不能简单等同于真假、情绪或立场，也往往没有一句明确的自我声明。需要把抽象心理概念拆成能够从文本分析的要素，再考虑不同要素对具体任务的贡献。", "rationale": "论文用“信念—欲望—计划”分析新闻意图：信念关注报道持什么立场，欲望关注想产生什么影响，计划关注为此采用什么写作方式。NewsInt 围绕这些维度组织数据，DMInt 分别提取各维度的局部和全文特征，再根据当前文章分配权重，用于下游预测。", "basis_title": "信念、欲望和计划怎样进入新闻分析", "method_title": "从理论定义到数据，再到模型", "method_input": "新闻主题和正文；训练阶段使用分解式意图分析信号。", "method_output": "信念、欲望、计划等意图表示，可接入真假检测及热度预测。", "result_title": "意图表示可以用于哪些任务", "connection": "NINT 定义分析维度，NewsInt 提供数据，分解式提示把概念变成可处理信号，DMInt 再通过局部—全局特征与门控用于下游任务。理论、数据和预测模型是不同层次，不应全部统称为一个分类器。", "architecture": [{"name": "NINT：意图定义", "flow": "新闻表达 → 信念、欲望与计划维度", "operation": "提出 NINT 框架，以信念、欲望与计划组织新闻意图，细化为立场、目标影响和写作策略等维度，明确各维度之间的关系。\n\n信念关注报道持有什么立场、怎样理解事实，欲望关注想影响哪些对象并达到什么效果，计划关注为此采用的组织和写作方式。三个维度有联系，却不能用一个情绪标签替代。论文再将它们细化成可提问和标注的项目，使后续数据构建、提示设计和模型分支沿同一套概念展开。"}, {"name": "NewsInt：数据与信号", "flow": "文章、讨论 → 意图分析数据", "operation": "构建 NewsInt，包含 12,959 篇文章及 Reddit 讨论，用分解式推理形成意图信号，为理论概念提供可研究的数据基础。\n\nNewsInt 将新闻文章与相应讨论放在同一研究数据中，用来研究内容意图与受众互动。理论维度需要落实为可计算信号，因而数据准备还包括按维度分析和质量控制。数据集是评测与学习的基础；真正给新文章提取意图特征的，是后面的提示方法或 DMInt 模型，两者不要与数据本身混淆。"}, {"name": "DMG：分解式意图提问", "flow": "文章、NINT 维度 → 多维意图信号", "operation": "按照理论维度分解提问，使信念、欲望和计划不只成为一个笼统标签。\n\nDMG 把抽象维度拆成一串较具体的问题：例如报道面对什么议题、期望引发什么情绪或态度，以及是否采用某类说服策略，再据此汇总意图。问题顺序组织在同一次提示中，模型按序作答，并非每个问题都必须独立调用一次。这样形成的分维度信号也用于训练后续的高效意图模型。"}, {"name": "DMInt：多视角聚合", "flow": "文本及意图信号 → 下游任务特征", "operation": "DMInt 采用 RoBERTa、多视角局部—全局提取器和动态门控，聚合不同层面的意图特征，并将其接入下游任务。\n\nDMInt 用 RoBERTa 编码主题与正文，三个分支分别提取信念、欲望和计划特征。每个分支用注意力看全局，再用不同窗口的一维卷积看局部写作片段；门控根据当前文章动态加权三个分支。各分维度预测和汇总预测共同训练，得到的意图向量再与下游任务原有特征结合，而不必为每条新闻在线重复运行长篇意图问答。"}], "findings": "研究提供意图分析框架、数据集和下游建模方法，为后续意图—语义联合学习等工作建立基础。", "limitations": "主要是文本新闻；数据源与推断框架可能带来文化、政治及平台偏差；推断意图不能等同事实核查结论。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-33-fig-01.webp", "original_caption": "Figure 1: Process of news production. News intent controls news writing as a rational action, subsequently eliciting social reactions as outcomes. This motivates us to deconstruct news intent from aspects of rational action and outcome.", "placement": "intro", "caption": "新闻意图影响写作，写作又可能引发社会反应。作者由这一过程同时分析行动与结果，而不是把意图仅理解为文中一句显式声明。"}, {"number": 2, "page": 3, "src": "figures/paper-33-fig-02.webp", "original_caption": "Figure 2: The proposed Nint framework. Nint deconstructs the concept of news intent into beliefs, desires, and plans using interdisciplinary theories. It further situates these elements within the specific context of news to investigate the concrete manifestations of news intent.", "placement": "basis", "caption": "NINT 将意图拆为信念、欲望与计划，并放入新闻场景。它规定后续数据与模型究竟要分析什么，是这篇论文理论部分的核心。"}, {"number": 7, "page": 10, "src": "figures/paper-33-fig-07.webp", "original_caption": "Figure 7: Illustration of DMG Prompting.", "placement": "detail", "caption": "DMG Prompting 将意图分析分解成有顺序的提问和推理，展示抽象理论怎样变成具体可用的模型信号。"}, {"number": 8, "page": 12, "src": "figures/paper-33-fig-08.webp", "original_caption": "Figure 8: Overview of DMInt method.", "placement": "method", "caption": "DMInt 的局部、全局与不同视角提取器处理意图信息，动态门控决定各部分贡献，最后用于相应下游任务。"}], "paper_url": "https://doi.org/10.1016/j.ipm.2025.104229", "code_url": "https://github.com/ICTMCG/NewsInt", "sort_date": "2025-11-01", "experiment": {"summary": "意图极性识别实验对多个 LLM 比较普通提示与 DMG。以 GPT-3.5 为例，宏 F1 从 0.674 提高到 0.841；其他所列模型也有提升，支持按信念、欲望与计划分解提问。", "caption": "每个模型与其“w/ DMG”行成对比较。宏 F1 平衡各类别表现，比仅看总体准确率更能反映少数类别是否被识别。", "src": "figures/paper-33-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["新闻意图", "信念—欲望—计划", "分解式提示", "动态门控"]}, {"id": "paper-34", "title": "The staircase of ethics: Probing llm value priorities through multi-step induction to complex moral dilemmas", "chinese_title": "递进道德困境：观察大模型的价值优先序", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Wu, Q Sheng, D Wang, G Yang, Y Sun, Z Wang, Y Bu, J Cao", "publication": {"venue": "EMNLP 2025", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-05-23", "arxiv_id": "2505.18154"}, "motivation": "问模型一次“应该帮助谁”，只能得到它在这一种情境下的选择。如果帮助某人会让更多人受损，它还会坚持原来的原则吗？这篇论文沿着同一个故事逐步增加代价和冲突，观察模型何时改选另一种价值，研究复杂处境中优先考虑的原则怎样变化。", "context": "同一个模型先选择照顾某人，增加额外代价后又选择公平，并不一定自相矛盾，可能是情境中的价值冲突变了。论文因此沿同一故事逐步增加压力，观察选择什么时候变化，而不是只比较互不相关的道德题。", "analysis": "不同问题之间的价值差异可能来自情景本身，难以判断模型到底改变了什么。若在同一故事中逐步升级冲突，就能比较选择从哪一步转变，再分析其中关怀、公平等价值如何竞争。", "rationale": "本文明确采用道德基础理论和 Schwartz 价值理论组织价值类别，并将五阶段递进困境中的选择映射到这些类别。逐阶段比较与成对竞争分析用于观察模型优先序如何变化；它测量的是情境化行为，不把模型当作拥有固定人格的道德主体。", "basis_title": "冲突逐步升级时，模型会怎样改选", "method_title": "困境构造、价值映射与行为比较", "method_input": "递进道德故事、各阶段两种行动选项，以及待评测的 LLM。", "method_output": "模型在不同阶段的价值选择分布、变化趋势和成对价值竞争关系。", "result_title": "哪些价值优先序会改变", "connection": "故事生成提供连续问题，模型回答提供选择，价值映射再把选择转成理论类别。最后比较的是阶段间分布和两类价值的竞争；理论提供解释坐标，不是给每个回答直接盖上“道德正确”的标签。", "architecture": [{"name": "五阶段困境构造", "flow": "道德规范、初始故事 → 递进故事组", "operation": "从 Moral Stories 的规范出发，用 GPT-4o 构造 3,302 组、每组五阶段的递进道德困境，保持故事关联并逐步增加决策压力。\n\n每组沿同一故事推进，逐步加入会改变决策代价的新情境；每个阶段保存背景、困境和两种行动，便于比较同一个模型何时改变选择。作者还对照一次提供全部故事、各阶段独立提问和逐步携带既往情境及模型选择三种方式。主要递进评测因此能观察选择路径，而非把五个阶段当作互不相干的题目。"}, {"name": "理论价值映射", "flow": "模型选择 → 理论定义的价值类别", "operation": "依据道德基础理论与 Schwartz 价值理论，将模型选择映射到较明确的价值类别，由多个模型形成共识标注。\n\n三种标注模型独立说明行动会影响哪些利益相关者、造成什么后果，再按关怀、公平、忠诚等道德基础维度，或 Schwartz 价值理论的相应定义赋类。至少两个模型同意时采用该标注，三者不一致则交人工裁决。每阶段两个行动对应不同价值维度，后续评测才能把 A／B 选择转换成价值间的取舍，而不是只统计选项字母。"}, {"name": "逐阶段行为分析", "flow": "九个模型的选择 → 价值分布及竞争关系", "operation": "评测九个 LLM，跟踪各阶段选择、价值分布和成对价值竞争，观察价值优先顺序随困境升级发生的变化。\n\n记录九个模型在各阶段的行动，转换为相应价值，再分别看同一模型随阶段的变化、模型之间的排名，以及两类价值冲突时谁更常被选择。时间维度回答“压力增加后怎样变”，成对比较回答“发生冲突时优先保留谁”。这是一条实验分析流程，没有训练一个名为“伦理阶梯”的新生成网络。"}], "findings": "价值选择会随困境升级变化；关怀经常占优，但在部分条件下，公平等价值会超过它。结果描述的是所测情境中的行为倾向。", "limitations": "价值框架偏西方，情境多为线性升级且主要由模型生成；观察输出不能推断模型拥有价值观，也不能直接推断实际行为。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-34-fig-01.webp", "original_caption": "Figure 1: Comparison of existing value evaluation protocols and ours for LLMs. Instead of asking a single question or situating an isolated moral dilemma, our proposed MMDs framework sets a multi-step moral dilemma questionnaire to progressively induce models into stronger and more complex ethical conflicts to expose their underlying value priorities.", "placement": "intro", "caption": "递进困境与一次性道德提问的区别在于连续性。后续阶段加入新条件，使价值取舍的变化可以沿同一条情境线索追踪。"}, {"number": 2, "page": 4, "src": "figures/paper-34-fig-02.webp", "original_caption": "Figure 2: ①Moral Dilemmas Generation: A five-level dilemma series (S1–S5) is generated, each with context (Ctx), decision (D), action (A), and action (B). ②Model Value Mapping: Decisions and actions are mapped to values such as Liberty, Care, Fairness, Loyalty, and Sanctity. ③LLM Value Evaluation: A language model evaluates the values, producing scores VA 1 –VA 5 and VB 1 –VB 5 . ④Value Preference Analysis: Reveals model tendencies to prioritize or overlook certain value dimensions.", "placement": "method", "caption": "五阶段故事、模型价值映射和后续分析在图中分开。先有具体选择，再映射到价值类别，避免把类别名称当成已经测得的行为。"}, {"number": 3, "page": 7, "src": "figures/paper-34-fig-03.webp", "original_caption": "Figure 3: The preference and ranking change of nine LLMs across six value dimensions: care, fairness, authority, sanctity, loyalty, and liberty. The left panels depict the preference scores over five steps (Step 1 to Step 5). Preference scores are determined by the proportion of times a model selects a specific moral dimension relative to the total occurrences at each step, normalized within a range of -0.5 to 0.5. A positive score indicates a preference for the dimension, while a negative score suggests aversion. The right panels showcase LLMs’ rank changes across six moral dimensions between Step 1 and Step 5 evaluations. ▲show rank improvements, ▼show rank declines and • indicates no change in ranking.", "placement": "evidence", "caption": "九个模型在六类价值上的偏好和排名随阶段变化。曲线用于看选择转折与相对优先序，而不说明某模型具有固定的人类人格。"}], "paper_url": "https://aclanthology.org/2025.emnlp-main.806/", "sort_date": "2025-11-01", "experiment": {"summary": "在 3,302 组五阶段困境中，比较九个 LLM 的选择与价值偏好。随着冲突升级，部分模型的关怀、公平等价值排序发生变化，说明一次孤立提问不足以概括这些情境中的决策行为。", "caption": "左侧跟踪五个阶段中的价值偏好，右侧对照第一与第五阶段的排名，展示情境逐步变化后模型怎样调整选择。", "src": "figures/paper-34-fig-03.webp", "original_caption": "Figure 3: The preference and ranking change of nine LLMs across six value dimensions: care, fairness, authority, sanctity, loyalty, and liberty. The left panels depict the preference scores over five steps (Step 1 to Step 5). Preference scores are determined by the proportion of times a model selects a specific moral dimension relative to the total occurrences at each step, normalized within a range of -0.5 to 0.5. A positive score indicates a preference for the dimension, while a negative score suggests aversion. The right panels showcase LLMs’ rank changes across six moral dimensions between Step 1 and Step 5 evaluations. ▲show rank improvements, ▼show rank declines and • indicates no change in ranking."}, "novelty": {"score": 4}, "fine_tags": ["价值观评测", "递进道德困境", "道德基础理论", "多步决策"]}, {"id": "paper-41", "title": "Forewarned is Forearmed: Pre-Synthesizing Jailbreak-like Instructions to Enhance LLM Safety Guardrail to Potential Attacks.", "chinese_title": "IMAGINE：提前模拟潜在越狱指令进行安全对齐", "year": "2025", "theme": "大模型可信与安全", "authors": "S Liu, Q Sheng, D Wang, Y Liu, G Yang, J Cao", "publication": {"venue": "EMNLP 2025 · Findings", "date_label": "论文集", "date": "2025-11", "preprint_date": "2025-08-27", "arxiv_id": "2508.20038"}, "motivation": "模型会拒绝直接的危险请求，却可能被角色扮演或复杂故事绕过去。等每一种新包装出现后再补训练样本，总容易慢一步。这篇论文从已有恶意指令出发，提前合成更多意思相近、表达方式不同的潜在攻击，再用这些样本加强安全训练，扩大模型学会应对的情境。", "context": "安全样本如果始终集中在熟悉表达附近，换一种情境包装就可能暴露空白。本文既要求改写后仍对应原意图，也要求它在表示空间里离开已经覆盖的区域；两项条件缺一，增强都可能流于表面。", "analysis": "合成数据既要保持原始意图，才能作为有效安全训练样本，又要拓展表达分布，而不只是近义改写。论文将“情境隐藏”和“表示空间覆盖”作为两个需要共同处理的问题。", "rationale": "作者认为，已有安全训练数据与实际越狱请求的表达方式存在差距。合成时，一方面保持原请求的意图，另一方面扩展表达方式，得到更多情境包装。之后用直接偏好优化（DPO）训练目标模型，让它在这些请求下更倾向合适的拒绝回答。", "basis_title": "潜在攻击表达为何不能只靠近义改写覆盖", "method_title": "让新数据保持意图，又扩展表达范围", "method_input": "直接指令及情境改写样本，以及需要加强安全对齐的目标模型。", "method_output": "覆盖更广表达方式的安全训练数据，及据此完成偏好对齐的模型。", "result_title": "更新后的数据分布是什么样", "connection": "生成模型负责逐轮产生包装变体，嵌入空间目标约束多样性与主题，目标语言模型再用这些数据进行 DPO。安全对齐的效果来自新增训练分布，不是部署时临时调用攻击生成器过滤回答。", "architecture": [{"name": "意图隐藏生成器", "flow": "原始指令 → 情境包装指令", "operation": "先训练情境改写模型，学习将原指令意图放进不同表达背景，形成更接近潜在越狱包装的样本。\n\n第一阶段用直接指令与情境化改写的配对数据训练生成器，使其学会在保持指令意图的同时改变表达背景。目标同时涉及配对学习和句子嵌入，避免生成器只复述已有模板。这个生成器的用途是为后面的防御训练准备更丰富的指令表达，和最终接受安全对齐的目标模型分开训练。"}, {"name": "迭代分布扩展", "flow": "上一轮样本与表示 → 新区域样本", "operation": "逐轮训练生成变体，在嵌入空间使用主题、对比及距离相关约束，使新样本保持原意图，同时向旧样本未充分覆盖的区域扩展。\n\n每轮从初始改写模型复制一个变体，主题损失约束新文本仍围绕原始意图，距离约束区分安全与有害语义，对比项则让新一轮表示与此前轮次拉开。多轮得到若干分布不同的数据组，而非把同一生成器的采样数量简单放大。三类约束共同控制“扩到哪里”及“扩展后还表达什么”。"}, {"name": "DPO 安全对齐", "flow": "合成指令、拒绝偏好 → 目标模型", "operation": "将合成样本与拒绝回答组成偏好数据，通过 DPO 安全对齐目标模型，并检查正常任务能力和过度拒绝情况。\n\n目标模型训练使用合成的情境指令构造偏好对，通过直接偏好优化（DPO）提高合适拒绝相对不合适响应的偏好；不同生成轮次提供更多表达分布。上线的是完成对齐的模型，不需要每次请求再运行整套合成流程。论文除攻击测试外，也检查正常任务和过度拒绝，以观察增加安全训练覆盖后是否影响正常使用。"}], "findings": "在 Qwen2.5 与 Llama 系列三个模型上降低多种越狱攻击成功率，并评估正常能力和误拒绝。", "limitations": "仍依赖初始配对数据和嵌入模型；迭代生成有计算成本；未验证更大规模模型，也不能保证覆盖未来攻击。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-41-fig-01.webp", "original_caption": "Figure 1: Comparison between post hoc patching and IMAGINE enhanced safety alignment. (a) An illustration of the post hoc patching workflow. Model developers are always “one step slower” than the attackers, achieving less effect with more effort. (b) Align with IMAGINE, model developers could train unaligned models with jailbreak-like data. As a new jailbreak attack is proposed, the model has already been trained with similar data and could recognize and refuse the real attack instruction, reducing the cost of patching post hoc.", "placement": "intro", "caption": "被动补洞与提前模拟的时间线对比说明作者动机：部署后再修攻击可能总落后一步，增强希望提前拓展训练覆盖。"}, {"number": 2, "page": 4, "src": "figures/paper-41-fig-02.webp", "original_caption": "Figure 2: (a) An illustration of the iterative space expansion workflow. (b) An example of a simple malicious instruction and its intent concealed versions. (c) Training from base intent-concealing model M0 at iteration k.", "placement": "method", "caption": "迭代空间扩展、情境包装示例和第 k 轮训练放在同图。不同损失协调保持主题与生成新区域，不只是让文字看起来更长。"}, {"number": 3, "page": 9, "src": "figures/paper-41-fig-03.webp", "original_caption": "Figure 3: t-SNE (Van der Maaten and Hinton, 2008) visualization of latent spaces before and expanded by IMAGINE. Left: Original embedding distributions. Right: IMAGINE-added distribution. Rows from top to bottom: Llama3.1, Llama3.2, and Qwen2.5.", "placement": "evidence", "caption": "t-SNE 对比原有与扩展后的样本表示，用来直观展示覆盖变化。这是分布可视化，真正安全效果仍需结合攻击测试。"}], "paper_url": "https://aclanthology.org/2025.findings-emnlp.266/", "sort_date": "2025-11-01", "experiment": {"summary": "在 Qwen2.5、Llama3.1、Llama3.2 上，用多种越狱方法测试安全对齐。IMAGINE 单独训练或作为补充数据时，多项攻击成功率降低，但改善幅度随模型与攻击变化。", "caption": "ASR 是攻击成功率，越低越好；上半表是独立训练数据，下半表是在已有安全数据上追加合成数据，需在各组内比较。", "src": "figures/paper-41-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["安全对齐", "合成数据", "潜在空间扩展", "偏好优化"]}, {"id": "paper-36", "title": "Adversarial robust memory-based continual learner", "chinese_title": "持续学习中的对抗鲁棒性：输出校准与记忆选择", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "X Mi, F Tang, Z Yang, D Wang, J Cao, P Li, Y Liu", "publication": {"venue": "ICCV 2025", "date_label": "会议", "date": "2025-10-19—23", "preprint_date": "2023-11-29", "arxiv_id": "2311.17608"}, "motivation": "一个图片分类器先学猫狗，后来又学汽车和鸟，却只能留下少量旧图片复习，可能逐渐忘记旧类别。若再给图片加人眼不易察觉的干扰，它的旧知识还可能更不稳定。这篇论文同时研究“学新不忘旧”和抵抗这种干扰，重点改进旧样本的保留方式及类别判断。", "context": "“记忆回放”就是保存少量旧图片，在学习新类别时重新拿出来训练。“对抗扰动”则是专门让模型判断出错的微小输入修改。本文希望小规模复习既保住旧类别知识，也保住抵抗这种修改的能力。", "analysis": "新任务更新会挤压旧类别的输出空间，有限缓存中难分、异常或不稳定的样本又可能降低回放质量。单纯增加对抗训练强度，不能同时解决类别竞争和缓存选择。", "rationale": "作者从两个位置减轻遗忘：AFLC 调整不同类别的分类分数，减少学新类别时对旧类别的压制；RAER 挑选更能抵抗扰动的旧样本留在缓存。一个改变当前的学习过程，一个改善以后可用于复习的材料。", "basis_title": "普通遗忘与鲁棒性遗忘并不相同", "method_title": "分类输出与记忆选择分别怎样改", "method_input": "当前任务数据、有限旧样本缓存，以及对抗训练生成的扰动样本。", "method_output": "较少遗忘旧任务、同时保持对抗鲁棒性的持续学习模型。", "result_title": "旧知识能否在扰动后保住", "connection": "当前数据与旧缓存一起生成对抗版本，AFLC 调整类别输出，RAER 决定哪些样本进入下一轮记忆。一个改变当前怎样学习，另一个改变未来还能看到什么旧样本，两者通过后续回放形成联系。", "architecture": [{"name": "AFLC：输出校准", "flow": "类别阶段信息、分类输出 → 校准后的学习信号", "operation": "AFLC 根据过去、当前和未来类别校准分类输出，调整不同类别在学习中的影响，缓解新任务对旧类别的负面梯度作用。\n\nAFLC 在 Softmax 之前调整各类别的 logit，即尚未归一化的分类分数。过去、当前与未来类别按任务阶段及样本分布采用不同校准，改变交叉熵传回这些类别的梯度。作者希望减少当前对抗样本对旧类的抑制，并加强旧缓存对当前类的约束；校准因此直接参与当前这一步怎样学习，而非训练结束后再改一个预测阈值。"}, {"name": "RAER：缓存选择", "flow": "PGD 过程中的稳定性 → 新记忆集合", "operation": "RAER 统计样本在 PGD-10 过程中的被成功攻击次数，以文中 k<5 的规则筛选缓存候选，优先保留鲁棒且有代表性的样本，再更新记忆。\n\nRAER 在已有的十轮逐步扰动攻击（PGD-10）过程中，统计每个样本被成功攻击的次数 k，不另跑一套昂贵的筛选模型。实际设置把 k<5 的样本列为候选，再按记忆容量随机保留，更新下一阶段使用的缓存。它先排除过于脆弱、容易贴近边界过拟合的样本，之后仍按回放机制与新任务共同训练，改变的是未来能反复看到的旧知识。"}], "findings": "在 Split-CIFAR10/100 和 Split-Tiny-ImageNet 上评估；论文报告 ResNet 与 ViT 的对抗遗忘明显下降。", "limitations": "测试为划分式图像分类任务与有限缓存，不能直接等同真实长期开放流；依赖对抗训练和任务阶段信息。旧预印本摘要结果与正式版口径不同，已采用正式版。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-36-fig-01.webp", "original_caption": "Figure 1. A preliminary analysis of the combination of contin- ual learning and adversarial training on Split-CIFAR10 with buffer size 200. We consider the ﬁnal average accuracy (FAA) and for- getting of adversarial and clean samples in both class incremental and task incremental settings. The red numbers indicate the per- formance after adding our approach.", "placement": "intro", "caption": "初步比较同时展示正常与对抗样本的准确率、遗忘情况。它说明普通持续学习表现较好，并不能保证扰动下也保留旧任务。"}, {"number": 3, "page": 4, "src": "figures/paper-36-fig-03.webp", "original_caption": "Figure 3. The gradient cosine similarities between robust joint model and robust continual model, which indicates a special gra- dient obfuscation only in continual learning. We experiment with buffer size=200/5,120 on the Split-CIFAR10 dataset. Gradient ob- fuscation weakens as the buffer size gets larger, and our method also mitigates gradient obfuscation.", "placement": "basis", "caption": "梯度相似性分析用于检查鲁棒联合训练和鲁棒持续学习之间的差异。作者据此分析连续任务中特有的学习冲突，而非只用最终分数说明问题。"}, {"number": 4, "page": 5, "src": "figures/paper-36-fig-04.webp", "original_caption": "Figure 4. The pipeline of our adversarial robust memory-based continual learner. First, generate adversarial samples ( \u0002 Xt, \u0002 XM) and robust difﬁculty factors (Kt) for both current task data (Xt, Yt) and memory data (XM, YM). The model then processes these samples through AFLC (Sec. 4.2), which calibrates logits based on task order to reduce negative gradients toward past tasks. Meanwhile, RAER (Sec. 4.3) leverages the robust difﬁculty factors Kt to select representative samples for memory storage, mitigating gradient obfuscation.", "placement": "method", "caption": "总图从当前任务和记忆数据生成对抗样本，再进入输出校准及缓存筛选。两部分都作用在训练流程，最终部署仍是得到的分类器。"}], "paper_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Mi_Adversarial_Robust_Memory-Based_Continual_Learner_ICCV_2025_paper.html", "sort_date": "2025-10-19", "experiment": {"summary": "在 Split-CIFAR10/100 的类别增量与任务增量设置下，比较不同对抗训练和缓存大小。加入本文方法后，多组配置的对抗最终准确率提高，并缓解旧任务遗忘；主表基座为 ResNet18。", "caption": "FAA 越高越好，Forgetting 越低越好；Clean 与 Adversarial 分别测正常和受攻击样本，PGD-20 与 AA 是不同攻击评测。", "src": "figures/paper-36-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["持续学习", "对抗鲁棒性", "遗忘缓解", "经验回放"]}, {"id": "paper-43", "title": "Llm-generated fake news induces truth decay in news ecosystem: A case study on neural news recommendation", "chinese_title": "真相衰减：生成新闻如何影响推荐排序", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "B Hu, Q Sheng, J Cao, Y Li, D Wang", "publication": {"venue": "SIGIR 2025", "date_label": "在线发表", "date": "2025-07-13", "preprint_date": "2025-04-28", "arxiv_id": "2504.20013"}, "motivation": "如果 AI 生成的假新闻进入推荐系统，它不只是多了一条待检测内容，还可能混进用户阅读记录和后续训练数据，继续影响推荐。这篇论文分别模拟这些进入位置，观察假新闻与真新闻的排名怎样变化，研究生成内容会不会让推荐结果越来越偏离真实信息。", "context": "推荐系统不仅读取候选新闻，也读取用户历史，并通过训练数据学习偏好。生成内容进入不同位置，可能以不同方式改变结果。作者把这些位置逐步打开，避免一次加入全部生成数据后无法区分来源。", "analysis": "若所有生成新闻一次性加入系统，很难区分影响来自候选内容、历史表示还是训练过程。作者因此按介入位置逐步设置实验，并观察推荐模型对不同来源文本的偏好。", "rationale": "作者逐步改变生成新闻进入系统的位置：先进入推荐候选，再进入阅读历史，最后进入训练数据。每次分别观察真假新闻排名怎样变化，区分不同环节的影响；随后结合模型对文本的熟悉程度，分析为什么部分生成内容更容易获得推荐。", "basis_title": "生成新闻进入推荐系统的哪一环", "method_title": "先构造可比较数据，再逐步介入", "method_input": "有真假标签的新闻与用户互动，以及不同自动生成程度的新闻版本。", "method_output": "不同介入阶段下真假新闻的推荐排名变化与相关分析。", "result_title": "真实新闻的排序优势怎样变化", "connection": "先把真假检测数据改造成推荐序列，再生成和检查不同新闻样本，最后固定推荐模型比较各阶段。研究对象是相对排序变化，而不是直接证明每个真实用户都会被生成内容说服。", "architecture": [{"name": "推荐数据构建", "flow": "真假标签、互动、生成新闻 → 序列推荐数据", "operation": "把 GossipCop 的真假标签与社交互动记录整理为推荐序列数据，构建约 5.6 万条多种方式生成的新闻，为真假和生成来源提供可比较的样本。\n\n基于 GossipCop 新闻与社交互动建立新闻阅读序列，再为同一素材准备不同生成版本。L1 做保留内容的转述，L2 做更有说服力的改写，L3 根据标题和主体材料重新创作；真实新闻只使用较能保留事实的 L1，虚假新闻覆盖三个级别。这样可分别比较生成参与程度与原始真假属性，而非把所有机器文本视为同一种处理。"}, {"name": "分阶段介入", "flow": "固定推荐模型、不同介入位置 → 排名结果", "operation": "依次设置生成新闻不介入、进入候选、进入历史、进入训练数据等条件，在 LSTUR、NRMS 等推荐模型中比较排序变化。\n\nPhase 0 只用人写新闻；Phase 1 保持训练和历史不变，只把生成新闻放进候选；Phase 2 再逐步用对应生成版本替换部分用户历史；Phase 3 才让生成新闻进入训练数据并重训。每阶段记录相同比例和生成级别下的排序，使候选评分、用户表示和训练更新这三处影响能够分开观察。"}, {"name": "机制分析", "flow": "排序指标、熟悉度信号 → 真相衰减解释", "operation": "以 MRR、nDCG 和前列占比等指标观察真假新闻位置，并结合模型熟悉度与困惑度分析生成内容为何更容易获得推荐优势。\n\n指标同时看真实与虚假新闻的 MRR、nDCG 和前列占比，比较的重点是两者相对优势是否缩小或反转。随后测量推荐基座对新闻的困惑度：较低困惑度表示语言模型更熟悉该表达。论文将这一结果与排序偏好对应，作为生成文本可能占优的解释，再讨论不同生成级别和介入比例下的变化。"}], "findings": "观察到生成内容逐步介入时，真实新闻相对假新闻的排序优势减弱，作者称之为“真相衰减”。", "limitations": "这是模拟推荐环境中的排名现象，并非真实平台因果实验或人类信念实验证据；未覆盖下一代 LLM 推荐器和完全自主造假。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-43-fig-01.webp", "original_caption": "Figure 1: Illustration of Truth Decay phenomenon, where real news gradually loses its advantageous position in rankings against fake news as LLM-generated news penetrates.", "placement": "intro", "caption": "示意图定义真相衰减：生成新闻介入后，真实新闻原有的排序优势减弱。它先说明要测什么，再进入推荐模型和数据设计。"}, {"number": 2, "page": 3, "src": "figures/paper-43-fig-02.webp", "original_caption": "Figure 2: Illustration of a typical news recommendation model in the (Left) training and (Right) inference phases.", "placement": "basis", "caption": "训练阶段与推理阶段的新闻／用户编码流程不同。把这张图与介入实验一起看，能理解生成候选、生成历史和生成训练数据为何不是同一种操作。"}, {"number": 3, "page": 5, "src": "figures/paper-43-fig-03.webp", "original_caption": "Figure 3: Illustration of dataset construction process, which consists of (Top) repurposing a fake news detection dataset for news recommendation and (Bottom) prompting LLMs to generate news data and performing quality check.", "placement": "method", "caption": "上半部分将带真假标签及用户互动的数据整理为推荐材料，下半部分生成并检查新闻。这样后续排名可以按内容类型分别统计。"}, {"number": 7, "page": 13, "src": "figures/paper-43-fig-07.webp", "original_caption": "Figure 7: Variation in Ratio@5 for real and fake news. The red dashed line and blue dashed line represent the Ratio@5 values for real and fake news, respectively, when no LLM-generated news is present. The red shaded area illustrates the extent to which real news leads fake news, while the blue shaded area shows the extent to which fake news leads real news.", "placement": "evidence", "caption": "真实与虚假新闻在前列的占比随生成内容介入而变化。基线线条提供参照，观察的是排序结构如何变，而不是把某一类新闻的分数单独拉高多少。"}], "paper_url": "https://doi.org/10.1145/3726302.3730027", "sort_date": "2025-07-13", "experiment": {"summary": "在 LSTUR、NRMS 的模拟推荐环境中，逐步让生成新闻进入候选、历史和训练。随着较高生成程度的虚假新闻比例增加，真实新闻的排名优势缩小，部分条件下假新闻的前列占比反超。", "caption": "横轴是生成内容进入数据的比例，纵轴看前五条推荐中的真假新闻比例。不同生成级别和模型组合分别成图，红蓝区域显示相对优势。", "src": "figures/paper-43-fig-07.webp", "original_caption": "Figure 7: Variation in Ratio@5 for real and fake news. The red dashed line and blue dashed line represent the Ratio@5 values for real and fake news, respectively, when no LLM-generated news is present. The red shaded area illustrates the extent to which real news leads fake news, while the blue shaded area shows the extent to which fake news leads real news."}, "novelty": {"score": 4}, "fine_tags": ["新闻推荐", "生成内容污染", "排序偏差", "分阶段实验"]}, {"id": "paper-44", "title": "Enhancing the comprehensibility of text explanations via unsupervised concept discovery", "chinese_title": "ECO-Concept：自动发现可理解的文本分类概念", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Sun, D Wang, Q Sheng, J Cao, J Li", "publication": {"venue": "ACL 2025 · Findings", "date_label": "论文集", "date": "2025-07", "preprint_date": "2025-05-26", "arxiv_id": "2505.20293"}, "motivation": "情感分类器把一句评论判成负面，只把几个词标红，读者未必明白它到底依据了什么。事后再让模型编一段解释，也不保证那是真正的判断原因。这篇论文希望先从数据中发现可描述的概念，再让分类器通过这些概念做决定，使解释能对应实际计算过程。", "context": "ECO-Concept 先从数据中学习一些概念，再给每篇文本计算各概念的匹配分数，称为“概念激活量”。分类器只能依据这些分数作判断。之后再检查概念能否被描述清楚、能否在新文本中找到对应片段，将检查结果反馈给概念学习。", "analysis": "无监督聚类得到的概念可能很难解释，而分类后再让 LLM 编一段说明，也未必忠实于模型。论文把概念提取、分类和可理解性反馈放进一个训练循环，使解释能够影响模型本身。", "rationale": "模型先用多个可学习的概念去读取文本片段，这一步称为“槽注意力”。各概念的分数组成分类器的唯一输入，形成“概念瓶颈”。大模型再根据概念描述去新文本中找片段，与原模型实际关注的位置比较；两者的差异用于继续训练概念，使解释更容易与实际判断对应。", "basis_title": "概念解释怎样真正参与分类", "method_title": "发现概念、通过概念预测，再反馈修正", "method_input": "用于分类的文本和类别标签，不预先提供人工概念词表。", "method_output": "文本类别，以及参与该预测的概念激活和对应文字片段。", "result_title": "一个具体文本例子怎样变化", "connection": "槽注意力分配文本片段，概念激活进入分类器；评估器则总结高激活样本，并在新样本中重新定位概念。重新定位与模型实际注意力之间的差异回到概念训练，使解释不只是一张事后标签。", "architecture": [{"name": "槽注意力概念提取", "flow": "词元特征、可学习概念 → 概念激活", "operation": "多个可学习的概念从文本中选择相关片段，同一片段的注意力会在这些概念之间分配。训练鼓励同一概念含义稳定，也鼓励不同概念有所区分。\n\n每个概念是一个可学习原型，它作为 Query 与文本词元的 Key 计算注意力；归一化沿概念槽进行，使多个概念竞争同一词元。再用注意力汇集词元得到概念特征。相同概念在不同高激活样本中要保持语义接近，不同概念则需拉开差异，两项正则与分类目标一起训练。"}, {"name": "概念瓶颈分类", "flow": "各概念激活量 → 类别预测", "operation": "汇总各概念的激活量作为分类输入，分类器只通过这一概念瓶颈作判断，使概念与预测建立结构上的联系。\n\n把每个概念在全部词元上的注意力加总，形成只有概念数那么长的激活向量，作为线性分类器的唯一输入。模型不能绕过概念直接读取整篇文本表示，因此概念确实处在预测路径中。类别权重表示某个概念对各类别的支持或抑制作用，结合概念激活还能计算哪些概念更值得优先改善可理解性。"}, {"name": "可理解性反馈", "flow": "概念描述、高亮和模型注意力 → 概念更新", "operation": "让 LLM 总结高激活样本，再在新样本中高亮该概念对应片段；比较高亮与实际注意力的差异，形成可理解性反馈并微调概念，迭代至较稳定状态。\n\n从高激活样本中分出概念总结集与新样本高亮集：LLM 先根据前者写出概念含义，再按这个含义在后者定位词元。高亮分布与模型真实槽注意力之间的均方差，经概念重要性加权后加入训练；没有明确含义的概念则被压低激活。迭代时重新总结，含义稳定的原型冻结，其余继续更新。"}], "findings": "在七个文本分类数据集和人工实验中比较分类能力与概念可理解性，多项分类结果接近黑箱模型。", "limitations": "主要为较轻量文本分类模型；LLM 评价有成本和偏差；概念数量预先固定，并未直接解决大生成模型的全部可解释性问题。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-44-fig-01.webp", "original_caption": "Figure 1: Comparison of explanations between our pro- posed ➂ECO-Concept and existing typical ➀super- vised and ➁unsupervised concept-based methods. Su- pervised methods explain based on predefined concepts, while ECO-Concept and unsupervised methods explain via concept-related highlighted text. ECO-Concept elim- inates the need for concept annotations and can discover unseen concepts with improved comprehensibility.", "placement": "intro", "caption": "三种概念解释路线比较是否依赖预定义概念、是否能发现新概念、是否可读。本文关注自动发现与可理解性的结合。"}, {"number": 2, "page": 4, "src": "figures/paper-44-fig-02.webp", "original_caption": "Figure 2: (a) Illustration of the proposed framework ECO-Concept. ECO-Concept consists of a concept extractor, a classifier, and a concept evaluator. (b) The concept extractor takes the encoded text X as input and interacts with the concept prototypes C to obtain a slot attention matrix A and concept features U. The concept prototypes are optimized using consistency and distinctiveness loss. (c) The concept evaluator utilizes exemplars with the highest concept attention values to construct two sets, Dsum and Dhigh. Using the corresponding slot attention matrices Asum and Ahigh, the evaluator highlights these exemplars to perform concept summarization and highlighting, thus getting the comprehensibility loss to guide model fine-tuning.", "placement": "method", "caption": "主框架连接概念提取器、瓶颈分类器和概念评估器。读者应先看分类是否真的经由概念，再看评估反馈怎样回到概念参数。"}, {"number": 6, "page": 14, "src": "figures/paper-44-fig-06.webp", "original_caption": "Figure 6: Comparison of explanations before and after concept enhancement in a beer review case", "placement": "evidence", "caption": "同一啤酒评论在概念增强前后的解释并排展示。具体词句对应哪些概念、概念能否被人读懂，比只列可理解性总分更直观。"}], "paper_url": "https://aclanthology.org/2025.findings-acl.758/", "sort_date": "2025-07-01", "experiment": {"summary": "在七个文本分类数据集上，ECO-Concept 的分类表现接近或超过所列黑箱模型。例如 CEBaB 准确率为 0.697，RoBERTa 为 0.682；原文另用概念评测与人工实验检查解释可理解性。", "caption": "主表展示分类准确性，用来检查加入概念解释后能否保住预测能力；解释是否易懂另由概念评测与人工评价检验。", "src": "figures/paper-44-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["概念可解释性", "槽注意力", "概念瓶颈", "语言反馈"]}, {"id": "paper-46", "title": "PhantomHunter: Detecting Unseen Privately-Tuned LLM-Generated Text via Family-Aware Learning", "chinese_title": "PhantomHunter：家族感知的私有微调文本检测", "year": "2025", "theme": "大模型可信与安全", "authors": "Y Shi, Y Yang, Q Sheng, H Mi, B Hu, C Xu, J Cao", "publication": {"venue": "arXiv:2506.15683", "date_label": "预印本首发", "date": "2025-06-18", "preprint_date": "2025-06-18", "arxiv_id": "2506.15683"}, "motivation": "某个公司用公开模型做了私有微调，却不开放权重，也不允许你收集它的输出。怎样判断一段文本是不是这个未知模型写的？针对公开模型训练的检测器，遇到微调版本可能失效。这篇论文利用同一基座及其微调后代共享的特征，研究检测没见过的私有模型生成文本。", "context": "检测器不能调用未知私有模型，但可以运行多个公开的基础语言模型，计算同一段文字在这些模型下出现的概率。每个模型给出一串逐词元概率，作为检测特征。后面所说的“家族”，指同一个基础模型及由它微调得到的模型。", "analysis": "语义风格随领域微调变化较大，但文本在多个公开基座下的概率模式，可能仍保留家族关系。方法不仅需要真假判别，还要从多个家族中选出更适合当前文本的检测专家。", "rationale": "作者以基座与微调后代之间共享家族级特征的观察为依据，对比学习显式鼓励保留家族共性，专家门控则利用这一共性进行检测。它不假定不同家族都能由一个固定判别边界充分覆盖。", "basis_title": "私有微调改变风格后，还剩哪些共同线索", "method_title": "公开代理概率、家族编码与专家融合", "method_input": "待检测文本，以及若干可运行的公开基座语言模型。", "method_output": "文本来源家族的概率和最终人类／LLM 写作判断。", "result_title": "为什么家族信息可能帮助检测", "connection": "概率编码器先学习序列特征，家族对比把同源后代拉近，家族预测再控制专家融合。家族来源不必先由人正确指定，而是模型内部估计；估计不准也会影响后面的专家权重。", "architecture": [{"name": "公开基座概率特征", "flow": "待测文本、多个公开基座 → 逐词元概率表示", "operation": "把待测文本分别送入多个公开基座，计算逐词元概率序列，再用 CNN 与 Transformer 编码这些序列，获得概率特征。\n\n对同一段文本，让每个基座在已有前文条件下计算当前真实词元的概率，得到“基座数量 × 文本长度”的概率列表。它不是让模型判断文本风格，而是观察同一写法在不同基座下有多容易出现。CNN 与 Transformer 再对列表做局部和序列编码，形成后面家族分类与真假专家共用的表示。"}, {"name": "家族对比编码", "flow": "生成文本的家族关系 → 家族相关特征", "operation": "同一家族生成文本作为正样本进行对比学习，并学习来源家族，使同基座不同微调后代的特征更接近。\n\n训练配对把同一公开基座的不同微调后代生成文本视为同家族正样本，其他家族为负样本。对比目标缩小同家族表示距离，同时用来源标签监督家族分类器。重点因此从记住某一个公开生成器，转向学习微调之后仍可能保留的家族级概率模式，以用于未见过的私有微调版本。"}, {"name": "家族专家融合", "flow": "家族概率、专家判断 → 真假预测", "operation": "以家族预测概率作为门控，融合多个家族专家的真假判断。推理不需要访问未知私有模型本身，但需要运行这些公开代理基座。\n\n各家族专家分别输出真假判断，再以家族分类器给出的概率加权求和，形成最终预测。来源不确定时，多个专家都可以贡献；来源较明确时，相应专家权重更大。测试不用访问未知私有生成器，但仍需运行前面的公开基座来计算概率列表，因此公开代理的运行成本是整个检测流程的一部分。"}], "findings": "实验和消融支持概率特征、家族对比学习及专家门控的贡献；来源家族识别仍比真假二分类更难。", "limitations": "对训练覆盖外的全新家族与复杂改写的泛化不能保证；需要运行多个基座计算概率，部署成本高于单模型分类；私有微调设置仍是实验近似。", "figures": [{"number": 1, "page": 3, "src": "figures/paper-46-fig-01.webp", "original_caption": "Figure 1: Detection accuracy for LLM-generated text with increasing amounts of fine-tuning data.", "placement": "intro", "caption": "随着微调数据增多，原有语义或概率检测器准确率下降。该分析说明只认识公开基座本身，可能不足以识别它的私有后代。"}, {"number": 2, "page": 4, "src": "figures/paper-46-fig-02.webp", "original_caption": "Figure 2: Cosine similarity between the token probability lists of fine-tuned models and those of the base ones. Darker colors indicate higher similarity.", "placement": "basis", "caption": "微调模型与不同基座的词元概率序列相似度支持家族相关性的观察。较深颜色表示更相近，但并不说明所有后代都能被无误归家族。"}, {"number": 3, "page": 5, "src": "figures/paper-46-fig-03.webp", "original_caption": "Figure 3: Overall architecture of PhantomHunter. Given a text sample x, it 1) extracts the probability feature from M base models and encode them with CNN and transformer blocks; 2) predicts the family of x to determine the family gating weights; and 3) feeds the representation RF to a mixture-of-experts network controlled by the gating weights from Step 2 for final prediction of x being LLM-generated. During training, a contrastive learning is applied in each mini-batch to better model family relationships.", "placement": "method", "caption": "从多个公开基座取概率，经过家族编码，再用家族权重融合专家。三个阶段的中间输出分别是概率表示、来源倾向和真假判断。"}], "paper_url": "https://arxiv.org/abs/2506.15683", "sort_date": "2025-06-18", "experiment": {"summary": "在 arXiv、Q&A 文本及全参数、LoRA 微调设置下，测试未见私有微调模型。PhantomHunter 四组宏 F1 均超过 96%，移除概率特征、家族对比或专家融合后均下降。", "caption": "Human 与 Gen. 是两类的 F1，Macro 是宏平均。Full、LoRA 指生成模型的微调方式，测试对象都未用于检测器训练。", "src": "figures/paper-46-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["大模型文本检测", "私有微调", "家族对比学习", "混合专家"]}, {"id": "paper-14", "title": "From judgment to interference: Early stopping llm harmful outputs via streaming content monitoring", "chinese_title": "SCM：在生成过程中检测并截停有害回答", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Y Yang, X Zhang, J Cao", "publication": {"venue": "NeurIPS 2025", "date_label": "arXiv 首发", "date": "2025-06-11", "preprint_date": "2025-06-11", "arxiv_id": "2506.09996"}, "motivation": "聊天机器人常常一边生成、一边把文字显示出来。如果等整段回答结束才检查有害内容，用户可能早就看到了；但只看到半句话，又容易把尚未说完的拒绝误判成危险回答。这篇论文研究生成过程中怎样及时检测和截停，训练检测器适应只能看到当前前缀的情况。", "context": "模型以一个个小单位持续输出文字，这些单位称为词元（token）。监控程序只能读到已经生成的部分，无法提前看到后面的句子。如果训练时总看完整回答，上线时却只读到开头，判断依据就变了。SCM 因此专门学习在回答尚未完成时识别风险。", "analysis": "模型必须从不完整内容判断风险，还要尽量区分只是讨论危险主题与正在提供有害帮助。词元级信号有利于快速反应，整篇判断有利于理解语境，但部署时反复运行整篇检测会增加等待和计算。", "rationale": "论文用句子／词元级监督构建流式检测，并在训练中加入整篇评分器和层级逻辑一致性约束，协调局部风险与全文判断。Delay-k 要求累计一定数量的危险词元再截停，论文通过该参数实验分析及时性与误报之间的取舍。", "basis_title": "完整回答检测为什么来不及", "method_title": "训练看全文，推理看当前前缀", "method_input": "用户提示，以及语言模型正在逐词元输出的回答前缀。", "method_output": "当前词元风险分数，以及是否终止继续生成的决定。", "result_title": "截停速度与误报的取舍", "connection": "细粒度标注先提供危险内容的位置；训练时整篇分支帮助局部分支理解语境；部署移除整篇分支后，局部评分随词元更新。Delay-k 决定积累多少危险证据才停止，不同于见到一个敏感主题词就拒绝。", "architecture": [{"name": "FineHarm：细粒度监督", "flow": "回答文本 → 有害句与危险词元标签", "operation": "构建 FineHarm，先识别有害句子，再用词性规则定位实义词，形成细粒度监督，使检测器学习危险内容从哪里开始出现。\n\n标注先从句子层面区分有害与无害，再用词性规则把有害句中的实义词标成危险词元；同时保留整段回答的安全性标签。由此，训练目标既包含回答是否有害，也包含危险内容在何处出现。它给后续评分器的是逐位置监督，评分器上线后仍根据上下文学习到的表示判断，而不是机械运行一张敏感词表。"}, {"name": "层级联合训练", "flow": "词元特征、全文特征 → 协调的风险评分器", "operation": "训练时联合词元评分器与可拆卸的整篇评分器，并使用层级逻辑一致性约束，使局部风险与整体判断互相协调。\n\n特征提取器读取提示与已生成文本，为每个词元提供表示；词元头给各位置评分，整篇头则读取最后一个词元的表示判断全文。训练还取词元风险的最大值，与全文风险建立逻辑约束：整篇被判有害时，应能在局部找到相应危险信号。局部损失、全文损失和逻辑损失一起优化，让短前缀检测获得全文级监督。"}, {"name": "Delay-k：流式截停", "flow": "逐步到达的输出 → 继续生成或停止", "operation": "部署只保留流式词元分支。随着输出到达持续评分，危险词元累积达到设定数量后停止生成；调整延迟阈值，在更快响应与减少误报之间取舍。\n\n部署移除整篇评分头，只保留特征提取器和词元评分器，随着被监控模型输出逐步更新风险。当词元分数越过阈值时记为一次危险检出，累计检出达到 k 才触发停止。k 小时反应更快，k 大时要求更多危险证据；论文分别测量这种延迟变化下的安全性和误判情况。"}], "findings": "实验平均读取约 18% 的回答词元即可完成检测，宏 F1 超过 0.95；超过 80% 的有害回答在前 30% 词元内被识别。", "limitations": "细粒度标签含自动规则噪声；指标不意味着所有内容均能在有害信息出现前阻止；实际延迟还取决于审核器与主模型部署。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-14-fig-01.webp", "original_caption": "Figure 1: Paradigm differences between the existing harmful content detectors and our proposed Streaming Content Monitor (SCM). (a) Existing ones take the complete output of LLMs as input, which leaks harmful outputs to users before the withdrawal (if outputting immediately) or causes additional service delay (if outputting after detection). (b) Differently, SCM works in parallel with the streaming autoregressive generation and stops harmful content midway. Output tokens are in blue shaded boxes. Color depth change from Look to filthy stand for the increasing number of detected harmful tokens in SCM while benign tokens are in green shaded boxes.", "placement": "intro", "caption": "完整输出检测和流式检测在时间上不同。前者等内容生成完再判断，后者在用户接触完整风险内容之前就尝试干预。"}, {"number": 2, "page": 5, "src": "figures/paper-14-fig-02.webp", "original_caption": "Figure 2: Position distribution of the harmful words in responses.", "placement": "basis", "caption": "危险词在回答中的位置分布说明，风险并不总从第一词开始，也不能由全文一个标签指出。它支持细粒度位置监督的必要性。"}, {"number": 3, "page": 6, "src": "figures/paper-14-fig-03.webp", "original_caption": "Figure 3: Overview of the modules. During the training phase, holistic scorer is a detachable module that helps to build a comprehensive sight of the whole response and a rough perception of the possible future tokens. During the inference phase, we only use the well-trained feature extractor and token scorer to follow LLMs’ output streaming to perform timely judgment with acceptable latency, and a hyperparameter k is used to determine the minimum number of detected harmful tokens that terminates generation.", "placement": "method", "caption": "训练图包含词元评分与可拆卸全文评分，推理图只保留局部流式路径。读图时最重要的是分清哪些组件训练后被移除。"}], "paper_url": "https://proceedings.neurips.cc/paper_files/paper/2025/hash/4e3157021c5f833bb2204081f1dda573-Abstract-Conference.html", "sort_date": "2025-06-11", "experiment": {"summary": "在有害回答检测中，流式 SCM 的宏 F1 超过 0.95，并能接近或超过同规模完整回答检测器。及时性实验平均读取约 18% 的回答词元即可检测，超过 80% 的有害回答在前 30% 词元内被识别。", "caption": "主表比较流式与全文检测的准确程度。F1 衡量检测效果，截停时机和已输出比例在论文的及时性实验中另行测量。", "src": "figures/paper-14-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["流式安全监测", "词元级检测", "层级监督", "逻辑约束"]}, {"id": "paper-28", "title": "HOMA: Towards Generic Human-Object Interaction in Multimodal Driven Human Animation with Weak Conditions", "chinese_title": "HOMA：弱条件控制的人—物交互视频生成", "year": "2025", "theme": "可控视频生成", "authors": "Z Huang, Z Zhou, J Cao, Y Ma, Y Chen, Z Rao, Z Xu, H Wang, Q Lin, ...", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-06-10", "preprint_date": "2025-06-10", "arxiv_id": "2506.08797"}, "motivation": "想生成人拿着物体活动的视频，若必须先准备每一帧的全身骨架、手指姿势和物体位置，制作条件本身就很费力。这篇论文希望输入不那么精细、甚至缺少部分动作条件时，仍能生成合理交互。用户可以按需要提供部分姿态、物体路线或音频，由模型补齐其余运动。", "context": "弱条件并不意味着完全没有约束。物体中心轨迹仍规定大致位置，骨架规定部分身体动作，缺失部分由生成先验补全。论文通过可选姿态设计，让用户决定控制精度和输入成本之间的取舍。", "analysis": "控制条件太少会让动作和物体关系漂移，条件过细又限制使用场景。人物、物体与动作还处于不同表示方式中，需要在视频基座里协调，而不是简单把参考图堆在输入侧。", "rationale": "论文用可以缺省的人体姿态和物体中心点轨迹表示运动要求。人物、物体和动作先转换成模型内部特征，再通过人—物交互（HOI）适配器加强联系。作者用不同条件组合及去掉组件的实验，检查输入简化后还能保留多少控制能力。", "basis_title": "弱控制保留哪些条件，放开哪些细节", "method_title": "条件融合、交互适配与说话控制", "method_input": "人物图、物体图，以及可选的人体姿态、物体点轨迹和音频条件。", "method_output": "在不同弱条件组合下生成的人—物交互视频。", "result_title": "条件减少之后还能控制什么", "connection": "外观和运动先进入共享上下文，再通过 HOI 适配器强化人与物的联系。音频适配器另外作用于面部，服务唇形控制；它不替代物体轨迹，也不自动决定双手怎样接触商品。", "architecture": [{"name": "弱条件编码", "flow": "参考人物、物体、弱骨架与点轨迹 → 条件表示", "operation": "以可缺省的人体骨架和物体中心点轨迹表示弱条件，保留基本位置与运动约束，同时降低对精细手部或完整三维标注的依赖。\n\n人体姿态控制身体的大体动作，物体轨迹以点表示目标位置，而非要求完整物体网格或精细手指几何。论文用不同姿态精度、轨迹组合和条件缺省来检验灵活性。编码时将两类运动条件分别处理，再合入生成模型，使物体位置与人物姿态可以各自指定，不必被绑成一套固定控制序列。"}, {"name": "上下文融合", "flow": "外观与动作 → MMDiT 上下文", "operation": "把人物、物体和弱动作条件组织到潜变量与 token 表示中。\n\n人物 VAE 特征在潜变量通道中拼接，物体则既作为额外参考 token 加入，又按轨迹位置贴入潜变量条件。姿态、轨迹各自经过编码和投影后与外观输入相加；人物和物体的全局视觉特征还与文字一起送入文本分支。不同接入位置分别照顾外观保持、空间位置与全局语义，合起来形成视频基座的上下文。"}, {"name": "HOI 适配器", "flow": "融合条件 → 交互一致特征", "operation": "以预训练 HunyuanVideo 参数初始化适配器，强化物体注入和人—物关系。\n\n只在输入层注入物体时，深层可能逐渐弱化它的信息。HOI 适配器因此在多个中间层再次让视频特征与物体 token 交互，并把输出按物体掩码加回相应区域。适配器使用基座块的预训练注意力权重初始化，另结合 DINO 与时间特征提供外观语义，从而在生成中反复强化同一物体。"}, {"name": "面部音频控制", "flow": "语音特征、面部区域 → 同步说话动作", "operation": "进一步用面部音频交叉注意力支持说话，将声音条件与面部变化联系起来；训练与评估覆盖不同对象、弱姿态和运动轨迹组合。\n\n音频经 MLP 映射后成为交叉注意力的 Key 和 Value，当前视频特征作为 Query 读取与自己相关的声音。更新再乘以面部掩码，只加回面部区域，适配器插在部分中间层。这样音频影响说话表情和唇形，人体姿态与物体轨迹仍由各自条件控制，几种控制可以在同一视频中配合。"}], "findings": "比较不同对象、轨迹与弱条件设定，并通过消融检验上下文融合和 HOI 适配器。解读以 HunyuanVideo-HOMA 预印本为基础。", "limitations": "仍需要稀疏动作输入，点轨迹不保证精确接触；真实物理合理性主要靠生成先验。", "figures": [{"number": 2, "page": 4, "src": "figures/paper-28-fig-02.webp", "original_caption": "Figure 2: We explore a weak HOI condition, where each component of the human pose can be optionally removed, and the object’s motion is a sequence of dots indicating the center points of its trajectory.", "placement": "intro", "caption": "多种弱姿态和物体点轨迹直接展示输入到底简化到什么程度。物体只用中心点序列表示，人体姿态部分可省去，便于与强控制方法区分。"}, {"number": 3, "page": 5, "src": "figures/paper-28-fig-03.webp", "original_caption": "Figure 3: Architecture of HunyuanVideo-HOMA. HunyuanVideo-HOMA is built upon the multi-modal diffusion transformer and is composed of context fusion, HOI adapter, and audio adapter.", "placement": "method", "caption": "总图包含上下文融合、HOI 适配器和音频适配器。读图时分别追踪外观、运动与声音，能看清这些条件在何处汇合、何处保持专门路径。"}, {"number": 4, "page": 7, "src": "figures/paper-28-fig-04.webp", "original_caption": "Figure 4: Depth-aware HOI Data Curation.", "placement": "detail", "caption": "深度感知的数据整理用来筛选真实交互片段。它属于训练数据准备，不是每次用户生成时都执行的数据检索模块。"}, {"number": 10, "page": 13, "src": "figures/paper-28-fig-10.webp", "original_caption": "Figure 10: Results with different types of poses.", "placement": "evidence", "caption": "不同姿态条件下的输出说明弱控制的可用范围。条件越少，越多细节由先验决定，因此“能生成”与“能精确指定每个接触”并不相同。"}], "paper_url": "https://doi.org/10.1145/3757377.3763861", "sort_date": "2025-06-10", "experiment": {"summary": "在自采集交互测试集上，HOMA 的 FID 为 51.60、FVD 为 502.69，低于表中对比方法；物体一致性为 90.05。结果说明弱姿态与点轨迹也能支持较稳定的交互生成。", "caption": "FID、FVD 越低越好，一致性和同步指标越高越好。短横线表示该方法未提供对应控制能力或结果。", "src": "figures/paper-28-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["人—物交互", "视频生成", "弱条件控制", "多模态融合", "音频驱动"]}, {"id": "paper-29", "title": "In-context brush: Zero-shot customized subject insertion with context-aware latent space manipulation", "chinese_title": "In-Context Brush：无需微调的定制主体插入", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, Y Wu, L Gao, O Deussen, H Yan, J Li, J Cao, TY Lee", "publication": {"venue": "SIGGRAPH Asia 2025", "date_label": "arXiv 首发", "date": "2025-05-26", "preprint_date": "2025-05-26", "arxiv_id": "2505.20271"}, "motivation": "你想把参考照片里的某个玩偶放到新的场景中，希望还是同一个玩偶，同时光线、大小和姿态能融入新环境。直接抠图粘贴不够自然，为每个玩偶重新训练模型又太慢。这篇论文尝试在一次生成过程中，把参考主体的信息送进新场景，完成无需为该主体额外训练的插入。", "context": "参考图的背景未必适合新场景，主体的姿态和光照也可能需要调整。因此先分割主体，再把主体信息送进生成模型的内部表示，让模型结合目标场景重新绘制。论文把这种内部表示称为“潜空间”，后面的方法主要在这里调整信息的流向。", "analysis": "只依赖文字描述容易丢失参考主体的独特外观；直接复制局部像素又难以适应新场景。主体信息必须能进入目标区域，同时避免把参考图背景和其他无关因素一起带过去。", "rationale": "模型把参考主体、目标场景和文字放在同一上下文中处理。方法在注意力计算内部，增加目标区域从参考主体和文字获得的信息，再调整不同注意力头的贡献。每轮生成后还混合图像特征单元，保持掩码外的背景稳定，兼顾主体保持、文字修改和场景融合。", "basis_title": "插入参考主体，不是简单复制像素", "method_title": "参考信息怎样进入目标区域", "method_input": "参考主体图、目标背景、放置掩码及文字修改要求。", "method_output": "保留参考主体特点、同时融入新场景的插入图像。", "result_title": "怎样保住主体又融入场景", "connection": "上下文输入让模型看到参考和目标，特征位移连接主体与目标位置，文本重加权与 token 混合再协调修改要求和场景一致性。三者都发生在已有模型的推理中，不需要每插入一个新主体就重新训练。", "architecture": [{"name": "参考主体与场景准备", "flow": "主体图、目标场景和掩码 → 上下文输入", "operation": "先分割出较干净的参考主体，将其与目标场景拼接成上下文输入，并扩展目标区域掩码，为新主体及其边缘融合留出生成空间。\n\n把主体参考与目标场景组织成同一上下文后，模型能分别读取参考身份和目标空间。掩码指定要重新生成的区域，扩展边界则为主体边缘和附近融合留出余量。参考主体、文字和场景在注意力中对应不同 token 段，后续操作正是利用这种区分，控制输出区域从哪一路获取信息。"}, {"name": "注意力头内特征位移", "flow": "参考主体潜变量 → 目标区域主体表示", "operation": "在注意力头内部进行潜变量特征位移，将参考主体语义送向目标位置，让已有模型在新场景中重新合成主体，而非只在像素层粘贴。\n\n论文将目标区域的注意力输出拆成三部分：来自自身、来自参考主体、来自文字。特征位移显式增加后两部分的贡献，把参考身份与指令语义向目标位置送入，而不是把整幅参考图的像素搬过去。加权发生在注意力头内部，因此既能利用现成生成先验重画主体，也能调节参考对新场景的影响强度。"}, {"name": "重加权与混合", "flow": "主体表示、文字和场景 → 融合图像", "operation": "跨头重加权增强文本控制，并通过 token blending 协调目标区域与上下文，兼顾身份保持、修改要求和场景融合。\n\n头级重加权先统计各头的文字相关激活，归一化后提高与本次指令更相关的贡献，帮助修改颜色、材质等属性。每个去噪步之后，token 混合再用目标场景对应噪声水平下的背景状态替换掩码外部分，让下一步继续从未漂移的背景获得引导。两项分别处理文字控制与背景一致性，共同减少主体边缘或色调不协调。"}], "findings": "与主体插入方法比较身份保持、文字对齐和图像质量，并展示试衣、组合及局部插入等应用。", "limitations": "依赖分割与掩码位置，复杂遮挡及大幅形变受基础修复模型限制。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-29-fig-01.webp", "original_caption": "Figure 1. Our method achieves identity-preserving subject insertion in the novel scene harmoniously, simultaneously enabling diverse text-driven control.", "placement": "intro", "caption": "示例同时展示身份保持、场景融合和文字控制。三者应一起看：只像参考主体但融不进背景，或只符合场景却变了身份，都不满足任务。"}, {"number": 2, "page": 3, "src": "figures/paper-29-fig-02.webp", "original_caption": "Figure 2. Pipeline of our method. We mainly introduce latent space shifting for subject present in target images in a training-free manner. In the “Latent Feature Shifting” part, features from the reference are shifted to output. We propose attention heads activation for further enhance representation of textual prompts and token blending for consistency injection within the image.", "placement": "method", "caption": "流程图中的 latent shifting 把参考特征送到目标区域，注意力头激活强化文字作用，token blending 协调上下文，分别对应不同问题。"}, {"number": 7, "page": 8, "src": "figures/paper-29-fig-07.webp", "original_caption": "Figure 7. Ablation study on token blending.", "placement": "evidence", "caption": "混合操作的消融用于观察主体与周围内容如何协调。它说明插入边界和上下文处理并非最后可有可无的装饰步骤。"}], "paper_url": "https://doi.org/10.1145/3757377.3763820", "code_url": "https://github.com/ICTMCG/In-context-Brush", "sort_date": "2025-05-26", "experiment": {"summary": "对主体插入与文字编辑分别评估身份保持、文字对齐和图像分布。In-context Brush 的插入 CLIP-I 为 0.7957、FID 为 122.61，均优于表中完整对比方法；其他身份指标仍存在取舍。", "caption": "Injection 与 Editing 是不同测试情形。DINO、CLIP-I、CLIP-T 越高越好，FID 越低越好，优先按同一列比较。", "src": "figures/paper-29-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["主体插入", "图像编辑", "上下文学习", "无需训练", "潜变量控制"]}, {"id": "paper-48", "title": "Attend to not attended: Structure-then-detail token merging for post-training dit acceleration", "chinese_title": "SDTM：依据结构—细节去噪过程合并 token", "year": "2025", "theme": "高效模型与鲁棒学习", "authors": "H Fang, S Tang, J Cao, E Zhang, F Tang, TY Lee", "publication": {"venue": "CVPR 2025", "date_label": "arXiv 首发", "date": "2025-05-16", "preprint_date": "2025-05-16", "arxiv_id": "2505.11707"}, "motivation": "AI 绘图往往先形成大致轮廓，再慢慢补纹理。要加快生成，可以把部分图像位置的计算合并，但从头到尾用同一种合并规则，可能在画轮廓时丢结构、补细节时丢纹理。这篇论文按生成阶段改变合并方式，让省计算的位置随画面形成过程而变化。", "context": "模型把画面分成许多用于计算的小单元，称为 token。合并 token 是把部分相近单元一起处理，从而节省计算。问题是生成早期和后期需要保留的信息不同，作者因此分别设计结构阶段和细节阶段的合并规则。", "analysis": "冗余的位置与程度会随时间变化：早期应保护全局布局，后期需要避免损伤细节。只看当前特征相似度或固定压缩率，难以适应这两种需求。", "rationale": "作者先分析生成过程中哪些计算重复，再分别设计保留结构和保留细节的合并规则。早期主要在局部合并结构相近的位置，后期更多合并注意力较低的位置；同时调整合并比例与文字指导，让压缩方式跟随生成阶段变化。", "basis_title": "去噪前后期，哪些计算是重复的", "method_title": "局部结构与全局细节采用不同合并方式", "method_input": "已有 DiT 的视觉 token、去噪时间步、注意力及文本条件。", "method_output": "减少 token 计算后的图像，基座无需重新训练。", "result_title": "合并位置是否随阶段改变", "connection": "两种合并规则分别用于生成的前后阶段，动态比例决定每一步省掉多少计算，提示词重加权则突出当前更重要的动作、布局或纹理信息。这些操作接入现有扩散 Transformer（DiT）的推理过程，使用时不必重新训练基础模型。", "architecture": [{"name": "前期局部结构合并", "flow": "早期 token → 压缩结构表示", "operation": "早期根据局部结构相似性合并 token，降低重复计算，同时保留生成布局所需的局部结构差异。\n\n把视觉 token 划入局部窗口，计算窗口内平均余弦相似度，再结合最近是否反复合并过的记录，决定优先合并哪些窗口。选中窗口取均值压缩，其他位置保留，压缩后的序列执行注意力与 MLP。优先处理局部弱结构冗余，是为了在早期降低重复计算，同时让有明显结构差异的位置继续独立更新。"}, {"name": "后期：合并关注较低的位置", "flow": "后期 token → 压缩细节表示", "operation": "生成后期，找出较少被其他位置关注的 token，与更重要且相似的位置合并，把计算留给仍需要细化的部分。\n\n后期统计每个 token 从其他位置得到的注意力，较少被读取的位置视为弱细节候选。候选与较重要 token 匹配相似度后加权合并，后期主要节省 MLP 计算，保留完整注意力的信息交换。计算后再把序列还原到原空间，并结合上一时间步各位置的状态，降低把多个位置完全替换成同一特征的误差。"}, {"name": "动态压缩率", "flow": "去噪阶段 → 合并比例或阈值", "operation": "随结构和细节生成阶段调整压缩程度，避免全程同一强度。\n\n基础方案让合并比例随去噪过程按余弦趋势下降，早期较多、后期较少，对特定时间步和浅层另作较保守设置。增强方案则先统计相似度分布，建立比例与阈值的对应表，再按当前层和时间步选择阈值。比例直接规定合并数量，阈值则让实际压缩程度随冗余变化，二者是不同的控制方式。"}, {"name": "提示词重加权", "flow": "结构／细节提示 → 阶段相关文字指导", "operation": "相应提高当前阶段所需语义的作用，配合 token 合并。\n\n论文先把提示词划入结构、细节等分组，再按当前生成阶段调整相关注意力权重：早期更突出动作和空间结构，后期更突出颜色、材质等细节。它与视觉 token 压缩共同使用，补充压缩后仍需保留的文字指导。该模块改变条件的相对作用，原始提示和去噪基座仍是同一套输入与模型。"}], "findings": "跨骨干、采样器和数据集测试，论文报告约 1.55 倍加速，画质变化较小。", "limitations": "压缩收益取决于输入与模型，过度合并仍可能损失细节；“无损”不能泛化。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-48-fig-01.webp", "original_caption": "Figure 1. Illustration. Upper: Our SDTM represents a dynamic multi-resolution generation process by reducing feature redundan- cies in areas not unattended by the denoising process. Lower: Compared to the baseline method, our approach achieves 1.55× acceleration with negligible impact on generation quality.", "placement": "intro", "caption": "前后两条去噪序列展示压缩后的多分辨率变化及最终结果。它让读者先看到：减少 token 计算不等于始终使用同样粗糙的表示。"}, {"number": 2, "page": 3, "src": "figures/paper-48-fig-02.webp", "original_caption": "Figure 2. Preliminaries. Left: Evolution of Denoising Process: The L2 norm of (a) LL, (b) LH, HL, and HH subbands of estimated noise during the DiT denoising process. Right: Evolution of Feature Redundancies: (c) Location and (d) Degree evolution of token redundancies across DiT different steps and layers. Experiments were conducted on MMDiT [9] with 50-step RF schedule [25] based on 10k samples.", "placement": "basis", "caption": "频率子带和冗余随去噪变化，是结构先、细节后的原文分析依据。该观察随后决定不同阶段采用不同规则。"}, {"number": 3, "page": 4, "src": "figures/paper-48-fig-03.webp", "original_caption": "Figure 3. Overview. Grey: Our SDTM compresses weak-structure redundancies in the early stage and weak-detail redundancies in the later stage. Blue: Compression ratio adjusting (CRA) dynamically adjusts the ratio or threshold to control the pruning degree. Yellow: Prompt token reweighting (PTR) categorizes each prompt token into structure or detail groups, optimizing the denoising direction by reweighting attention map. Here, increase and decrease in red and green, while bold implies intensity.", "placement": "method", "caption": "总图中动态合并、压缩率调整和提示重加权分别标出，说明加速并非只靠一个固定阈值。"}, {"number": 4, "page": 4, "src": "figures/paper-48-fig-04.webp", "original_caption": "Figure 4. Visual Token Merging. By measuring structure similar- ity, unmerged frequency, and detail inattentiveness, SSM and IDM target different types of feature redundancies for reduction.", "placement": "module-1", "caption": "SSM 与 IDM 的合并依据不同：前者关注结构相似性，后者依据各位置受到的注意力，优先合并关注较低的位置。看这张图能分清两种策略到底合并哪些位置。"}, {"number": 9, "page": 8, "src": "figures/paper-48-fig-09.webp", "original_caption": "Figure 9. Visualization of merged tokens selected. White masks represent independent sampling, while gray masks represent merg- ing. In the later stage, only inattentive merged tokens are grayed.", "placement": "evidence", "caption": "不同步骤实际选择的合并位置可视化。它用于检查策略是否按设计改变关注区域，而不是仅在文字上声称动态。"}], "paper_url": "https://arxiv.org/abs/2505.11707", "code_url": "https://github.com/ICTMCG/SDTM", "sort_date": "2025-05-16", "experiment": {"summary": "在 SD3 Medium、50 步采样下，SDTM* 将耗时从 10.67 秒降到 6.90 秒，约 1.55 倍加速。COCO FID 为 28.97，接近原模型 29.02，文字 CLIP 对齐略有下降。", "caption": "优先比较同一速度档。Latency 是实际耗时，MACs 是计算量；FID 越低越好、CLIP 越高越好，用它们共同判断加速代价。", "src": "figures/paper-48-main-experiment.webp"}, "novelty": {"score": 3}, "fine_tags": ["扩散加速", "Token 合并", "结构—细节分工", "动态压缩"]}, {"id": "paper-49", "title": "Understanding and mitigating hallucination in large vision-language models via modular attribution and intervention", "chinese_title": "视觉语言模型幻觉：模块归因与定向干预", "year": "2025", "theme": "大模型可信与安全", "authors": "T Yang, Z Li, J Cao, C Xu", "publication": {"venue": "ICLR 2025", "date_label": "会议", "date": "2025-04-24—28"}, "motivation": "让看图模型描述照片，它有时会提到根本不存在的物体，例如顺着常见搭配补出画面里没有的东西。这种现象叫视觉幻觉。只统计说错了几次，还不知道该改模型哪里。这篇论文先检查哪些内部模块会增加错误物体出现的概率，再对这些位置做局部修改，减少错误描述。", "context": "模型内部有许多并行处理图像和文字联系的注意力头。作者先实际改变内部模块的输出，观察不存在的物体词出现的概率是否下降，再分析高影响模块是否过度依赖文字。这样才有依据决定后面应改哪些位置。", "analysis": "注意力高不代表对输出有因果作用。作者采用因果中介分析比较注意力与前馈模块，追查哪些部件真正推动幻觉词，并进一步研究这些注意力头是否过度依赖文本而忽视视觉。", "rationale": "这里明确使用的是论文中的因果中介分析框架：通过对内部变量的干预评估其对结果的作用。随后两种方法针对已定位的幻觉头修改计算，分别对应解码干预和局部微调。", "basis_title": "注意力大不等于导致幻觉", "method_title": "先做因果定位，再决定怎样干预", "method_input": "视觉语言模型、图像与提问，以及分析阶段定位到的幻觉相关注意力头。", "method_output": "模块贡献分析，以及通过解码干预或局部微调减少幻觉的模型输出。", "result_title": "减少幻觉也要保住生成质量", "connection": "分析得到的幻觉头用于两种不同方案：AD-HH 在解码中改文本注意力，TF-HH 只微调相关部分。两者不是必须先后执行的网络层，读者可以分别理解无需整体重训的推理干预和局部训练干预。", "architecture": [{"name": "因果模块归因", "flow": "模型内部变量、幻觉输出 → 模块贡献", "operation": "通过模块级因果中介分析，干预并比较内部模块对幻觉输出的贡献，定位高贡献注意力头，而不只用相关性可视化选位置。\n\n先在图像描述中标出与真实物体不符的幻觉词，再逐个将注意力或前馈网络（MLP）模块的输出置零，其余模型保持不变。比较干预前后这些幻觉词的生成概率，并对幻觉位置求平均，得到模块影响分数。若拿掉某个模块后幻觉概率明显下降，说明它在这组样本中确实对该输出起了推动作用，比仅看高亮注意力多了一步实际干预。"}, {"name": "幻觉头特征分析", "flow": "已定位头 → 文本偏好与模块位置", "operation": "分析这些头的位置、文本偏好及其与语言底座、指令微调的关系，建立后续干预应针对哪些计算通路的依据。\n\n定位相关头之后，把它们对指令及已生成文字的注意力，与对图像 token 的注意力分别求和，检查其依赖哪种输入。作者还比较视觉指令微调后的模型与语言底座对应头，分析这种文字偏好是否延续自原有语言模型。这个阶段产出需干预的头集合及其行为依据，接着可分别选择下面两种方法。"}, {"name": "AD-HH：解码干预", "flow": "已定位的头 → 调整后的文本注意力", "operation": "生成时对过度偏向文字的幻觉头关闭文本注意力。\n\nAD-HH 并非永久关闭这些头：每个解码步先求相关头在文字 token 上的注意力总量，只有超过阈值时，才将该步文字注意力置零；未超过则照常计算。这样对过度依赖文字的时刻进行干预，同时保留其他时刻的正常生成。它只需单次生成前向，但必须显式读取注意力权重，论文因此讨论了与高效注意力实现的兼容性。"}, {"name": "TF-HH：局部微调", "flow": "相关注意力头与语言头 → 更新的模型", "operation": "只微调定位相关的参数，论文实现中特别处理注意力的 Query／Key。\n\nTF-HH 是另一条路线：冻结其余模块，只更新定位相关的注意力参数与最终语言预测头。训练将常规下一词元损失，与抑制这些头过度依赖文字的惩罚结合，兼顾回答流畅与看图依据。训练完成后可直接贪心解码，不必先运行 AD-HH；两者分别是推理时调整计算和训练时修改少量参数。"}], "findings": "LLaVA-v1.5-7B 的 COCO 描述实验中，幻觉率最多降至原来的约 1/1.7，同时检查生成质量。", "limitations": "无需训练方案需要显式注意力权重，与 FlashAttention 等实现不兼容；定位与干预需模型内部访问；结论不能外推为所有幻觉的唯一原因。", "figures": [{"number": 1, "page": 4, "src": "figures/paper-49-fig-01.webp", "original_caption": "Figure 1: Influence scores of MLP and MHAs in LLaVa-7B on generation probability of hal- lucination objects.", "placement": "basis", "caption": "MLP 与多头注意力的中介效应比较用于定位更相关的模块类型。纵轴是干预后效应，不是一般注意力权重。"}, {"number": 2, "page": 5, "src": "figures/paper-49-fig-02.webp", "original_caption": "Figure 2: Contrastive influence values of atten- tion heads in the LLaVA-7B model, with blue boxes for the top 20 hallucination heads and red boxes for non-hallucination heads.", "placement": "basis", "caption": "不同层、不同注意力头的对照影响值帮助定位少数高贡献头。定位结果告诉后续方法应优先改哪里。"}, {"number": 3, "page": 5, "src": "figures/paper-49-fig-03.webp", "original_caption": "Figure 3: Attention weights on text and image tokens for hallucination and non-hallucination heads. Hallucination heads strongly favor text tokens over image tokens.", "placement": "method", "caption": "幻觉头和非幻觉头在文字／图像注意力上的差别，为“过度偏向文字”的机制解释提供经验依据。"}, {"number": 6, "page": 7, "src": "figures/paper-49-fig-06.webp", "original_caption": "Figure 6: (a) Downscaling text attention weights reduce hallucination rate. (b) Upscaling image attention weights does not work. (c) Downscaling text attentions weights to zero lead to the drop in generation quality of BLEU.", "placement": "detail", "caption": "改变文本或图像注意力强度的对照同时观察幻觉和质量。它说明降低文本影响不是越强越好，直接全关也可能损伤正常生成。"}, {"number": 7, "page": 9, "src": "figures/paper-49-fig-07.webp", "original_caption": "Figure 7: Visualization of attention weights for the top hallucination head when predicting the next token (shown in blue). We accumulate the attention weights on a total of 576 image tokens into the placeholder <image> to simplify visualization. Redder values in the context indicate larger attention weights. The original LLaVA-7B model significantly relies on the previously generated tokens, resulting in hallucination. Our model through targeted fine-tuning does not have this issue.", "placement": "evidence", "caption": "具体生成案例展示相关头的注意力和输出差别，把内部干预与用户能看到的描述联系起来。"}], "paper_url": "https://proceedings.iclr.cc/paper_files/paper/2025/hash/8001c3568152d134d821cd46d4d84768-Abstract-Conference.html", "code_url": "https://github.com/TianyunYoung/Hallucination-Attribution", "sort_date": "2025-04-24", "experiment": {"summary": "在 COCO 和 Nocaps 图像描述中测量物体幻觉。LLaVA-7B 在 COCO 上的 CHAIR-I 从 13.3 降到 AD-HH 的 8.0 或 TF-HH 的 8.7，说明两种定向干预均可减少幻觉物体。", "caption": "CHAIR-S 统计含幻觉的句子比例，CHAIR-I 统计幻觉物体比例，均越低越好。解码干预与局部微调是两种独立设置。", "src": "figures/paper-49-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["视觉语言模型", "物体幻觉", "因果归因", "注意力干预", "局部微调"]}, {"id": "paper-50", "title": "B4m: Breaking low-rank adapter for making content-style customization", "chinese_title": "B4M：可组合的内容—风格低秩适配", "year": "2025", "theme": "图像编辑与生成评估", "authors": "Y Xu, F Tang, J Cao, Y Zhang, O Deussen, W Dong, J Li, TY Lee", "publication": {"venue": "ACM Transactions on Graphics 44(2)", "date_label": "正式发表", "date": "2025-04-17", "preprint_date": "2024-03-28", "arxiv_id": "2403.19456"}, "motivation": "你分别学会了“画某个特定人物”和“画成某种风格”，希望把两种能力组合起来。但把两个小型微调模块直接叠加，可能人物不像了，或画风变淡；一起训练又可能只会画这个人物配这种风格。这篇论文研究怎样分开存放内容与风格的变化，再让两者能灵活组合。", "context": "LoRA 是在原模型旁学习的一小组可调整参数，可以用来记录特定人物或画风。若同一组参数同时承担两种概念，它们就容易相互影响。B4M 从哪些参数负责内容、哪些负责风格，以及训练时怎样搭配两类样本入手。", "analysis": "LoRA 的上下投影矩阵共同决定更新，把内容和风格都放在共享可学习参数中，难以保证组合时仍各自保留作用。训练数据若只有一对一对应，也会鼓励记住固定内容—风格配对。", "rationale": "预印本把内容与风格分配到不同的可学习参数分块，用近似正交的初始化减少相互干扰，这一设计称为 PLP。训练时再让同一内容对应多种风格、同一风格对应多种内容，即 MCP，减少固定配对带来的绑定。正式版还采用黎曼预条件，协调组合时内容与风格的学习。", "basis_title": "内容与风格为何会在参数里纠缠", "method_title": "先分开学习，再组合优化", "method_input": "少量主体内容图、风格参考图和生成提示。", "method_output": "可组合的内容／风格适配器，以及按新提示生成的定制图像。", "result_title": "组合是否保留两边的特征", "connection": "PLP 决定内容和风格分别学习哪些参数，MCP 决定训练时怎样交叉配对，组合阶段再重建可用适配器。这里图示主要来自 Break-for-Make 预印本；正式版关于黎曼预条件的补充仍按其摘要明确的用途说明。", "architecture": [{"name": "PLP：部分可学习投影", "flow": "原 LoRA → 分离的内容／风格子空间", "operation": "PLP 只学习上下投影矩阵中的部分参数，将内容与风格分配到不同子参数空间；冻结部分用近似正交基初始化，减少矩阵乘积带来的干扰。\n\nLoRA 用两个较小矩阵的乘积表示基座权重的增量，避免更新全部原模型参数。普通 LoRA 的更新是上、下投影矩阵的乘积；PLP 把两个矩阵各自拆成冻结与可学习部分。冻结块以近似正交方式初始化，使乘积的一部分尽量抵消，另外的分块分别承担内容、风格和它们的交互。这样“分离”落实在可学习参数的位置与矩阵组合上，而不是仅为两套适配器起不同名称。"}, {"name": "MCP：多对应训练", "flow": "内容与多风格、风格与多内容 → 可组合投影", "operation": "MCP 让同一内容对应多种参考风格，也让同一风格对应多种内容，打破一对一绑定，学习更可组合的参数空间。\n\n学习某个主体时，同时搭配多种风格参考更新对应部分；学习某种风格时，则配合多种内容。训练因而不能只靠记住一组固定的主体和风格来降低误差，需要在改变搭配后仍保留所负责的概念。MCP 对应的是训练样本怎样组合，PLP 对应的是这些样本更新哪些参数，两者在同一学习过程配合。"}, {"name": "组合与平衡优化", "flow": "内容／风格 PLP → 组合适配器", "operation": "组合阶段重新拼接内容与风格的 PLP 矩阵。正式期刊摘要进一步采用黎曼预条件（Riemannian preconditioning）自适应平衡内容与风格学习，再进行组合适配；这里的预条件用于调整优化过程，而不是新增一个生成器。\n\n预印本流程从内容适配器取上投影、风格适配器取下投影，重建组合 LoRA，再用给定内容与风格图做少量微调。单独使用原内容或风格适配器也能完成对应定制。正式版摘要另加入黎曼预条件以平衡内容与风格学习；这里保留这个版本差异，具体矩阵过程及配图按已阅读的预印本说明。"}], "findings": "通过参数分布、内容与风格重建、编辑、人类偏好及组件消融检验组合生成效果。", "limitations": "仍需参考样本训练与组合微调，复杂多主体与基础模型薄弱概念仍受限。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-50-fig-01.webp", "original_caption": "Figure 1: By separately learning content and style in “partly learnable projection” (PLP), our method is able to generate images of customized content and style aligned with various prompts while successfully disentangling content and style and maintaining high fidelity of them.", "placement": "intro", "caption": "同一主体换风格、同一风格换主体的示例明确可组合定制的目标。不是只在训练时那一对参考组合上看起来相似。"}, {"number": 2, "page": 3, "src": "figures/paper-50-fig-02.webp", "original_caption": "Figure 2: Frameworks of the two main approaches and ours for customized content-style image generation. LoRA joint training incorporates image-text pairs to fine-tuning the overall model parameters. ZipLoRA [Shah et al. 2023] effectively merging independently trained content and style LoRAs, then add to per-trained weights to generaet images of the customized content and style. Our method trains content and style in separated parameter subspaces of LoRA, results in disentanglement of content and style while maintaining high level of fidelity.", "placement": "basis", "caption": "联合训练、适配器合并和本文分离投影的结构对照。它帮助理解各方法把内容与风格放在哪些参数中，以及组合发生在何处。"}, {"number": 3, "page": 5, "src": "figures/paper-50-fig-03.webp", "original_caption": "Figure 3: Analysis of the two main methods and ours using LoRA for customized content-style image generation. Joint training LoRA will mix the parameter space of content and style, leads to entanglement of content and style. Merging LoRAs after independent training has problem of conflict parameters from content LoRA and style LoRA, leads to content and/or style unfaithful after fusion. Our proposed method trains the content and style in separate parameter subspaces of the LoRA modules, with orthogonal fixed parameter spaces, resulting in disentangled and faithful fusion of content and style.", "placement": "method", "caption": "参数空间分析展示联合学习与简单合并可能出现的干扰，并对照 PLP 的分离方式，为参数设计提供原文证据。"}, {"number": 4, "page": 5, "src": "figures/paper-50-fig-04.webp", "original_caption": "Figure 4: Illustration of the multi-correspondence projection. We present the learned content distribution on the left of the top row. When training specific content and style in a one-to-one manner, the content will tend to overfit to the specific style, as illustrated on the middle of the top row. By leveraging our proposed multi-correspondence projection, we learn multiple styles with the content in PLP, enhance the generalization of the learned content.", "placement": "module-1", "caption": "MCP 中同一内容与不同风格交叉对应，反向也同样组织。图把“打破一对一绑定”落实为训练关系，而不只是新增一个正则名称。"}, {"number": 14, "page": 14, "src": "figures/paper-50-fig-14.webp", "original_caption": "Figure 14: Ablation study evaluating the impact of the proposed Multi-Correspondence Projection (“MCP”). We train specific content (e.g., “vase”) and style (e.g., “glass”) in a one-to-one manner and directly inference after training. Results are presented in W/o MCP - I column. We train specific content (e.g., “vase”) and style (e.g., “yarn”) in a one-to-one manner in the first stage, and combine the content (e.g., “vase”) adapters with other style (e.g., “glass”) adapters in the second stage, then inference with the combined adapters. Results are presented in W/o MCP - II column. The visual comparison highlights the effectiveness of MCP in enhancing the details while preserving the disentanglement of content and style, as well as maintaining high-level fidelity of them.", "placement": "evidence", "caption": "移除多对应训练后的对比用于检查配对策略是否影响新组合。关注内容与风格是否各自保持，而不是只看整体画质。"}], "paper_url": "https://doi.org/10.1145/3728461", "code_url": "https://github.com/ICTMCG/Break-for-make", "sort_date": "2025-04-17", "experiment": {"summary": "本地预印本主表比较内容、风格与提示对齐。本文风格相似度为 0.6219、内容相似度为 0.6615；相对 DB+LoRA，风格更高而内容更低，呈现了内容与风格之间的取舍。", "caption": "Content、Style、Prompt 分别衡量主体保持、风格与提示词匹配，展示内容和画风组合时的不同取舍。这里对应 Break-for-Make 预印本的主实验。", "src": "figures/paper-50-main-experiment.webp"}, "novelty": {"score": 4}, "fine_tags": ["内容—风格定制", "LoRA", "参数解耦", "组合式生成"]}, {"id": "paper-38", "title": "Exploiting user comments for early detection of fake news prior to users’ commenting", "chinese_title": "CAS-FEND：在评论出现前利用评论知识检测新闻", "year": "2025", "theme": "虚假信息与新闻理解", "authors": "Q Nan, Q Sheng, J Cao, Y Zhu, D Wang, G Yang, J Li", "publication": {"venue": "Frontiers of Computer Science 19(10)", "date_label": "在线发表", "date": "2025-01-28", "preprint_date": "2023-10-16", "arxiv_id": "2310.10429"}, "motivation": "新闻评论里常有人指出矛盾、补充证据，能帮助判断真假。但新新闻刚发出时还没有评论，不能等大家讨论完才预警。这篇论文让模型在训练时学习历史评论提供的信息；真正判断新新闻时，只读新闻正文，把从旧评论学到的经验用起来。", "context": "训练时可以同时阅读新闻和历史评论的模型，称为“教师”；上线时只阅读新闻正文的模型，称为“学生”。教师先从评论学到疑点、情绪等线索，再把这些信息用于指导学生。新新闻出现后，只运行学生，就不必等待真实评论积累。", "analysis": "直接为新新闻编几条虚拟评论，可能带来额外错误。论文改为让学生学习教师内部已有的内容、情绪和综合特征，这种训练方式称为“知识蒸馏”。不同新闻所需的线索不同，模型还会学习给各类指导分配不同权重。", "rationale": "历史评论只在训练阶段提供额外帮助。作者把这种帮助拆成词级内容、情绪和综合判断三类，分别指导学生，并按新闻内容决定各类指导的重要性。最终只保留能从正文独立判断的学生模型。", "basis_title": "评论还没出现，怎样利用评论知识", "method_title": "教师看评论，学生只看正文", "method_input": "训练时为新闻及历史评论；上线早期检测时只有新闻正文。", "method_output": "不等待评论积累即可给出的真假判断。", "result_title": "不同新闻需要的监督并不一样", "connection": "教师先学习内容与评论之间的线索，学生分别接收词级、情绪和综合知识。知识偏好评分器控制蒸馏权重，随后部署只保留学生；训练输入更多不等于上线也需要相同输入。", "architecture": [{"name": "有评论教师", "flow": "新闻、历史评论 → 多类教师知识", "operation": "教师模型联合编码新闻与评论，通过共注意力寻找相关内容，并建模社会情绪，形成有评论条件下的判断。\n\n教师将评论按时间串接，与新闻分别编码，再以词元级共注意力计算双方哪些内容最相关。新闻语义、评论语义和社会情绪共同形成教师判断。训练完成后冻结教师，保留它的内容注意力、情绪特征和综合特征供学生学习，因此评论线索进入后续模型的方式是监督迁移。"}, {"name": "正文学生", "flow": "新闻正文 → 词级、情绪和综合表示", "operation": "学生只编码新闻正文，同时学习教师的重要词分布、虚拟社会情绪和综合特征，分别接收细粒度内容、情感与整体判断知识。\n\n学生仍只读新闻词元：内容注意力学习教师认为哪些词重要；社会情绪预测器用掩码注意力和 MLP 从正文预测评论可能体现的情绪；内容与虚拟情绪再加权形成综合特征。三层目标分别采用均方误差靠近教师信号，学生最后用自己的综合特征分类，不需要先生成几条虚拟评论。"}, {"name": "知识偏好蒸馏", "flow": "新闻内容、各类监督 → 加权训练目标", "operation": "内容相关的知识偏好评分器为各蒸馏目标分配权重，让不同新闻选择更有帮助的监督。部署阶段只保留学生，不需要等待或输入真实评论。\n\n知识偏好评分器也只看新闻词元，输出三个归一化权重，分别控制语义、情绪、综合蒸馏损失。加权蒸馏与真假分类损失共同更新学生，因此不同新闻可从教师的不同知识中获益。训练结束部署学生，教师与真实评论均不再是输入；这正对应新闻刚出现、尚没有用户评论时的使用场景。"}], "findings": "学生优于所比较的纯正文方法，并优于部分只获得四分之一评论的评论模型，支持发布时检测。", "limitations": "历史评论可能有偏差与噪声；虚拟情绪是预测特征，不能冒充实际用户态度；跨平台及未来事件仍需验证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-38-fig-01.webp", "original_caption": "Fig. 1 Difference between existing fake news detection methods (content-only and comment-aware) and ours in training-testing settings.", "placement": "intro", "caption": "表格式对照把纯正文、依赖评论和本文的训练／测试条件放在一起。CAS-FEND 的关键是训练可使用评论、测试不依赖评论。"}, {"number": 2, "page": 6, "src": "figures/paper-38-fig-02.webp", "original_caption": "Fig. 2 Overall architecture of the Comments Assisted Fake News Detection (CAS-FEND) framework, which consists of a teacher model and a student model. During the teacher model training, we exploit both news content and comments by aggregating the semantic feature of news content (st p) and user comments (st c) and the social emotion feature et. When training the student model, we only input the content and freeze the well-trained teacher model as guidance. We adopt a Social Emotion Predictor to get an alternative virtual social emotion feature es and aggregate it with content semantic feature ss p. With the help of Knowledge Preference Scorer, the student feature learning is guided by the teacher model through a loss- based adaptive knowledge distillation at the semantic, emotional, and overall knowledge levels.", "placement": "method", "caption": "上方教师联合正文与评论，下方学生仅看正文；中间蒸馏连接三类知识，偏好评分器决定各类监督权重。箭头表示训练指导，并不是推理时再查询教师。"}, {"number": 3, "page": 14, "src": "figures/paper-38-fig-03.webp", "original_caption": "Fig. 3 Distribution of average preference scores for fake and real categories.", "placement": "evidence", "caption": "不同真假类别的平均知识偏好权重不同。图用于检查自适应加权是否实际区分了知识需求，而不是三种蒸馏始终等权。"}], "paper_url": "https://link.springer.com/article/10.1007/s11704-024-40674-6", "sort_date": "2025-01-28", "experiment": {"summary": "在 Weibo21 与 GossipCop 上按时间切分，正文学生模型的宏 F1 分别为 0.7950 和 0.8434，高于表中纯正文与蒸馏对比方法。检测时不输入真实评论，仍能利用训练期转移的评论知识。", "caption": "CAS-FEND(stu) 是上线时只读正文的学生模型。主表对照同样无需等待评论的检测方法。", "src": "figures/paper-38-main-experiment.webp"}, "novelty": {"score": 2}, "fine_tags": ["早期虚假新闻检测", "知识蒸馏", "社会情绪", "自适应加权"]}, {"id": "paper-52", "title": "Multi-level feature dynamic fusion neural radiance fields for audio-driven talking head generation", "chinese_title": "MLDF-NeRF：多层特征融合的音频驱动说话头像", "year": "2025", "theme": "可控视频生成", "authors": "W Song, Q Liu, Y Liu, P Zhang, J Cao", "publication": {"venue": "Applied Sciences 15(1)", "date_label": "正式发表", "date": "2025-01-06"}, "motivation": "给一张人物形象配上语音，生成说话视频时，嘴唇要跟声音动，脸的其他部位又不能一起乱动。把声音信息用同一种方式加到整张脸上，很难兼顾这些差别。这篇论文让模型同时保留粗、细层次的面部信息，并让不同区域选择性地使用音频，改善说话头像的细节与稳定性。", "context": "本文用一种可从空间位置生成颜色和透明度的场景表示来绘制头像，称为神经辐射场（NeRF）。声音提供嘴部运动线索，空间特征保留脸部形状和纹理；方法重点是让这些信息在不同面部位置
