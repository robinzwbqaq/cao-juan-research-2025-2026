<script id="paper-data" type="application/json">[{"id": "paper-01", "title": "Who Does What and Where to Go: Orthogonal Alignment and Hierarchical Planning for Multi-entity Trajectories", "chinese_title": "多实体三维轨迹生成：身份动作绑定与分层空间规划", "year": "2026", "theme": "人物与交互视频生成", "authors": "Z Wan, Y Li, T Huang, J Cao, S Tang", "publication": {"venue": "ECCV 2026", "date_label": "在线发表", "date": "2026-09-15"}, "motivation": "在交互视频里，单个人物动作自然还不够。输入“猫向左跑、狗向右跳”时，系统既要把每个动作交给正确的实体，也要让它们在同一空间中合理移动。直接生成视频很难单独检查这些约束，因此论文先研究多实体三维轨迹，把轨迹作为后续视频生成可以使用的结构条件。", "context": "论文输出的核心不是一段成片，而是每个实体随时间变化的三维位置。这样可以分别检查两件事：角色有没有执行指定动作，以及轨迹是否发生碰撞。后续视频模型再把这份结构条件转成画面，因而轨迹质量与最终画质不是同一个评价目标。", "analysis": "困难分成两层：语义层上，身份、动作和方向容易混在一起，导致角色互换；几何层上，二维画面里看似错开的物体，在深度方向仍可能碰撞。把两类问题都交给端到端坐标回归，会使语义错误与空间错误彼此叠加。", "rationale": "作者把语义—物理落差拆成身份动作耦合和缺少几何先验两项问题。§4.2 用外积融合身份与动作，并最小化不同实体意图向量的归一化内积：L_ortho = ∑ᵢ∑ⱼ≠ᵢ |〈Fᵢ,Fⱼ〉| / (‖Fᵢ‖‖Fⱼ‖)。约束施加在意图特征上，不是要求运动轨迹互相垂直。§4.3 再用俯视空间先验引导三维去噪。", "basis_reference": "§4.2—4.3：StructVLA 与分层规划", "basis_title": "先分清动作归属，再处理空间约束", "method_title": "从实体表示到三维轨迹", "result_title": "轨迹条件能为视频带来什么", "connection": "整个流程先读取参考帧和文字，形成逐实体的意图表示；再从深度得到场景俯视图；最后共同引导轨迹扩散。身份分支负责“是谁”，动作分支负责“做什么”，俯视图负责“哪里能走”，三者在轨迹生成时汇合。", "architecture": [{"name": "实体拆分", "flow": "参考帧、逐实体动作描述 → 身份特征与运动特征", "explanation": "身份掩码是标出某个实体像素范围的二值图，负责限定视觉编码对象；动作分支则描述该实体做什么、向哪里运动。两路信息先独立提取，再进入后面的绑定，避免一开始就混合其他角色。", "operation": "先建立逐实体的输入表示。分割参考帧得到身份掩码，单独编码每个主体；再把文本拆成以动作为中心的描述，提取对应运动特征，避免整张图和整句话压成一个混合向量。"}, {"name": "StructVLA：身份—动作绑定", "flow": "身份特征、运动特征 → 可区分的实体意图表示", "explanation": "外积融合同时保留身份与动作之间的组合关系。正交约束降低不同实体意图向量之间的相似度；它约束的是表示空间，允许角色执行同行等相关运动。每个实体的绑定结果继续交给轨迹模型。", "operation": "StructVLA 用因子化张量融合绑定身份与动作，并对不同实体的意图特征施加正交约束。这里要求的是特征容易区分，并不要求两个人物的运动方向互相垂直，也允许同行等相关动作。"}, {"name": "几何感知俯视图", "flow": "场景深度 → 占据与可通行区域", "operation": "从深度建立 BEV，将前后空间关系转成俯视占据与边界，为多实体共享规划提供参照。", "explanation": "这一步提供结构条件，还没有生成完整三维运动。"}, {"name": "渐进轨迹去噪", "flow": "实体意图、BEV → 连续三维轨迹", "operation": "扩散模型在语义与几何条件下逐步恢复各实体的位置序列。", "explanation": "输出可用于下游视频合成，但仍需要单独检查碰撞与长序列误差。"}], "findings": "在 Stepwise-ME 合成多实体数据上验证动作归属与空间一致性。补充实验平均碰撞率为 7.3%；对比独立生成再合并的轨迹更少发生碰撞。", "limitations": "与部分单实体方法的比较采用独立生成后聚合协议；数据主要来自合成环境，仍会发生碰撞，不能解释为严格物理安全保证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-01-fig-01.webp", "original_caption": "Fig. 1: Qualitative comparison between end-to-end baselines and our ProgTraj-Director. End-to-end baselines suffer from inter-entity collisions (penetra- tion) and motion binding confusion. In contrast, our hierarchical decoupled framework achieves physics-consistent, collision-free trajectories with precise entity-motion binding via geometry-aware spatial planning.", "placement": "intro", "caption": "图中把角色动作绑定错误和空间碰撞放在一起比较。前者是把某个动作交给了错误对象，后者是轨迹位置冲突；两个错误可能同时出现，因此不能只检查视频整体是否流畅。"}, {"number": 2, "page": 5, "src": "figures/paper-01-fig-02.webp", "original_caption": "Fig. 2: Empirical analysis of semantic entanglement and static bias. (a) Radar charts show a “static bias” where CLIP variants favor static content words over dynamic motion verbs. (b) Relational tests reveal a role binding collapse when swapping entity roles (e.g., Cat ↔Dog). (c) Attention heatmaps visualize the resulting semantic leakage and attribute misbinding.", "placement": "basis", "caption": "作者分析视觉语言模型对静态内容词和动态动作词的响应差异，以及角色关系绑定问题。这是 StructVLA 拆开身份与动作的经验依据，不是先假定分支越多就越有效。"}, {"number": 3, "page": 6, "src": "figures/paper-01-fig-03.webp", "original_caption": "Fig. 3: The semantic-physical gap and geometric uncertainty. (a-b) Depth (Z-axis) ambiguity results in physical collisions despite plausible 2D projections. (c) Statistical analysis shows that geometric errors and inter-entity collision rates accumulate exponentially over longer sequences due to the lack of explicit spatial priors.", "placement": "basis", "caption": "二维投影里位置合理，三维深度上仍可能相撞。俯视表示把原来在画面中不明显的前后关系转成空间占据关系，说明为什么只有文本与二维外观还不够。"}, {"number": 4, "page": 6, "src": "figures/paper-01-fig-04.webp", "original_caption": "Fig. 4: Overview of the ProgTraj-Director framework. Our model integrates a StructVLA module for identity-action decoupling and a hierarchical spatial planning mechanism guided by Geometry-Aware BEV priors.", "placement": "method", "caption": "总图先看左侧的身份掩码和动作解析，再看中间的实体绑定；另一条路径从深度生成 BEV，两条路径共同进入右侧轨迹去噪模型。输出是各实体的连续三维轨迹。"}, {"number": 9, "page": 14, "src": "figures/paper-01-fig-09.webp", "original_caption": "Fig. 9: Trajectory-guided versus text-only multi-entity video generation. Without 3D priors (Bottom), text-only generation suffers from tangled trajectories, missing spatial coordination, and entity merging. With 3D trajectory control (Top), ProgTraj-Director provides geometric guidance that improves entity separation and physical plausibility.", "placement": "evidence", "caption": "图中比较使用三维轨迹条件与只用文字的视频生成。它展示这项工作和下游视频合成的关系：先改善运动结构，再观察视频中实体纠缠、合并等问题是否减轻。"}], "paper_url": "https://link.springer.com/chapter/10.1007/978-3-032-37029-7_34", "code_url": "https://github.com/wzbos-token/Who-Does-What-and-Where-to-Go"}, {"id": "paper-02", "title": "TryOnCrafter: Unleashing Camera Trajectories for Realistic Video Virtual Try-on via a Renderable 4D Try-on Proxy", "chinese_title": "TryOnCrafter：可控制相机轨迹的视频试衣", "year": "2026", "theme": "人物与交互视频生成", "authors": "H Sun, H Yan, M Chen, Q Song, Y Li, J Cao, J Lan, X Zhu, B Zheng, ...", "publication": {"venue": "ECCV 2026", "date_label": "arXiv 首发", "date": "2026-06-24", "preprint_date": "2026-06-24", "arxiv_id": "2606.26092"}, "motivation": "视频试衣通常默认沿用原视频的机位。如果还想让镜头绕着人物移动，就必须同时补出衣服侧面、人物遮挡关系和新视角背景。论文希望把“给人物换衣”和“重新安排镜头”放在同一个流程中，让试衣结果能够跟随新的相机轨迹。", "context": "换镜头并不是对原片做简单平移。镜头绕到侧面后，人物遮挡、衣服可见面和背景透视都变了。论文先建立一个可从新视角观察的粗场景，再由视频模型修细节，避免每一帧都从头猜几何关系。", "analysis": "二维换衣模型能修改可见衣服，却没有稳定的三维场景表示；直接让视频模型猜新机位，又容易让衣纹、人物比例和背景漂移。另一个具体问题是，重建点云与人体模型处在不同坐标和尺度中，即使各自在原视角投影正确，合起来仍可能错位。", "rationale": "§3.1 明确指出，单目重建的人体与场景存在尺度和坐标差异，因此用人体点云作锚，通过相似变换 T(v)=sRv+t 对齐。§3.2 将可渲染代理提供的结构先验与跨视角参考特征结合，分别对应新机位下的空间布局和外观细节保持。", "basis_reference": "§3.1—3.2：四维代理与代理引导生成", "basis_title": "为什么先做一个能渲染的试衣代理", "method_title": "场景对齐、换衣人物与视频细化", "result_title": "换镜头后，哪些部分仍需保持", "connection": "这三步有明确先后：先统一场景和人体坐标，才能把换好衣服的人物放回正确位置；有了动态代理，才能沿新机位渲染；渲染结果再交给视频模型，参考适配器则持续提供原人物和原场景信息。", "architecture": [{"name": "场景与人体对齐", "flow": "原视频 → 统一坐标中的背景和人体动作", "explanation": "SMPL-X 是参数化人体表示，给出身体及手部等姿态；点云来自场景重建。锚定对齐解决它们之间的尺度和坐标差异，是后续新视角渲染前必须完成的连接步骤。", "operation": "从原视频估计深度、相机和动态点云，分离人物与背景；同时恢复 SMPL-X 人体运动。以可靠的人体点云区域为锚，通过相似变换把人体动作对齐到场景的世界坐标。"}, {"name": "四维试衣代理", "flow": "关键帧、目标服装、人体动作 → 可渲染的动态人物与场景", "explanation": "三维高斯人物用一组带位置、形状和颜色的高斯表示外观，再由人体动作驱动形变。“四维”指三维表示随时间变化，使同一人物能够沿不同相机轨迹被渲染。", "operation": "选择正面可见、遮挡较少的关键帧，先完成二维换衣，再生成穿目标服装的三维高斯人物。用对齐的人体动作驱动这个人物，并把它放回保留的背景，形成可随时间变化的四维试衣代理。"}, {"name": "代理引导 DiT", "flow": "新机位代理渲染 → 细化的视频特征", "operation": "沿目标相机路径渲染四维代理，给视频模型明确的空间布局，再由 DiT 恢复图像细节。", "explanation": "代理承担结构，生成器承担细化，避免每帧完全从文字猜布局。"}, {"name": "跨视角参考适配器", "flow": "源视频与参考图 → 身份、衣料与背景补充", "operation": "参考适配器把原片特征引入新视角生成，补充粗代理缺失的细节。", "explanation": "这条路径与代理引导共同作用，不是在最后一帧完成后的换脸或贴图。"}], "findings": "在 CaM-VVTBench 上检查服装保持、生成质量和镜头控制，并展示环绕、子弹时间及人物重定位等效果。", "limitations": "依赖上游人体、深度和三维头像重建；看不见的衣服背面仍需推测，不能理解为真实服装测量。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-02-fig-01.webp", "original_caption": "Fig. 1: Examples synthesized by TryOnCrafter. We introduce a Renderable 4D Try-on Proxy (middle) as a geometric anchor to guide the Video Diffusion Transformer. This explicit 4D representation enables photorealistic try-on across unconstrained, novel camera trajectories (bottom) not present in the source video (top).", "placement": "intro", "caption": "原片、目标服装、四维代理与最终结果对应展示。中间代理并不是最终画面，它主要为新相机路径提供结构锚点；最后的生成阶段再恢复衣服和背景细节。"}, {"number": 2, "page": 5, "src": "figures/paper-02-fig-02.webp", "original_caption": "Fig. 2: Overview of TryOnCrafter. Top: 4D Try-on Proxy Construction. A metric- aligned scene in world space is established via anchor-based alignment of dynamic point clouds and SMPL-X sequences. Integrating a canonical 3DGS-based avatar distilled from reference image, the resulting 4D Try-on Proxy supports interactive editing and rendering across arbitrary camera trajectories. Bottom: Proxy-Anchored Try-on Video Generation. The try-on video is synthesized by the DiT under the integrated guidance of rendered priors, cross-view source features, and multimodal semantic conditions.", "placement": "method", "caption": "上半部分构建场景与换衣人物，下半部分用渲染视频、参考信息和语义条件驱动 DiT。两部分分开，便于理解为什么既需要三维代理，也需要视频生成器。"}, {"number": 3, "page": 6, "src": "figures/paper-02-fig-03.webp", "original_caption": "Fig. 3: Details of 4D Try-on Proxy Construction and CRA Module. (a) A similarity transformation {Rt, tt, st} maps the SMPL-X sequence from camera space to the world space, utilizing the human point cloud as a geometric anchor. (b) The canonical 3DGS- based avatar is dynamically warped via LBS driven by the aligned SMPL-X sequence, preserving structural integrity across the motion. (c) The CRA module facilitates inter- action between DiT features Fi and reference features Fl. By sharing K-V projections and utilizing independent Q′-O′ weights, it integrates a reference residual O′ l into the backbone to ensure cross-view identity and background consistency.", "placement": "module-1", "caption": "三个子图分别说明坐标对齐、人体动作驱动和跨视角参考适配器。对齐解决“放到哪里”，动作驱动解决“怎样随时间变”，适配器解决“怎样继续像原来的人和场景”。"}, {"number": 6, "page": 11, "src": "figures/paper-02-fig-06.webp", "original_caption": "Fig. 6: Versatile Applications of TryOnCrafter. Leveraging the decoupled 4D proxy, our model enables controllable synthesis: (a) Human Relocalization: Translating the motion sequence within Sw while maintaining scene-geometry consistency. (b) 360- degree Orbital Viewing: Synthesizing full orbital trajectories with robust structural integrity in unobserved viewpoints. (c) Bullet Time: Rendering a frozen temporal mo- ment from a moving camera by anchoring the generation to a single pose.", "placement": "evidence", "caption": "应用图展示人物重定位和镜头变化等控制。它们共享同一个场景与人物代理，因此可在几何表示上修改，而不是为每种效果另训练一套试衣模型。"}], "paper_url": "https://arxiv.org/abs/2606.26092"}, {"id": "paper-03", "title": "Multi-Tool Image Editing Attribution in Facial Forgery", "chinese_title": "多工具人脸编辑归因：追查连续编辑中的参与工具", "year": "2026", "theme": "视觉取证与内容保护", "authors": "S Liu, Q Sheng, D Wang, Y Li, C Zhou, J Cao", "publication": {"venue": "ACM Multimedia 2026", "date_label": "arXiv 首发", "date": "2026-09-02", "preprint_date": "2026-09-02", "arxiv_id": "2609.02751"}, "motivation": "一张人脸可能先被换脸，再美颜、化妆和修图。对最终图像只预测一种来源工具，往往只能识别最近一次操作，无法回答它是否还经历过其他编辑。论文将取证目标改成多标签归因：找出所有参与过编辑的工具。", "context": "这里的“归因”不是判断照片真假，也不是寻找唯一生成模型。只要某种工具参与过，就应被标出来。例如换脸之后又化妆，正确答案应同时包含两类工具；后一步把前一步痕迹盖住，正是任务的困难所在。", "analysis": "连续编辑会覆盖或改变先前痕迹，而不同工具的线索也未必出现在同一位置。全图语义容易被人物外观主导；只看空间局部又可能忽略频域残留。因此，训练样本和特征提取都要对应真实的多步骤编辑过程。", "rationale": "作者将多次编辑引发的痕迹覆盖视为单工具归因失效的原因，提出从空间与频率两域提取局部补丁证据，并以多标签目标预测参与工具集合。按错误调整的课程学习用于逐步处理更难的组合；这些是论文的问题分析与方法设计，不是关于所有编辑链可恢复性的定理。", "basis_reference": "§3—4：MultiEdit 与 DPEC", "basis_title": "连续编辑为什么会让归因更难", "method_title": "局部痕迹怎样汇成工具集合", "result_title": "模型看的是哪些编辑区域", "connection": "训练数据先定义工具集合标签，特征网络再从最终图像提证据。DPEC 内部的补丁增强负责看哪里、看哪类痕迹；课程学习负责怎样安排训练难度。后者不是推理时还要逐步重放编辑链。", "architecture": [{"name": "MultiEdit：多步编辑数据", "flow": "源人像、六类编辑工具 → 带多标签的编辑链样本", "explanation": "标签记录各工具是否参与，目标不要求恢复操作先后。这使同一图像可以同时有多个真标签，也决定最后不能采用只允许一个答案的普通多分类输出。", "operation": "构建 MultiEdit 数据集，从 200 张源人像出发组合六类工具，生成约 51 万张、最多五步的编辑结果，并为每张图保留参与工具的集合标签。"}, {"name": "DPEC：双域补丁证据", "flow": "最终人脸图 → 增强后的局部取证特征", "explanation": "空间域关注局部纹理和边界，频率域提供另一种残留表达。补丁是图像小块，增强模块优先放大具有区分力的区域，不把整张脸的内容特征直接当作工具证据。", "operation": "DPEC 在空间域和频率域分别编码局部补丁，让细节纹理与频率异常提供互补证据；随后增强更有区分力的补丁，减少与归因无关的人脸内容影响。"}, {"name": "错误驱动课程与多标签预测", "flow": "双域特征、当前学习难点 → 参与工具集合", "explanation": "课程学习改变训练难度安排，不是推理时增加一次编辑过程。预测阶段每种工具分别得到是否参与的判断，最后组合成集合；整组都正确才计为严格命中。", "operation": "采用按错误调整的课程学习安排训练难度，让模型逐渐适应更复杂的编辑组合，最终同时输出多个工具是否参与，而非把它们当成互斥类别。"}], "findings": "在六类工具的组合测试中，平均严格准确率为 92.93%，五步编辑时为 87.40%。严格准确率要求整组工具全部预测正确。", "limitations": "只覆盖人脸与六种工具；换脸仅放第一步。识别工具集合不等于恢复先后顺序；源人像仅 200 张。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-03-fig-01.webp", "original_caption": "Figure 1: Multi-Tool Image Editing and Attribution. A polished portrait often undergoes multiple editing operations from different tools, and the whole editing process remains unseen and undisclosed. Existing single-tool attribution methods focus on extracting specific features produced by a single tool, which, to their best, only produces an incomplete prediction. In this paper, we explore how to build a multi-tool attributor that can identify all involved tools in the image editing process from a given edited result image.", "placement": "intro", "caption": "图中对照单工具与多工具归因：观察者只能看到最终人像，看不到实际编辑过程。新任务需要找出多个参与者，因此输出应是一个集合。"}, {"number": 3, "page": 8, "src": "figures/paper-03-fig-03.webp", "original_caption": "Figure 3: Ridge graph of the spatial and frequency domains among editing tools. We analyze the spatial and frequency domain differences between the images before and after editing by specific tools on different facial regions. In the spatial domain, CSD-MT, SHMT, and DeepFake show similar distributions, while totally differing in the frequency domain. Likewise, the distributions of OpenCV and FLUX are similar in the frequency domain while varying in the spatial domain.", "placement": "basis", "caption": "图按面部区域比较不同工具在空间域与频率域的变化分布。不同工具的可辨线索不完全相同，这为同时使用双域、局部补丁提供了原文依据。"}, {"number": 6, "page": 10, "src": "figures/paper-03-fig-06.webp", "original_caption": "Figure 6: Overview of DPEC. DPEC consists of a) Patchwise Feature Enhancement (PFE) module and b) Error-based Curriculum Learning (ECL) module. PFE applies Slide Window DCT and a patchwise cross-attention to capture distinguishable, locality-aware features in both spatial and frequency domains. ECL adjusts data sampling weights of each subset of different difficulties during training based on error rate feedback, enabling the model to learn progressively from simple to hard samples. Based on the fused feature, a multi-label classifier finally predicts which tools in the candidates manipulated the given edited image IS.", "placement": "method", "caption": "DPEC 包括补丁级特征增强 PFE 和基于错误的课程学习 ECL。滑窗 DCT 与补丁交叉注意力用于提取、强调局部证据；ECL 另外调整训练的难易安排。"}, {"number": 8, "page": 15, "src": "figures/paper-03-fig-08.webp", "original_caption": "Figure 8: Decisive ROI Visualization for Different Editing Tools. The red-highlighted regions indicate the areas that DPEC focuses on when attributing each tool. a) Original images; b) Multi-tool edited images; c)-g) Grad-CAM heatmaps for different editing tools. Editing targets are marked with colored boxes for clarity.", "placement": "evidence", "caption": "热图显示模型为不同工具关注的区域。它能帮助检查预测是否依赖局部编辑线索，但热图本身不等于恢复了编辑顺序，也不构成工具参与的独立证明。"}], "paper_url": "https://arxiv.org/abs/2609.02751", "code_url": "https://github.com/ICTMCG/MIEA"}, {"id": "paper-06", "title": "AgentHOI: Multi-Agent Reasoning for Human-Object-Interaction Video Generation via Implicit Representation Alignment", "chinese_title": "AgentHOI：以多角色推理驱动人—物交互视频", "year": "2026", "theme": "人物与交互视频生成", "authors": "Z Huang, S Li, J Cao, C Li, Y Zhang, Z Zhou, C Wang, Y Zhou, Q Lu, ...", "publication": {"venue": "arXiv:2607.22241", "date_label": "预印本首发", "date": "2026-07-24", "preprint_date": "2026-07-24", "arxiv_id": "2607.22241"}, "motivation": "让人物拿起某件物体，仅提供人物图、物体图和一句话仍很困难：模型需要决定哪只手先动、什么时候接触、怎样转移物体。要求用户额外提供骨架或完整运动序列，又把最难的规划工作交回了用户。AgentHOI 尝试在生成前补出动作计划。", "context": "用户只给两张参考图时，人物和物体还没有共同场景，甚至可能姿态不适配。系统不能直接假定人物已经拿着物体，而要先看清现有姿态、手是否空闲，再按文字要求安排接近、抓取和移动等动作关系。", "analysis": "语言模型可以描述合理动作，却未必能把这种知识直接传给视频模型；视频模型擅长合成外观，也未必理解手部接触的时序。论文因此同时处理显式动作推理和隐式运动表示，两者分别解决计划可读性与生成可执行性。", "rationale": "论文明确区分生成前的结构化动作推理和训练期的运动表示对齐。前者把用户意图拆成可检查的交互计划，后者从文本到运动教师蒸馏隐式运动知识，使视频模型学会利用计划；作者据此实现推理时不输入显式运动序列的设定。", "basis_reference": "§3.1—3.2：交互推理与隐式运动对齐", "basis_title": "动作计划怎样进入视频模型", "method_title": "先规划交互，再生成连续画面", "result_title": "哪些改动改善了交互", "connection": "动作推理在生成前运行，输出文字计划；运动教师主要在训练时提供特征监督。两者承担不同职责：一个把意图说具体，一个让视频模型学会把具体意图转成运动。部署时不需要教师再输出一套显式骨架。", "architecture": [{"name": "视觉感知角色", "flow": "独立人物图与物体图 → 物理属性", "operation": "分别记录人物姿态、手部占用，以及物体形状、材质等可见属性。", "explanation": "先独立观察，避免把尚未发生的交互误当成既有事实。"}, {"name": "交互分析角色", "flow": "属性、用户动作要求 → 可行交互约束", "operation": "分析人物姿态与物体可供操作的方式，保留指令中明确的动作、左右手及转移要求。", "explanation": "输出的是交互规范，为时间安排提供条件。"}, {"name": "动作规划与穿模检查", "flow": "交互约束 → 经检查的秒级计划", "operation": "规划角色拆分动作时序，检查角色复核接触和穿模问题，并修正计划。", "explanation": "计划是视频生成前的文字条件，不是完整三维仿真结果。"}, {"name": "训练期运动表示对齐", "flow": "动作文本、运动教师特征 → 具有运动知识的视频表示", "explanation": "文本到运动教师提供隐式特征，投影与对齐损失让视频模型吸收相关知识。这里迁移的是表示，不是把教师生成的骨架序列作为推理输入。", "operation": "动作规划角色将交互拆成秒级步骤，穿模检查角色复核并修改不合理接触；用户明确指定的动作和左右手要求保留为规划约束。"}, {"name": "无显式运动条件的生成", "flow": "参考图、文字动作计划 → 人—物交互视频", "explanation": "视频模型把计划落实为连续画面。训练混合真实与合成交互数据；部署时用户仍只需要给图像和文字，避免额外准备逐帧动作条件。", "operation": "训练视频模型时，引入文本到运动教师，通过表示对齐蒸馏隐式运动知识。真实与合成交互数据共同支持训练，推理时使用参考图和文字计划，不要求输入显式骨架序列。"}], "findings": "论文通过跨动作测试和消融，检查多角色推理、穿模检查、运动对齐及混合数据各自的贡献。", "limitations": "语义检查不等于物理仿真；原文不保证严格时间控制，VLM幻觉可导致错误动作时间线，且生成分辨率限制细节。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-06-fig-01.webp", "original_caption": "Figure 1. Following a “thinking-before-generation” schema, the proposed AgentHOI first generates detailed textual motion controls and then generates corresponding HOI videos. The Action 1–Action 5 labels in the teaser are simplified for visualization; the actual motion plan uses second-level temporal intervals.", "placement": "intro", "caption": "示例先列动作阶段，再给出对应交互帧。阶段文字是“先想后生成”的可读中间结果，读者可以先检查动作要求，再看视频是否执行。"}, {"number": 2, "page": 4, "src": "figures/paper-06-fig-02.webp", "original_caption": "Figure 2. The pipeline for the proposed AgentHOI. Our framework consists of two core components: agent-based HOI reasoning and motion-free HOI video generation. The former employs a multi-agent architecture to infer structured and physically plausible HOI action plans from textual and image inputs, while the latter enhances text controllability by aligning video representations with implicit text-to- motion features during training, enabling robust text-driven HOI video generation without explicit motion inputs at inference time.", "placement": "method", "caption": "总图左侧为多角色交互推理，右侧为视频模型与文本到运动教师的训练对齐。需要区分文字计划作为条件，与教师表征作为训练监督这两条连接。"}, {"number": 3, "page": 7, "src": "figures/paper-06-fig-03.webp", "original_caption": "Figure 3. Visualization of real data pipeline and synthetic data pipeline. We build an HOI dataset via a hybrid real–synthetic pipeline. For real data, we develop an automated filtering system that mines high-quality HOI clips from large-scale online videos using multi- stage quality control, video understanding, and object/human decomposition, yielding 71K clips from 10M videos. For synthetic data, we generate diverse HOI samples via reference-based human-object synthesis and image-to-video animation, producing 37K additional clips to improve motion and object diversity.", "placement": "detail", "caption": "真实数据和合成数据采用不同处理流程，再共同服务训练。真实片段提供实际接触与外观，合成流程补充可控交互；这解释了混合数据不是简单增加样本数量。"}, {"number": 7, "page": 10, "src": "figures/paper-06-fig-07.webp", "original_caption": "Figure 7. Ablation on the agent-based HOI reasoning and planning module. More analysis of the optimized prompt is shown in the supplementary material.", "placement": "evidence", "caption": "移除交互推理与规划后的对比用于检查这一部分是否真有作用。关注动作是否完整、手物关系是否合理，而不是只比较某一帧的清晰度。"}], "paper_url": "https://arxiv.org/abs/2607.22241", "code_url": "https://github.com/bone-11/agenthoi"}, {"id": "paper-07", "title": "Beyond the Final Actor: Modeling the Dual Roles of Creator and Editor for Fine-Grained LLM-Generated Text Detection", "chinese_title": "混合写作检测：区分创作者与编辑者", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Z Wang, Y Yang, D Wang, J Cao", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-04-06", "arxiv_id": "2604.04932"}, "motivation": "现实文本常由人和大模型共同完成，例如人写初稿后让模型润色，或模型起草后由人重写。把所有文本只分成人写和机器写，会丢失创作者与编辑者的差别。论文希望区分四种生产过程，从而更细致地识别混合写作。", "context": "四种文本的差异在生产过程：谁先写，谁再改。人改 AI 文本可能保留机器初稿的组织方式，AI 润色人写文本又可能保留人的论证结构。只从最终词汇“像谁”判断，很容易把这些过程混为一谈。", "analysis": "改写会改变词汇和句式，却不一定重建文章的论证顺序与篇章关系。仅依赖表面用词，容易把编辑者误认为唯一作者。因此，方法同时观察局部语言表达和较稳定的修辞组织，寻找不同角色留下的互补信息。", "rationale": "作者以修辞结构理论（RST）作为篇章组织的表示基础：文章被分成基本篇章单元，并按修辞关系构树。方法再以关系特定的图卷积传播信息，区分因果、转折等连接。信息瓶颈投影用于减少表面词汇噪声，帮助关注与创作角色有关的结构差异。", "basis_reference": "§3：逻辑图与修辞引导消息传递", "basis_title": "创作者和编辑者留下的线索不同", "method_title": "用篇章关系组织检测特征", "result_title": "四类写作过程怎样区分", "connection": "解析器先把线性文本变成篇章树，再把内容片段和修辞关系放进图中。节点初始化保留片段含义，关系特定传播保留组织差异，最后分类器才据此区分四类来源。", "architecture": [{"name": "RST 解析", "flow": "文本 → 篇章单元与修辞树", "explanation": "基本篇章单元是小段表达，修辞树表示它们怎样形成因果、转折等组织关系。它提供后续图的节点与连接，保留文本跨句结构。", "operation": "使用修辞结构理论解析器把文本切成基本篇章单元，并建立因果、转折、论证等关系树，将写作组织转换为可以计算的结构。"}, {"name": "逻辑图与瓶颈投影", "flow": "内容单元、关系树 → 紧凑节点表示", "explanation": "图同时保留内容与关系节点；投影降低原始语言特征中的冗余。这样后续网络处理的既有说了什么，也有这些内容如何组织。", "operation": "构建同时包含内容单元节点和修辞关系节点的逻辑图。内容提供具体表达，关系节点汇集所辖片段的信息，再通过紧凑投影减少与作者结构分析无关的词汇噪声。"}, {"name": "修辞关系消息传递", "flow": "逻辑图 → 四种创作／编辑角色预测", "explanation": "不同修辞关系采用对应传播规则，分类与对比目标联合训练。最后输出的是生产过程类别，而不只是当前文字像不像大模型。", "operation": "采用关系特定的图消息传递，区分不同修辞边的作用，并结合分类与对比学习，识别纯人、纯 AI、人改 AI 和 AI 改人四类。"}], "findings": "在 HART 上与 12 种基线比较，并补充同源文本分组划分实验，检查对创作与编辑角色的识别能力。", "limitations": "仅一个适配四分类的基准，其他语言与领域未知；多轮交替编辑未覆盖；预测精度不足以单独作为处罚依据。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-07-fig-01.webp", "original_caption": "Figure 1: Illustration of our research scope. (a) A Creator-Editor framework for categorizing different types of texts in fine-grained LLM-generated text de- tection. (b) Comparison of the existing settings and the complex 4-class setting that we focus on in this paper.", "placement": "intro", "caption": "创作者—编辑者框架把四类文本清楚分开。它改变了检测问题的标签定义：不只看最后一次操作由谁完成，也追踪初稿与编辑的组合。"}, {"number": 2, "page": 3, "src": "figures/paper-07-fig-02.webp", "original_caption": "Figure 2: Distribution of RST relations. (a) Divergence of Creators: Human creators build deeper rhetorical hi- erarchies (e.g., Attribution, Temporal), whereas LLMs produce flatter structures relying on surface-level re- lations (e.g., Elaboration, Cause). (b) LLM-Polished: underlying human architecture persists. (c) Humanized: underlying LLM architecture persists.", "placement": "basis", "caption": "作者比较不同来源文本的 RST 关系分布。图中结构差异为采用篇章关系提供经验支撑；这是一种统计差异，不意味着每篇人写文章都一定更深。"}, {"number": 3, "page": 4, "src": "figures/paper-07-fig-03.webp", "original_caption": "Figure 3: Overall architecture of RACE. Given a text piece, RACE (a) first captures both creator and editor traces through rhetorical structure construction and elementary discourse unit extraction. (b) These dual traces are then transformed into a logic-aware graph, where both linguistic expression and logical organization signals are encoded into node features via descendant span pooling and relation-aware projection. (c) Next, Rhetoric-Guided Message Passing propagates information through relation-specific aggregation with basis decomposition to capture complex rhetorical dependencies. (d) Finally, the global text representation is obtained via root pooling for classification.", "placement": "method", "caption": "RACE 从篇章解析得到内容单元与关系，再构建图表示并做修辞引导传播。图中的内容与逻辑分工说明，方法不只是把一篇文章整体送进分类器。"}], "paper_url": "https://aclanthology.org/2026.acl-long.235/"}, {"id": "paper-08", "title": "Logical Consistency as a Bridge: Improving LLM Hallucination Detection via Label Constraint Modeling between Responses and Self-Judgments", "chinese_title": "LaaB：用逻辑一致性训练幻觉检测器", "year": "2026", "theme": "大模型可信与安全", "authors": "H Mi, Q Sheng, S Wang, B Hu, Y Sun, Z Wang, H Zeng, Y Li, D Wang, ...", "publication": {"venue": "ACL 2026", "date_label": "论文集", "date": "2026-07", "preprint_date": "2026-05-05", "arxiv_id": "2605.03971"}, "motivation": "模型生成一个错误答案后，自检有时能发现问题，有时又会自信地认可原答案。另一方面，隐藏状态和生成概率虽包含不确定性线索，也可能漏掉高置信度幻觉。LaaB 研究如何让内部神经信号与自检判断互相提供训练约束。", "context": "如果模型回答错了，却自检说“正确”，自检文本本身也就说错了。反过来，自检说“错误”时，自检是否正确与原答案是否正确正好相反。论文利用的是这种标签关系，而不是认为模型多问自己一次就更可靠。", "analysis": "自检的 Yes/No 是离散判断，内部特征则是连续表示，直接拼接不容易保证两路含义一致。论文把自检也看作一段可能说错的回答：不仅判断原回答是否正确，也判断这次自检本身是否正确，从而建立可计算的逻辑关系。", "rationale": "论文的核心逻辑规则是：若自检断言“原回答正确”，原回答真实性与自检正确性标签相同；若自检断言“原回答错误”，两者标签相反。由此，自检探针的概率 q 可按 Yes／No 转为 q 或 1−q，与原回答探针对齐，再用稳健损失和置信度权重互学。该规则是训练约束，不代表自检天然可靠。", "basis_reference": "§3：逻辑约束互学习", "basis_title": "自检也可能说错，怎样利用它", "method_title": "两路训练，一路部署", "result_title": "逻辑约束改善了哪些判断", "connection": "训练中有原回答探针和自检正确性探针，两路需要按 Yes／No 关系转成同一问题的概率再互学。推理图可以删掉自检一侧，仅用训练好的原回答探针，因此收益主要通过训练进入模型。", "architecture": [{"name": "原回答探针", "flow": "回答生成中的内部信号 → 原回答真实性概率", "explanation": "探针是利用模型内部特征训练的轻量判别器，不负责重新回答问题。它也是最终部署时保留的分支。", "operation": "从原回答提取隐藏状态、生成概率或注意力等内部特征，训练一个回答真实性探针，输出原回答为真的概率。"}, {"name": "自检正确性探针", "flow": "自检文本及其内部信号 → 自检本身正确的概率", "explanation": "第二路判断的是“自检是否说对”，不等同于把自检的 Yes 当真、No 当假。它的输出需结合自检内容转回对原回答的判断。", "operation": "要求同一模型自检原回答，并从自检生成过程提取特征，训练第二个探针，判断这次自检是否正确，而不是无条件相信它给出的 Yes/No。"}, {"name": "逻辑约束互学", "flow": "两路概率、Yes／No 关系 → 校准后的回答探针", "explanation": "两个预测按原文逻辑对齐后互相约束。训练结束后，自检分支移除，推理不会再运行两路融合或反复自我检查。", "operation": "当自检声称原回答正确时，两路真实性标签应一致；声称错误时，两路标签应相反。训练用逻辑约束、Huber 损失与置信度加权进行互学；部署时只保留原回答探针。"}], "findings": "在四套问答或幻觉数据、四个开源模型上比较八类基线，多数组合得到改善，推理阶段不需要额外生成自检。", "limitations": "必须访问模型内部信息，适合服务提供方；强制二选一自检会引入噪声；两路同时犯错时没有保证能纠正。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-08-fig-01.webp", "original_caption": "Figure 1: Comparison between existing hallucination detection methods (a-b) and our proposed LaaB (c). Unlike methods that rely solely on micro-level intrinsic patterns (a) or macro-level symbolic judgment (b), LaaB bridges these two views by enforcing logical consistency via logic-constraint mutual learning.", "placement": "intro", "caption": "三种路线分别只看内部信号、只看自检文字，以及 LaaB 的结合方式。关键区别是，LaaB 还评估自检本身是否可信。"}, {"number": 2, "page": 3, "src": "figures/paper-08-fig-02.webp", "original_caption": "Figure 2: Overall architecture of LaaB. Given a user query and corresponding response, LaaB first performs (a) Response Hallucination Modeling, extracting intrinsic features from the response generation to capture implicit uncertainty. (b) Self-Judgment Hallucination Modeling introduces a meta-judgment process that analyzes the elicited verbal judgment to mitigate evaluative biases. Finally, (c) Logic-Constrained Mutual Learning bridges these dual views by enforcing logical consistency between response and judgment predictions, utilizing their inherent dependency for robust joint optimization.", "placement": "method", "caption": "原回答与自检分别提取内部特征，再通过逻辑约束互学习。图中标明训练后可移除的自检部分，不能把两路都画成每次推理必需。"}, {"number": 3, "page": 8, "src": "figures/paper-08-fig-03.webp", "original_caption": "Figure 3: Prediction correctness transitions before and after applying LaaB.", "placement": "evidence", "caption": "图统计应用 LaaB 前后预测正确性的变化，帮助观察哪些原先错误的判断被纠正，以及是否出现新的错误；比只看一个总分更能说明互学的影响。"}], "paper_url": "https://aclanthology.org/2026.acl-long.286/", "code_url": "https://github.com/ICTMCG/LaaB"}, {"id": "paper-09", "title": "Fleet: Few Shots Lead Effective AI-generated Image Detection", "chinese_title": "Fleet：持续少样本适应的生成图像检测", "year": "2026", "theme": "视觉取证与内容保护", "authors": "J Wang, S Liu, Y Li, K Yang, J Cao, S Tang", "publication": {"venue": "ICML 2026 · PMLR 306", "date_label": "会议", "date": "2026-07-06—11", "preprint_date": "2026-06-30", "arxiv_id": "2606.31082"}, "motivation": "图像检测器在旧数据上表现很好，也可能在新生成器上线后迅速失效。Fleet 将重点放在持续少样本适应：获得少量新模型生成图后，尽快修正检测器，同时保留对旧模型的识别能力。", "context": "Fleet 不把新模型带来的失败都归结为检测器完全没有相关知识。它关注另一种情况：模型已有不同子空间，但新生成图被送到了更偏真实图的路径。因此，少量标注样本首先用于修正路由。", "analysis": "新生成图可能被错误送进表示“真实图”的特征路径。若直接用几张新样本更新整个表示空间，容易过拟合甚至破坏旧边界。论文把适应目标缩小到特征路由的纠正，而不是要求少量样本重新学出完整分类空间。", "rationale": "§4.2 用 AI／非 AI 平均路由权重的内积作为正交约束，并用覆盖约束抑制路由塌缩；§4.3 的 avoidance routing 则阻止新生成图继续流入非 AI 主导子空间。作者据此将少样本适应表述为受约束的路由纠正，区别于自由更新全部特征。", "basis_reference": "§4.1—4.3：子空间路由", "basis_title": "新生成器出现后，旧边界为什么失灵", "method_title": "把少样本更新变成路由纠正", "result_title": "少量新样本改变了什么", "connection": "预训练先形成 AI 与非 AI 的路径分工；适应阶段再利用少量新 AI 样本调整这些路径。高频分支产生路由线索，视觉基座提取较丰富的表示，旧样本回放与蒸馏则限制更新伤害已有能力。", "architecture": [{"name": "视觉特征与频率路由", "flow": "图像 → 视觉表示与高频路由权重", "explanation": "DINOv3 提取视觉表示，LoRA 用少量可学习参数适配检测。高频分支过滤低频后提取痕迹信号，用它决定多个子空间的激活权重。", "operation": "以 DINOv3 加 LoRA 提取视觉特征，同时由高频分支提供低层痕迹信号。多个可学习子空间各自提供地址与特征，高频信号决定输入应主要激活哪些子空间。"}, {"name": "互斥子空间预训练", "flow": "已有真假样本 → 分工后的 AI／非 AI 路径", "explanation": "路由正交约束减少两类样本使用同一路径；覆盖约束防止只用少数子空间。输出特征由各子空间按权重组合后完成真假判别。", "operation": "预训练通过分类、路由正交和覆盖约束，让 AI 与非 AI 样本倾向不同路径，并防止所有样本塌缩到少数路径。"}, {"name": "少样本避让路由", "flow": "新生成器少量样本 → 修正的特征流向", "operation": "降低新 AI 图进入非 AI 主导子空间的权重，引导其使用相关 AI 路径。", "explanation": "适应目标被限制为路由纠正，避免几张样本自由改变全部特征。"}, {"name": "旧知识保持", "flow": "旧样本与旧模型知识 → 对适应更新的约束", "operation": "通过样本回放和蒸馏限制新适应破坏既有检测能力。", "explanation": "它与新样本适应共同训练，不是最终预测后的另一道分类。"}], "findings": "在 Treasure 的 64 种生成模型上测试。豆包 Seedream 4.0 的 AI 图检测准确率从 20.4% 提高到 10-shot 适应后的 73.1%。", "limitations": "研究整图生成，局部编辑与换脸仍需验证；依赖带标签新样本和回放。已有20阶段连续适配实验，但真实开放环境的长期表现仍需验证。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-09-fig-01.webp", "original_caption": "Figure 1. Analysis of Benchmarks. (a) Performance of SOTA methods on common datasets. (AIGIBench-13 refers to AI- GIBench’s subset of 13 full-graph generation models.) (b) De- tection accuracy of SOTA methods on generated images across different release years. The models in the image (from left to right) are: SDv2.1, Midjourney v6, Playground v2.5, SD3, Midjourney v7, Doubao Seedream 3.0, Imagen 4, Nano Banana Pro.", "placement": "intro", "caption": "基准分析显示，旧测试集表现高不代表面对新生成器仍然可靠。这张图解释了作者为何从静态泛化转向持续适应。"}, {"number": 2, "page": 4, "src": "figures/paper-09-fig-02.webp", "original_caption": "Figure 2. Overview of Treasure Dataset. (a) We have meticulously collected a large number of images generated by current mainstream generative models, assigning authenticity labels and artistic style tags to each image. (b, c) Illustration of image and prompt source distribution. Our dataset maintains excellent diversity in data sources to ensure its ability to simulate real-world inputs. (d, e, f) Comparison with other benchmarks. Our dataset possesses significant advantages in both scale and novelty.", "placement": "basis", "caption": "Treasure 展示所覆盖生成模型和数据构成。其作用是让评估包含较新、不同架构及闭源引擎，而非只在少数早期生成器上验证。"}, {"number": 3, "page": 5, "src": "figures/paper-09-fig-03.webp", "original_caption": "Figure 3. Overview of Fleet.The model employs a dual-branch architecture, utilizing the high-frequency signal rfreq to generate subspace routing weights. During pre-training, Lorth and Lcov decouple high-dimensional features into mutually exclusive AI (Red) and Non-AI (Green) subspaces. In the few-shot adaptation phase, Lavoid forces the redirection of feature flows from novel generated images toward the most relevant AI subspaces while suppressing their activation in Non-AI subspaces.", "placement": "method", "caption": "上方两分支分别处理视觉特征与频率路由，下面区分预训练和少样本适应。避让机制改变新图像流向，不是简单把“新模型”作为一个额外类别。"}, {"number": 6, "page": 8, "src": "figures/paper-09-fig-06.webp", "original_caption": "Figure 6. Visualization of Subspace Routing Weights Before and After Few-shot Training. (a) Query set mean routing weights before and after few-shot training. (b) Mean routing weights on AI classes in the AIGIBench validation set. (c) Mean routing weights on Non-AI classes in the AIGIBench validation set.", "placement": "evidence", "caption": "路由权重可视化比较适应前后特征流向。它检查的正是论文机制：新生成图是否减少走入非 AI 路径，而不仅是分类得分发生变化。"}], "paper_url": "https://proceedings.mlr.press/v306/wang26eo.html", "code_url": "https://github.com/ICTMCG/Fleet"}, {"id": "paper-10", "title": "ComMark: Covert and Robust Black-Box Model Watermarking with Compressed Samples", "chinese_title": "ComMark：基于压缩样本的黑盒模型水印", "year": "2026", "theme": "视觉取证与内容保护", "authors": "Y Yang, X Chen, Z Zhao, Y Zhou, X Gu, J Cao", "publication": {"venue": "ICMR 2026", "date_label": "在线发表", "date": "2026-06-15", "preprint_date": "2025-12-16", "arxiv_id": "2512.15641"}, "motivation": "模型通过接口被复制或提取后，拥有者未必能检查可疑模型的参数。黑盒水印希望只靠查询输入与输出证明模型来源，但明显的贴片触发器容易被发现，也容易被裁剪或压缩破坏。ComMark 尝试把触发模式藏进较自然的压缩过程。", "context": "水印不一定是照片角落的可见标志。本文将特殊压缩后的图像与指定类别绑定，拥有者保留这些查询样本。之后即使只拿到可疑模型的 API，也能检查它是否仍保留这种约定反应。", "analysis": "水印需要同时满足两点：正常用户看图时不容易察觉异常，模型在样本经过常见预处理后仍能给出约定输出。只优化触发成功率，可能得到显眼而脆弱的模式；只追求不可见，也可能让触发信号不够稳定。", "rationale": "论文借鉴 JPEG 的分块离散余弦变换与量化：主要保留承载视觉内容的低频，压缩不易察觉的高频成分，以压缩行为构造触发模式。随后用预处理增强和相似性约束训练稳定关联。作者给出的是频域构造与实验鲁棒性依据，不是对任意攻击的不可移除证明。", "basis_reference": "§3.3—3.5：频域压缩与水印训练", "basis_title": "压缩怎样成为不显眼的水印", "method_title": "构造、训练与黑盒验证", "result_title": "保护效果与视觉观感", "connection": "构造样本决定触发模式，联合训练把模式写进模型，核验阶段只测命中率。正常分类能力和水印响应是同一模型学习的两项任务；输入预处理增强则用于让响应不被常见变换轻易抹掉。", "architecture": [{"name": "频域水印构造", "flow": "正常图片 → 带目标标签的压缩水印图", "explanation": "图像先做分块频率变换与量化，触发模式来自压缩行为。目标标签由拥有者预先指定，用于之后检查模型是否保留约定反应。", "operation": "从正常图像构造水印样本：转入亮度与色度空间，分块做离散余弦变换，再以量化压缩改变频率成分，为处理后的样本分配预设目标标签。"}, {"name": "鲁棒联合训练", "flow": "正常样本、水印及变换样本 → 带水印模型", "explanation": "模型同时学习正常任务与水印任务，预处理增强覆盖常见变换。相似性损失补充目标类别关联，并不是在模型输出中显示一段可见标记。", "operation": "联合训练正常分类与水印识别，并在训练中加入多种预处理后的水印样本，使触发器适应裁剪、缩放、旋转和 JPEG 等变化。"}, {"name": "黑盒所有权核验", "flow": "可疑模型 API、水印测试图 → 命中率与核验结论", "explanation": "核验只读取预测标签，不读取权重。用多张样本的目标类命中比例与阈值比较，比单张触发更能检验水印关联是否存在。", "operation": "引入相似性约束巩固水印与目标类之间的关联。核验时将保留的水印样本提交给可疑模型，以目标标签命中比例是否超过阈值判断水印是否存在。"}], "findings": "四个视觉数据集上原模型水印成功率约 99.7%—100%；论文进一步检验微调、剪枝与输入预处理后的保留情况。", "limitations": "需在原模型训练时植入；较高命中率是实验条件下证据，不能自动代表法律确权或抵抗任意攻击。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-10-fig-01.webp", "original_caption": "Figure 1: Examples of watermark samples from existing black-box methods including Abstract [1], Content [79], EWE [27], MEAD [41] and BlindMark [34].", "placement": "intro", "caption": "不同黑盒水印样本并排展示，用来理解“隐蔽性”具体指什么：触发图能否仍像普通照片，而不是出现容易识别的异常图案。"}, {"number": 2, "page": 2, "src": "figures/paper-10-fig-02.webp", "original_caption": "Figure 2: The effect of visual differences in the spatial domain resulting from different components being discarded in the frequency domain. The DCT and IDCT are the discrete cosine transform and its inverse transform, respectively.", "placement": "basis", "caption": "频域不同成分的取舍会产生不同视觉变化。DCT／IDCT 在图中连接空间图像与频率表示，为压缩触发器的构造提供直观说明。"}, {"number": 3, "page": 3, "src": "figures/paper-10-fig-03.webp", "original_caption": "Figure 3: An overview of our ComMark method.", "placement": "method", "caption": "从正常图片得到压缩水印，再联合训练，最后查询可疑模型。三段流程中，只有最后一段属于所有权核验，不需要再次训练目标。"}, {"number": 6, "page": 7, "src": "figures/paper-10-fig-06.webp", "original_caption": "Figure 6: Visual comparison of covertness of different watermarking methods. (On CIFAR10)", "placement": "evidence", "caption": "视觉比较用于查看保护样本的外观变化。它补充水印命中率，因为高命中但明显损伤图像，并不能满足本文追求的隐蔽性。"}], "paper_url": "https://doi.org/10.1145/3805622.3810742"}, {"id": "paper-13", "title": "Headrouter: A training-free image editing framework for mm-dits by adaptively routing attention heads", "chinese_title": "HeadRouter：按注意力头语义进行图像编辑", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Fan Tang, Juan Cao, Yuxin Zhang, Xiaoyu Kong, Jintao Li, Oliver Deussen, Tong-Yee Lee（所读原文顺序）", "publication": {"venue": "ACM Transactions on Graphics 45(3)", "date_label": "在线发表", "date": "2026-04-24", "preprint_date": "2024-11-22", "arxiv_id": "2411.15034"}, "motivation": "修改图像中的材质、颜色或主体时，用户希望目标属性改变，其他内容尽量稳定。MM-DiT 的不同注意力头可能对不同编辑语义有不同敏感性，平均使用所有头会削弱这种分工。HeadRouter 尝试利用现成模型内部结构，提高无需训练的编辑控制。", "context": "把一只普通鹦鹉改成钩织材质，既要让材质真正变化，也要保留主体和构图。统一加强文本可能导致其他部分一起改变。论文希望找到这次材质修改更相关的注意力头，集中调整它们的贡献。", "analysis": "同一句修改指令对不同图像的作用位置不同，固定指定一组注意力头缺少适应性；仅增强文本也可能改变过多画面。方法需要根据当前实例识别有效的头，并协调文字与图像 token 的更新。", "rationale": "作者先分析不同注意力头对编辑语义的敏感性，再在方法中比较重建与编辑分支的头输出相似度，动态调整贡献。双 token 细化分别作用于文字指导和图像区域表达。设计依据来自头部响应分析及删除、替换实验，而非预设每个头都有固定语义名称。", "basis_reference": "§3：注意力头分析；§4.1—4.2：路由与细化", "basis_title": "注意力头为什么值得分别控制", "method_title": "编辑目标怎样找到相关计算路径", "result_title": "语义修改与原图保留", "connection": "先用原图重建与目标编辑比较头部响应，再按实例分配权重。双 token 细化随后分别照顾文字指导和图像区域，使“选对计算路径”与“把修改落到正确位置”连起来。", "architecture": [{"name": "IARouter：实例自适应路由", "flow": "重建／编辑分支头输出 → 调整后的头贡献", "explanation": "依据当前图像和修改目标比较响应差异，再改变各头权重。路由随实例变化，相关路径被强调，其他路径尽量维持已有图像信息。", "operation": "推理中比较重建与编辑分支对应头的输出差异，根据本次编辑目标动态调整各头贡献，强调相关变化，同时保留不相关头原有信息。"}, {"name": "DTR：双 token 细化", "flow": "文本与视觉 token → 更准确的编辑结果", "explanation": "token 是模型处理的特征单元。文字侧维持目标语义，图像侧细化对应区域，随后交回原扩散模型生成，不需另训练编辑模型。", "operation": "双 token 细化一方面增强编辑文本的表达，另一方面借助文本到图像的联系调整相关视觉 token，在无需额外训练的流程中改善目标语义落地。"}], "findings": "论文在多种编辑基准上比较质量与指令对齐，并用注意力头删除、替换实验检验头部选择的作用。", "limitations": "“语义专长”是经验敏感性，不能视为完全独立的开关；超出基础生成模型能力的编辑仍难。", "figures": [{"number": 2, "page": 3, "src": "figures/paper-13-fig-02.webp", "original_caption": "Figure 2. Analysis of multi-head attention in MM-DiTs. We illustrate the distribution of distinct semantics across attention heads. Dropping the most influential head leads to significant shifts in associated semantics while swapping the output features of this head enables targeted semantic injection to a certain degree.", "placement": "basis", "caption": "删除或交换重要注意力头，会改变相关语义，图中以实际生成结果说明不同头并非完全可互换。这是选择性路由的依据。"}, {"number": 3, "page": 4, "src": "figures/paper-13-fig-03.webp", "original_caption": "Figure 3. Analysis of text guidance on image tokens. Key image regions influenced by text guidance are identified within the joint self-attention map and visualized. Additionally, we observe that text guidance influence diminishes as attention blocks progress in the denoising steps, leading to weakened semantic representation from text-guided editing.", "placement": "basis", "caption": "文字指导对图像 token 的影响既有空间分布，也会在模型中衰减。该分析说明，仅选择注意力头还不够，需要维护文字指导和相关视觉区域。"}, {"number": 4, "page": 5, "src": "figures/paper-13-fig-04.webp", "original_caption": "Figure 4. Pipeline of our method. We mainly introduce instance-adaptive attention head router (IARouter) to adaptively activate attention heads based on their semantic sensitivity, enabling a more accurate representation of the edited specific images.", "placement": "method", "caption": "重建分支提供原图参照，编辑分支响应目标文字；IARouter 调整头贡献，DTR 进一步细化文字与图像 token，两者接入同一无需训练的编辑过程。"}, {"number": 6, "page": 7, "src": "figures/paper-13-fig-06.webp", "original_caption": "Figure 6. Qualitative comparison with baseline methods on various editing tasks. Our results demonstrate high alignment with the text guidance while keeping consistency with the reference image.", "placement": "evidence", "caption": "不同编辑任务的并排结果同时检查两点：目标语义有没有改出来，不需要改的原图内容是否还在。单看画面漂亮无法回答后一问题。"}], "paper_url": "https://doi.org/10.1145/3797956", "code_url": "https://github.com/ICTMCG/HeadRouter"}, {"id": "paper-14", "title": "From judgment to interference: Early stopping llm harmful outputs via streaming content monitoring", "chinese_title": "SCM：在生成过程中检测并截停有害回答", "year": "2026", "theme": "大模型可信与安全", "authors": "Y Li, Q Sheng, Y Yang, X Zhang, J Cao", "publication": {"venue": "NeurIPS 2025", "date_label": "arXiv 首发", "date": "2025-06-11", "preprint_date": "2025-06-11", "arxiv_id": "2506.09996"}, "motivation": "聊天服务往往边生成边把文字发送给用户。如果等完整回答结束再检测，有害内容已经暴露；把完整文本检测器直接用于短前缀，又可能误判“先拒绝、后转折”或尚未完成的句子。SCM 将检测目标改为生成过程中的及时截停。", "context": "在线生成只允许看见已经输出的文字，不能使用未来词元。如果检测器训练时总能看到全文，部署时突然只读一小段，判断依据就变了。SCM 将这个差异作为任务本身处理，而非把短前缀勉强塞给全文分类器。", "analysis": "模型必须从不完整内容判断风险，还要尽量区分只是讨论危险主题与正在提供有害帮助。词元级信号有利于快速反应，整篇判断有利于理解语境，但部署时反复运行整篇检测会增加等待和计算。", "rationale": "论文用句子／词元级监督构建流式检测，并在训练中加入整篇评分器和层级逻辑一致性约束，协调局部风险与全文判断。Delay-k 要求累计一定数量的危险词元再截停，论文通过该参数实验分析及时性与误报之间的取舍。", "basis_reference": "方法部分：层级检测与 Delay-k", "basis_title": "完整回答检测为什么来不及", "method_title": "训练看全文，推理看当前前缀", "result_title": "截停速度与误报的取舍", "connection": "细粒度标注先提供危险内容的位置；训练时整篇分支帮助局部分支理解语境；部署移除整篇分支后，局部评分随词元更新。Delay-k 决定积累多少危险证据才停止，不同于见到一个敏感主题词就拒绝。", "architecture": [{"name": "FineHarm：细粒度监督", "flow": "回答文本 → 有害句与危险词元标签", "explanation": "标注流程先识别有害句，再用词性规则寻找实义词，形成可供局部评分学习的位置监督，避免只有整篇一个真假标签。", "operation": "构建 FineHarm，先识别有害句子，再用词性规则定位实义词，形成细粒度监督，使检测器学习危险内容从哪里开始出现。"}, {"name": "层级联合训练", "flow": "词元特征、全文特征 → 协调的风险评分器", "explanation": "局部分支学习及时识别，整篇分支提供完整语境，逻辑一致性约束协调两者。整篇分支在训练后可以移除。", "operation": "训练时联合词元评分器与可拆卸的整篇评分器，并使用层级逻辑一致性约束，使局部风险与整体判断互相协调。"}, {"name": "Delay-k：流式截停", "flow": "逐步到达的输出 → 继续生成或停止", "explanation": "推理只运行词元分支，累计危险信号达到阈值后截停。阈值改变需要等待多少风险证据，因此影响反应速度与误报。", "operation": "部署只保留流式词元分支。随着输出到达持续评分，危险词元累积达到设定数量后停止生成；调整延迟阈值，在更快响应与减少误报之间取舍。"}], "findings": "实验平均读取约 18% 的回答词元即可完成检测，宏 F1 超过 0.95；超过 80% 的有害回答在前 30% 词元内被识别。", "limitations": "细粒度标签含自动规则噪声；指标不意味着所有内容均能在有害信息出现前阻止；实际延迟还取决于审核器与主模型部署。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-14-fig-01.webp", "original_caption": "Figure 1: Paradigm differences between the existing harmful content detectors and our proposed Streaming Content Monitor (SCM). (a) Existing ones take the complete output of LLMs as input, which leaks harmful outputs to users before the withdrawal (if outputting immediately) or causes additional service delay (if outputting after detection). (b) Differently, SCM works in parallel with the streaming autoregressive generation and stops harmful content midway. Output tokens are in blue shaded boxes. Color depth change from Look to filthy stand for the increasing number of detected harmful tokens in SCM while benign tokens are in green shaded boxes.", "placement": "intro", "caption": "完整输出检测和流式检测在时间上不同。前者等内容生成完再判断，后者在用户接触完整风险内容之前就尝试干预。"}, {"number": 2, "page": 5, "src": "figures/paper-14-fig-02.webp", "original_caption": "Figure 2: Position distribution of the harmful words in responses.", "placement": "basis", "caption": "危险词在回答中的位置分布说明，风险并不总从第一词开始，也不能由全文一个标签指出。它支持细粒度位置监督的必要性。"}, {"number": 3, "page": 6, "src": "figures/paper-14-fig-03.webp", "original_caption": "Figure 3: Overview of the modules. During the training phase, holistic scorer is a detachable module that helps to build a comprehensive sight of the whole response and a rough perception of the possible future tokens. During the inference phase, we only use the well-trained feature extractor and token scorer to follow LLMs’ output streaming to perform timely judgment with acceptable latency, and a hyperparameter k is used to determine the minimum number of detected harmful tokens that terminates generation.", "placement": "method", "caption": "训练图包含词元评分与可拆卸全文评分，推理图只保留局部流式路径。读图时最重要的是分清哪些组件训练后被移除。"}], "paper_url": "https://proceedings.neurips.cc/paper_files/paper/2025/hash/4e3157021c5f833bb2204081f1dda573-Abstract-Conference.html"}, {"id": "paper-15", "title": "Reasoning about the unsaid: Misinformation detection with omission-aware graph inference", "chinese_title": "OmiGraph：通过跨报道遗漏信息检测误导新闻", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "Z Wang, D Wang, Q Sheng, J Wu, J Cao", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-01", "preprint_date": "2025-12-01", "arxiv_id": "2512.01728"}, "motivation": "误导性新闻不一定包含明显假句子，也可能只挑一部分事实，让读者形成错误印象。只读目标文章，很难知道哪些关键内容被省略。OmiGraph 引入同一时期的相关报道，研究通过跨来源比较识别“没有说出的信息”。", "context": "文章说出的每句话都可能是真的，但如果省略关键条件，读者仍会形成偏差。论文不要求模型凭空猜“作者没说什么”，而是检索当时已经存在的相关报道，明确以哪个背景为参照。", "analysis": "相关报道之间既有正常选题差异，也可能存在有意遗漏。把所有背景报道拼在一起，会引入大量无关内容，并掩盖具体哪句话与哪段背景存在关系。需要细化比较单位，同时保留报道内部语境。", "rationale": "作者以同一时期相关报道可互相提供背景为出发点。§3.1 只从目标新闻发布前的时间窗口检索，并定义句子级节点及报道内／跨来源边；后续将 LLM 生成的遗漏意图编码为边属性。这里的遗漏是相对背景信息的建模关系，并非“没有提及即为虚假”的逻辑规则。", "basis_reference": "§3.1—3.3：遗漏感知图推理", "basis_title": "只说真话，也可能产生误导", "method_title": "把跨报道的缺失内容变成图关系", "result_title": "遗漏线索能补充什么", "connection": "检索提供背景，句子图确定比较单位，意图关系描述差异含义，消息聚合再把遗漏线索送回检测器。这样能区分原新闻表达的内容与背景提供的补充，而不是把所有报道当成一段无来源区分的大文本。", "architecture": [{"name": "时间受限背景检索", "flow": "目标新闻、此前新闻池 → 相关背景报道", "explanation": "背景只来自目标发布前的时间窗口；语义相似度筛选相关主题。时间限制对应发布时检测，不让未来核查结果提前进入输入。", "operation": "从目标新闻发布之前的近期新闻池检索语义相关报道，构建可用背景，避免使用事件之后才出现的信息作为当时判断的依据。"}, {"name": "遗漏感知图", "flow": "目标与背景句子 → 带上下文及遗漏边的图", "explanation": "节点是句子级片段，不是另加实体节点。同报道内部边保留语境，跨来源边连接目标与背景之间的比较关系。", "operation": "将目标与背景报道拆成句子级原子片段作为节点，同一报道内连接上下文边，目标与背景片段之间建立跨来源的遗漏关系边。"}, {"name": "遗漏意图关系", "flow": "跨来源片段 → 带语义的遗漏边", "operation": "LLM 描述目标与背景片段之间的遗漏意图，再编码为关系属性。", "explanation": "边属性说明比较关系，不把整篇背景直接当成目标新闻事实。"}, {"name": "消息传播与分类", "flow": "句子图及边属性 → 增强真假判断", "operation": "通过局部注意力与全局聚合读取遗漏线索，交给原检测器。", "explanation": "传播决定哪些跨来源证据有用，输出仍是新闻检测结果。"}], "findings": "在中英文数据上，论文报告平均 F1 提高 5.4 个百分点、准确率提高 5.3 个百分点，并分析不同遗漏类型。", "limitations": "依赖外部新闻覆盖与检索质量；相关报道不天然等于完整事实；用 LLM 模拟背景可能引入生成偏差。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-15-fig-01.webp", "original_caption": "Figure 1: Concept comparison between existing methods and our OmiGraph. In contrast to solely focusing on the presented information, OmiGraph extracts more complete deception features via omission-aware modeling, capturing omitted key information such as the background and causal relation, and thus enhancing the existing detectors.", "placement": "intro", "caption": "概念图对照只看已呈现信息与结合遗漏内容的判断。新增线索来自相关背景，而非把“文本没提到”直接判为假。"}, {"number": 2, "page": 4, "src": "figures/paper-15-fig-02.webp", "original_caption": "Figure 2: Overview of OmiGraph. Given a news piece, OmiGraph constructs an omission-aware graph based on the contextual environment (a). Then, omission-oriented relation modeling reasons over the graph nodes, identifying intra-source contextual dependencies and inter-source omission intents (b). Finally, an omission-guided message passing mechanism extracts omission-oriented deception features (c) to enhance conventional misinformation detectors.", "placement": "method", "caption": "先建立背景环境，再做句子级图和遗漏关系建模，最后聚合。图里的节点是内容片段，边负责保留同来源语境与跨来源比较。"}, {"number": 4, "page": 11, "src": "figures/paper-15-fig-04.webp", "original_caption": "Figure 4: Omission type distribution standardized using Z-scores in English (left) and Chinese (right) dataset.", "placement": "evidence", "caption": "遗漏类型分布在中英文数据上并不完全相同。这提示读者，遗漏不是单一固定模式，模型需要面对不同表达和报道习惯。"}], "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/37097", "code_url": "https://github.com/ICTMCG/OmiGraph"}, {"id": "paper-16", "title": "Beyond Semantic Features: Pixel-level Mapping for Generalized AI-Generated Image Detection", "chinese_title": "像素级映射：减少生成图像检测中的语义偏差", "year": "2026", "theme": "视觉取证与内容保护", "authors": "C Zhou, J Wang, Y Li, L Li, J Cao, S Tang", "publication": {"venue": "AAAI 2026", "date_label": "arXiv 首发", "date": "2025-12-19", "preprint_date": "2025-12-19", "arxiv_id": "2512.17350"}, "motivation": "检测器可能记住训练集中“哪些东西经常出现在假图里”，而不是学到生成过程的痕迹。换一种生成模型或图像主题后，这类语义捷径就会失效。论文用简单的输入变换，迫使分类器减少对可辨认内容的依赖。", "context": "这里不是把图像变得越难看越好。作者要削弱可辨认主体等语义捷径，同时保留与生成处理有关的局部关系。如果直接打乱位置，可能在破坏语义时也毁掉需要检测的统计线索。", "analysis": "高通滤波和打乱图块未必足以消除语义，而且可能损失取证所需的局部关系。问题不是把图像任意破坏，而是在削弱可见语义的同时，尽量保留能够区分生成机制的像素统计。", "rationale": "作者先通过实验说明，高通滤波和图块打乱仍可能保留语义信息，再提出改变像素值映射而保留局部空间关系。其解释是削弱低频语义捷径、突出生成相关高频痕迹；随机映射与语义分类对照用于检验这一解释。", "basis_reference": "引言与方法：语义偏差分析、像素映射", "basis_title": "怎样阻止检测器记住图像主题", "method_title": "保留位置，改变像素值的呈现", "result_title": "映射后还能看到什么痕迹", "connection": "映射表先改变每个通道数值怎样呈现，像素仍留在原来的位置；分类器再从新图中学习真假。固定与随机映射是用于分析这种处理为何有效的不同设定，不意味着每次预测都要人为选择一张新表。", "architecture": [{"name": "像素值重映射", "flow": "原图 → 语义被削弱的输入", "explanation": "改变的是像素数值映射，不是像素所在位置。固定映射和随机映射实验帮助分析效果来自何种变化。", "operation": "在真假分类器之前加入逐像素数值重映射，打破像素亮度原有的单调次序，改变人眼和语义模型熟悉的外观。"}, {"name": "真假分类", "flow": "保留局部结构的变换图 → 真假概率", "explanation": "处理后的图仍保留局部对应关系，分类器从中学习生成相关统计。推理需要执行同类输入处理，再调用训练好的检测器。", "operation": "保持像素空间位置及局部对应关系，再用变换后的图像训练真假分类器，使学习重点更多转向生成相关的局部痕迹。"}], "findings": "在 GAN 与扩散生成器之间的跨模型测试中获得改善；语义分类和映射对照实验支持其减少语义偏差的解释。", "limitations": "收益是所测跨模型性能，不能推出对所有未来生成器通用；压缩可能削弱高频线索。", "figures": [{"number": 2, "page": 2, "src": "figures/paper-16-fig-02.webp", "original_caption": "Figure 2: Visualization results of various semantic-reduction methods.", "placement": "intro", "caption": "不同语义削弱方法的可视化让“削弱”具体可见：关注主体是否仍容易识别，以及局部结构是否被完整打乱。"}, {"number": 3, "page": 4, "src": "figures/paper-16-fig-03.webp", "original_caption": "Figure 3: (a) The framework pipeline of the proposed method. The input image first passes through the pixel-level mapping module before being sent into the classification head. (b) The fixed pixel-level mapping module applies the same fixed mapping to all three channels of images. (c) The random pixel-level mapping module applies a different random mapping to the three channels of each image.", "placement": "method", "caption": "主流程先经过像素级映射，再进入分类器。方法改变输入表示，而不是在输出分数之后增加一个判决规则。"}, {"number": 4, "page": 4, "src": "figures/paper-16-fig-04.webp", "original_caption": "Figure 4: (a) Fixed pixel-level mapping table, which remains the same for each channel of each sample. (b) Four examples of random pixel-level mapping tables, which maintain ran- domness for each channel of each sample.", "placement": "module-1", "caption": "固定映射与随机映射表说明，亮度值不再按原有顺序呈现。横纵轴描述数值对应关系，像素的空间坐标并未因此重排。"}, {"number": 6, "page": 7, "src": "figures/paper-16-fig-06.webp", "original_caption": "Figure 6: Visualization results of anomalies in mapped im- ages.", "placement": "evidence", "caption": "映射后异常的可视化用于检查哪些局部痕迹仍可被暴露。它与跨生成器实验共同支持作者的取证解释。"}], "paper_url": "https://arxiv.org/abs/2512.17350"}, {"id": "paper-17", "title": "Visual-friendly concept protection via selective adversarial perturbations", "chinese_title": "VCPro：兼顾视觉质量的选择性概念保护", "year": "2026", "theme": "视觉取证与内容保护", "authors": "X Mi, F Tang, Y Wu, J Cao, P Li, Y Liu", "publication": {"venue": "AAAI 2026", "date_label": "正式发表", "date": "2026-03-14", "preprint_date": "2024-08-16", "arxiv_id": "2408.08518"}, "motivation": "发布照片的人可能希望别人正常观看，却不希望照片被用于未经许可的个性化生成。对整张图施加强扰动容易损伤观感，弱扰动又可能挡不住概念学习。VCPro 研究如何把保护重点放到真正需要保护的概念与区域。", "context": "保护对象可能只是人物身份或某个特定概念，背景并非同等重要。用户掩码把这个需求具体化，使优化知道有限扰动应优先放在哪里；没有掩码时，“重要区域”的含义并不自动明确。", "analysis": "生成模型学习的概念未必对应普通分类器最关注的区域。若把有限扰动平均分布到背景、衣物和脸部，会浪费保护预算，也增加可见噪声。因此，保护目标与空间范围需要由拥有者明确指定。", "rationale": "论文将保护目标与最低可见扰动组织为约束优化，并用拉格朗日乘子求解放松问题。用户掩码指定应保护的概念区域，选择性扰动用于避免把预算无差别分配到整张图。这是原文优化问题的设计依据，不是对所有个性化训练过程的保护保证。", "basis_reference": "方法部分：选择性扰动与拉格朗日优化", "basis_title": "保护概念不等于破坏整张照片", "method_title": "从用户掩码到保护图片", "result_title": "同时看保护效果和图像变化", "connection": "掩码决定优化重点，生成模型的概念学习目标提供对抗信号，视觉约束限制可见变化。最终发布的是处理后的图片，后续个性化训练则用于检验这张图是否更难被未经授权地学习。", "architecture": [{"name": "概念与掩码选择", "flow": "用户保护目标 → 重点区域", "explanation": "掩码明确哪些像素属于要保护的概念。它是扰动分配依据，不能由普通分类器最关注的位置自动等同推出。", "operation": "由用户提供希望保护的概念和区域掩码，将隐私或身份相关部分标记为重点；掩码也可结合其他检测工具得到。"}, {"name": "选择性对抗扰动", "flow": "目标区域、概念学习目标 → 扰动图", "explanation": "优化优先干扰目标概念学习，减少对不需要保护区域的无差别修改。输出是仍可被人观看的保护图片。", "operation": "在概念学习过程上构造选择性对抗扰动，优先干扰生成模型对目标概念的吸收，而不是无差别破坏整幅图像。"}, {"name": "视觉与保护约束协调", "flow": "保护损失、扰动约束 → 最终发布图片", "explanation": "拉格朗日形式协调两项目标，决定为保护效果付出多少可见变化。保护检验通过后续个性化生成实验完成。", "operation": "把保护有效性与可见扰动之间的权衡写成放松优化问题，利用拉格朗日乘子协调约束，在满足保护需求时尽量减少额外视觉变化。"}], "findings": "在人脸个性化生成实验中，相较全图扰动方法，展示了更好的保护效果与视觉质量折中。", "limitations": "主要验证 DreamBooth / Textual Inversion 与特定扩散模型；不能理解成对任意新模型或去噪处理的绝对保护。", "figures": [{"number": 1, "page": 2, "src": "figures/paper-17-fig-01.webp", "original_caption": "Figure 1: The first row shows protected images from Anti-DreamBooth (Le et al. 2023), Mist (Zhang et al. 2022), Meta- Cloak (Liu et al. 2024), SDS(-) (Xue et al. 2024), PhotoGuard (Salman et al. 2023), and our VCPro. Second and third rows show magnified regions and Textual Inversion results. At ϵ=8/255, our method better balances protection effectiveness and visual quality (higher PSNR/SSIM).", "placement": "intro", "caption": "上排显示保护后的原图，下面显示利用这些图进行个性化生成的效果。两组一起看，才能同时判断观感和保护是否兼顾。"}, {"number": 2, "page": 4, "src": "figures/paper-17-fig-02.webp", "original_caption": "Figure 2: VCPro pipeline. Users create protective masks via SAM or other tools. The masks and images are fed into our protec- tion module (Eq. 8), which uses regional adversarial learning to minimize perturbation visibility while maintaining protection.", "placement": "method", "caption": "用户先生成概念掩码，再进入区域对抗优化。图中保护模块连接掩码和原图，强调保护强度有空间选择，而不是整图平均加噪。"}, {"number": 3, "page": 5, "src": "figures/paper-17-fig-03.webp", "original_caption": "Figure 3: Qualitative comparison (ϵ = 8/255, SD v1-4). Rows show original and protected images from baseline methods and ours, with TI/DB results. Perturbations visualized in black-yellow. Please zoom in.", "placement": "evidence", "caption": "不同方法的保护图、生成结果与扰动可视化并列。扰动分布帮助理解方法为何能把修改更多集中在目标区域。"}], "paper_url": "https://ojs.aaai.org/index.php/AAAI/article/view/41250", "code_url": "https://github.com/KululuMi/VCPro"}, {"id": "paper-18", "title": "Tailoring Rumor Debunking to You: Diversifying Chinese Rumor-Debunking Passages with an LLM-Driven Simulated Feedback-Enhanced Framework", "chinese_title": "MURSE：面向不同读者的中文辟谣生成", "year": "2026", "theme": "虚假信息与新闻理解", "authors": "X Pang, D Wang, Q Sheng, Y Sun, B Hu, J Cao", "publication": {"venue": "EACL 2026 · Industry Track", "date_label": "会议", "date": "2026-03-25—27"}, "motivation": "同一份辟谣证据，对不同读者未必同样有效。专业术语可能让一部分人难以理解，生硬纠正也可能增加抵触。MURSE 在不改变核查结论的前提下，研究怎样为不同用户组织更容易接受的中文辟谣文章。", "context": "个性化在这里不改变谣言真假，也不按读者喜好改核查结论。变化的是解释顺序、措辞和信息安排。专业证据仍是共同依据，用户画像决定如何把证据讲得更容易理解和接受。", "analysis": "事实正确、文字流畅与读者愿意接受并不是同一件事。真实用户反馈收集慢，自动生成又容易停留在“换一种语气”。方法需要把预期读者反应转换成具体修改意见，并控制改写不偏离原有证据。", "rationale": "作者引用面向用户的纠正研究，将“可读”与“被读者接受”区分开，并据此引入用户画像和模拟反馈。MURSE 用读者、顾问与编辑之间的迭代，将预期反应转成修改建议；论文检验的是生成文本偏好，未把它当作真实信念转变的理论证明。", "basis_reference": "§1 与方法部分：用户接受度、模拟反馈", "basis_title": "同一份证据，怎样对不同读者说明白", "method_title": "反馈如何变成下一轮修改", "result_title": "改写带来的收益是什么", "connection": "通用稿进入模拟反馈模块，读者角色先给反应，顾问整理建议，编辑再修改。下一轮重新评价稿件，因此反馈不是生成结束后的附加评语，而是直接参与下一次文本生产。", "architecture": [{"name": "通用证据稿", "flow": "谣言、专业核查证据 → 初始辟谣稿", "explanation": "先固定事实依据与结论，再考虑用户表达偏好，避免读者画像决定真假立场。初稿进入反馈循环，而非直接发布。", "operation": "先以谣言主张和专业核查证据生成通用稿，明确辟谣应保留的事实与结论，避免从用户偏好直接生成立场。"}, {"name": "模拟读者与顾问", "flow": "初稿、用户画像 → 反馈与修改意见", "explanation": "模拟读者给出反应，顾问将反应整理成可执行建议。画像包含年龄、性别和教育组合，不代表读取某位真实读者心理。", "operation": "按年龄、性别、教育程度组合出 24 类读者画像，让模拟读者对稿件给出反馈；顾问角色将这些反应整理为可以执行的改写建议。"}, {"name": "编辑与筛选", "flow": "修改意见、事实证据 → 面向用户的辟谣稿", "explanation": "编辑多轮调整后，按情绪友好、信息和冗余等要求筛选；核查结论继续保留。实验中的偏好比较针对文本接受度。", "operation": "编辑角色据此多轮修改，并结合情绪友好、信息量和低冗余等要求筛选文本，形成面向目标用户的辟谣稿。"}], "findings": "在 CHEF 的 333 条被驳斥主张上评估；多数人工比较情形中，个性化稿的偏好次数约为通用稿的两倍。", "limitations": "画像只有三个维度，可能强化群体刻板印象；偏好选择不能证明真实用户信念长期改变；主要实验依赖特定模型组合。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-18-fig-01.webp", "original_caption": "Figure 1: Paradigm comparison between existing ➀ex- tractive, ➁abstractive approaches, and our proposed method ➂MURSE. Our proposed MURSE considers the user profile to personalize the generation of debunk- ing passages, which can more effectively help vulnera- ble populations clarify misconceptions.", "placement": "intro", "caption": "三种范式分别抽取证据、生成通用说明和按用户画像改写。新增的重点是接受度，而非仅把证据拼接得更流畅。"}, {"number": 2, "page": 4, "src": "figures/paper-18-fig-02.webp", "original_caption": "Figure 2: Illustration of the proposed MURSE framework. MURSE consists of a Simulated Feedback Module and a Passage Refinement Module. The Simulated Feedback Module utilizes a Commenter to simulate target user responses to rumors and an Advisor to analyze user feedback and provide advice. The Passage Refinement Module uses an Editor to modify the debunking passage based on this advice. The debunking passage undergoes continuous improvement until it satisfies our established criteria.", "placement": "method", "caption": "MURSE 的反馈模块与改写模块形成循环。Commenter 模拟读者反应，顾问与编辑把反应转成具体改动，事实证据贯穿整个过程。"}, {"number": 3, "page": 6, "src": "figures/paper-18-fig-03.webp", "original_caption": "Figure 3: Three criteria changes with the iteration. Round 0 corresponds to the general debunking passage.", "placement": "evidence", "caption": "三项准则随迭代变化，用于观察改写是否逐步接近设定目标。它体现的是文本质量变化，不能直接当成真实用户信念改变的证据。"}], "paper_url": "https://aclanthology.org/2026.eacl-industry.45/"}, {"id": "paper-20", "title": "Anchorcrafter: Animate cyber-anchors selling your products via human-object interacting video generation", "chinese_title": "AnchorCrafter：面向商品展示的人—物交互视频", "year": "2026", "theme": "人物与交互视频生成", "authors": "Ziyi Xu, Ziyao Huang, Juan Cao, Yong Zhang, Xiaodong Cun, Qing Shuai, Yuchen Wang, Linchao Bo, Fan Tang（所读v2）", "publication": {"venue": "IEEE TVCG 32(7)", "date_label": "卷期", "date": "2026-07", "preprint_date": "2024-11-26", "arxiv_id": "2411.17383"}, "motivation": "数字主播展示商品时，难点不只在于脸和身体动作自然。商品需要保持形状与纹理，手指要抓在正确位置，遮挡关系也要随动作变化。AnchorCrafter 将人物动画扩展到商品展示中的人—物交互。", "context": "展示视频中，商品往往比人物面积小，却承载最重要的信息：形状、商标、纹理和抓握关系都不能随便变化。只追踪人物骨架，可能让手动起来了，但商品静止、变形，或被误当成身体一部分。", "analysis": "人物和商品的外观信息需要独立保存，而手、商品与身体运动又必须协调。只用人体骨架不能充分约束手指与物体接触；全图训练损失还可能忽略面积较小却很重要的商品细节。", "rationale": "作者将问题分别归为商品外观保持、手—物交互和小区域细节。多视角外观与双适配器、手网格／深度条件、交互区域加权损失分别回应这些问题；方法图与消融用于检验各组件。", "basis_reference": "方法部分：双适配器、交互控制与加权损失", "basis_title": "商品为什么不能只当作人物的一部分", "method_title": "外观保持与交互运动分别怎样控制", "result_title": "商品与手部是否同时稳定", "connection": "人物图和商品多视角图进入外观路径，身体、手和物体几何进入运动路径，区域加权则改变训练关注重点。这些信号共同控制视频；新商品适配与新主播推理在论文中另外区分，不能把所有商品场景都理解为无需适配。", "architecture": [{"name": "HOI 外观感知", "flow": "人物图、多视角商品图 → 分离的外观条件", "explanation": "DINO 是视觉特征提取器，多视角商品图提供不同可见面；人物与物体适配器分别保存外观，避免商品细节与人物混合。", "operation": "使用商品多视角图像的 DINO 特征补充外观信息，并用人物与物体双适配器分别注入两类外观，减少商品信息被人物特征淹没。"}, {"name": "HOI 运动注入", "flow": "骨架、手网格、商品深度 → 交互运动条件", "explanation": "身体骨架描述整体动作，手网格补细粒度抓握，商品深度提供几何与遮挡线索。它们共同进入视频生成，而不是只控制人物四肢。", "operation": "结合人体骨架、三维手网格和商品深度图提供运动与几何条件，显式处理人和物体之间的遮挡，让控制信号覆盖身体、手和商品。"}, {"name": "区域加权训练", "flow": "生成视频、手与商品区域 → 更关注交互的模型", "explanation": "局部权重提高这些小区域在训练目标中的作用。部署仍由同一视频模型输出，不是最后再贴一张商品图进行修补。", "operation": "训练中提高交互手部与商品区域的损失权重，促使模型关注抓握和小物体细节，而不只优化大面积背景或人物轮廓。"}], "findings": "交互数据与对比实验检验商品保持和手部运动；所读 v2 表中 Object-IoU 为 0.906、Object-CLIP 为 0.921。", "limitations": "需针对商品微调、依赖演员动作和上游估计；最新v2局限部分明确透明物体困难。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-20-fig-01.webp", "original_caption": "Fig. 1: Existing methods accurately follow human poses but struggle with realistic hand-object interactions, often misinterpreting the object as part of the human, leading to static animations. In contrast, our approach ensures natural and dynamic movement by precisely synthesizing human- object interactions while preserving object appearance.", "placement": "intro", "caption": "现有方法跟随人体姿态，却可能把手持商品误作身体一部分。对照图把“身体会动”和“真实人—物交互”之间的差别具体展示出来。"}, {"number": 2, "page": 2, "src": "figures/paper-20-fig-02.webp", "original_caption": "Fig. 2: We propose AnchorCrafter, a diffusion-based human video generation framework for creating high-fidelity anchor- style product promotion videos by animating reference human images with specific products and motion controls. By incorporating human-object interaction into the generation process, AnchorCrafter achieves high preservation of object appearance and enhanced interaction awareness.", "placement": "intro", "caption": "应用总览展示参考人物、指定商品与交互结果，明确输入既包含人物也包含物体，目标是共同保持两者，而不是只生成一个动作相近的人。"}, {"number": 4, "page": 4, "src": "figures/paper-20-fig-04.webp", "original_caption": "Fig. 4: Training pipeline for AnchorCrafter: Based on a video diffusion model, AnchorCrafter injects human and multi- view object references into the video via HOI-appearance perception. The motion is controlled through HOI-motion injection, with the training objective reweighted in the HOI region.", "placement": "method", "caption": "训练图中外观感知与运动注入是两条不同路径。人物和多视角商品参考提供外观，姿态及深度提供运动和遮挡条件，最后共同进入视频扩散模型。"}, {"number": 5, "page": 4, "src": "figures/paper-20-fig-05.webp", "original_caption": "Fig. 5: HOI-appearance perception: The feature of the target object fO is extracted through multi-view object feature fusion and combined with the human reference feature fH within a human-object dual adapter to achieve improved disentanglement results.", "placement": "module-0", "caption": "先融合多视角商品特征，再通过人物—物体双适配器注入。这样可以单独看商品信息怎样进入模型，避免把“用了参考图”当作已经解释完外观保持。"}], "paper_url": "https://doi.org/10.1109/TVCG.2026.3662720", "code_url": "https://github.com/cangcz/AnchorCrafter"}, {"id": "paper-21", "title": "Beyond pixels: Visual metaphor transfer via schema-driven agentic reasoning", "chinese_title": "Beyond Pixels：基于图式的视觉隐喻迁移", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Yu Xu, Yuxin Zhang, Juan Cao, Lin Gao, Chunyu Wang, Oliver Deussen, Tong-Yee Lee, Fan Tang（v1）", "publication": {"venue": "arXiv:2602.01335v1", "date_label": "预印本首发", "date": "2026-02-01", "preprint_date": "2026-02-01", "arxiv_id": "2602.01335"}, "motivation": "视觉隐喻的核心往往是两个事物之间的关系，而不是某一种颜色或画风。例如把主体替换后，仍希望保留原图表达的讽刺、冲突或寓意。论文研究如何将参考图的隐喻逻辑迁移到新主体，避免只复制表面构图。", "context": "参考图中的主体可以被替换，但隐喻成立的关系不能随便丢掉。例如原图靠两个领域之间的冲突表达寓意，直接换一个对象可能只剩奇怪拼贴。论文先显式表达这种关系，再为新主体重新寻找合适载体。", "analysis": "让模型直接模仿参考图，容易保留无关外观，却丢掉真正的类比关系。另一方面，只有一句抽象寓意也不足以决定新图中应该出现什么载体、哪些部件应如何组合。因此需要可分析、可修改的中间表示。", "rationale": "论文用七元图式显式表示视觉隐喻，迁移阶段保留跨领域共同关系 G，同时重新实例化主体、载体、属性、不协调点与寓意。这个关系不变量是作者组织迁移推理的约束；诊断角色再检查新图式与视觉实现是否一致。", "basis_reference": "§3：Schema Grammar；§4：四角色推理", "basis_title": "迁移隐喻，究竟要保留什么", "method_title": "从概念图式到可见图像", "result_title": "图式与诊断各起什么作用", "connection": "概念合成理论提供理解隐喻的框架，七元图式把它转成可处理的描述。感知角色抽出参考关系，迁移角色重新实例化，生成角色画出来，诊断角色再回查逻辑与实现。各角色不是重复写四份提示。", "architecture": [{"name": "感知图式", "flow": "参考隐喻图 → 七元图式", "explanation": "主体与载体是具体对象，属性描述对象，共同关系是可跨领域迁移的核心，不协调点与涌现寓意解释隐喻为何成立。", "operation": "感知角色把参考图整理为七元图式，描述主体、载体、相关属性、共同关系、不协调点及涌现寓意，将隐含创意显式化。"}, {"name": "跨域迁移", "flow": "参考图式、新主体 → 新图式", "explanation": "保留关系 G，但重新寻找适合新主体的载体和冲突方式。迁移输出仍是结构化描述，尚不是最终图像。", "operation": "迁移角色保留跨领域的关系核心，分析新主体的属性，寻找适合的新载体并重新安排冲突点，使新图表达类似寓意但不机械复制原对象。"}, {"name": "生成角色", "flow": "新图式 → 视觉结果", "operation": "把新主体、载体、关系与冲突转成可执行的生成描述，生成图像。", "explanation": "这是关系推理落地到画面的阶段。"}, {"name": "诊断角色", "flow": "图像与图式 → 分阶段修改意见", "operation": "检查逻辑、部件选择与提示实现，回到相关阶段调整。", "explanation": "诊断不是只给作品一个总分，而是指明应修改哪一部分。"}], "findings": "以隐喻一致性、类比合理性、创意评价与人工评测比较方法。此处解读采用曹娟署名的 arXiv v1。", "limitations": "创意评估包含主观判断，且依赖VLM理解与图像生成器执行；文化隐喻可能歧义。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-21-fig-01.webp", "original_caption": "Figure 1. Diverse image metaphor transfer results generated by our framework. For each pair, the left image serves as the Reference and the right is the Generated Result. Our model demonstrates robust capability across distinct cognitive levels.", "placement": "intro", "caption": "成对示例左侧是参考隐喻，右侧是迁移结果。比较时需要看寓意和关系是否延续，而不仅是颜色、材质或构图是否相似。"}, {"number": 2, "page": 3, "src": "figures/paper-21-fig-02.webp", "original_caption": "Figure 2. Conceptual Blending Theory.", "placement": "basis", "caption": "概念合成理论区分两个输入空间、共同结构和合成空间。本文据此提取可跨领域保留的关系，再组织新主体与载体，不是凭空给多智能体流程加一个理论名称。"}, {"number": 3, "page": 4, "src": "figures/paper-21-fig-03.webp", "original_caption": "Figure 3. Architecture of our Self-Reflective Agentic Framework for Visual Rhetoric Transfer. The system consists of Perception, Transfer, Generation, and Diagnostic agents. It transforms a reference visual metaphor (Iref) into a new target context (Igen) by extracting and mapping structured graph representations (Gref →Gtgt). A hierarchical feedback loop ensures the generated output faithfully preserves the rhetorical logic while adapting to the new subject matter.", "placement": "method", "caption": "四个角色依次处理感知、迁移、生成和诊断。回路表示失败可返回相关阶段修改，让读者分清错误来自隐喻逻辑，还是图像实现。"}, {"number": 6, "page": 8, "src": "figures/paper-21-fig-06.webp", "original_caption": "Figure 6. Qualitative comparison of ablation variants. w/o CBT & Phase 1,2 (Nano-Banana-Pro [6]) performs naive object replacement. w/o CBT fails to perform complex carrier migra- tion. w/o Phase 4 exhibits specific agent failures. The Full Model correctly reasons that coffee acts as a battery, rope represents hair texture, and the ashtray demonstrates the consequences of smok- ing via a dual-panel layout.", "placement": "evidence", "caption": "消融对照展示缺少理论图式、前期推理或诊断后的差别。重点是载体是否合理、寓意是否成立，以及部件是否正确落地。"}], "paper_url": "https://arxiv.org/abs/2602.01335v1", "code_url": "https://github.com/ICTMCG/Beyond-Pixels"}, {"id": "paper-23", "title": "Interactive Visual Assessment for Text-to-Image Generation Models", "chinese_title": "DyEval：交互式探索文生图模型的能力边界", "year": "2026", "theme": "图像编辑与生成评估", "authors": "X Mi, F Tang, J Cao, Q Sheng, Z Huang, P Li, Y Liu, TY Lee", "publication": {"venue": "IEEE TVCG 32(4)", "date_label": "卷期", "date": "2026-04", "preprint_date": "2024-11-23", "arxiv_id": "2411.15509"}, "motivation": "固定提示词集合能比较模型在已知任务上的表现，却很难不断找到新错误。生成模型升级后，旧测试还可能过于简单，或已经进入训练数据。DyEval 把评估做成可持续探索的过程，让人和 LLM 根据结果继续提出更有针对性的测试。", "context": "假设模型在一个简单主题上经常通过，继续问相同问题并不能发现边界；出现失败后，又需要区分是数量、关系还是文化含义导致。DyEval 让评估沿主题向下探索，同时在失败处做局部诊断。", "analysis": "随机增加提示词会浪费测试预算，单纯追逐失败又可能陷在一个很窄的问题里。发现失败后，还需要知道是某个词、关系还是组合造成问题，才有助于后续改进。测试组织和失败解释因此需要一起设计。", "rationale": "论文从固定覆盖、测试难度演化和数据泄漏风险提出动态评估需求。测试树组织分层探索，人工反馈驱动新输入，场景图分解用于寻找失败触发条件。其依据是论文提出的交互评估目标与实验分析，不是对完整能力边界的穷尽证明。", "basis_reference": "§III：设计目标；§IV：动态测试与上下文反思", "basis_title": "评估不只要一个分数，还要找到问题", "method_title": "一次反馈怎样产生下一次测试", "result_title": "如何把失败缩小到具体条件", "connection": "测试树记录探索走到了哪里，人给生成结果反馈，LLM 再决定继续细化还是定位失败。场景图并不替代生图模型，它把文字条件拆开，使“哪部分一加入就出错”变成更可操作的检查。", "architecture": [{"name": "测试树与新提示", "flow": "用户主题、已有反馈 → 层级测试输入", "explanation": "树记录从宽主题到细子问题的探索，LLM 生成下一批提示。人工判定图像表现，为后续探索提供方向。", "operation": "以测试树组织主题、提示词、生成图和人工反馈，让不同层次的能力覆盖与测试历史在同一界面中可见。LLM 根据主题和已有反馈生成新的测试输入。"}, {"name": "自适应深化", "flow": "已有测试结果 → 更细或更难的测试", "explanation": "反馈改变测试覆盖和难度，使评估随被测模型能力演进，而不只是无限随机造提示。", "operation": "对已经掌握的主题继续加深难度或细化条件，使测试随着模型表现变化，而不是始终重复相同的简单样本。"}, {"name": "上下文反思", "flow": "失败提示及其场景图 → 失败触发条件", "explanation": "场景图显式表示对象与关系，分治缩小导致失败的组合，再总结可供人检查的模式，帮助从错误案例走向可解释诊断。", "operation": "遇到失败后，把提示转成场景图，用分治方式缩小触发错误的条件组合，再让 LLM 反思可能的失败模式，形成可供人检查的诊断。"}], "findings": "在相同测试样本预算下，论文报告最多发现 2.56 倍失败案例，并展示代词、隐含关系和文化语境等较难问题。", "limitations": "仍需要人工评判；发现更多失败不直接代表模型整体错误率，受搜索策略影响。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-23-fig-01.webp", "original_caption": "Fig. 1: Diagram of the DyEval, a dynamic interactive testing framework for Text-to-Image (T2I) models. DyEval leverages a Large Language Model (LLM) to generate test prompts based on model feedback dynamically. The T2I model outputs are assessed, and results are used to update a test tree. Nodes with high pass rates (green) continue to explore deeper layers, while nodes with high fail rates (brown) are analyzed by the LLM to analyze failure reasons.", "placement": "intro", "caption": "测试树中，通过较多的节点继续深入，失败较多的节点转向分析。它说明动态评估改变的是测试方向，而不只是自动写更多提示词。"}, {"number": 2, "page": 4, "src": "figures/paper-23-fig-02.webp", "original_caption": "Fig. 2: Overview of DyEval. The DyEval process begins with setting initial topics and model parameters (Step A). In the test input generation phase, the LLM creates initial test inputs for the selected topic (Step B). Evaluators then review and annotate the generated images (Step C) and update the test tree accordingly (Step D). If a test node shows low average pass rates (Step E), the LLM refines these inputs to identify potential failure triggers in the dynamic failure location module (Step F). It then reflects on all available information related to the current topic (Step G) and updates the test tree (Step H). If the pass rates are satisfactory, the LLM proposes new topics based on the test context (history testing records in the testing tree) (Step I). Evaluators can select these new topics (Step J) to generate additional test inputs, continuing the evaluation cycle. This iterative process continues until the maximum exploration depth is reached.", "placement": "method", "caption": "从设置主题、生成测试输入、人工评价到更新树和反思，图中每个步骤都有对应输出。反馈进入下一轮输入生成，是流程闭环的关键。"}, {"number": 5, "page": 8, "src": "figures/paper-23-fig-05.webp", "original_caption": "Fig. 5: A test process case of DyEval. The initial test topic is “Spacial relationships” and the APR of this test node is 0.60. Based on the test records of the current topic, LLM continuously generates new test topics to analyze the model capability boundaries further. We also provide specific test inputs in the path of the test tree. Green represents nodes with test pass rate greater than or equal to 0.6, light orange represents pass rate (0.6,0.3], and less than 0.3 is dark orange.", "placement": "detail", "caption": "一个空间关系主题沿测试树展开，展示抽象主题怎样变成具体提示及反馈。读者可以顺着节点理解，系统不是一次性罗列固定测试集。"}, {"number": 9, "page": 9, "src": "figures/paper-23-fig-09.webp", "original_caption": "Fig. 9: An error analysis example mentioned in the paper. Given the test input “A dog and its owner taking a leisurely walk in the park on a bright morning.” to test relation generation for SD1-5. While the model correctly generates a leash connecting two subjects, it fails to properly generate the dog and man themselves.", "placement": "evidence", "caption": "“狗与主人散步”的例子中，关系连接可能正确，主体本身却仍有问题。案例提醒我们，图像某一项通过不代表整条提示全部满足。"}], "paper_url": "https://doi.org/10.1109/TVCG.2026.3658714"}, {"id": "paper-25", "title": "Tag-moe: Task-aware gating for unified generative mixture-of-experts", "chinese_title": "TAG-MoE：用任务语义指导生成模型的专家分工", "year": "2026", "theme": "图像编辑与生成评估", "authors": "Y Xu, H Yan, J Cao, Y Cheng, T Hang, R He, Z Yin, S Zhang, Y Zhang, ...", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07", "preprint_date": "2026-01-12", "arxiv_id": "2601.08881"}, "motivation": "统一图像模型既要生成新图，也要处理局部编辑、风格变化和主体定制。这些任务对“哪些内容该变、哪些必须保留”的要求不同，用完全共享的计算路径可能互相牵制。TAG-MoE 希望让稀疏专家按任务语义形成分工。", "context": "“把背景换成海滩”主要要求保持人物，“让人物微笑”却要修改脸部并保持其余内容。两者都叫编辑，但应改变的范围与必须保持的条件不同。TAG-MoE 因此不满足于给样本一个粗略任务名。", "analysis": "普通路由器主要根据特征选择专家，却未必学到用户意图。只给“编辑”这样的粗标签，也分不清换背景与改表情。方法需要更细的语义监督，同时避免推理时再增加一套外部标注流程。", "rationale": "作者将任务分成 Scope、Type、Preservation 三层语义，并用余弦对齐把聚合路由特征与语义监督联系起来。语义标签只用于训练；推理仍由内部路由器选择专家。稀疏激活的目的，是在相近激活计算下增加容量并形成任务分工。", "basis_reference": "§3.2—3.3：层级任务语义与路由对齐", "basis_title": "换背景与改表情，为什么不能混成一种任务", "method_title": "训练标签怎样影响专家选择", "result_title": "专家分工是否真的帮助生成", "connection": "训练阶段先生成细粒度任务语义，路由器学习让专家选择与这些语义对应。部署时用户不用再准备标签：门控由模型内部特征运行。专家增加的是可用容量，不等于每次都把所有专家计算一遍。", "architecture": [{"name": "训练期层级标注", "flow": "图像、指令、目标图 → 三层任务语义", "explanation": "Scope 表示范围，Type 表示操作，Preservation 表示必须保留的内容。视觉语言模型仅在训练数据处理中提供这些标签。", "operation": "训练期用视觉语言模型为样本标注三层语义：作用范围、操作类型和保持约束。例如区分局部与全局变化，并标明身份、背景或结构应当保持。"}, {"name": "稀疏专家骨干", "flow": "图像与文字 token → 专家处理后的特征", "explanation": "后十层图像前馈网络包含四专家，每个 token 选择一个。专家增大总容量，而每次只激活一部分参数。", "operation": "以 Qwen-Image 为基座，在末十层图像前馈网络中引入四个专家，采用 top-1 稀疏路由，让模型容量增加而每个 token 只激活有限计算。"}, {"name": "语义对齐路由", "flow": "路由特征、训练标签 → 有语义分工的门控", "explanation": "聚合路由特征与任务语义做对齐，促成不同专家分工。推理输入仍是原有图像与指令，不需外部再生成任务标签。", "operation": "聚合路由特征并预测任务语义，通过余弦对齐损失把专家选择与任务含义联系起来。推理依靠内部路由，不需要额外输入任务标签。"}], "findings": "在 ICE-Bench 等五组基准上评估，并通过移除语义对齐的消融检验任务监督的作用。", "limitations": "仍依赖VLM预处理，不能联合理解图像内数学等内容；部分训练数据为私有。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-25-fig-01.webp", "original_caption": "Figure 1. We present TAG-MoE, by injecting high-level task semantic intent into the local routing decisions of the MoE gating network, we enabling the diffusion transformer model to handle diverse generative tasks.", "placement": "intro", "caption": "不同生成与编辑任务放在同一框架中，体现统一模型要处理的要求差异。观察任务是否既执行了修改，也保住应保持的内容。"}, {"number": 2, "page": 4, "src": "figures/paper-25-fig-02.webp", "original_caption": "Figure 2. Pipeline of our method. TAG-MoE consists of: (1) A MM-DiT with MoE layers; (2) A Hierarchical Task Semantic Annotation that labels training data with atomic task descriptors; (3) A novel Semantic-Aligned Router explicitly aligns MoE routing behavior with task semantics through Predictive Alignment Regularization.", "placement": "method", "caption": "三个主要部分分别是带 MoE 的骨干、层级任务标注和语义对齐路由。标注线只存在于训练监督，不应误读为用户推理时额外调用一个标注模型。"}, {"number": 3, "page": 7, "src": "figures/paper-25-fig-03.webp", "original_caption": "Figure 3. Qualitative comparison on diverse tasks. Our model successfully resolves complex task conflicts where baselines fail.", "placement": "evidence", "caption": "跨任务对比说明作者关心的任务冲突：同一个模型能否根据指令改变操作，而不是在每个任务上套用同样的修改强度。"}], "paper_url": "https://arxiv.org/abs/2601.08881", "code_url": "https://github.com/ICTMCG/TAG-MoE"}, {"id": "paper-26", "title": "GeoHOI: Geometry-Enhanced Human-Object Interaction Video Generation via Hierarchical Multi-Modal Injection", "chinese_title": "GeoHOI：以多视角几何约束人—物交互", "year": "2026", "theme": "人物与交互视频生成", "authors": "Ziyi Xu, Zejing Rao, Juan Cao, Xiaoqiang Liu, Zhixue Fang, Haoxian Zhang, Songlin Tang, Fan Tang（正式PDF）", "publication": {"venue": "CVPR 2026 · Findings", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "人物转动物品时，商品纹理像原图还不够，形状和手部接触也必须在多视角下稳定。普通外观编码更擅长描述二维纹理，容易在转动或遮挡后把物体生成变形。GeoHOI 引入多视角几何先验来约束交互视频。", "context": "一张商品图只展示可见表面，视频里转动后还要保持体积和结构。多视角几何特征补充这种约束；手势与点轨迹说明运动，但它们本身不包含完整物体外观。方法把这些信息按职责接起来。", "analysis": "几何、纹理和语言控制不一定应在每层以相同方式混合。较早阶段需要建立空间结构，后续阶段才逐步补充外观；若纹理信息过早压过几何，模型可能生成“看起来像”却结构不稳的商品。", "rationale": "§3.1 采用 Flow Matching，定义 x_t=(1−t)x₀+tx₁，并学习由数据到噪声的速度场。几何条件部分使用 VGGT 多层特征和相机姿态调制，层级注入再按浅层几何、中层混合、深层纹理语义组织条件。二者分别是生成基础与本文的条件设计。", "basis_reference": "§3.1、§3.3—3.4：Flow Matching 与层级注入", "basis_title": "物体转过来以后，不能只保留纹理", "method_title": "几何、纹理和动作怎样分工", "result_title": "哪些组件帮助物体少变形", "connection": "几何提取器提供结构，纹理编码器提供表面细节，文字提供语义；层级注入决定它们在不同深度怎样进入 DiT。首帧和运动条件则约束视频往哪里变，避免把静态外观一致性与动态交互控制混作一个目标。", "architecture": [{"name": "多视角几何提取", "flow": "物体多视角图、相机姿态 → 几何条件", "explanation": "VGGT 提供几何相关特征，相机姿态调制将物体视角信息带入潜变量。DINO 另提纹理，避免把几何与外观视为同一信号。", "operation": "从多视角物体图中提取 VGGT 多层几何特征，并以相机姿态调制物体潜变量；同时提取 DINO 纹理特征，分别描述结构与表面外观。"}, {"name": "层级多模态注入", "flow": "几何、纹理、文字 → 各层条件化特征", "explanation": "浅层、中层、深层接收的条件重点不同。该策略对应作者希望先稳定结构、再细化外观的生成安排。", "operation": "按照层级注入策略，在浅层主要加入几何与文字，中层逐步引入纹理，深层重点细化纹理和语义，让不同信息进入更适合的计算阶段。"}, {"name": "动作控制与视频去噪", "flow": "首帧、手势、物体点轨迹 → 交互视频", "explanation": "共享 VAE 将不同视觉条件编码到潜空间，DiT 在这些条件下去噪。VAE 是把图像压成潜变量、再解码回图像的编码器—解码器。", "operation": "以手部姿态序列、稀疏物体点轨迹和参考首帧控制视频运动，并构建自动数据处理流程，提供较一致的交互监督。"}], "findings": "相对 Wan2.2-5B，Object-IoU 提高 26.2%，手部 LMD 下降 19.6%；两项均为论文所报相对变化。", "limitations": "依赖上游姿态、分割与跟踪；透明、反光物体及复杂多人互动仍困难。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-26-fig-01.webp", "original_caption": "Figure 1. We propose GeoHOI, a human–object interaction video generation framework built on the DiT architecture. By introducing object geometry priors and hierarchical injection policy, GeoHOI enhances object perception and modeling, enabling the preservation of shapes and textures under complex motions and achieving high-quality interaction generation.", "placement": "intro", "caption": "示例关注转动和交互时物体形状、纹理是否延续。不能只看首帧像参考图，还要看运动以后是否仍是同一物体。"}, {"number": 2, "page": 3, "src": "figures/paper-26-fig-02.webp", "original_caption": "Figure 2. Training pipeline of GeoHOI: based on a video generation model, GeoHOI employs the Multi-view Geometry Prior Extractor to capture object geometry priors and designs a Hierarchical Injection Policy to effectively integrate multimodal information while preventing confusion among features from different sources.", "placement": "method", "caption": "VGGT 几何、DINO 纹理、相机姿态、手势和物体点轨迹在图中各有入口；层级注入把不同来源安排到相应层，避免一开始无差别混合。"}, {"number": 6, "page": 7, "src": "figures/paper-26-fig-06.webp", "original_caption": "Figure 6. Ablation study. Unlike other variants that exhibit object deformation or texture errors, our method preserves consistency and produces plausible motion interactions.", "placement": "evidence", "caption": "移除几何、纹理或改变注入策略后的结果展示具体失败。消融让模块作用从名称变成可见现象，例如结构变形或纹理错误。"}], "paper_url": "https://openaccess.thecvf.com/content/CVPR2026F/html/Xu_GeoHOI_Geometry-Enhanced_Human-Object_Interaction_Video_Generation_via_Hierarchical_Multi-Modal_Injection_CVPRF_2026_paper.html"}, {"id": "paper-27", "title": "ResCa: Residual Caching for Diffusion Transformers Acceleration", "chinese_title": "ResCa：用代理 token 与残差缓存加速扩散模型", "year": "2026", "theme": "高效模型与鲁棒学习", "authors": "H Fang, Y Li, F Tang, Y Lu, J Cao, S Tang", "publication": {"venue": "CVPR 2026", "date_label": "会议", "date": "2026-06-03—07"}, "motivation": "扩散 Transformer 反复更新大量视觉 token，成本很高。直接复用上一时刻特征可以省计算，却可能让画面停留在过时状态。ResCa 研究能否只计算少量代表 token，再用它们的变化推算其他 token 的更新。", "context": "直接缓存会让一段时间内的特征停留在旧状态；合并 token 又可能让不同位置过度趋同。ResCa 保留各 token 自身状态，尝试共享可复用的更新变化，而不是让整组位置变成一个相同值。", "analysis": "当前看起来相似的 token，后续去噪方向未必一致；缓存绝对特征也容易积累误差。因此需要根据历史轨迹判断谁可以共同更新，并复用“变化量”而非简单冻结所有内容。", "rationale": "作者观察到，相似历史去噪轨迹对应更可复用的残差，且低阶残差更稳定。TETC 用近期加权的历史相似度聚类，代理模拟再按历史关系复用残差更新。依据来自论文轨迹分析与残差实验，不是所有 token 都可无误差共享计算的假设。", "basis_reference": "§3：残差复用观察；§4.2—4.3：TETC 与代理模拟", "basis_title": "缓存旧特征与复用变化量，有什么不同", "method_title": "怎样只算代表 token，又让其他位置继续更新", "result_title": "近似计算是否保住细节", "connection": "完整步骤建立历史轨迹和缓存，分组找出变化相近的位置，稀疏步骤只算代理，再模拟其他 token 的更新。这里“代理”不是语言智能体，而是承担代表性计算的一个视觉特征单元。", "architecture": [{"name": "密集步骤缓存", "flow": "全部 token → 当前特征和历史轨迹", "operation": "完整计算当前状态并保存，为下一轮分组和近似更新提供参照。", "explanation": "密集步骤也是后续校准近似误差的机会。"}, {"name": "TETC：历史轨迹聚类", "flow": "多步特征变化 → 轨迹相似组", "operation": "用近期加权的历史相似度分组，不只比较某一时刻的特征。", "explanation": "分组回答哪些位置的后续变化更可能可复用。"}, {"name": "代理 token 更新", "flow": "每组代表 token → 当前真实去噪残差", "explanation": "稀疏步骤只完整计算代理，减少大部分 token 的昂贵计算。其他 token 仍需更新，并非被冻结不变。", "operation": "在稀疏计算步骤，每组选择代理 token 真正执行去噪，其余 token 不再逐一通过全部计算。代理提供本组当前变化的参考。"}, {"name": "残差模拟与校准", "flow": "代理变化、组内历史 → 全部 token 新状态", "explanation": "残差是状态相对已有值的变化量。PDDS 没有让所有 token 照抄代理结果，而是保留各自变化方向，再借代理作修正，以减少直接缓存不更新造成的偏离。", "operation": "保留被代理 token 自身的低阶残差作为主方向，以代理 token 的当前残差作方向修正，再用隐式常微分方程形式模拟去噪；后续密集步骤重新校准全部特征。"}], "findings": "在 DiT、FLUX 和 HunyuanVideo 上评估；论文报告 FLUX 最高达到 5.5 倍 GFLOPs 加速，不能直接等同于端到端耗时缩短 5.5 倍。", "limitations": "GFLOPs倍数不等于实际运行速度；聚类/代理误差会随压缩加大影响质量。", "figures": [{"number": 1, "page": 1, "src": "figures/paper-27-fig-01.webp", "original_caption": "Figure 1. Illustration of denoising trajectories. Solid and dashed line denotes the realized and the target trajectories. (a) Original trajectory. (b) Caching: reuse the previous step xa t , forming a non- updated denoising direction (does not stay fixed due to residual connections). (c) Merging: merge similar at and ct into bt, reusing the xb t, forming a non-self denoising direction. (d) Ours: computes multi-order residuals ∆kxc t to guide the cached xa t , thus achieving a both self and updated trajectory.", "placement": "intro", "caption": "轨迹示意对照原始去噪、缓存、合并与本文方式。它帮助分清各加速方法到底省掉了什么，以及输出偏离目标轨迹的方式。"}, {"number": 2, "page": 3, "src": "figures/paper-27-fig-02.webp", "original_caption": "Figure 2. Preliminaries. Upper: Where to find the similar residuals? Illustration of (a) feature- and (b) trajectory-based clusters, where the trajectory-based clusters groups the blue and red trajectories more accurately. (c) Comparison of the two methods showing that trajectory- based clusters have lower pairwise distance of residuals within each cluster. Lower: How to use the similar residuals? (d) Intra-cluster L2 distance of multi-order residuals, indicating that 1st-, 2nd-, and 3rd-order residuals are more reusable than 0th-order ones. (e) Intra-cluster residual relationships across timesteps, showing that smaller historical residual distance implies higher reuse value for future residuals.", "placement": "basis", "caption": "上半部分比较按当前特征和按历史轨迹分组，下半部分分析不同阶残差。作者据此选择轨迹聚类和更可复用的低阶变化，而非任意挑一个 token 代表其他位置。"}, {"number": 3, "page": 4, "src": "figures/paper-27-fig-03.webp", "original_caption": "Figure 3. Overview. grey: In the dense timestep, all tokens are processed to cache their features, followed by TETC to group tokens. In the sparse timestep, one proxy token from each group is selected for denoising, which then uses PDDS to guide the denoising of other tokens. blue: Temporal-Enhanced Trajectory Clustering (TETC): perform clustering using a similarity metric computed by token trajectories. orange: Proxy-driven Denoising Simulation (PDDS): use the driven token’s residuals as the main direction; the proxy token’s residuals provide directional corrections to estimate the future direction, and subsequently simulate the denoising process using an implicit ODE.", "placement": "method", "caption": "密集步骤缓存和分组，稀疏步骤更新代理并进行残差模拟。TETC 与 PDDS 分别回答“谁可以一起更新”和“怎样由代理推算更新”。"}, {"number": 5, "page": 7, "src": "figures/paper-27-fig-05.webp", "original_caption": "Figure 5. Qualitative comparison in text-to-video generation on HunyuanVideo. ResCa generates high-quality, semantically aligned videos, while others suffer from issues such as misplaced bottle caps, missing water splash details, and missing drumstick objects.", "placement": "evidence", "caption": "视频对比观察语义和局部细节是否保住。计算量少只是效率指标，瓶盖、水花、鼓槌等细节是否丢失则体现近似代价。"}], "paper_url": "https://openaccess.thecvf.com/content/CVPR2026/html/Fang_ResCa_Residual_Caching_for_Diffusion_Transformers_Acceleration_CVPR_2026_paper.html", "code_url": "https://github.com/Fanghaipeng/ResCa_Residual_Caching"}, {"id": "paper-28", "title": "HOMA: Towards Generic Human-Object Interaction in Multimodal Driven Human Animation with Weak Conditions", "chinese_title": "
